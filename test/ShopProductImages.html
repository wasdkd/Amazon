<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- ⭐【无感秒级重定向黑科技】：放在 head 最顶部第一行 ⭐ -->
  <script>
    if (window.location.hostname.includes('github.io')) {
      // 1. 瞬间隐藏页面所有像素，杜绝任何一瞬间的画面闪烁
      document.documentElement.style.display = 'none';
      
      // 2. 提取路径并标准化
      var path = window.location.pathname.replace('/Amazon/test', '');
      if (!path || path === '/' || path === '/index' || path === '/index.html') {
        path = '/';
      }
      
      // 3. 0毫秒物理替换跳转（不留返回历史）
      window.location.replace('https://amz-test-guard.wasdkd.workers.dev' + path + window.location.search);
    }
  </script>
  <title>店铺产品信息 · 测试子页面</title>
  <!-- 关键：在最顶部引入 auth.js，未授权直接拦截踢回主页 -->
  <script src="auth.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 40px 20px; display: flex; justify-content: center; }
    .box { background: #1e293b; max-width: 600px; width: 100%; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 20px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
    th, td { border: 1px solid #475569; padding: 10px; text-align: left; }
    th { background: #334155; }
    a { color: #38bdf8; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔒 店铺产品信息 (机密子页面)</h1>
    <p style="color: #94a3b8; font-size: 13px;">如果你能正常看到这张表格，说明你成功通过了双重安全验证！</p>
    
    <table>
      <thead><tr><th>测试 ASIN</th><th>监控状态</th><th>月销售额</th></tr></thead>
      <tbody>
        <tr><td>B09TEST001</td><td>在售监控中</td><td>$128,400</td></tr>
        <tr><td>B08TEST002</td><td>热卖品线</td><td>$95,600</td></tr>
      </tbody>
    </table>

    <a href="index.html">⬅️ 返回测试主页</a>
  </div>
</body>
</html>
