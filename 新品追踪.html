<!DOCTYPE html>

        body { font-family:'Segoe UI',Tahoma,Verdana,sans-serif; background:#f5f5f5; margin:0; font-size:14px; }
        .header { position:sticky; top:0; z-index:1000; background:#232f3e; color:#fff; padding:6px 20px; display:flex; justify-content:space-between; align-items:center; }
        .header h1 { margin:0; font-size:20px; }
        .header .btn { padding:4px 10px; background:#007BFF; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px; margin-left:5px; }
        .header .btn:hover { background:#0056b3; }

        .filter-container { position:sticky; top:40px; z-index:999; background:#f8f8f8; box-shadow:0 2px 8px rgba(0,0,0,.1); display:flex; gap:12px; padding:10px 15px; flex-wrap:wrap; align-items:flex-end; margin-bottom:10px; border-radius:6px; }
        .filter-box { display:flex; flex-direction:column; gap:2px; position:relative; }
        .filter-box label { font-weight:bold; font-size:13px; color:#333; }
        .filter-box input[type=text], .filter-box input[type=number], .filter-box select { padding:4px 6px; border-radius:4px; border:1px solid #ddd; font-size:14px; }
        .range-box { display:flex; gap:4px; align-items:center; }
        .range-box input { width:60px; }
        .special-filter-box { display:flex; gap:10px; align-items:center; background:#fff3cd; padding:4px 8px; border-radius:4px; border:1px solid #ffeba2; font-size:13px; }
        .special-filter-box label { cursor:pointer; color:#856404; font-weight:bold; display:flex; align-items:center; gap:3px; }
        .filter-dropdown-btn { background:#fff; border:1px solid #ddd; border-radius:4px; padding:4px 8px; cursor:pointer; min-width:100px; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
        .filter-dropdown-btn::after { content:'\25BC'; font-size:10px; color:#666; }
        .filter-dropdown { display:none; position:absolute; top:100%; left:0; background:#fff; border:1px solid #ddd; border-radius:4px; padding:8px; box-shadow:0 4px 10px rgba(0,0,0,.15); z-index:1001; max-height:280px; overflow-y:auto; min-width:170px; margin-top:2px; }
        .filter-checkbox { margin:4px 0; font-size:14px; display:flex; align-items:center; }
        .filter-checkbox label { cursor:pointer; display:flex; align-items:center; gap:5px; }
        .filter-info-display { width:100%; background:#e3f2fd; padding:6px 12px; border-radius:5px; font-size:14px; font-weight:bold; color:#1976d2; border:1px solid #bbdefb; box-sizing:border-box; margin-top:6px; }
        .filter-label { color:#e53935; font-weight:bold; }
        .filter-value { color:#2e7d32; font-weight:bold; }
        .filter-title { color:#1565c0; font-weight:bold; }

        .container { padding:10px; }
        /* 每行 = 1公司产品图 + 1公司信息 + 5竞品 = 7列 */
        .product-row { display:grid; grid-template-columns: 1.1fr 1.5fr repeat(5, 1fr); gap:8px; background:#fff; border:1px solid #ddd; border-radius:6px; padding:8px; margin-bottom:12px; box-shadow:0 2px 5px rgba(0,0,0,.08); align-items:stretch; }
        .product-row.low-rating-card { border:2px solid #ff4d4f; background:#fff1f0; }

        .cell { display:flex; flex-direction:column; box-sizing:border-box; }
        .cell-title { font-size:11px; font-weight:bold; text-align:center; padding:2px; border-radius:3px 3px 0 0; margin-bottom:4px; }
        .own-title { background:#232f3e; color:#fff; }
        .comp-title { background:#6c757d; color:#fff; }

        .prod-img { width:100%; object-fit:contain; background:#f8f8f8; cursor:pointer; border-radius:4px; }
        .comp-img { width:100%; object-fit:contain; background:#f8f8f8; cursor:pointer; border-radius:4px; }

        /* 公司信息三板块 */
        .own-info { display:flex; flex-direction:column; gap:0; font-size:13px; }
        .info-block { border:1px solid #ccc; border-radius:4px; padding:5px 7px; margin-bottom:5px; }
        .info-block.top { background:#fff8f0; border-color:#ffd8a8; }
        .info-block.mid { background:#f0f7ff; border-color:#a5d8ff; }
        .info-block.bot { background:#f3f0ff; border-color:#d0bfff; }
        .info-line { line-height:1.5; word-break:break-all; }
        .info-line .k { color:#555; }
        .info-line .v { font-weight:bold; color:#111; }
        .info-line a { color:#0066c0; font-weight:bold; text-decoration:none; }
        .info-line a:hover { text-decoration:underline; }
        .sellpoint { max-height:78px; overflow-y:auto; }

        /* 竞品信息 */
        .comp-info { font-size:12px; line-height:1.5; text-align:center; margin-top:4px; word-break:break-all; }
        .comp-info a { color:#0066c0; font-weight:bold; text-decoration:none; }
        .comp-info a:hover { text-decoration:underline; }
        .comp-info .v { font-weight:bold; color:#111; }
        .comp-empty { display:flex; align-items:center; justify-content:center; color:#bbb; font-size:13px; height:100%; min-height:120px; border:1px dashed #ddd; border-radius:4px; }

        /* 竞品图容器 + 公司自有品牌标记 */
        .comp-img-wrap { position:relative; }
        .own-brand-tag { position:absolute; top:4px; left:4px; background:#232f3e; color:#fff; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; z-index:12; box-shadow:0 2px 4px rgba(0,0,0,.3); border:1px solid #ffd400; }
        .comp-cell-own { border:2px solid #ffd400; border-radius:4px; background:#fffdf0; }

        .warning-tag { position:absolute; top:6px; right:6px; background:#ff4d4f; color:#fff; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; z-index:10; }
        .bsr-excellent-tag { position:absolute; top:6px; left:6px; background:#2e7d32; color:#fff; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; z-index:10; }
        .own-cell-wrap { position:relative; }

        .pagination-container { display:flex; justify-content:center; align-items:center; gap:12px; margin:15px 0; padding:10px; background:#e9ecef; border-radius:5px; font-size:15px; }
        .pagination-container button { padding:4px 12px; background:#28a745; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:14px; }
        .pagination-container button:disabled { background:#ccc; cursor:not-allowed; }

        #imageOverlay, #chartOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.85); z-index:2000; justify-content:center; align-items:center; }
        #imageOverlay img { max-width:92vw; max-height:92vh; object-fit:contain; border:2px solid #fff; }
        .bsr-badge { color:#fff; padding:1px 6px; border-radius:4px; font-size:12px; }

        @media (max-width:1400px){ .product-row{ grid-template-columns: 1fr 1.4fr repeat(5,1fr); } .prod-img{max-height:180px;} .comp-img{max-height:120px;} }
    </style>
</head>

        let currentPage = 1;
        const itemsPerPage = 50;
        let filteredProducts = [...allProducts];
        let bsrChartInstance = null;

        function getBsrColor(bsr) {
            if (bsr === "N/A" || bsr === null || bsr <= 0) return "#888888";
            const num = parseInt(bsr);
            if (num <= 5000) return "#d32f2f";
            if (num <= 30000) return "#ff9800";
            return "#4caf50";
        }

        function showBsrTrendChart(sku, asin, trendData) {
            if (!trendData || Object.keys(trendData).length === 0) { alert("暂无该产品的历史 BSR 趋势数据"); return; }
            const dates = Object.keys(trendData).sort();
            const bsrValues = dates.map(d => trendData[d]);
            document.getElementById('chartModalTitle').textContent = `产品 [${sku}] (ASIN: ${asin}) 大类 BSR 历史趋势`;
            document.getElementById('chartOverlay').style.display = "flex";
            const ctx = document.getElementById('bsrChartCanvas').getContext('2d');
            if (bsrChartInstance) bsrChartInstance.destroy();
            bsrChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: dates, datasets: [
                    { type:'bar', label:'BSR 排名', data:bsrValues, backgroundColor:'rgba(54,162,235,.6)', borderColor:'rgba(54,162,235,1)', borderWidth:1, barPercentage:0.5 },
                    { type:'line', label:'趋势走势', data:bsrValues, borderColor:'rgba(255,99,132,1)', backgroundColor:'rgba(255,99,132,.2)', borderWidth:2, tension:0.3, fill:false, pointRadius:4, pointHoverRadius:6 }
                ]},
                options: { responsive:true, maintainAspectRatio:false,
                    plugins:{ legend:{display:true,position:'top'}, tooltip:{callbacks:{label:function(c){return ' BSR 排名: '+c.parsed.y.toLocaleString();}}} },
                    scales:{ y:{beginAtZero:false, title:{display:true,text:'BSR 排名 (数值越小排名越高)'}}, x:{title:{display:true,text:'日期'}} }
                }
            });
        }
        function closeChartModal(){ document.getElementById('chartOverlay').style.display="none"; }

        function getCheckedValues(name){ return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb=>cb.value); }
        function restoreCheckboxState(name, values){
            const cbs=document.querySelectorAll(`input[name="${name}"]`); cbs.forEach(cb=>cb.checked=false);
            if(!values||values.length===0||values.includes('all')){ const a=document.querySelector(`input[name="${name}"][value="all"]`); if(a)a.checked=true; }
            else { values.forEach(v=>{ const cb=document.querySelector(`input[name="${name}"][value="${v}"]`); if(cb)cb.checked=true; }); }
        }
        function toggleDropdown(id){
            const d=document.getElementById(id); const vis=d.style.display==='block';
            document.querySelectorAll('.filter-dropdown').forEach(x=>x.style.display='none');
            d.style.display=vis?'none':'block';
        }
        document.querySelectorAll('.filter-dropdown').forEach(d=>d.addEventListener('click',e=>e.stopPropagation()));
        document.addEventListener('click',e=>{ if(!e.target.classList.contains('filter-dropdown-btn')) document.querySelectorAll('.filter-dropdown').forEach(d=>d.style.display='none'); });

        function setupCheckboxLogic(name){
            document.addEventListener('change',function(e){
                if(e.target.name===name){
                    const allCb=document.querySelector(`input[name="${name}"][value="all"]`);
                    const others=document.querySelectorAll(`input[name="${name}"]:not([value="all"])`);
                    if(e.target.value==='all'){ others.forEach(cb=>cb.checked=false); allCb.checked=true; }
                    else { allCb.checked=!Array.from(others).some(cb=>cb.checked); }
                    updateAllFilters(); filterProducts();
                }
            });
        }
        ['dev','leader','planCat','wave','category','fabric'].forEach(setupCheckboxLogic);

        function getActiveFilterRanges(){
            const g=id=>document.getElementById(id).value;
            const num=v=>v!==""?parseFloat(v):null;
            return {
                searchStr: g('globalSearch').toLowerCase().trim(),
                selectedDevs:getCheckedValues('dev'),
                selectedLeaders:getCheckedValues('leader'),
                selectedPlanCats:getCheckedValues('planCat'),
                selectedWaves:getCheckedValues('wave'),
                selectedCategories:getCheckedValues('category'),
                selectedFabrics:getCheckedValues('fabric'),
                onlyNoRating:document.getElementById('onlyNoRating').checked,
                onlyNoBsr:document.getElementById('onlyNoBsr').checked,
                onlyHasTrend:document.getElementById('onlyHasTrend').checked,
                minSales:num(g('minSales')), maxSales:num(g('maxSales')),
                minBsr:num(g('minBsr')), maxBsr:num(g('maxBsr')),
                minRating:num(g('minRating')), maxRating:num(g('maxRating')),
                minReviews:num(g('minReviews')), maxReviews:num(g('maxReviews'))
            };
        }

        function matchProductFilters(p, ignoreField, f){
            if(f.searchStr){
                const t=`${p.sku} ${p.wave} ${p.category} ${p.fabric} ${p.asin} ${p.dev} ${p.leader} ${p.planCat}`.toLowerCase();
                if(!t.includes(f.searchStr)) return false;
            }
            const inSel=(field,sel,val)=> ignoreField===field || sel.length===0 || sel.includes('all') || sel.includes(val);
            if(!inSel('dev',f.selectedDevs,p.dev)) return false;
            if(!inSel('leader',f.selectedLeaders,p.leader)) return false;
            if(!inSel('planCat',f.selectedPlanCats,p.planCat)) return false;
            if(!inSel('wave',f.selectedWaves,p.wave)) return false;
            if(!inSel('category',f.selectedCategories,p.category)) return false;
            if(!inSel('fabric',f.selectedFabrics,p.fabric)) return false;

            if(f.onlyNoRating && (p.ratingNum!==null && p.ratingNum>0 && p.rating!=="N/A")) return false;
            if(f.onlyNoBsr && (p.bsrNum!==null && p.bsrNum>0 && p.bsr!=="N/A")) return false;
            if(f.onlyHasTrend && (!p.bsrTrend||Object.keys(p.bsrTrend).length===0)) return false;

            if(!f.onlyNoRating && (f.minRating!==null||f.maxRating!==null)){
                if(p.ratingNum===null||p.ratingNum<=0||p.rating==="N/A") return false;
                if(f.minRating!==null && p.ratingNum<f.minRating) return false;
                if(f.maxRating!==null && p.ratingNum>f.maxRating) return false;
            }
            if(!f.onlyNoBsr && (f.minBsr!==null||f.maxBsr!==null)){
                if(p.bsrNum===null||p.bsrNum<=0||p.bsr==="N/A") return false;
                if(f.minBsr!==null && p.bsrNum<f.minBsr) return false;
                if(f.maxBsr!==null && p.bsrNum>f.maxBsr) return false;
            }
            if(f.minSales!==null||f.maxSales!==null){
                if(p.salesNum===null||p.salesNum<=0||p.sales==="N/A") return false;
                if(f.minSales!==null && p.salesNum<f.minSales) return false;
                if(f.maxSales!==null && p.salesNum>f.maxSales) return false;
            }
            if(f.minReviews!==null||f.maxReviews!==null){
                if(p.reviewsNum===null||p.reviewsNum<0||p.reviews==="N/A") return false;
                if(f.minReviews!==null && p.reviewsNum<f.minReviews) return false;
                if(f.maxReviews!==null && p.reviewsNum>f.maxReviews) return false;
            }
            return true;
        }

        function updateDropdownOptions(name, fieldName){
            const f=getActiveFilterRanges(); const counts={};
            allProducts.forEach(p=>{ if(matchProductFilters(p,fieldName,f)){ const v=p[fieldName]; if(v)counts[v]=(counts[v]||0)+1; } });
            const dd=document.getElementById(`${fieldName}Dropdown`); if(!dd) return;
            dd.querySelectorAll(`input[name="${name}"]:not([value="all"])`).forEach(cb=>{
                const c=counts[cb.value]||0; const lb=cb.closest('label'); const cs=lb.querySelector('.count');
                if(cs) cs.textContent=`(${c})`;
                const item=cb.closest('.filter-checkbox'); if(item) item.style.display=c>0?'flex':'none';
            });
        }
        function updateAllFilters(){
            [['dev','dev'],['leader','leader'],['planCat','planCat'],['wave','wave'],['category','category'],['fabric','fabric']].forEach(x=>updateDropdownOptions(x[0],x[1]));
        }

        function updateFilterInfoDisplay(f){
            const info=[];
            const push=(k,v)=>info.push(`<span class='filter-label'>${k}:</span> <span class='filter-value'>${v}</span>`);
            if(f.searchStr) push('搜索',f.searchStr);
            const chk=(sel,k)=>{ if(sel.length>0&&!sel.includes('all')) push(k,sel.join(", ")); };
            chk(f.selectedDevs,'开发'); chk(f.selectedLeaders,'组长'); chk(f.selectedPlanCats,'企划类目');
            chk(f.selectedWaves,'波段'); chk(f.selectedCategories,'品类'); chk(f.selectedFabrics,'面料');
            if(f.onlyNoRating) push('评分为空','是');
            if(f.onlyNoBsr) push('BSR为空','是');
            if(f.onlyHasTrend) push('仅有趋势','是');
            const rng=(mn,mx,k,dmn,dmx)=>{ if(mn!==null||mx!==null) push(k,`${mn!==null?mn:dmn} ~ ${mx!==null?mx:dmx}`); };
            rng(f.minSales,f.maxSales,'销量','不限','不限');
            rng(f.minBsr,f.maxBsr,'BSR','不限','不限');
            rng(f.minRating,f.maxRating,'评分','0','5');
            rng(f.minReviews,f.maxReviews,'评分数','不限','不限');
            const sm={sales_desc:'月销量降序',rating_asc:'评分升序',reviews_desc:'评分数降序',bsr_asc:'大类BSR升序'};
            const sb=document.getElementById('sortBy').value;
            if(sb!=='default'&&sm[sb]) push('排序',sm[sb]);
            const el=document.getElementById('filterInfoDisplay');
            el.innerHTML = info.length>0 ? "<span class='filter-title'>当前筛选条件:</span> "+info.join(" &nbsp;|&nbsp; ") : "<span class='filter-title'>当前筛选条件:</span> <span class='filter-value'>全部数据 (无筛选)</span>";
        }
    </script>

    <script>
        function saveFilterState(){
            const g=id=>document.getElementById(id);
            const state={
                globalSearch:g('globalSearch').value, ratingThreshold:g('ratingThreshold').value, bsrThreshold:g('bsrThreshold').value,
                sortBy:g('sortBy').value,
                selectedDevs:getCheckedValues('dev'), selectedLeaders:getCheckedValues('leader'), selectedPlanCats:getCheckedValues('planCat'),
                selectedWaves:getCheckedValues('wave'), selectedCategories:getCheckedValues('category'), selectedFabrics:getCheckedValues('fabric'),
                minSales:g('minSales').value, maxSales:g('maxSales').value, minBsr:g('minBsr').value, maxBsr:g('maxBsr').value,
                minRating:g('minRating').value, maxRating:g('maxRating').value, minReviews:g('minReviews').value, maxReviews:g('maxReviews').value,
                onlyNoRating:g('onlyNoRating').checked, onlyNoBsr:g('onlyNoBsr').checked, onlyHasTrend:g('onlyHasTrend').checked,
                currentPage:currentPage, scrollY:window.scrollY
            };
            localStorage.setItem('productCompareState_track', JSON.stringify(state));
        }
        function restoreFilterState(){
            const saved=localStorage.getItem('productCompareState_track'); if(!saved) return null;
            try{
                const s=JSON.parse(saved); const g=id=>document.getElementById(id);
                g('globalSearch').value=s.globalSearch||''; g('ratingThreshold').value=s.ratingThreshold||'4.2';
                g('bsrThreshold').value=s.bsrThreshold||'50000'; g('sortBy').value=s.sortBy||'default';
                restoreCheckboxState('dev',s.selectedDevs); restoreCheckboxState('leader',s.selectedLeaders); restoreCheckboxState('planCat',s.selectedPlanCats);
                restoreCheckboxState('wave',s.selectedWaves); restoreCheckboxState('category',s.selectedCategories); restoreCheckboxState('fabric',s.selectedFabrics);
                ['minSales','maxSales','minBsr','maxBsr','minRating','maxRating','minReviews','maxReviews'].forEach(k=>g(k).value=s[k]||'');
                g('onlyNoRating').checked=!!s.onlyNoRating; g('onlyNoBsr').checked=!!s.onlyNoBsr; g('onlyHasTrend').checked=!!s.onlyHasTrend;
                currentPage=s.currentPage||1; return s;
            }catch(e){ return null; }
        }

        function filterProducts(){
            const f=getActiveFilterRanges();
            filteredProducts=allProducts.filter(p=>matchProductFilters(p,null,f));
            const sb=document.getElementById('sortBy').value;
            if(sb==='sales_desc') filteredProducts.sort((a,b)=>(b.salesNum||0)-(a.salesNum||0));
            else if(sb==='rating_asc') filteredProducts.sort((a,b)=>(a.ratingNum||99)-(b.ratingNum||99));
            else if(sb==='reviews_desc') filteredProducts.sort((a,b)=>(b.reviewsNum||0)-(a.reviewsNum||0));
            else if(sb==='bsr_asc') filteredProducts.sort((a,b)=>(a.bsrNum||999999)-(b.bsrNum||999999));
            updateFilterInfoDisplay(f); renderGrid(); saveFilterState();
        }

        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function compCell(c){
            if(!c) return `<div class="cell"><div class="cell-title comp-title">竞品</div><div class="comp-empty">无竞品</div></div>`;
            const priceStr = c.priceNum!==null ? '$'+c.priceNum.toFixed(2) : 'N/A';
            const bsrStr = c.bsrNum!==null ? c.bsrNum.toLocaleString() : 'N/A';
            const img = c.imgSrc || 'https://via.placeholder.com/200x260?text=No+Image';
            const isOwn = !!c.isOwnBrand;
            const titleTxt = isOwn ? `本公司 ${esc(c.brand||'')} ${esc(c.asin)}` : `竞品 ${esc(c.asin)}`;
            return `<div class="cell ${isOwn?'comp-cell-own':''}">
                <div class="cell-title comp-title" ${isOwn?'style="background:#232f3e;"':''}>${titleTxt}</div>
                <div class="comp-img-wrap">
                    ${isOwn?`<div class="own-brand-tag" title="品牌 ${esc(c.brand||'')} 属于本公司">★ 公司产品</div>`:''}
                    <img class="comp-img" src="${img}" loading="lazy" onclick="zoomImage('${c.imgSrc}')" alt="竞品图">
                </div>
                <div class="comp-info">
                    <div><a href="${esc(c.url)}" target="_blank" title="点击跳转竞品详情页">${esc(c.asin)}</a></div>
                    <div>月销量: <span class="v" style="color:#d32f2f;">${c.salesNum!==null?c.salesNum:'N/A'}</span></div>
                    <div>价格: <span class="v" style="color:#2e7d32;">${priceStr}</span></div>
                    <div>评分: <span class="v">${c.ratingNum!==null?c.ratingNum:'N/A'} &#9733;</span> (${c.reviewsNum!==null?c.reviewsNum:'N/A'})</div>
                    <div>大类BSR: <span class="bsr-badge" style="background:${getBsrColor(c.bsrNum)};">${bsrStr}</span></div>
                    <div>上架: <span class="v">${esc(c.listDate)}</span></div>
                </div>
            </div>`;
        }

        function renderGrid(){
            const container=document.getElementById('productsContainer'); container.innerHTML='';
            document.getElementById('productCount').textContent=filteredProducts.length;
            const threshold=parseFloat(document.getElementById('ratingThreshold').value)||0;
            const bsrThreshold=parseFloat(document.getElementById('bsrThreshold').value)||0;
            const totalPages=Math.ceil(filteredProducts.length/itemsPerPage)||1;
            if(currentPage>totalPages) currentPage=totalPages; if(currentPage<1) currentPage=1;
            document.getElementById('totalPages').textContent=totalPages;
            document.getElementById('currentPage').textContent=currentPage;
            document.getElementById('prevBtn').disabled=currentPage<=1;
            document.getElementById('nextBtn').disabled=currentPage>=totalPages;
            const start=(currentPage-1)*itemsPerPage;
            const pageData=filteredProducts.slice(start,start+itemsPerPage);

            pageData.forEach(p=>{
                const isLowRating = p.ratingNum!==null && p.ratingNum<threshold;
                const isBsrExcellent = p.bsrNum!==null && p.bsrNum>0 && p.bsrNum<=bsrThreshold;
                const priceStr = p.priceNum!==null ? '$'+p.priceNum.toFixed(2) : 'N/A';
                const bsrStr = p.bsrNum!==null ? p.bsrNum.toLocaleString() : 'N/A';
                const hasTrend = p.bsrTrend && Object.keys(p.bsrTrend).length>0;
                const ownImg = p.imgSrc || 'https://via.placeholder.com/300x400?text=No+Image';

                const row=document.createElement('div');
                row.className=`product-row ${isLowRating?'low-rating-card':''}`;

                // 位置1: 公司产品主图
                let html = `<div class="cell own-cell-wrap">
                    <div class="cell-title own-title">公司产品</div>
                    ${isLowRating?`<div class="warning-tag">&#9888; 评分&lt;${threshold}</div>`:''}
                    ${isBsrExcellent?`<div class="bsr-excellent-tag">&#128293; BSR&le;${bsrThreshold}</div>`:''}
                    <img class="prod-img" src="${ownImg}" loading="lazy" onclick="zoomImage('${p.imgSrc}')" alt="公司产品主图">
                    ${hasTrend?`<div style="text-align:center;margin-top:6px;"><button onclick='showBsrTrendChart(${JSON.stringify(p.sku)}, ${JSON.stringify(p.asin)}, ${JSON.stringify(p.bsrTrend)})' style="background:#28a745;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">&#128200; BSR趋势</button></div>`:''}
                </div>`;

                // 位置2: 公司信息（三板块）
                html += `<div class="cell">
                    <div class="cell-title own-title">产品信息</div>
                    <div class="own-info">
                        <div class="info-block top">
                            <div class="info-line"><span class="k">月销量:</span> <span class="v" style="color:#d32f2f;">${p.sales}</span></div>
                            <div class="info-line"><span class="k">价格:</span> <span class="v" style="color:#2e7d32;">${priceStr}</span></div>
                            <div class="info-line"><span class="k">大类BSR:</span> <span class="bsr-badge" style="background:${getBsrColor(p.bsrNum)};">${bsrStr}</span></div>
                            <div class="info-line"><span class="k">评分:</span> <span class="v" style="${isLowRating?'color:#d32f2f;':''}">${p.rating} &#9733;</span></div>
                            <div class="info-line"><span class="k">评分数:</span> <span class="v">${p.reviews}</span></div>
                        </div>
                        <div class="info-block mid">
                            <div class="info-line"><span class="k">SKU:</span> <a href="${esc(p.url)}" target="_blank" title="点击跳转商品详情页">${esc(p.sku)}</a></div>
                            <div class="info-line"><span class="k">负责开发:</span> <span class="v">${esc(p.dev)}</span></div>
                            <div class="info-line"><span class="k">组长:</span> <span class="v">${esc(p.leader)}</span></div>
                            <div class="info-line"><span class="k">组别:</span> <span class="v">${esc(p.group)}</span></div>
                            <div class="info-line"><span class="k">商品波段:</span> <span class="v">${esc(p.wave)}</span></div>
                            <div class="info-line"><span class="k">库存定位:</span> <span class="v">${esc(p.stockPos)}</span></div>
                            <div class="info-line"><span class="k">品类中文:</span> <span class="v">${esc(p.category)}</span></div>
                        </div>
                        <div class="info-block bot">
                            <div class="info-line"><span class="k">企划类目:</span> <span class="v">${esc(p.planCat)}</span></div>
                            <div class="info-line"><span class="k">期望面料:</span> <span class="v">${esc(p.fabric)}</span></div>
                            <div class="info-line"><span class="k">成分比例:</span> <span class="v">${esc(p.ratio)}</span></div>
                            <div class="info-line sellpoint"><span class="k">核心卖点:</span> <span class="v">${esc(p.sellpoint)}</span></div>
                        </div>
                    </div>
                </div>`;

                // 位置3-7: 5个竞品
                for(let i=0;i<5;i++){ html += compCell(p.competitors[i]); }

                row.innerHTML=html;
                container.appendChild(row);
            });
        }

        function changePage(delta){ currentPage+=delta; renderGrid(); saveFilterState(); window.scrollTo({top:0,behavior:'smooth'}); }

        function resetFilters(){
            localStorage.removeItem('productCompareState_track');
            const g=id=>document.getElementById(id);
            g('globalSearch').value=''; g('sortBy').value='default';
            ['minSales','maxSales','minBsr','maxBsr','minRating','maxRating','minReviews','maxReviews'].forEach(k=>g(k).value='');
            g('ratingThreshold').value='4.2'; g('bsrThreshold').value='50000';
            g('onlyNoRating').checked=false; g('onlyNoBsr').checked=false; g('onlyHasTrend').checked=false;
            document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{ cb.checked = cb.value==='all'; });
            currentPage=1; updateAllFilters(); filterProducts();
        }

        function zoomImage(src){ if(!src) return; document.getElementById('overlayImg').src=src; document.getElementById('imageOverlay').style.display='flex'; }

        function downloadOriginalData(){
            if(!excelBase64){ alert('数据文件未加载'); return; }
            const link=document.createElement('a');
            link.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+excelBase64;
            link.download='a数据处理结果_原始数据.xlsx';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeChartModal(); document.getElementById('imageOverlay').style.display='none'; } });
        window.addEventListener('scroll',()=>{ saveFilterState(); });
        document.querySelectorAll('.filter-container input, .filter-container select').forEach(el=>{
            el.addEventListener('input',()=>{ updateAllFilters(); filterProducts(); });
            el.addEventListener('change',()=>{ updateAllFilters(); filterProducts(); });
        });
        window.addEventListener('DOMContentLoaded',()=>{
            const s=restoreFilterState(); updateAllFilters(); filterProducts();
            if(s&&s.scrollY){ setTimeout(()=>window.scrollTo(0,s.scrollY),100); }
        });
    </script>
</body>
</html>
