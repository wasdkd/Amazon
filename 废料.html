        '数字7是魔法数字，但无法变出钱来。',
        '七的倍数出现，今天适合集齐七颗龙珠召唤午饭。',
        '7倍能量: 周一到周日，每天都是周一综合症。',
        '七的倍数告诉你，生命不过七千多天，而你已浪费大半。',
        '七倍数: 七七四十九，干啥啥不行。',
        '7倍驾到，今天不宜打麻将，容易自摸七筒然后输光。',
        '7倍小秘密：你的运气周期是7天，每天都很差。',
        '7倍定律：连续7天熬夜，就会获得7天黑眼圈。',
        '7倍占卜：第7个小时会有奇遇，比如发现手机没电。',
        '7倍冷笑话：为什么7是幸运数字？因为8才是发。',
        '7倍哲学：一周七天，你总有七天不想上班。',
        '7倍健身：做7个仰卧起坐，然后休息70分钟。',
        '7倍食谱：一周吃7次外卖，周周如此。',
        '7倍作息：每天睡7小时，其中6小时在翻身。',
        '7倍祝福：愿你的烦恼每隔7天自动清零一次（并不）。',
        '7倍警句：七倍数的日子，别做重大决定，因为7天以后你会后悔。',
        '7倍神谕：七是一个循环，就像你的人生兜兜转转还是穷。',
        '7倍彩蛋：你读到这句的时候，已经浪费了7秒钟。'
    ];

    const defaultTemplates = [
        '这个数字代表“算了”，今天不适合努力。',
        '数字占卜结果: 你的运势正在重启，请稍后再颓。',
        '此数字暗藏玄机，玄机就是没有玄机。',
        '这串数字的暗示: 你该放下手机休息了。',
        '数字说: 人生苦短，再来一碗。',
        '根据量子废话学，你今天适合网购。',
        '数字告诉宇宙: 你想涨薪，但宇宙没听见。',
        '此数字提醒你，离过年又近了一天，体重又重一斤。',
        '数字占卜结论: 可以继续躺平。',
        '这个数字说: 别问，问就是不知道。',
        '数字跟你讲了个笑话：你的年终奖。',
        '数字承诺：今天不会有好事，也不会有坏事，就是普通无聊。',
        '数字建议：按任意键继续摆烂。',
        '数字天气预报：局部有雨，局部有伞，你局部没带。',
        '数字星座：今天不宜思考，适宜傻笑。',
        '数字快递：你的好运正在派送中，但因地址不详已退回。',
        '数字外卖：你的快乐已送达，请给个差评。',
        '数字闹钟：起床吧，再睡就天黑了。',
        '数字日历：今天什么日子？浪费日的第365天。',
        '数字冷笑话：这个数字是你本月剩余的钱。',
        '数字哲学：数字无所谓好坏，反正你都不行。',
        '数字占卜更新：失败是成功之母，那你肯定是孤儿。',
        '数字神谕：别试图理解数字，理解自己都很难。',
        '数字彩蛋：你已经看了很多废话，但这是最后一句。'
    ];

    // 扩展每个类别到至少100句（通过重复模板并轻微变化，实际数量远大于100）
    function expandTo(target, templates) {
        let corpus = [];
        while (corpus.length < target) {
            for (let t of templates) {
                if (corpus.length >= target) break;
                corpus.push(t);
            }
        }
        // 随机打乱
        for (let i = corpus.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [corpus[i], corpus[j]] = [corpus[j], corpus[i]];
        }
        return corpus;
    }

    const themedWaste = {
        even: expandTo(100, evenTemplates),
        odd: expandTo(100, oddTemplates),
        prime: expandTo(100, primeTemplates),
        palindrome: expandTo(100, palindromeTemplates),
        multipleOf7: expandTo(100, multipleOf7Templates),
        perfectSquare: expandTo(100, squareTemplates),
        default: expandTo(100, defaultTemplates)
    };

    // 辅助函数：判断质数
    function isPrime(n) {
        if (n <= 1) return false;
        if (n === 2) return true;
        if (n % 2 === 0) return false;
        for (let i = 3; i <= Math.sqrt(n); i += 2) {
            if (n % i === 0) return false;
        }
        return true;
    }

    // 根据数字返回占卜废话
    function getPhraseByNumber(num) {
        if (isNaN(num)) return themedWaste.default[Math.floor(Math.random() * themedWaste.default.length)];
        const n = Math.abs(Math.floor(num));
        const strNum = n.toString();
        // 回文 (长度大于1)
        const isPalindrome = strNum === strNum.split('').reverse().join('') && strNum.length > 1;
        if (isPalindrome && n > 10) {
            return themedWaste.palindrome[Math.floor(Math.random() * themedWaste.palindrome.length)];
        }
        // 完全平方数
        const sqrt = Math.sqrt(n);
        const isPerfectSquare = Number.isInteger(sqrt) && n > 0;
        if (isPerfectSquare && n !== 1) {
            return themedWaste.perfectSquare[Math.floor(Math.random() * themedWaste.perfectSquare.length)];
        }
        // 质数
        if (isPrime(n) && n > 1) {
            return themedWaste.prime[Math.floor(Math.random() * themedWaste.prime.length)];
        }
        // 7的倍数
        if (n !== 0 && n % 7 === 0) {
            return themedWaste.multipleOf7[Math.floor(Math.random() * themedWaste.multipleOf7.length)];
        }
        // 奇偶
        if (n % 2 === 0) {
            return themedWaste.even[Math.floor(Math.random() * themedWaste.even.length)];
        } else {
            return themedWaste.odd[Math.floor(Math.random() * themedWaste.odd.length)];
        }
    }

    function getRandomWaste() {
        return uniqueLibrary[Math.floor(Math.random() * uniqueLibrary.length)];
    }

    let currentPhrase = '';

    function updateUIWithPhrase(phrase, flash = true) {
        currentPhrase = phrase;
        const phraseEl = document.getElementById('phraseText');
        const container = document.getElementById('phraseBox');
        if (flash && container) {
            container.classList.add('flash');
            setTimeout(() => container.classList.remove('flash'), 120);
        }
        phraseEl.textContent = phrase;
    }

    function randomGenerate() {
        updateUIWithPhrase(getRandomWaste(), true);
    }

    function divineByNumber() {
        const input = document.getElementById('numberInput');
        let rawValue = input.value.trim();
        if (rawValue === '') rawValue = '0';
        let num = Number(rawValue);
        if (isNaN(num)) num = 0;
        const divinePhrase = getPhraseByNumber(num);
        updateUIWithPhrase(`🔮 数字 ${num} 的废料预言:\n${divinePhrase}`, true);
    }

    async function copyToClipboard() {
        if (!currentPhrase || currentPhrase === '') {
            currentPhrase = document.getElementById('phraseText').innerText;
        }
        try {
            await navigator.clipboard.writeText(currentPhrase);
            showToast('✨ 废料已复制，快去祸害朋友 ✨');
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = currentPhrase;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('📋 复制成功（手动保底）');
        }
    }

    let toastTimer = null;
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        if (!toast) return;
        toast.textContent = msg || '✨ 已复制，可分享到朋友圈 ✨';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function init() {
        currentPhrase = uniqueLibrary[Math.floor(Math.random() * uniqueLibrary.length)];
        document.getElementById('phraseText').textContent = currentPhrase;
        document.getElementById('numberInput').value = '42';
    }

    document.addEventListener('DOMContentLoaded', () => {
        init();
        document.getElementById('generateBtn').addEventListener('click', randomGenerate);
        document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
        document.getElementById('divineBtn').addEventListener('click', divineByNumber);
        document.getElementById('numberInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') divineByNumber();
        });
    });
</script>
</body>
