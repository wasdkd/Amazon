    &lt;!-- 引入SheetJS库用于Excel处理 --&gt;
    &lt;script src=&quot;https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
    &lt;!-- 引入JSZip库用于创建ZIP文件 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // 文件数据存储
        let filesData = [];
        let originalFilesData = [];

        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileTableBody = document.getElementById('fileTableBody');
        const fileCountElement = document.getElementById('fileCount');
        const uploadStatus = document.getElementById('uploadStatus');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const applyRenamesBtn = document.getElementById('applyRenamesBtn');
        const resetBtn = document.getElementById('resetBtn');
        const previewNameBtn = document.getElementById('previewNameBtn');
        const applyNameChangesBtn = document.getElementById('applyNameChangesBtn');
        const previewExtBtn = document.getElementById('previewExtBtn');
        const applyExtChangesBtn = document.getElementById('applyExtChangesBtn');
        const downloadExcelBtn = document.getElementById('downloadExcelBtn');
        const uploadExcelBtn = document.getElementById('uploadExcelBtn');
        const excelFileInput = document.getElementById('excelFileInput');

        // 事件监听器
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#e3e9ff';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.backgroundColor = '#f8faff';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#f8faff';
            handleFolderDrop(e);
        });

        fileInput.addEventListener('change', (e) =&gt; {
            handleFiles(e.target.files);
        });

        applyRenamesBtn.addEventListener('click', applyAllRenames);
        resetBtn.addEventListener('click', resetAll);

        previewNameBtn.addEventListener('click', previewNameChanges);
        previewExtBtn.addEventListener('click', previewExtChanges);

        downloadExcelBtn.addEventListener('click', downloadExcelTemplate);
        uploadExcelBtn.addEventListener('click', () =&gt; excelFileInput.click());
        excelFileInput.addEventListener('change', handleExcelUpload);

        // 处理拖放文件夹
        async function handleFolderDrop(e) {
            const items = e.dataTransfer.items;
            const files = [];

            // 遍历拖放的项目
            for (const item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    await traverseFileTree(entry, files);
                }
            }

            // 转换为FileList类似对象
            const fileList = {
                length: files.length,
                item: (index) =&gt; files[index],
                ...files
            };

            handleFiles(fileList);
        }

        // 遍历文件树（用于拖放文件夹）
        async function traverseFileTree(entry, files) {
            if (entry.isFile) {
                return new Promise((resolve) =&gt; {
                    entry.file((file) =&gt; {
                        // 只处理图片文件
                        if (file.type.startsWith('image/')) {
                            files.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                return new Promise((resolve) =&gt; {
                    reader.readEntries(async (entries) =&gt; {
                        for (const childEntry of entries) {
                            await traverseFileTree(childEntry, files);
                        }
                        resolve();
                    });
                });
            }
        }

        // 处理上传的文件
        function handleFiles(fileList) {
            if (fileList.length === 0) return;

            loadingIndicator.classList.add('active');

            // 清空现有数据
            filesData = [];
            originalFilesData = [];
            fileTableBody.innerHTML = '';

            // 筛选图片文件
            const imageFiles = Array.from(fileList).filter(file =&gt;
                file.type.startsWith('image/')
            );

            if (imageFiles.length === 0) {
                uploadStatus.textContent = '未找到图片文件，请上传包含图片的文件夹';
                uploadStatus.style.color = '#dc3545';
                loadingIndicator.classList.remove('active');
                return;
            }

            uploadStatus.textContent = `成功加载 ${imageFiles.length} 个图片文件`;
            uploadStatus.style.color = '#28a745';

            // 处理每个文件
            imageFiles.forEach((file, index) =&gt; {
                // 提取文件名和扩展名
                const lastDotIndex = file.name.lastIndexOf('.');
                const nameWithoutExt = lastDotIndex &gt; 0 ? file.name.substring(0, lastDotIndex) : file.name;
                const extension = lastDotIndex &gt; 0 ? file.name.substring(lastDotIndex) : '';

                // 创建文件对象
                const fileObj = {
                    id: index + 1,
                    originalName: file.name,
                    originalNameWithoutExt: nameWithoutExt,
                    originalExtension: extension,
                    newNameWithoutExt: nameWithoutExt,
                    newExtension: extension,
                    file: file,
                    previewUrl: URL.createObjectURL(file),
                    status: '未更改'
                };

                filesData.push(fileObj);
                originalFilesData.push({...fileObj}); // 保存原始数据副本

                // 创建表格行
                addFileToTable(fileObj);
            });

            updateFileCount();
            loadingIndicator.classList.remove('active');
            applyRenamesBtn.disabled = false;

            // 更新Excel下载按钮状态
            downloadExcelBtn.disabled = false;
        }

        // 添加文件到表格
        function addFileToTable(fileObj) {
            const row = document.createElement('tr');
            row.dataset.id = fileObj.id;

            row.innerHTML = `
                &lt;td&gt;${fileObj.id}&lt;/td&gt;
                &lt;td&gt;
                    &lt;img src=&quot;${fileObj.previewUrl}&quot; alt=&quot;预览&quot; class=&quot;preview-img&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;div class=&quot;filename-cell&quot;&gt;
                        &lt;i class=&quot;fas fa-file-image file-icon&quot;&gt;&lt;/i&gt;
                        &lt;div&gt;
                            &lt;div&gt;${fileObj.originalName}&lt;/div&gt;
                            &lt;div class=&quot;original-name&quot;&gt;原始名称&lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;input type=&quot;text&quot; class=&quot;new-name-input&quot; value=&quot;${fileObj.newNameWithoutExt}&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;${fileObj.originalExtension}&lt;/td&gt;
                &lt;td&gt;
                    &lt;select class=&quot;new-ext-select&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                        &lt;option value=&quot;.jpg&quot; ${fileObj.newExtension === '.jpg' ? 'selected' : ''}&gt;.jpg&lt;/option&gt;
                        &lt;option value=&quot;.png&quot; ${fileObj.newExtension === '.png' ? 'selected' : ''}&gt;.png&lt;/option&gt;
                        &lt;option value=&quot;.gif&quot; ${fileObj.newExtension === '.gif' ? 'selected' : ''}&gt;.gif&lt;/option&gt;
                        &lt;option value=&quot;.webp&quot; ${fileObj.newExtension === '.webp' ? 'selected' : ''}&gt;.webp&lt;/option&gt;
                        &lt;option value=&quot;.bmp&quot; ${fileObj.newExtension === '.bmp' ? 'selected' : ''}&gt;.bmp&lt;/option&gt;
                        &lt;option value=&quot;.jpeg&quot; ${fileObj.newExtension === '.jpeg' ? 'selected' : ''}&gt;.jpeg&lt;/option&gt;
                        &lt;option value=&quot;.svg&quot; ${fileObj.newExtension === '.svg' ? 'selected' : ''}&gt;.svg&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/td&gt;
                &lt;td class=&quot;status-cell&quot; data-id=&quot;${fileObj.id}&quot;&gt;${fileObj.status}&lt;/td&gt;
            `;

            fileTableBody.appendChild(row);

            // 添加事件监听器
            const nameInput = row.querySelector('.new-name-input');
            const extSelect = row.querySelector('.new-ext-select');
            const statusCell = row.querySelector('.status-cell');

            nameInput.addEventListener('input', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateFileName(id, e.target.value, null);
                updateStatus(id);
                updateFileCount();
            });

            extSelect.addEventListener('change', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateFileName(id, null, e.target.value);
                updateStatus(id);
                updateFileCount();
            });
        }

        // 更新文件名
        function updateFileName(id, newNameWithoutExt, newExtension) {
            const fileObj = filesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            if (newNameWithoutExt !== null) {
                fileObj.newNameWithoutExt = newNameWithoutExt;
            }

            if (newExtension !== null) {
                fileObj.newExtension = newExtension;
            }

            // 检查是否有更改
            const isNameChanged = fileObj.newNameWithoutExt !== fileObj.originalNameWithoutExt;
            const isExtChanged = fileObj.newExtension !== fileObj.originalExtension;

            if (isNameChanged || isExtChanged) {
                fileObj.status = '已修改';
            } else {
                fileObj.status = '未更改';
            }
        }

        // 更新状态显示
        function updateStatus(id) {
            const fileObj = filesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            const statusCell = document.querySelector(`.status-cell[data-id=&quot;${id}&quot;]`);
            if (statusCell) {
                statusCell.textContent = fileObj.status;
                statusCell.style.color = fileObj.status === '已修改' ? '#28a745' : '#6c757d';
            }
        }

        // 更新文件计数
        function updateFileCount() {
            const count = filesData.length;
            const modifiedCount = filesData.filter(f =&gt; f.status === '已修改').length;

            fileCountElement.textContent = `${count} 个文件${modifiedCount &gt; 0 ? ` (${modifiedCount} 个已修改)` : ''}`;
        }

        // 预览名称更改
        function previewNameChanges() {
    const pattern = document.getElementById('namePattern').value;
    const startNumber = parseInt(document.getElementById('startNumber').value) || 1;
    const customPrefix = document.getElementById('customPrefix').value;

    filesData.forEach((fileObj, index) =&gt; {
        let newName = '';

        switch (pattern) {
            case 'sequential':
                newName = `图片${startNumber + index}`;
                break;
            case 'date':
                const today = new Date();
                const dateStr = today.toISOString().split('T')[0];
                newName = `${dateStr}_${startNumber + index}`;
                break;
            case 'timestamp':
                const timestamp = Math.floor(Date.now() / 1000);
                newName = `${timestamp}_${startNumber + index}`;
                break;
            case 'custom':
            default:
                newName = customPrefix ? `${customPrefix}${startNumber + index}` : fileObj.originalNameWithoutExt;
                break;
        }

        // 更新表格中的输入框
        const nameInput = document.querySelector(`.new-name-input[data-id=&quot;${fileObj.id}&quot;]`);
        if (nameInput) {
            nameInput.value = newName;
        }

        // 直接调用updateFileName来更新状态
        updateFileName(fileObj.id, newName, null);
    });

    updateFileCount();
}



        // 预览后缀更改
        function previewExtChanges() {
    const currentExtFilter = document.getElementById('currentExtFilter').value;
    const newExtension = document.getElementById('newExtension').value;

    filesData.forEach((fileObj) =&gt; {
        // 检查是否满足筛选条件
        if (currentExtFilter !== 'all' &amp;&amp; fileObj.originalExtension !== currentExtFilter) {
            return;
        }

        // 更新表格中的选择框
        const extSelect = document.querySelector(`.new-ext-select[data-id=&quot;${fileObj.id}&quot;]`);
        if (extSelect) {
            extSelect.value = newExtension;
        }

        // 直接调用updateFileName来更新状态
        updateFileName(fileObj.id, null, newExtension);
    });

    updateFileCount();
}



        // 下载Excel模板
        function downloadExcelTemplate() {
            if (filesData.length === 0) {
                alert('请先上传图片文件！');
                return;
            }

            // 创建工作簿
            const wb = XLSX.utils.book_new();

            // 创建工作表数据
            const wsData = [
                ['原始文件名', '新文件名（请在此列填写）', '原始后缀', '新后缀（可选）'],
                ['说明：请在第二列填写您想要的新文件名（不需要填写后缀）', '', '', '']
            ];

            // 添加每个文件的数据
            filesData.forEach(fileObj =&gt; {
                wsData.push([
                    fileObj.originalName,
                    fileObj.originalNameWithoutExt, // 初始值设为原始文件名（不带后缀）
                    fileObj.originalExtension,
                    fileObj.originalExtension // 初始值设为原始后缀
                ]);
            });

            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // 设置列宽
            const wscols = [
                {wch: 30}, // 原始文件名
                {wch: 30}, // 新文件名
                {wch: 10}, // 原始后缀
                {wch: 10}  // 新后缀
            ];
            ws['!cols'] = wscols;

            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, &quot;图片重命名&quot;);

            // 生成Excel文件并下载
            XLSX.writeFile(wb, '图片重命名模板.xlsx');

            alert('Excel模板已生成！请填写第二列&quot;新文件名&quot;和第四列&quot;新后缀&quot;，然后上传Excel文件以应用更改。');
        }

        // 处理Excel文件上传
        function handleExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    // 检查文件类型
    if (!file.name.match(/\.(xlsx|xls)$/)) {
        alert('请上传Excel文件（.xlsx或.xls格式）');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});

            // 获取第一个工作表
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

            // 跳过表头行
            const dataRows = sheetData.slice(2); // 跳过标题行和说明行

            if (dataRows.length === 0) {
                alert('Excel文件中没有数据！');
                return;
            }

            // 用于统计更新了多少文件
            let updatedCount = 0;

            // 遍历Excel数据行
            dataRows.forEach(row =&gt; {
                const originalName = row[0]; // 第一列：原始文件名
                const newName = row[1]; // 第二列：新文件名
                const newExtension = row[3]; // 第四列：新后缀（可选）

                // 查找匹配的文件
                const fileObj = filesData.find(f =&gt; f.originalName === originalName);

                if (fileObj &amp;&amp; newName) {
                    // 更新文件名（不带后缀）
                    fileObj.newNameWithoutExt = newName;

                    // 更新表格中的输入框
                    const nameInput = document.querySelector(`.new-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                    if (nameInput) {
                        nameInput.value = newName;
                    }

                    // 关键修复：手动调用更新文件名函数来确保状态正确更新
                    updateFileName(fileObj.id, newName, null);
                    updatedCount++;
                }

                // 如果有新后缀，更新后缀
                if (fileObj &amp;&amp; newExtension &amp;&amp; newExtension.startsWith('.')) {
                    fileObj.newExtension = newExtension;

                    // 更新表格中的选择框
                    const extSelect = document.querySelector(`.new-ext-select[data-id=&quot;${fileObj.id}&quot;]`);
                    if (extSelect) {
                        extSelect.value = newExtension;
                    }

                    // 关键修复：手动调用更新文件名函数来确保状态正确更新
                    updateFileName(fileObj.id, null, newExtension);
                }

                // 更新状态
                if (fileObj) {
                    updateStatus(fileObj.id);
                }
            });

            // 更新文件计数
            updateFileCount();

            // 清空文件输入
            excelFileInput.value = '';

            alert(`成功从Excel文件更新了 ${updatedCount} 个文件的名称！`);

        } catch (error) {
            console.error('解析Excel文件时出错:', error);
            alert('解析Excel文件时出错，请确保文件格式正确。');
        }
    };

    reader.readAsArrayBuffer(file);
}

        // 应用所有重命名并下载
        function applyAllRenames() {
            if (filesData.length === 0) return;

            const modifiedFiles = filesData.filter(f =&gt; f.status === '已修改');
            if (modifiedFiles.length === 0) {
                alert('没有文件被修改，请先修改文件名或后缀。');
                return;
            }

            // 创建Zip文件
            const zip = new JSZip();

            modifiedFiles.forEach(fileObj =&gt; {
                const newFileName = fileObj.newNameWithoutExt + fileObj.newExtension;
                zip.file(newFileName, fileObj.file);
            });

            // 生成Zip文件并下载
            zip.generateAsync({type: &quot;blob&quot;})
                .then(function(content) {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = '重命名后的图片.zip';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // 更新状态
                    filesData.forEach(fileObj =&gt; {
                        if (fileObj.status === '已修改') {
                            fileObj.status = '已下载';
                            updateStatus(fileObj.id);
                        }
                    });

                    alert(`成功打包并下载 ${modifiedFiles.length} 个文件！`);
                })
                .catch(error =&gt; {
                    console.error('创建ZIP文件时出错:', error);
                    alert('创建ZIP文件时出错，请重试。');
                });
        }

        // 重置所有更改
        function resetAll() {
            if (filesData.length === 0) return;

            if (!confirm('确定要重置所有更改吗？这将恢复所有文件到原始名称。')) {
                return;
            }

            // 恢复原始数据
            filesData = originalFilesData.map(f =&gt; ({...f}));

            // 更新表格
            fileTableBody.innerHTML = '';
            filesData.forEach(fileObj =&gt; {
                addFileToTable(fileObj);
            });

            updateFileCount();
            alert('所有更改已重置！');
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () =&gt; {
            // 添加一些示例文件（仅用于演示）
            setTimeout(() =&gt; {
                uploadStatus.textContent = '请上传包含图片的文件夹，或拖放文件夹到此区域';
                uploadStatus.style.color = '#666';
            }, 100);
        });
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;">

&lt;!--&amp;lt;!&amp;ndash;写前端代码，实现批量创建文件夹的功能和批量修改文件夹名称的功能，有选择按钮，实现不同的功能，批量创建文件夹可以在网页上写要创建的文件夹名称，也可以通过上传excel表名称--&gt;
&lt;!--的方式修改，网页给出excel表模板，修改文件夹名称是用户上传一个大文件夹，里面有许多的子文件夹，可以在页面进行修改看，也可以通过excel表上传进行修改&amp;ndash;&amp;gt;--&gt;

&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;

    &lt;!-- 引入 JSZip 库用于创建 ZIP 文件 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;

    &lt;style&gt;

    &lt;div class=&quot;container&quot;&gt;

                        &lt;div class=&quot;hint&quot;&gt;

                            &lt;input type=&quot;file&quot; id=&quot;create-excel-file&quot; accept=&quot;.xlsx, .xls&quot; style=&quot;display: none;&quot;&gt;
                            &lt;button class=&quot;upload-btn&quot; id=&quot;create-browse-btn&quot;&gt;选择Excel文件&lt;/button&gt;

    &lt;script&gt;
        // 切换输入方法
        const methodBtns = document.querySelectorAll('.method-btn');

        methodBtns.forEach(btn =&gt; {
            btn.addEventListener('click', () =&gt; {
                const method = btn.getAttribute('data-method');
                const parentSection = btn.closest('.input-section');

                // 更新按钮状态
                parentSection.querySelectorAll('.method-btn').forEach(b =&gt; b.classList.remove('active'));
                btn.classList.add('active');

                // 更新输入区域显示
                const textInput = parentSection.querySelector('.text-input');
                const excelUpload = parentSection.querySelector('.file-upload');

                if (method === 'text') {
                    textInput.classList.add('active');
                    excelUpload.classList.remove('active');
                } else {
                    textInput.classList.remove('active');
                    excelUpload.classList.add('active');
                }
            });
        });

        // 显示/隐藏加载指示器
        function showLoading(show) {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (show) {
                loadingIndicator.classList.add('active');
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        // 创建文件夹 - 文本输入变化时更新预览
        const createTextInput = document.querySelector('#create-text-input textarea');
        const createFolderPreview = document.getElementById('create-folder-preview');

        createTextInput.addEventListener('input', updateCreatePreview);

        function updateCreatePreview() {
            const folderNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');

            if (folderNames.length === 0) {
                createFolderPreview.innerHTML = `
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;项目文档&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;客户资料&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;会议记录&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;财务报告&lt;/div&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            createFolderPreview.innerHTML = '';
            folderNames.forEach(name =&gt; {
                const folderItem = document.createElement('div');
                folderItem.className = 'folder-item';
                folderItem.innerHTML = `
                    &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                    &lt;div class=&quot;folder-name&quot;&gt;${name.trim()}&lt;/div&gt;
                `;
                createFolderPreview.appendChild(folderItem);
            });
        }

        // 创建文件夹 - Excel上传
        const createBrowseBtn = document.getElementById('create-browse-btn');
        const createExcelFile = document.getElementById('create-excel-file');
        const createFileList = document.getElementById('create-file-list');

        createBrowseBtn.addEventListener('click', () =&gt; {
            createExcelFile.click();
        });

        createExcelFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                createFileList.innerHTML = `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 使用 SheetJS 解析 Excel 文件
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                        // 处理数据（假设第一列是文件夹名称）
                        const folderNames = [];
                        for (let i = 1; i &lt; sheetData.length; i++) {
                            const row = sheetData[i];
                            if (row &amp;&amp; row[0]) {
                                folderNames.push(row[0].toString());
                            }
                        }

                        // 更新文本输入区域
                        createTextInput.value = folderNames.join('\n');

                        // 更新预览
                        updateCreatePreview();

                        alert(`成功从Excel文件读取 ${folderNames.length} 个文件夹名称！`);
                    } catch (error) {
                        console.error('解析Excel文件时出错:', error);
                        alert('解析Excel文件时出错，请确保文件格式正确且第一列包含文件夹名称。');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 创建文件夹 - 下载模板
        document.getElementById('create-template-download').addEventListener('click', function(e) {
            e.preventDefault();

            // 定义模板数据
            const data = [
                ['文件夹名称'],
                ['项目文档'],
                ['客户资料'],
                ['会议记录'],
                ['财务报告']
            ];

            // 使用 SheetJS 创建工作簿
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '文件夹列表');

            // 导出为 .xlsx 文件
            XLSX.writeFile(wb, '文件夹创建模板.xlsx');
        });

        // 创建文件夹 - 清空按钮
        document.getElementById('create-clear-btn').addEventListener('click', function() {
            createTextInput.value = '';
            createFileList.innerHTML = '';
            createExcelFile.value = '';
            updateCreatePreview();
        });

        // 创建文件夹 - 执行按钮
        // document.getElementById('create-execute-btn').addEventListener('click', async function() {
        //     const folderNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
        //
        //     if (folderNames.length === 0) {
        //         alert('请先输入要创建的文件夹名称！');
        //         return;
        //     }
        //
        //     showLoading(true);
        //
        //     try {
        //         // 使用 JSZip 创建文件夹结构
        //         const zip = new JSZip();
        //
        //         // 为每个文件夹创建一个空文件（因为 ZIP 不支持空文件夹）
        //         folderNames.forEach(folderName =&gt; {
        //             // 创建一个空文件来确保文件夹被创建
        //             zip.folder(folderName).file('.keep', '');
        //         });
        //
        //         // 生成 ZIP 文件并下载
        //         const content = await zip.generateAsync({type: &quot;blob&quot;});
        //         const link = document.createElement('a');
        //         link.href = URL.createObjectURL(content);
        //         link.download = '批量创建文件夹.zip';
        //         document.body.appendChild(link);
        //         link.click();
        //         document.body.removeChild(link);
        //
        //         alert(`成功创建包含 ${folderNames.length} 个文件夹的压缩包！`);
        //     } catch (error) {
        //         console.error('创建 ZIP 文件失败:', error);
        //         alert('创建文件夹压缩包时发生错误，请重试。');
        //     } finally {
        //         showLoading(false);
        //     }
        // });
        document.getElementById('create-execute-btn').addEventListener('click', async function() {
    const folderNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');

    if (folderNames.length === 0) {
        alert('请先输入要创建的文件夹名称！');
        return;
    }

    showLoading(true);

    try {
        // 使用 JSZip 创建文件夹结构
        const zip = new JSZip();

        // 只创建文件夹结构，不添加任何文件
        folderNames.forEach(folderName =&gt; {
            zip.folder(folderName);
        });

        // 生成 ZIP 文件并下载
        const content = await zip.generateAsync({type: &quot;blob&quot;});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = '批量创建文件夹.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        alert(`成功创建包含 ${folderNames.length} 个文件夹的压缩包！`);
    } catch (error) {
        console.error('创建 ZIP 文件失败:', error);
        alert('创建文件夹压缩包时发生错误，请重试。');
    } finally {
        showLoading(false);
    }
});

        // 初始化预览
        updateCreatePreview();

&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;

    &lt;title&gt;批量Excel表管理工具&lt;/title&gt;
    &lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css&quot;&gt;

    &lt;style&gt;
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #1d6f42 0%, #14532d 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .function-selector {
            display: flex;
            border-bottom: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }

        .function-tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #dee2e6;
            color: #495057;
        }

        .function-tab:last-child {
            border-right: none;
        }

        .function-tab:hover {
            background-color: #e9ecef;
        }

        .function-tab.active {
            background-color: white;
            color: #1d6f42;
            border-bottom: 3px solid #1d6f42;
        }

        .function-tab i {
            margin-right: 10px;
        }

        .function-content {
            padding: 30px;
            display: none;
        }

        .function-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #1d6f42;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #1d6f42;
        }

        .input-method-selector {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            max-width: 400px;
        }

        .method-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #ddd;
        }

        .method-btn:last-child {
            border-right: none;
        }

        .method-btn:hover {
            background-color: #e9ecef;
        }

        .method-btn.active {
            background-color: #1d6f42;
            color: white;
        }

        .input-area {
            margin-bottom: 25px;
        }

        .text-input textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            transition: border 0.3s;
        }

        .text-input textarea:focus {
            outline: none;
            border-color: #1d6f42;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hint i {
            color: #1d6f42;
        }

        .file-upload {
            border: 2px dashed #c3cfe2;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: #1d6f42;
            background-color: #f8fafd;
        }

        .file-upload i {
            font-size: 3rem;
            color: #1d6f42;
            margin-bottom: 15px;
        }

        .file-upload p {
            margin-bottom: 20px;
            color: #666;
        }

        .upload-btn {
            background-color: #1d6f42;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .upload-btn:hover {
            background-color: #14532d;
        }

        .template-download {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1d6f42;
            text-decoration: none;
            font-weight: 500;
        }

        .template-download:hover {
            text-decoration: underline;
        }

        .excel-preview {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background-color: #f8fafd;
        }

        .excel-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .excel-item:last-child {
            border-bottom: none;
        }

        .excel-item i {
            color: #1d6f42;
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .excel-name {
            flex: 1;
        }

        .excel-name-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .excel-name-input:focus {
            outline: none;
            border-color: #1d6f42;
        }

        .excel-actions {
            display: flex;
            gap: 10px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .action-icon-btn:hover {
            color: #1d6f42;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .action-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .primary-btn {
            background-color: #1d6f42;
            color: white;
        }

        .primary-btn:hover {
            background-color: #14532d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 111, 66, 0.3);
        }

        .secondary-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .secondary-btn:hover {
            background-color: #e9ecef;
        }

        .file-list {
            margin-top: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item i {
            color: #1d6f42;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1d6f42;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .results-actions {
            display: flex;
            gap: 10px;
        }

        .results-textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: monospace;
            resize: vertical;
            background-color: #f8f9fa;
        }

        .results-count {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
            text-align: right;
        }

        /* 批量重命名样式 */
        .rename-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: #1d6f42;
            box-shadow: 0 0 0 3px rgba(29, 111, 66, 0.1);
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .excel-table th {
            background-color: #f8f9fa;
            padding: 15px 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            color: #495057;
        }

        .excel-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        .excel-table tr:hover {
            background-color: #f8f9fa;
        }

        .original-name {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* 创建功能左右布局 */
        .create-content {
            display: flex;
            gap: 30px;
        }

        .create-left {
            flex: 1;
        }

        .create-right {
            flex: 1;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 8px;
            }

            header {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .function-content {
                padding: 20px;
            }

            .function-selector {
                flex-direction: column;
            }

            .function-tab {
                border-right: none;
                border-bottom: 1px solid #dee2e6;
            }

            .actions {
                flex-direction: column;
                gap: 10px;
            }

            .action-btn {
                justify-content: center;
            }

            .rename-controls {
                flex-direction: column;
            }

            .create-content {
                flex-direction: column;
            }
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;header&gt;
