        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#f8faff';
            handleFolderDrop(e);
        });

        fileInput.addEventListener('change', (e) =&gt; {
            handleFiles(e.target.files);
        });

        applyRenamesBtn.addEventListener('click', applyAllRenames);
        resetBtn.addEventListener('click', resetAll);

        previewNameBtn.addEventListener('click', previewNameChanges);
        previewExtBtn.addEventListener('click', previewExtChanges);

        downloadExcelBtn.addEventListener('click', downloadExcelTemplate);
        uploadExcelBtn.addEventListener('click', () =&gt; excelFileInput.click());
        excelFileInput.addEventListener('change', handleExcelUpload);

        // 处理拖放文件夹
        async function handleFolderDrop(e) {
            const items = e.dataTransfer.items;
            const files = [];

            // 遍历拖放的项目
            for (const item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    await traverseFileTree(entry, files);
                }
            }

            // 转换为FileList类似对象
            const fileList = {
                length: files.length,
                item: (index) =&gt; files[index],
                ...files
            };

            handleFiles(fileList);
        }

        // 遍历文件树（用于拖放文件夹）
        async function traverseFileTree(entry, files) {
            if (entry.isFile) {
                return new Promise((resolve) =&gt; {
                    entry.file((file) =&gt; {
                        // 只处理图片文件
                        if (file.type.startsWith('image/')) {
                            files.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                return new Promise((resolve) =&gt; {
                    reader.readEntries(async (entries) =&gt; {
                        for (const childEntry of entries) {
                            await traverseFileTree(childEntry, files);
                        }
                        resolve();
                    });
                });
            }
        }

        // 处理上传的文件
        function handleFiles(fileList) {
            if (fileList.length === 0) return;

            loadingIndicator.classList.add('active');

            // 清空现有数据
            filesData = [];
            originalFilesData = [];
            fileTableBody.innerHTML = '';

            // 筛选图片文件
            const imageFiles = Array.from(fileList).filter(file =&gt;
                file.type.startsWith('image/')
            );

            if (imageFiles.length === 0) {
                uploadStatus.textContent = '未找到图片文件，请上传包含图片的文件夹';
                uploadStatus.style.color = '#dc3545';
                loadingIndicator.classList.remove('active');
                return;
            }

            uploadStatus.textContent = `成功加载 ${imageFiles.length} 个图片文件`;
            uploadStatus.style.color = '#28a745';

            // 处理每个文件
            imageFiles.forEach((file, index) =&gt; {
                // 提取文件名和扩展名
                const lastDotIndex = file.name.lastIndexOf('.');
                const nameWithoutExt = lastDotIndex &gt; 0 ? file.name.substring(0, lastDotIndex) : file.name;
                const extension = lastDotIndex &gt; 0 ? file.name.substring(lastDotIndex) : '';

                // 创建文件对象
                const fileObj = {
                    id: index + 1,
                    originalName: file.name,
                    originalNameWithoutExt: nameWithoutExt,
                    originalExtension: extension,
                    newNameWithoutExt: nameWithoutExt,
                    newExtension: extension,
                    file: file,
                    previewUrl: URL.createObjectURL(file),
                    status: '未更改'
                };

                filesData.push(fileObj);
                originalFilesData.push({...fileObj}); // 保存原始数据副本

                // 创建表格行
                addFileToTable(fileObj);
            });

            updateFileCount();
            loadingIndicator.classList.remove('active');
            applyRenamesBtn.disabled = false;

            // 更新Excel下载按钮状态
            downloadExcelBtn.disabled = false;
        }

        // 添加文件到表格
        function addFileToTable(fileObj) {
            const row = document.createElement('tr');
            row.dataset.id = fileObj.id;

            row.innerHTML = `
                &lt;td&gt;${fileObj.id}&lt;/td&gt;
                &lt;td&gt;
                    &lt;img src=&quot;${fileObj.previewUrl}&quot; alt=&quot;预览&quot; class=&quot;preview-img&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;div class=&quot;filename-cell&quot;&gt;
                        &lt;i class=&quot;fas fa-file-image file-icon&quot;&gt;&lt;/i&gt;
                        &lt;div&gt;
                            &lt;div&gt;${fileObj.originalName}&lt;/div&gt;
                            &lt;div class=&quot;original-name&quot;&gt;原始名称&lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;input type=&quot;text&quot; class=&quot;new-name-input&quot; value=&quot;${fileObj.newNameWithoutExt}&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;${fileObj.originalExtension}&lt;/td&gt;
                &lt;td&gt;
                    &lt;select class=&quot;new-ext-select&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                        &lt;option value=&quot;.jpg&quot; ${fileObj.newExtension === '.jpg' ? 'selected' : ''}&gt;.jpg&lt;/option&gt;
                        &lt;option value=&quot;.png&quot; ${fileObj.newExtension === '.png' ? 'selected' : ''}&gt;.png&lt;/option&gt;
                        &lt;option value=&quot;.gif&quot; ${fileObj.newExtension === '.gif' ? 'selected' : ''}&gt;.gif&lt;/option&gt;
                        &lt;option value=&quot;.webp&quot; ${fileObj.newExtension === '.webp' ? 'selected' : ''}&gt;.webp&lt;/option&gt;
                        &lt;option value=&quot;.bmp&quot; ${fileObj.newExtension === '.bmp' ? 'selected' : ''}&gt;.bmp&lt;/option&gt;
                        &lt;option value=&quot;.jpeg&quot; ${fileObj.newExtension === '.jpeg' ? 'selected' : ''}&gt;.jpeg&lt;/option&gt;
                        &lt;option value=&quot;.svg&quot; ${fileObj.newExtension === '.svg' ? 'selected' : ''}&gt;.svg&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/td&gt;
                &lt;td class=&quot;status-cell&quot; data-id=&quot;${fileObj.id}&quot;&gt;${fileObj.status}&lt;/td&gt;
            `;

            fileTableBody.appendChild(row);

            // 添加事件监听器
            const nameInput = row.querySelector('.new-name-input');
            const extSelect = row.querySelector('.new-ext-select');
            const statusCell = row.querySelector('.status-cell');

            nameInput.addEventListener('input', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateFileName(id, e.target.value, null);
                updateStatus(id);
                updateFileCount();
            });

            extSelect.addEventListener('change', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateFileName(id, null, e.target.value);
                updateStatus(id);
                updateFileCount();
            });
        }

        // 更新文件名
        function updateFileName(id, newNameWithoutExt, newExtension) {
            const fileObj = filesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            if (newNameWithoutExt !== null) {
                fileObj.newNameWithoutExt = newNameWithoutExt;
            }

            if (newExtension !== null) {
                fileObj.newExtension = newExtension;
            }

            // 检查是否有更改
            const isNameChanged = fileObj.newNameWithoutExt !== fileObj.originalNameWithoutExt;
            const isExtChanged = fileObj.newExtension !== fileObj.originalExtension;

            if (isNameChanged || isExtChanged) {
                fileObj.status = '已修改';
            } else {
                fileObj.status = '未更改';
            }
        }

        // 更新状态显示
        function updateStatus(id) {
            const fileObj = filesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            const statusCell = document.querySelector(`.status-cell[data-id=&quot;${id}&quot;]`);
            if (statusCell) {
                statusCell.textContent = fileObj.status;
                statusCell.style.color = fileObj.status === '已修改' ? '#28a745' : '#6c757d';
            }
        }

        // 更新文件计数
        function updateFileCount() {
            const count = filesData.length;
            const modifiedCount = filesData.filter(f =&gt; f.status === '已修改').length;

            fileCountElement.textContent = `${count} 个文件${modifiedCount &gt; 0 ? ` (${modifiedCount} 个已修改)` : ''}`;
        }

        // 预览名称更改
        function previewNameChanges() {
    const pattern = document.getElementById('namePattern').value;
    const startNumber = parseInt(document.getElementById('startNumber').value) || 1;
    const customPrefix = document.getElementById('customPrefix').value;

    filesData.forEach((fileObj, index) =&gt; {
        let newName = '';

        switch (pattern) {
            case 'sequential':
                newName = `图片${startNumber + index}`;
                break;
            case 'date':
                const today = new Date();
                const dateStr = today.toISOString().split('T')[0];
                newName = `${dateStr}_${startNumber + index}`;
                break;
            case 'timestamp':
                const timestamp = Math.floor(Date.now() / 1000);
                newName = `${timestamp}_${startNumber + index}`;
                break;
            case 'custom':
            default:
                newName = customPrefix ? `${customPrefix}${startNumber + index}` : fileObj.originalNameWithoutExt;
                break;
        }

        // 更新表格中的输入框
        const nameInput = document.querySelector(`.new-name-input[data-id=&quot;${fileObj.id}&quot;]`);
        if (nameInput) {
            nameInput.value = newName;
        }

        // 直接调用updateFileName来更新状态
        updateFileName(fileObj.id, newName, null);
    });

    updateFileCount();
}



        // 预览后缀更改
        function previewExtChanges() {
    const currentExtFilter = document.getElementById('currentExtFilter').value;
    const newExtension = document.getElementById('newExtension').value;

    filesData.forEach((fileObj) =&gt; {
        // 检查是否满足筛选条件
        if (currentExtFilter !== 'all' &amp;&amp; fileObj.originalExtension !== currentExtFilter) {
            return;
        }

        // 更新表格中的选择框
        const extSelect = document.querySelector(`.new-ext-select[data-id=&quot;${fileObj.id}&quot;]`);
        if (extSelect) {
            extSelect.value = newExtension;
        }

        // 直接调用updateFileName来更新状态
        updateFileName(fileObj.id, null, newExtension);
    });

    updateFileCount();
}



        // 下载Excel模板
        function downloadExcelTemplate() {
            if (filesData.length === 0) {
                alert('请先上传图片文件！');
                return;
            }

            // 创建工作簿
            const wb = XLSX.utils.book_new();

            // 创建工作表数据
            const wsData = [
                ['原始文件名', '新文件名（请在此列填写）', '原始后缀', '新后缀（可选）'],
                ['说明：请在第二列填写您想要的新文件名（不需要填写后缀）', '', '', '']
            ];

            // 添加每个文件的数据
            filesData.forEach(fileObj =&gt; {
                wsData.push([
                    fileObj.originalName,
                    fileObj.originalNameWithoutExt, // 初始值设为原始文件名（不带后缀）
                    fileObj.originalExtension,
                    fileObj.originalExtension // 初始值设为原始后缀
                ]);
            });

            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // 设置列宽
            const wscols = [
                {wch: 30}, // 原始文件名
                {wch: 30}, // 新文件名
                {wch: 10}, // 原始后缀
                {wch: 10}  // 新后缀
            ];
            ws['!cols'] = wscols;

            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, &quot;图片重命名&quot;);

            // 生成Excel文件并下载
            XLSX.writeFile(wb, '图片重命名模板.xlsx');

            alert('Excel模板已生成！请填写第二列&quot;新文件名&quot;和第四列&quot;新后缀&quot;，然后上传Excel文件以应用更改。');
        }

        // 处理Excel文件上传
        function handleExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    // 检查文件类型
    if (!file.name.match(/\.(xlsx|xls)$/)) {
        alert('请上传Excel文件（.xlsx或.xls格式）');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});

            // 获取第一个工作表
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

            // 跳过表头行
            const dataRows = sheetData.slice(2); // 跳过标题行和说明行

            if (dataRows.length === 0) {
                alert('Excel文件中没有数据！');
                return;
            }

            // 用于统计更新了多少文件
            let updatedCount = 0;

            // 遍历Excel数据行
            dataRows.forEach(row =&gt; {
                const originalName = row[0]; // 第一列：原始文件名
                const newName = row[1]; // 第二列：新文件名
                const newExtension = row[3]; // 第四列：新后缀（可选）

                // 查找匹配的文件
                const fileObj = filesData.find(f =&gt; f.originalName === originalName);

                if (fileObj &amp;&amp; newName) {
                    // 更新文件名（不带后缀）
                    fileObj.newNameWithoutExt = newName;

                    // 更新表格中的输入框
                    const nameInput = document.querySelector(`.new-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                    if (nameInput) {
                        nameInput.value = newName;
                    }

                    // 关键修复：手动调用更新文件名函数来确保状态正确更新
                    updateFileName(fileObj.id, newName, null);
                    updatedCount++;
                }

                // 如果有新后缀，更新后缀
                if (fileObj &amp;&amp; newExtension &amp;&amp; newExtension.startsWith('.')) {
                    fileObj.newExtension = newExtension;

                    // 更新表格中的选择框
                    const extSelect = document.querySelector(`.new-ext-select[data-id=&quot;${fileObj.id}&quot;]`);
                    if (extSelect) {
                        extSelect.value = newExtension;
                    }

                    // 关键修复：手动调用更新文件名函数来确保状态正确更新
                    updateFileName(fileObj.id, null, newExtension);
                }

                // 更新状态
                if (fileObj) {
                    updateStatus(fileObj.id);
                }
            });

            // 更新文件计数
            updateFileCount();

            // 清空文件输入
            excelFileInput.value = '';

            alert(`成功从Excel文件更新了 ${updatedCount} 个文件的名称！`);

        } catch (error) {
            console.error('解析Excel文件时出错:', error);
            alert('解析Excel文件时出错，请确保文件格式正确。');
        }
    };

    reader.readAsArrayBuffer(file);
}

        // 应用所有重命名并下载
        function applyAllRenames() {
            if (filesData.length === 0) return;

            const modifiedFiles = filesData.filter(f =&gt; f.status === '已修改');
            if (modifiedFiles.length === 0) {
                alert('没有文件被修改，请先修改文件名或后缀。');
                return;
            }

            // 创建Zip文件
            const zip = new JSZip();

            modifiedFiles.forEach(fileObj =&gt; {
                const newFileName = fileObj.newNameWithoutExt + fileObj.newExtension;
                zip.file(newFileName, fileObj.file);
            });

            // 生成Zip文件并下载
            zip.generateAsync({type: &quot;blob&quot;})
                .then(function(content) {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = '重命名后的图片.zip';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // 更新状态
                    filesData.forEach(fileObj =&gt; {
                        if (fileObj.status === '已修改') {
                            fileObj.status = '已下载';
                            updateStatus(fileObj.id);
                        }
                    });

                    alert(`成功打包并下载 ${modifiedFiles.length} 个文件！`);
                })
                .catch(error =&gt; {
                    console.error('创建ZIP文件时出错:', error);
                    alert('创建ZIP文件时出错，请重试。');
                });
        }

        // 重置所有更改
        function resetAll() {
            if (filesData.length === 0) return;

            if (!confirm('确定要重置所有更改吗？这将恢复所有文件到原始名称。')) {
                return;
            }

            // 恢复原始数据
            filesData = originalFilesData.map(f =&gt; ({...f}));

            // 更新表格
            fileTableBody.innerHTML = '';
            filesData.forEach(fileObj =&gt; {
                addFileToTable(fileObj);
            });

            updateFileCount();
            alert('所有更改已重置！');
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () =&gt; {
            // 添加一些示例文件（仅用于演示）
            setTimeout(() =&gt; {
                uploadStatus.textContent = '请上传包含图片的文件夹，或拖放文件夹到此区域';
                uploadStatus.style.color = '#666';
            }, 100);
        });

            align-items: center;
            gap: 12px;
            color: var(--primary-color);
            font-size: 22px;
            font-weight: 700;
        }

        .logo i {
            font-size: 24px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chart-type-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chart-type-btn {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--card-bg);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .chart-type-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        .chart-type-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(22, 119, 255, 0.3);
        }

        .chart-type-btn .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-color);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
            margin-bottom: 8px;
            box-shadow: var(--card-shadow);
        }

        .chart-type-btn .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: var(--text-color);
        }

        .chart-type-btn:hover .tooltip {
            opacity: 1;
        }

        .chart-actions {
            display: flex;
            gap: 10px;
        }

        /* 顶部配置面板 */
        .config-panel {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px;
            box-shadow: var(--card-shadow);
        }

        .config-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            align-items: flex-start;
        }

        @media (max-width: 992px) {
            .config-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 上传区域 */
        .upload-section {
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        .upload-section:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--primary-light);
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .upload-area:hover::before {
            left: 100%;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: rgba(22, 119, 255, 0.05);
            transform: translateY(-2px);
        }

        .upload-area i {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 12px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-area h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .upload-area p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .file-info {
            margin-top: 16px;
            padding: 12px;
            background: var(--primary-light);
            border-radius: 8px;
            font-size: 14px;
            word-break: break-all;
            border: 1px solid var(--border-color);
        }

        /* 配置区域 */
        .config-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        .config-section:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .config-item {
            display: flex;
            flex-direction: column;
        }

        .config-item label {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-item label i {
            color: var(--primary-color);
            font-size: 14px;
        }

        .config-item select, .config-item input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--card-bg);
            transition: var(--transition);
        }

        .config-item select:focus, .config-item input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
        }

        /* 排序选项 */
        .sort-options {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        .sort-options label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .sort-select {
            flex: 1;
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
        }

        /* 拖拽区域 */
        .drop-zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            grid-column: 1 / -1;
            margin-top: 16px;
        }

        .drop-zone {
            min-height: 100px;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 12px;
            transition: var(--transition);
            background: var(--background);
        }

        .drop-zone.active {
            border-color: var(--primary-color);
            background: rgba(22, 119, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
        }

        .drop-zone-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .drop-zone-title i {
            color: var(--primary-color);
        }

        .drop-zone-content {
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* 数据字段区域 */
        .data-fields-container {
            grid-column: 1 / -1;
            margin-top: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title span i {
            color: var(--primary-color);
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .data-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            max-height: 140px;
            overflow-y: auto;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        /* 数据字段样式 */
        .data-field {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: grab;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: var(--card-shadow);
        }

        .data-field:hover {
            border-color: var(--primary-color);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-hover);
        }

        .data-field.dragging {
            opacity: 0.6;
            transform: scale(0.95);
        }

        .data-field.numeric {
            border-left: 3px solid var(--primary-color);
        }

        .data-field.category {
            border-left: 3px solid var(--secondary-color);
        }

        .data-field.time {
            border-left: 3px solid var(--warning-color);
        }

        .data-field small {
            color: var(--text-tertiary);
            font-size: 12px;
        }

        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(22, 119, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 119, 255, 0.4);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .btn-secondary:hover {
            background: var(--background);
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: var(--card-shadow-hover);
        }

        .chart-controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            grid-column: 1 / -1;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            padding: 24px;
            overflow: auto;
        }

        /* 图表容器 */
        .chart-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .chart-container:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .chart-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, var(--background) 0%, var(--card-bg) 100%);
        }

        .chart-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-header h3 i {
            color: var(--primary-color);
        }

        .chart-content {
            padding: 24px;
            min-height: 450px;
        }

        /* 无数据提示 */
        .no-data {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .no-data i {
            font-size: 64px;
            margin-bottom: 24px;
            color: var(--text-tertiary);
            background: linear-gradient(135deg, var(--text-tertiary) 0%, var(--border-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .no-data h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .no-data p {
            font-size: 16px;
            margin-bottom: 24px;
        }

        /* 数据表格 */
        .data-table-container {
            margin-top: 24px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th {
            background: linear-gradient(180deg, var(--primary-light) 0%, var(--background) 100%);
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            color: var(--text-color);
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .data-table tr:hover td {
            background: var(--primary-light);
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transform: translateY(20px);
            animation: slideUp 0.3s ease forwards;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, var(--background) 0%, var(--card-bg) 100%);
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-modal:hover {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        /* 图表说明区域 */
        .chart-guide {
            grid-column: 1 / -1;
            margin-top: 16px;
            padding: 16px;
            background: var(--primary-light);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 14px;
        }

        .chart-guide h4 {
            margin-bottom: 8px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-guide ul {
            margin-left: 20px;
            color: var(--text-secondary);
        }

        .chart-guide li {
            margin-bottom: 6px;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--primary-light);
            color: var(--text-color);
            font-size: 12px;
        }

        .filter-chip-field {
            font-weight: 600;
            margin-right: 4px;
        }

        .filter-chip-remove {
            margin-left: 6px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .filter-chip-remove:hover {
            color: var(--danger-color);
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--primary-light);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* 通知样式 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-success {
            background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
        }

        .notification-error {
            background: linear-gradient(135deg, #ff4d4f 0%, #ff7875 100%);
        }

        .notification-warning {
            background: linear-gradient(135deg, #faad14 0%, #ffc53d 100%);
        }

        .notification-info {
            background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%);
        }
    &lt;/style&gt;
&lt;/head&gt;

    &lt;div class=&quot;app-container&quot;&gt;
        &lt;!-- 顶部导航栏 --&gt;

            &lt;/div&gt;

        &lt;!-- 顶部配置面板 --&gt;
        &lt;div class=&quot;config-panel&quot;&gt;
            &lt;div class=&quot;config-layout&quot;&gt;
                &lt;!-- 上传区域 --&gt;
                &lt;div class=&quot;upload-section&quot;&gt;

                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;

                &lt;!-- 配置区域 --&gt;
                &lt;div class=&quot;config-section&quot;&gt;
                    &lt;div class=&quot;config-item&quot;&gt;
                        &lt;label&gt;&lt;i class=&quot;fas fa-chart-bar&quot;&gt;&lt;/i&gt; 图表类型&lt;/label&gt;

                            &lt;option value=&quot;horizontalBar&quot;&gt;条形图&lt;/option&gt;
                            &lt;option value=&quot;pie&quot;&gt;饼图&lt;/option&gt;
                            &lt;option value=&quot;scatter&quot;&gt;散点图&lt;/option&gt;

                    &lt;/div&gt;

                    &lt;div class=&quot;config-item&quot;&gt;

                        &lt;select id=&quot;aggregationSelect&quot;&gt;
                            &lt;option value=&quot;none&quot;&gt;无聚合(原始值)&lt;/option&gt;
                            &lt;option value=&quot;sum&quot;&gt;求和&lt;/option&gt;
                            &lt;option value=&quot;count&quot;&gt;计数&lt;/option&gt;
                            &lt;option value=&quot;avg&quot;&gt;平均值&lt;/option&gt;
                            &lt;option value=&quot;max&quot;&gt;最大值&lt;/option&gt;
                            &lt;option value=&quot;min&quot;&gt;最小值&lt;/option&gt;

                    &lt;/div&gt;

                    &lt;div class=&quot;config-item&quot;&gt;
                        &lt;label&gt;&lt;i class=&quot;fas fa-sort-amount-down&quot;&gt;&lt;/i&gt; 排序方式&lt;/label&gt;
                        &lt;div class=&quot;sort-options&quot;&gt;
                            &lt;select id=&quot;sortSelect&quot; class=&quot;sort-select&quot;&gt;
                                &lt;option value=&quot;none&quot;&gt;无排序&lt;/option&gt;
                                &lt;option value=&quot;asc&quot;&gt;升序&lt;/option&gt;
                                &lt;option value=&quot;desc&quot;&gt;降序&lt;/option&gt;
                            &lt;/select&gt;
                            &lt;select id=&quot;sortBySelect&quot; class=&quot;sort-select&quot;&gt;
                                &lt;option value=&quot;value&quot;&gt;按数值排序&lt;/option&gt;
                                &lt;option value=&quot;name&quot;&gt;按名称排序&lt;/option&gt;

    &lt;!-- 数据预览模态框 --&gt;

    &lt;script&gt;
        // 全局变量
        let uploadedData = {
            sheets: {},
            fields: [],
            data: [],
            sheetName: '',
            fieldTypes: {}
        };
        let currentChart = null;
        window.chartColors = window.chartColors || ['#5470C6', '#91CC75', '#EE6666', '#73C0DE', '#3BA272', '#FC8452', '#9A60B4', '#EA7CCC'];
        let dragSource = null;
        let activeFilters = [];

        window.chartColors = window.chartColors;

        // 图表类型配置 - 包含详细说明
        const chartTypes = [
            {
                id: 'auto',
                name: '智能推荐',
                icon: 'fas fa-magic',
                description: '系统根据数据特征自动选择最佳图表类型',
                guide: '系统将分析您的数据特征，自动选择最适合的可视化方式。'
            },
            {
                id: 'line',
                name: '折线图',
                icon: 'fas fa-chart-line',
                description: '展示数据随时间或有序类别的趋势变化',
                guide: '&lt;strong&gt;使用场景：&lt;/strong&gt;适合展示数据随时间、顺序或连续变量的变化趋势&lt;br&gt;&lt;strong&gt;数据配置：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;X轴：时间或有序类别字段（如月份、季度）&lt;/li&gt;&lt;li&gt;Y轴：一个或多个数值字段（如销售额、用户数）&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;示例：&lt;/strong&gt;月度销售额趋势、网站访问量变化'

            {
                id: 'bar',
                name: '柱状图',
                icon: 'fas fa-chart-bar',

            },
            {
                id: 'horizontalBar',

                icon: 'fas fa-chart-bar',
                description: '横向比较不同类别的数值，适合类别名称较长的情况',
                guide: '&lt;strong&gt;使用场景：&lt;/strong&gt;适合类别名称较长或需要横向对比的情况&lt;br&gt;&lt;strong&gt;数据配置：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;Y轴：类别字段（如产品名称、地区）&lt;/li&gt;&lt;li&gt;X轴：一个或多个数值字段（如销售额、数量）&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;多系列处理：&lt;/strong&gt;当X轴有多个数值字段时，条形图会自动并排显示&lt;br&gt;&lt;strong&gt;示例：&lt;/strong&gt;不同部门预算对比、各城市GDP排名'
            },
            {
                id: 'pie',
                name: '饼图',
                icon: 'fas fa-chart-pie',
                description: '展示各部分占总体的比例关系',
                guide: '&lt;strong&gt;使用场景：&lt;/strong&gt;适合展示整体中各部分的占比关系&lt;br&gt;&lt;strong&gt;数据配置：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;类别字段：作为饼图的各个扇区&lt;/li&gt;&lt;li&gt;数值字段：一个数值字段，决定每个扇区的大小&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;注意：&lt;/strong&gt;饼图只能展示一个数值字段，如果有多个数值字段，系统将使用第一个&lt;br&gt;&lt;strong&gt;示例：&lt;/strong&gt;市场份额分布、用户年龄比例、产品类别占比'
            },
            {
                id: 'scatter',
                name: '散点图',
                icon: 'fas fa-chart-scatter',
                description: '展示两个数值变量之间的关系和分布',
                guide: '&lt;strong&gt;使用场景：&lt;/strong&gt;适合研究两个数值变量之间的关系、相关性或分布模式&lt;br&gt;&lt;strong&gt;数据配置：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;X轴：第一个数值字段&lt;/li&gt;&lt;li&gt;Y轴：第二个数值字段&lt;/li&gt;&lt;li&gt;可选：颜色/大小字段（用于表示第三个维度）&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;示例：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;身高与体重的关系&lt;/li&gt;&lt;li&gt;广告投入与销售额的相关性&lt;/li&gt;&lt;li&gt;用户年龄与消费金额的分布&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;适用数据：&lt;/strong&gt;两个数值字段，每个数据点有对应的X和Y值'
            },
            {
                id: 'radar',
                name: '雷达图',
                icon: 'fas fa-bullseye',
                description: '多维度对比，展示各项指标的表现',
                guide: '&lt;strong&gt;使用场景：&lt;/strong&gt;适合对比多个实体在多个维度上的表现&lt;br&gt;&lt;strong&gt;数据配置：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;维度字段：作为雷达图的各个轴线（通常是类别字段）&lt;/li&gt;&lt;li&gt;数值字段：一个或多个数值字段，每个字段对应一条雷达线&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;示例：&lt;/strong&gt;&lt;ul&gt;&lt;li&gt;员工能力评估（技术、沟通、创新等维度）&lt;/li&gt;&lt;li&gt;产品特性对比（性能、价格、设计等维度）&lt;/li&gt;&lt;li&gt;游戏角色属性对比（力量、敏捷、智力等）&lt;/li&gt;&lt;/ul&gt;&lt;strong&gt;适用数据：&lt;/strong&gt;多个维度（3个以上）和至少一个对比实体'
            }
        ];

        // 示例数据
        const sampleData = {
            '销售数据': [
                ['月份', '产品A', '产品B', '产品C', '产品D', '地区', '销售员'],
                ['1月', 120, 85, 90, 110, '华东', '张三'],
                ['2月', 135, 92, 88, 115, '华东', '李四'],
                ['3月', 145, 98, 95, 120, '华北', '王五'],
                ['4月', 130, 87, 92, 118, '华北', '赵六'],
                ['5月', 155, 105, 100, 130, '华南', '张三'],
                ['6月', 160, 110, 105, 135, '华南', '李四'],
                ['7月', 150, 100, 98, 128, '华东', '王五'],
                ['8月', 165, 115, 110, 140, '华东', '赵六'],
                ['9月', 170, 120, 115, 145, '华北', '张三'],
                ['10月', 175, 125, 118, 150, '华北', '李四'],
                ['11月', 180, 130, 120, 155, '华南', '王五'],
                ['12月', 185, 135, 125, 160, '华南', '赵六']
            ],
            '多维数据': [
                ['维度', '团队A', '团队B', '团队C', '团队D'],
                ['技术能力', 85, 90, 75, 80],
                ['沟通能力', 80, 85, 90, 70],
                ['创新能力', 75, 80, 85, 90],
                ['执行力', 90, 85, 80, 75],
                ['学习能力', 85, 90, 70, 80],
                ['团队协作', 80, 85, 90, 75]
            ],

            '散点图数据': [
                ['身高(cm)', '体重(kg)', '年龄', '性别', '运动频率'],
                [175, 70, 25, '男', '高'],
                [160, 55, 22, '女', '中'],
                [180, 80, 30, '男', '高'],
                [165, 60, 28, '女', '低'],
                [170, 65, 26, '男', '中'],
                [155, 50, 20, '女', '高'],
                [185, 85, 32, '男', '低'],
                [168, 62, 24, '女', '中'],
                [172, 68, 27, '男', '高'],
                [158, 52, 21, '女', '中'],
                [178, 75, 29, '男', '中'],
                [162, 58, 23, '女', '低']
            ]
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initUpload();
            initDragDrop();
            initChartTypeSelector();
            updateChartGuide('auto');

            const chartTypeSelect = document.getElementById('chartTypeSelect');
            chartTypeSelect.addEventListener('change', function() {
                updateChartGuide(this.value);
                if (uploadedData.data.length &gt; 0 &amp;&amp; document.getElementById('chartArea').style.display === 'block') {
                    generateChart();
                }
            });

            ['sortSelect', 'sortBySelect', 'aggregationSelect', 'groupSelect'].forEach(id =&gt; {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('change', function() {
                        if (uploadedData.data.length &gt; 0 &amp;&amp; document.getElementById('chartArea').style.display === 'block') {
                            generateChart();
                        }
                    });
                }
            });
        });

        // 初始化文件上传
        function initUpload() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            uploadArea.addEventListener('click', () =&gt; fileInput.click());

            uploadArea.addEventListener('dragover', (e) =&gt; {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary-color)';
                uploadArea.style.background = 'rgba(22, 119, 255, 0.08)';
            });

            uploadArea.addEventListener('dragleave', () =&gt; {
                uploadArea.style.borderColor = 'var(--border-color)';
                uploadArea.style.background = 'var(--primary-light)';
            });

            uploadArea.addEventListener('drop', (e) =&gt; {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-color)';
                uploadArea.style.background = 'var(--primary-light)';

                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect();
                }
            });

            fileInput.addEventListener('change', handleFileSelect);
        }

        // 更新图表使用指南
        function updateChartGuide(chartType) {
            const chart = chartTypes.find(c =&gt; c.id === chartType) || chartTypes[0];
            document.getElementById('guideContent').innerHTML = chart.guide;
        }

        // 处理文件选择
        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            const fileInfo = document.getElementById('fileInfo');
            fileInfo.style.display = 'block';
            fileInfo.innerHTML = `
                &lt;div&gt;&lt;strong&gt;文件名:&lt;/strong&gt; ${file.name}&lt;/div&gt;
                &lt;div&gt;&lt;strong&gt;文件大小:&lt;/strong&gt; ${(file.size / 1024).toFixed(2)} KB&lt;/div&gt;
                &lt;div&gt;&lt;strong&gt;上传时间:&lt;/strong&gt; ${new Date().toLocaleString()}&lt;/div&gt;
            `;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                uploadedData.sheets = {};
                workbook.SheetNames.forEach(sheetName =&gt; {
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    uploadedData.sheets[sheetName] = jsonData;
                });

                // 默认使用第一个工作表
                const firstSheet = workbook.SheetNames[0];
                loadSheet(firstSheet);

                showNotification('文件上传成功', 'success');
            };

            reader.onerror = function() {
                showNotification('文件读取失败', 'error');
            };

            reader.readAsArrayBuffer(file);
        }

        // 加载示例数据
        function loadSampleData() {
            uploadedData.sheets = sampleData;
            const firstSheet = Object.keys(sampleData)[0];

            const fileInfo = document.getElementById('fileInfo');
            fileInfo.style.display = 'block';
            fileInfo.innerHTML = `
                &lt;div&gt;&lt;strong&gt;示例数据:&lt;/strong&gt; ${firstSheet}&lt;/div&gt;
                &lt;div&gt;&lt;strong&gt;加载时间:&lt;/strong&gt; ${new Date().toLocaleString()}&lt;/div&gt;
                &lt;div&gt;&lt;strong&gt;数据说明:&lt;/strong&gt; 包含${Object.keys(sampleData).length}个工作表，可用于测试各种图表类型&lt;/div&gt;
            `;

            loadSheet(firstSheet);
            showNotification('示例数据加载成功', 'success');

            const sheetSelector = document.createElement('select');
            sheetSelector.style.cssText = 'width: 100%; padding: 8px; margin-top: 8px; border-radius: 6px; border: 1px solid var(--border-color);';

        // 加载工作表数据
        function loadSheet(sheetName) {
            uploadedData.sheetName = sheetName;
            const sheetData = uploadedData.sheets[sheetName];

            if (!sheetData || sheetData.length === 0) return;

            // 提取表头和数据
            const headers = sheetData[0];
            const data = [];

            for (let i = 1; i &lt; sheetData.length; i++) {
                const row = sheetData[i];
                if (row.length === 0) continue;

                const rowData = {};
                headers.forEach((header, index) =&gt; {
                    if (header &amp;&amp; header.trim()) {
                        rowData[header] = row[index] || '';
                    }
                });
                data.push(rowData);
            }

            uploadedData.data = data;
            uploadedData.fields = headers.filter(h =&gt; h &amp;&amp; h.trim());

            // 分析字段类型
            analyzeFieldTypes();

            // 渲染数据字段
            renderDataFields();

            // 更新筛选和分组选项
            updateFilterAndGroupOptions();

            // 智能分析推荐
            analyzeData();

            // 隐藏无数据提示
            document.getElementById('noData').style.display = 'none';
        }

        // 分析字段类型
        function analyzeFieldTypes() {
            const sampleSize = Math.min(10, uploadedData.data.length);
            uploadedData.fieldTypes = {};

            uploadedData.fields.forEach(field =&gt; {
                const samples = uploadedData.data.slice(0, sampleSize).map(row =&gt; row[field]);
                let type = 'category';

                // 过滤掉空值
                const validSamples = samples.filter(val =&gt; val !== null &amp;&amp; val !== undefined &amp;&amp; val !== '');

                if (validSamples.length &gt; 0) {
                    // 检查是否为数值类型
                    const numericCount = validSamples.filter(val =&gt; {
                        const num = Number(val);
                        return !isNaN(num);
                    }).length;

                    // 检查是否为日期类型
                    const dateCount = validSamples.filter(val =&gt; {
                        const date = new Date(val);
                        return date instanceof Date &amp;&amp; !isNaN(date);
                    }).length;

                    if (numericCount / validSamples.length &gt; 0.7) {
                        type = 'numeric';
                    } else if (dateCount / validSamples.length &gt; 0.5) {
                        type = 'time';
                    }
                }

                uploadedData.fieldTypes[field] = type;
            });
        }

        // 渲染数据字段
        function renderDataFields() {
            const container = document.getElementById('dataFields');
            container.innerHTML = '';

            uploadedData.fields.forEach(field =&gt; {
                const type = uploadedData.fieldTypes[field];
                const typeIcon = {
                    numeric: 'fas fa-hashtag',
                    category: 'fas fa-tag',
                    time: 'fas fa-calendar-alt'
                }[type] || 'fas fa-question';

                const typeColor = {
                    numeric: 'numeric',
                    category: 'category',
                    time: 'time'
                }[type] || '';

                const fieldDiv = document.createElement('div');
                fieldDiv.className = `data-field ${typeColor} draggable`;
                fieldDiv.dataset.field = field;
                fieldDiv.dataset.type = type;
                fieldDiv.setAttribute('draggable', 'true');

                fieldDiv.innerHTML = `
                    &lt;i class=&quot;${typeIcon}&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;${field}&lt;/span&gt;
                    &lt;small&gt;(${type})&lt;/small&gt;
                `;

                fieldDiv.addEventListener('dragstart', handleDragStart);
                fieldDiv.addEventListener('dragend', handleDragEnd);

                container.appendChild(fieldDiv);
            });
        }

        // 初始化拖拽功能
        function initDragDrop() {
            const dropZones = document.querySelectorAll('.drop-zone');

            dropZones.forEach(zone =&gt; {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('dragenter', handleDragEnter);
                zone.addEventListener('dragleave', handleDragLeave);
                zone.addEventListener('drop', handleDrop);
            });
        }

        // 拖拽事件处理
        function handleDragStart(e) {
            dragSource = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.dataset.field);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            dragSource = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            e.target.closest('.drop-zone').classList.add('active');
        }

        function handleDragLeave(e) {
            e.target.closest('.drop-zone').classList.remove('active');
        }

        function handleDrop(e) {
            e.preventDefault();
            const dropZone = e.target.closest('.drop-zone');
            dropZone.classList.remove('active');

            const field = e.dataTransfer.getData('text/plain');
            const fieldType = dragSource?.dataset.type;
            const zoneId = dropZone.id;

            // Y轴区域允许多个数值字段，X轴区域只允许一个字段
            const contentDiv = dropZone.querySelector('.drop-zone-content');

            // X轴只能有一个字段
            if (zoneId === 'xAxisZone') {
                if (fieldType === 'numeric') {
                    showNotification('X轴仅支持类别/时间类型字段', 'warning');
                    return;
                }
                contentDiv.innerHTML = ''; // 清空原有内容
            }

            // Y轴只能是数值字段
            if (zoneId === 'yAxisZone' &amp;&amp; fieldType !== 'numeric') {
                showNotification('Y轴仅支持数值类型字段', 'warning');
                return;
            }

            // 检查是否已存在该字段
            const existingFields = Array.from(contentDiv.querySelectorAll('.data-field span'))
                .map(el =&gt; el.textContent);
            if (existingFields.includes(field)) {
                showNotification('该字段已添加', 'warning');
                return;
            }

            // 添加字段到拖拽区域
            const typeIcon = fieldType === 'numeric' ? 'fas fa-hashtag' : 'fas fa-tag';
            const fieldHtml = `
                &lt;div class=&quot;data-field ${fieldType}&quot; style=&quot;margin: 0;&quot;&gt;
                    &lt;i class=&quot;${typeIcon}&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;${field}&lt;/span&gt;
                    &lt;i class=&quot;fas fa-times&quot; onclick=&quot;removeFromDropZone(this)&quot;&gt;&lt;/i&gt;
                &lt;/div&gt;
            `;

            if (zoneId === 'xAxisZone') {
                contentDiv.innerHTML = fieldHtml;
            } else {
                contentDiv.innerHTML += fieldHtml;
            }

            // 更新图表使用指南提示
            updateChartGuideBasedOnFields();
        }
