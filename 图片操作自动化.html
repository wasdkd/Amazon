    <div class="visualization-section">
     <div class="iframe-container">
      <iframe srcdoc="
&lt;!--&amp;lt;!&amp;ndash;写前端代码，实现批量创建文件夹的功能和批量修改文件夹名称的功能，有选择按钮，实现不同的功能，批量创建文件夹可以在网页上写要创建的文件夹名称，也可以通过上传excel表名称--&gt;
&lt;!--的方式修改，网页给出excel表模板，修改文件夹名称是用户上传一个大文件夹，里面有许多的子文件夹，可以在页面进行修改看，也可以通过excel表上传进行修改&amp;ndash;&amp;gt;--&gt;

&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;title&gt;批量创建文件夹工具&lt;/title&gt;
    &lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css&quot;&gt;
    &lt;!-- 引入 JSZip 库用于创建 ZIP 文件 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js&quot;&gt;&lt;/script&gt;

    &lt;style&gt;
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 5px 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .function-content {
            padding: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #182848;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #4b6cb7;
        }

        .input-method-selector {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .method-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #ddd;
        }

        .method-btn:last-child {
            border-right: none;
        }

        .method-btn:hover {
            background-color: #e9ecef;
        }

        .method-btn.active {
            background-color: #4b6cb7;
            color: white;
        }

        .input-area {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .input-area.active {
            display: block;
        }

        .text-input textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            transition: border 0.3s;
        }

        .text-input textarea:focus {
            outline: none;
            border-color: #4b6cb7;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hint i {
            color: #4b6cb7;
        }

        .file-upload {
            border: 2px dashed #c3cfe2;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: #4b6cb7;
            background-color: #f8fafd;
        }

        .file-upload i {
            font-size: 3rem;
            color: #4b6cb7;
            margin-bottom: 15px;
        }

        .file-upload p {
            margin-bottom: 20px;
            color: #666;
        }

        .upload-btn {
            background-color: #4b6cb7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .upload-btn:hover {
            background-color: #3a5ca9;
        }

        .template-download {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #4b6cb7;
            text-decoration: none;
            font-weight: 500;
        }

        .template-download:hover {
            text-decoration: underline;
        }

        .folder-preview {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background-color: #f8fafd;
        }

        .folder-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .folder-item:last-child {
            border-bottom: none;
        }

        .folder-item i {
            color: #ffb74d;
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .folder-name {
            flex: 1;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .action-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .primary-btn {
            background-color: #4b6cb7;
            color: white;
        }

        .primary-btn:hover {
            background-color: #3a5ca9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 92, 169, 0.3);
        }

        .secondary-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .secondary-btn:hover {
            background-color: #e9ecef;
        }

        .file-list {
            margin-top: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item i {
            color: #4CAF50;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4b6cb7;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 8px;
            }

            header {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .function-content {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
                gap: 10px;
            }

            .action-btn {
                justify-content: center;
            }
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;header&gt;
            &lt;h1&gt;&lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt; 批量创建文件夹工具&lt;/h1&gt;
            &lt;p class=&quot;subtitle&quot;&gt;批量创建文件夹&lt;/p&gt;
        &lt;/header&gt;

        &lt;div class=&quot;main-content&quot;&gt;
            &lt;!-- 批量创建文件夹功能 --&gt;
            &lt;div class=&quot;function-content&quot; id=&quot;create-function&quot;&gt;
                &lt;div class=&quot;input-section&quot;&gt;
                    &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-pen-alt&quot;&gt;&lt;/i&gt; 输入文件夹名称&lt;/h3&gt;

                    &lt;div class=&quot;input-method-selector&quot;&gt;
                        &lt;div class=&quot;method-btn active&quot; data-method=&quot;text&quot;&gt;文本输入&lt;/div&gt;
                        &lt;div class=&quot;method-btn&quot; data-method=&quot;excel&quot;&gt;上传Excel文件&lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- 文本输入区域 --&gt;
                    &lt;div class=&quot;input-area text-input active&quot; id=&quot;create-text-input&quot;&gt;
                        &lt;textarea placeholder=&quot;请输入要创建的文件夹名称，每行一个名称，例如：&amp;#10;项目文档&amp;#10;客户资料&amp;#10;会议记录&amp;#10;财务报告&quot;&gt;&lt;/textarea&gt;
                        &lt;div class=&quot;hint&quot;&gt;
                            &lt;i class=&quot;fas fa-info-circle&quot;&gt;&lt;/i&gt; 每个文件夹名称占一行，将按此列表批量创建文件夹
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- Excel上传区域 --&gt;
                    &lt;div class=&quot;input-area file-upload&quot; id=&quot;create-excel-upload&quot;&gt;
                        &lt;div class=&quot;file-upload&quot;&gt;
                            &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                            &lt;p&gt;上传Excel文件，文件应包含一列文件夹名称&lt;/p&gt;
                            &lt;input type=&quot;file&quot; id=&quot;create-excel-file&quot; accept=&quot;.xlsx, .xls&quot; style=&quot;display: none;&quot;&gt;
                            &lt;button class=&quot;upload-btn&quot; id=&quot;create-browse-btn&quot;&gt;选择Excel文件&lt;/button&gt;
                            &lt;div class=&quot;file-list&quot; id=&quot;create-file-list&quot;&gt;&lt;/div&gt;
                            &lt;a href=&quot;#&quot; class=&quot;template-download&quot; id=&quot;create-template-download&quot;&gt;
                                &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 下载Excel模板
                            &lt;/a&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div class=&quot;preview-section&quot;&gt;
                    &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-eye&quot;&gt;&lt;/i&gt; 预览将要创建的文件夹&lt;/h3&gt;
                    &lt;div class=&quot;folder-preview&quot; id=&quot;create-folder-preview&quot;&gt;
                        &lt;div class=&quot;folder-item&quot;&gt;
                            &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                            &lt;div class=&quot;folder-name&quot;&gt;项目文档&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;folder-item&quot;&gt;
                            &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                            &lt;div class=&quot;folder-name&quot;&gt;客户资料&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;folder-item&quot;&gt;
                            &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                            &lt;div class=&quot;folder-name&quot;&gt;会议记录&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;folder-item&quot;&gt;
                            &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                            &lt;div class=&quot;folder-name&quot;&gt;财务报告&lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div class=&quot;actions&quot;&gt;
                    &lt;button class=&quot;action-btn secondary-btn&quot; id=&quot;create-clear-btn&quot;&gt;
                        &lt;i class=&quot;fas fa-eraser&quot;&gt;&lt;/i&gt; 清空
                    &lt;/button&gt;
                    &lt;button class=&quot;action-btn primary-btn&quot; id=&quot;create-execute-btn&quot;&gt;
                        &lt;i class=&quot;fas fa-play-circle&quot;&gt;&lt;/i&gt; 执行批量创建
                    &lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 加载指示器 --&gt;
        &lt;div class=&quot;loading&quot; id=&quot;loading-indicator&quot;&gt;
            &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
            &lt;p&gt;正在处理文件，请稍候...&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // 切换输入方法
        const methodBtns = document.querySelectorAll('.method-btn');

        methodBtns.forEach(btn =&gt; {
            btn.addEventListener('click', () =&gt; {
                const method = btn.getAttribute('data-method');
                const parentSection = btn.closest('.input-section');

                // 更新按钮状态
                parentSection.querySelectorAll('.method-btn').forEach(b =&gt; b.classList.remove('active'));
                btn.classList.add('active');

                // 更新输入区域显示
                const textInput = parentSection.querySelector('.text-input');
                const excelUpload = parentSection.querySelector('.file-upload');

                if (method === 'text') {
                    textInput.classList.add('active');
                    excelUpload.classList.remove('active');
                } else {
                    textInput.classList.remove('active');
                    excelUpload.classList.add('active');
                }
            });
        });

        // 显示/隐藏加载指示器
        function showLoading(show) {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (show) {
                loadingIndicator.classList.add('active');
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        // 创建文件夹 - 文本输入变化时更新预览
        const createTextInput = document.querySelector('#create-text-input textarea');
        const createFolderPreview = document.getElementById('create-folder-preview');

        createTextInput.addEventListener('input', updateCreatePreview);

        function updateCreatePreview() {
            const folderNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');

            if (folderNames.length === 0) {
                createFolderPreview.innerHTML = `
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;项目文档&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;客户资料&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;会议记录&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;folder-item&quot;&gt;
                        &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;folder-name&quot;&gt;财务报告&lt;/div&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            createFolderPreview.innerHTML = '';
            folderNames.forEach(name =&gt; {
                const folderItem = document.createElement('div');
                folderItem.className = 'folder-item';
                folderItem.innerHTML = `
                    &lt;i class=&quot;fas fa-folder&quot;&gt;&lt;/i&gt;
                    &lt;div class=&quot;folder-name&quot;&gt;${name.trim()}&lt;/div&gt;
                `;
                createFolderPreview.appendChild(folderItem);
            });
        }

        // 创建文件夹 - Excel上传
        const createBrowseBtn = document.getElementById('create-browse-btn');
        const createExcelFile = document.getElementById('create-excel-file');
        const createFileList = document.getElementById('create-file-list');

        createBrowseBtn.addEventListener('click', () =&gt; {
            createExcelFile.click();
        });

        createExcelFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                createFileList.innerHTML = `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 使用 SheetJS 解析 Excel 文件
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                        // 处理数据（假设第一列是文件夹名称）
                        const folderNames = [];
                        for (let i = 1; i &lt; sheetData.length; i++) {
                            const row = sheetData[i];
                            if (row &amp;&amp; row[0]) {
                                folderNames.push(row[0].toString());
                            }
                        }

                        // 更新文本输入区域
                        createTextInput.value = folderNames.join('\n');

                        // 更新预览
                        updateCreatePreview();

                        alert(`成功从Excel文件读取 ${folderNames.length} 个文件夹名称！`);
                    } catch (error) {
                        console.error('解析Excel文件时出错:', error);
                        alert('解析Excel文件时出错，请确保文件格式正确且第一列包含文件夹名称。');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 创建文件夹 - 下载模板
        document.getElementById('create-template-download').addEventListener('click', function(e) {
            e.preventDefault();

            // 定义模板数据
            const data = [
                ['文件夹名称'],
                ['项目文档'],
                ['客户资料'],
                ['会议记录'],
                ['财务报告']
            ];

            // 使用 SheetJS 创建工作簿
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '文件夹列表');

            // 导出为 .xlsx 文件
            XLSX.writeFile(wb, '文件夹创建模板.xlsx');
        });

        // 创建文件夹 - 清空按钮
        document.getElementById('create-clear-btn').addEventListener('click', function() {
            createTextInput.value = '';
            createFileList.innerHTML = '';
            createExcelFile.value = '';
            updateCreatePreview();
        });

        // 创建文件夹 - 执行按钮
        // document.getElementById('create-execute-btn').addEventListener('click', async function() {
        //     const folderNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
        //
        //     if (folderNames.length === 0) {
        //         alert('请先输入要创建的文件夹名称！');
        //         return;
        //     }
        //
        //     showLoading(true);
        //
        //     try {
        //         // 使用 JSZip 创建文件夹结构
        //         const zip = new JSZip();
        //
        //         // 为每个文件夹创建一个空文件（因为 ZIP 不支持空文件夹）
        //         folderNames.forEach(folderName =&gt; {
        //             // 创建一个空文件来确保文件夹被创建
        //             zip.folder(folderName).file('.keep', '');
        //         });
        //
        //         // 生成 ZIP 文件并下载
        //         const content = await zip.generateAsync({type: &quot;blob&quot;});
        //         const link = document.createElement('a');
        //         link.href = URL.createObjectURL(content);
        //         link.download = '批量创建文件夹.zip';
        //         document.body.appendChild(link);
        //         link.click();
        //         document.body.removeChild(link);
        //
        //         alert(`成功创建包含 ${folderNames.length} 个文件夹的压缩包！`);
        //     } catch (error) {
        //         console.error('创建 ZIP 文件失败:', error);
        //         alert('创建文件夹压缩包时发生错误，请重试。');
        //     } finally {
        //         showLoading(false);
        //     }
        // });
        document.getElementById('create-execute-btn').addEventListener('click', async function() {
    const folderNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');

    if (folderNames.length === 0) {
        alert('请先输入要创建的文件夹名称！');
        return;
    }

    showLoading(true);

    try {
        // 使用 JSZip 创建文件夹结构
        const zip = new JSZip();

        // 只创建文件夹结构，不添加任何文件
        folderNames.forEach(folderName =&gt; {
            zip.folder(folderName);
        });

        // 生成 ZIP 文件并下载
        const content = await zip.generateAsync({type: &quot;blob&quot;});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = '批量创建文件夹.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        alert(`成功创建包含 ${folderNames.length} 个文件夹的压缩包！`);
    } catch (error) {
        console.error('创建 ZIP 文件失败:', error);
        alert('创建文件夹压缩包时发生错误，请重试。');
    } finally {
        showLoading(false);
    }
});

        // 初始化预览
        updateCreatePreview();
    &lt;/script&gt;
&lt;/body&gt;

&lt;!--&amp;lt;!&amp;ndash;写一个前端代码，实现批量创建excel表的功能，还可以批量修改excel表的名称，可以在网页直接操作，也可以上传excel表进行创建或修改名称。需要有一个获取excel表的名称的功能，--&gt;
&lt;!--前台上传包含excel表的文件夹，获取excel表名称，打印到页面，可以复制，一行一个表名，有导出为excel表功能&amp;ndash;&amp;gt;--&gt;

&lt;!--&lt;!DOCTYPE html&gt;--&gt;
&lt;!--&lt;html lang=&quot;zh-CN&quot;&gt;--&gt;
&lt;!--&lt;head&gt;--&gt;

        * {

        body {

            min-height: 100vh;
            padding: 20px;
            color: #333;

        .container {

            padding: 18px;

            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #dee2e6;

        .function-content {

            display: none;

        }

        .template-download:hover {
            text-decoration: underline;
        }

            outline: none;
            border-color: #1d6f42;
        }

        .excel-actions {
            display: flex;
            gap: 10px;

        .action-icon-btn {
            background: none;

            color: #666;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .action-icon-btn:hover {
            color: #1d6f42;

            padding-top: 20px;

            display: flex;

            gap: 10px;

            background-color: #1d6f42;
            color: white;

        }

        .secondary-btn:hover {
            background-color: #e9ecef;

            padding: 15px;

            overflow-y: auto;

            align-items: center;

            color: #1d6f42;

            display: block;
        }

            border-top: 4px solid #1d6f42;

            width: 30px;
            height: 30px;

            margin: 0 auto 15px;

            0% { transform: rotate(0deg); }

        }

            resize: vertical;
            background-color: #f8f9fa;
        }

            font-size: 0.9rem;
            color: #666;
            text-align: right;
        }

            flex: 1;

            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
        }

            outline: none;
            border-color: #1d6f42;
            box-shadow: 0 0 0 3px rgba(29, 111, 66, 0.1);
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .excel-table th {
            background-color: #f8f9fa;

            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            color: #495057;
        }

        .excel-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        .excel-table tr:hover {
            background-color: #f8f9fa;
        }

        .original-name {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* 创建功能左右布局 */
        .create-content {

        &lt;!-- 提取Excel表名称功能 --&gt;
        &lt;div class=&quot;function-content&quot; id=&quot;extract-function&quot;&gt;
            &lt;div class=&quot;input-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-upload&quot;&gt;&lt;/i&gt; 上传Excel文件夹&lt;/h3&gt;

                &lt;div class=&quot;file-upload&quot; id=&quot;extract-upload-area&quot;&gt;
                    &lt;i class=&quot;fas fa-folder-open&quot;&gt;&lt;/i&gt;
                    &lt;p&gt;点击或拖拽包含Excel文件的文件夹到此区域上传&lt;/p&gt;
                    &lt;input type=&quot;file&quot; id=&quot;extract-file-input&quot; webkitdirectory multiple accept=&quot;.xlsx,.xls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;button class=&quot;upload-btn&quot; id=&quot;extract-browse-btn&quot;&gt;选择文件夹&lt;/button&gt;
                    &lt;div class=&quot;file-list&quot; id=&quot;extract-file-list&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;results-section&quot;&gt;
                &lt;div class=&quot;results-header&quot;&gt;
                    &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-file-alt&quot;&gt;&lt;/i&gt; 提取的Excel表名称&lt;/h3&gt;
                    &lt;div class=&quot;results-actions&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;copy-names-btn&quot;&gt;
                            &lt;i class=&quot;fas fa-copy&quot;&gt;&lt;/i&gt; 复制名称
                        &lt;/button&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;export-excel-btn&quot;&gt;
                            &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 导出为Excel
                        &lt;/button&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;textarea class=&quot;results-textarea&quot; id=&quot;extracted-names&quot; placeholder=&quot;Excel表名称将显示在这里，每行一个...&quot;&gt;&lt;/textarea&gt;
                &lt;div class=&quot;results-count&quot; id=&quot;extract-count&quot;&gt;0 个Excel文件&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 加载指示器 --&gt;
        &lt;div class=&quot;loading&quot; id=&quot;loading-indicator&quot;&gt;
            &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
            &lt;p&gt;正在处理文件，请稍候...&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // 切换功能选项卡
        const functionTabs = document.querySelectorAll('.function-tab');
        const functionContents = document.querySelectorAll('.function-content');

        functionTabs.forEach(tab =&gt; {
            tab.addEventListener('click', () =&gt; {
                const functionId = tab.getAttribute('data-function');

                // 更新选项卡状态
                functionTabs.forEach(t =&gt; t.classList.remove('active'));
                tab.classList.add('active');

                // 更新内容显示
                functionContents.forEach(content =&gt; content.classList.remove('active'));
                document.getElementById(`${functionId}-function`).classList.add('active');
            });
        });

        // 显示/隐藏加载指示器
        function showLoading(show) {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (show) {
                loadingIndicator.classList.add('active');
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        // ==================== 批量创建Excel表功能 ====================
        // 存储从上传Excel文件中读取的表名
        let uploadedExcelNames = [];

        // 创建Excel表 - 文本输入变化时更新预览
        const createTextInput = document.querySelector('#create-text-input textarea');
        const createExcelPreview = document.getElementById('create-excel-preview');

        createTextInput.addEventListener('input', updateCreatePreview);

        function updateCreatePreview() {
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
            const allNames = [...textNames, ...uploadedExcelNames];

            if (allNames.length === 0) {
                createExcelPreview.innerHTML = `
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;客户信息表.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;销售数据统计.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;财务报告2024.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;员工档案.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            createExcelPreview.innerHTML = '';
            allNames.forEach(name =&gt; {
                const excelItem = document.createElement('div');
                excelItem.className = 'excel-item';
                // 确保文件名以.xlsx结尾
                const fileName = name.trim().endsWith('.xlsx') || name.trim().endsWith('.xls') ? name.trim() : name.trim() + '.xlsx';
                excelItem.innerHTML = `
                    &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                    &lt;div class=&quot;excel-name&quot;&gt;${fileName}&lt;/div&gt;
                `;
                createExcelPreview.appendChild(excelItem);
            });
        }

        // 创建Excel表 - Excel上传
        const createBrowseBtn = document.getElementById('create-browse-btn');
        const createExcelFile = document.getElementById('create-excel-file');
        const createFileList = document.getElementById('create-file-list');

        createBrowseBtn.addEventListener('click', () =&gt; {
            createExcelFile.click();
        });

        createExcelFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                createFileList.innerHTML = `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 使用 SheetJS 解析 Excel 文件
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                        // 处理数据（假设第一列是Excel表名称）
                        const excelNames = [];
                        for (let i = 1; i &lt; sheetData.length; i++) {
                            const row = sheetData[i];
                            if (row &amp;&amp; row[0]) {
                                excelNames.push(row[0].toString());
                            }
                        }

                        // 保存上传的Excel表名
                        uploadedExcelNames = excelNames;

                        // 更新预览
                        updateCreatePreview();

                        alert(`成功从Excel文件读取 ${excelNames.length} 个Excel表名称！`);
                    } catch (error) {
                        console.error('解析Excel文件时出错:', error);
                        alert('解析Excel文件时出错，请确保文件格式正确且第一列包含Excel表名称。');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 创建Excel表 - 下载模板（包含上传文件中的表名）
        document.getElementById('create-template-download').addEventListener('click', function(e) {
            e.preventDefault();

            // 获取文本框中的表名
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');

            // 合并文本框中的表名和上传Excel中的表名
            const allNames = [...textNames, ...uploadedExcelNames];

            // 构建模板数据
            const data = [['Excel表名称']];

            if (allNames.length &gt; 0) {
                allNames.forEach(name =&gt; {
                    data.push([name]);
                });
            } else {
                // 默认模板数据
                data.push(['客户信息表']);
                data.push(['销售数据统计']);
                data.push(['财务报告2024']);
                data.push(['员工档案']);
            }

            // 使用 SheetJS 创建工作簿
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Excel表列表');

            // 导出为 .xlsx 文件
            XLSX.writeFile(wb, 'Excel表创建模板.xlsx');
        });

        // 创建Excel表 - 清空按钮
        document.getElementById('create-clear-btn').addEventListener('click', function() {
            createTextInput.value = '';
            createFileList.innerHTML = '';
            createExcelFile.value = '';
            uploadedExcelNames = [];
            updateCreatePreview();
        });

        // 创建Excel表 - 执行按钮
        document.getElementById('create-execute-btn').addEventListener('click', async function() {
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
            const allNames = [...textNames, ...uploadedExcelNames];

            if (allNames.length === 0) {
                alert('请先输入要创建的Excel表名称！');
                return;
            }

            showLoading(true);

            try {
                // 使用 JSZip 创建包含多个Excel文件的ZIP
                const zip = new JSZip();

                // 为每个Excel表名称创建一个简单的Excel文件
                for (const excelName of allNames) {
                    // 确保文件名以.xlsx结尾
                    const fileName = excelName.trim().endsWith('.xlsx') || excelName.trim().endsWith('.xls') ?
                        excelName.trim() : excelName.trim() + '.xlsx';

                    // 创建一个简单的工作表
                    const worksheetData = [
                        ['这是自动生成的Excel文件'],
                        ['文件名', fileName],
                        ['生成时间', new Date().toLocaleString()],
                        ['', ''],
                        ['列1', '列2', '列3'],
                        ['数据1', '数据2', '数据3'],
                        ['数据4', '数据5', '数据6']
                    ];

                    const worksheet = XLSX.utils.aoa_to_sheet(worksheetData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');

                    // 将工作簿转换为二进制数据
                    const excelData = XLSX.write(workbook, {type: 'array', bookType: 'xlsx'});

                    // 将Excel文件添加到ZIP
                    zip.file(fileName, excelData);
                }

                // 生成 ZIP 文件并下载
                const content = await zip.generateAsync({type: &quot;blob&quot;});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = '批量创建Excel表.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                alert(`成功创建包含 ${allNames.length} 个Excel文件的压缩包！`);
            } catch (error) {
                console.error('创建Excel文件失败:', error);
                alert('创建Excel文件时发生错误，请重试。');
            } finally {
                showLoading(false);
            }
        });

        // ==================== 批量重命名Excel表功能 ====================
        let renameFilesData = [];

        // 切换重命名输入方法
        const renameMethodBtns = document.querySelectorAll('#rename-function .method-btn');
        const renameFolderUpload = document.getElementById('rename-folder-upload');
        const renameMappingUpload = document.getElementById('rename-mapping-upload');

        renameMethodBtns.forEach(btn =&gt; {
            btn.addEventListener('click', () =&gt; {
                const method = btn.getAttribute('data-method');

                // 更新按钮状态
                renameMethodBtns.forEach(b =&gt; b.classList.remove('active'));
                btn.classList.add('active');

                // 切换显示区域
                if (method === 'folder') {
                    renameFolderUpload.style.display = 'block';
                    renameMappingUpload.style.display = 'none';
                } else {
                    renameFolderUpload.style.display = 'none';
                    renameMappingUpload.style.display = 'block';
                }
            });
        });

        // 上传文件夹
        const renameUploadArea = document.getElementById('rename-upload-area');

        // 处理拖放文件夹
        async function handleRenameFolderDrop(e) {
            const items = e.dataTransfer.items;
            const files = [];

            for (const item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    await traverseFileTreeForRename(entry, files);
                }

            const fileList = {
                length: files.length,

            };

        // 遍历文件树（用于拖放文件夹）

            if (entry.isFile) {
                return new Promise((resolve) =&gt; {
                    entry.file((file) =&gt; {
                        // 只处理Excel文件
                        if (file.name.match(/\.(xlsx|xls)$/)) {
                            files.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                return new Promise((resolve) =&gt; {
                    reader.readEntries(async (entries) =&gt; {
                        for (const childEntry of entries) {

                        }
                        resolve();

        }

        // 重命名模式变化
        const renamePattern = document.getElementById('rename-pattern');
        const replaceControls = document.getElementById('replace-controls');
        const replaceWithControls = document.getElementById('replace-with-controls');

        renamePattern.addEventListener('change', function() {

        // 应用重命名规则
        document.getElementById('apply-rename-btn').addEventListener('click', function() {
            if (renameFilesData.length === 0) {

            }

            const pattern = document.getElementById('rename-pattern').value;
            const startNumber = parseInt(document.getElementById('rename-start-number').value) || 1;
            const prefix = document.getElementById('rename-prefix').value;
            const findText = document.getElementById('rename-find').value;
            const replaceText = document.getElementById('rename-replace').value;

            renameFilesData.forEach((fileObj, index) =&gt; {
                let newName = '';

                switch (pattern) {
                    case 'sequential':
                        newName = `文件${startNumber + index}`;
                        break;
                    case 'date':
                        const today = new Date();
                        const dateStr = today.toISOString().split('T')[0];
                        newName = `${dateStr}_${startNumber + index}`;
                        break;
                    case 'replace':
                        newName = fileObj.originalNameWithoutExt.replace(new RegExp(findText, 'g'), replaceText);
                        break;
                    case 'custom':
                    default:
                        newName = prefix ? `${prefix}${startNumber + index}` : fileObj.originalNameWithoutExt;

                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                        // 解析映射关系（假设第1列是原文件名，第2列是新文件名）
                        const mapping = {};
                        for (let i = 1; i &lt; sheetData.length; i++) {
                            const row = sheetData[i];
                            if (row &amp;&amp; row[0] &amp;&amp; row[1]) {
                                mapping[row[0].toString().trim()] = row[1].toString().trim();
                            }
                        }

                        // 应用映射关系到现有的文件列表
                        applyMappingToFiles(mapping);

                        alert(`成功读取映射关系，共 ${Object.keys(mapping).length} 条记录`);
                    } catch (error) {
                        console.error('解析映射Excel文件时出错:', error);

                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 应用映射关系到文件列表
        function applyMappingToFiles(mapping) {
            if (renameFilesData.length === 0) {
                alert('请先上传需要重命名的Excel文件！');
                return;
            }

            let appliedCount = 0;
            renameFilesData.forEach(fileObj =&gt; {
                // 查找是否有对应的映射关系
                if (mapping[fileObj.originalName]) {
                    // 更新新文件名
                    const newName = mapping[fileObj.originalName];
                    const lastDotIndex = newName.lastIndexOf('.');
                    const newNameWithoutExt = lastDotIndex &gt; 0 ? newName.substring(0, lastDotIndex) : newName;
                    const newExtension = lastDotIndex &gt; 0 ? newName.substring(lastDotIndex) : fileObj.originalExtension;

                    fileObj.newNameWithoutExt = newNameWithoutExt;
                    fileObj.newExtension = newExtension;

                    // 更新表格中的输入框
                    const nameInput = document.querySelector(`.excel-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                    if (nameInput) {
                        nameInput.value = newNameWithoutExt;
                    }
                    appliedCount++;
                }

            if (appliedCount &gt; 0) {
                alert(`成功应用 ${appliedCount} 个文件的重命名规则`);

            XLSX.writeFile(wb, 'Excel表名称列表.xlsx');

            alert('Excel文件已生成并下载！');
        });

        // 初始化预览

            background: var(--primary-color); color: white; border-color: var(--primary-color);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
        }

        /* 统计指标小卡片 */
        .stat-card {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 14px 18px; display: flex; align-items: center; gap: 14px;
        }
        .stat-icon {
            width: 44px; height: 44px; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; font-size: 20px;
        }

        /* 表格样式 */
        .table-custom {
            border-collapse: separate; border-spacing: 0; width: 100%;
        }
        .table-custom thead th {
            background-color: #f8fafc !important;
            color: #334155;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            text-align: center !important;
            vertical-align: middle;
            border-bottom: 2px solid #cbd5e1;
            border-right: 1px solid #e2e8f0;
            position: sticky; top: 0;
            z-index: 20;
            height: var(--header-height);
        }
        .table-custom tbody td {
            text-align: center !important;
            vertical-align: middle;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #f1f5f9;
            font-size: 14px;
            background-color: #fff;
            padding: 10px 12px;
            transition: background 0.1s;
        }

        /* 单元格热度条 */
        .cell-value-wrapper {
            position: relative; display: flex; align-items: center; justify-content: center;
            min-height: 28px; z-index: 1;
        }
        .cell-data-bar {
            position: absolute; left: 4px; top: 4px; bottom: 4px;
            background: rgba(79, 70, 229, 0.12);
            border-radius: 4px; z-index: -1; pointer-events: none;
            transition: width 0.3s ease;
        }

        /* 合并单元格粘性定位 */
        .merged-cell {
            vertical-align: top !important;
            padding: 0 !important;
            background-color: #fff;
            z-index: 5;
            font-weight: 600;
        }
        .sticky-wrapper {
            position: sticky;
            top: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 10px;
            min-height: 48px;

            background-color: #fffbeb !important;
            color: #92400e;
            font-weight: 600;
        }
        .row-champion td:first-child {

        .champion-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white; font-size: 11px; padding: 2px 8px; border-radius: 12px;

        /* 筛选栏 */

            border-bottom-color: var(--primary-color); border-radius: 50%;
            display: none; margin: 10px auto; animation: rotation 0.8s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        function setTagActive(containerId, tagText) {
            const tag = Array.from(document.querySelectorAll(`#${containerId} .custom-tag`)).find(t =&gt; t.dataset.v === tagText);
            if(tag &amp;&amp; !tag.classList.contains('active')) {
                tag.click();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('loader');

        dropZone.onclick = () =&gt; fileInput.click();
        dropZone.ondragover = (e) =&gt; { e.preventDefault(); dropZone.style.borderColor = 'var(--primary-color)'; dropZone.style.background = '#eef2ff'; };
        dropZone.ondragleave = (e) =&gt; { e.preventDefault(); dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafafa'; };
        dropZone.ondrop = (e) =&gt; {
            e.preventDefault();
            dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafafa';
            if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };

        function handleFile(file) {
            document.getElementById('uploadContent').style.display = 'none';
            loader.style.display = 'block';
            const reader = new FileReader();
            reader.onload = (e) =&gt; {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                    rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: &quot;&quot;});
                    if (rawData.length &gt; 0) {
                        headers = Object.keys(rawData[0]);
                        initConfigUI();
                        document.getElementById('cardStep1').style.display = 'none';
                        document.getElementById('cardStep2').style.display = 'block';
                    } else { alert(&quot;Excel文件为空！&quot;); resetUpload(); }
                } catch (err) { alert(&quot;文件读取失败，请确保格式正确&quot;); resetUpload(); }
            };
            reader.readAsArrayBuffer(file);
        }

        function resetUpload() {
            loader.style.display = 'none';

        function initConfigUI() {
            const addTag = (id, txt) =&gt; {
                const t = document.createElement('div');
                t.className = 'custom-tag';
                t.innerHTML = `&lt;i class=&quot;bi bi-tag text-secondary&quot;&gt;&lt;/i&gt; ${txt}`;
                t.dataset.v = txt;
                t.onclick = function() {
                    this.classList.toggle('active');
                    this.querySelector('i').className = this.classList.contains('active') ? 'bi bi-check-circle-fill' : 'bi bi-tag text-secondary';
                };
                document.getElementById(id).appendChild(t);
            };
            document.getElementById('fixedContainer').innerHTML = '';
            document.getElementById('analysisContainer').innerHTML = '';
            const pSel = document.getElementById('pivotSelect'); pSel.innerHTML = '';
            const vSel = document.getElementById('valueSelect'); vSel.innerHTML = '';
            headers.forEach(h =&gt; {
                addTag('fixedContainer', h);
                addTag('analysisContainer', h);
                pSel.add(new Option(h, h));
                vSel.add(new Option(h, h));
            });
        }

        document.getElementById('btnAnalyze').addEventListener('click', () =&gt; {
            const getTags = (id) =&gt; Array.from(document.querySelectorAll(`#${id} .custom-tag.active`)).map(e =&gt; e.dataset.v);
            const fixedDims = getTags('fixedContainer');
            const analysisDims = getTags('analysisContainer');
            const pivotCol = document.getElementById('pivotSelect').value;
            const valueCol = document.getElementById('valueSelect').value || pivotCol;
            const agg = document.querySelector('input[name=&quot;agg&quot;]:checked').value;

            if (!analysisDims.length) { alert(&quot;请在【分析维度】中至少选择一个属性！&quot;); return; }
            if (!pivotCol) { alert(&quot;请选择【透视列】！&quot;); return; }

            const pHeaders = Array.from(new Set(rawData.map(r =&gt; r[pivotCol] !== undefined ? String(r[pivotCol]) : &quot;(空)&quot;))).sort();

            let tempMatrix = [];
            let tempProcess = [];
            let grandTotal = 0;
            let championCount = 0;
            gMaxPivotVal = 1;

            analysisDims.forEach(targetDim =&gt; {
                const aggMap = new Map();
                rawData.forEach(row =&gt; {
                    const fixedValues = fixedDims.map(d =&gt; row[d] !== undefined ? row[d] : '');
                    const uniqueKey = [...fixedValues, targetDim, row[targetDim]].join('|||');
                    if(!aggMap.has(uniqueKey)) aggMap.set(uniqueKey, { meta: row, rows: [] });
                    aggMap.get(uniqueKey).rows.push(row);
                });

                const dimRows = [];
                aggMap.forEach((gData) =&gt; {
                    const mRow = {};
                    mRow['分析维度'] = targetDim;
                    fixedDims.forEach(d =&gt; mRow[d] = gData.meta[d]);
                    mRow['属性值'] = gData.meta[targetDim];

                    let total = 0;
                    pHeaders.forEach(ph =&gt; {
                        const sub = gData.rows.filter(r =&gt; String(r[pivotCol]!==undefined?r[pivotCol]:&quot;(空)&quot;) === ph);
                        let val = 0;
                        if(agg==='COUNT') val = sub.length;
                        else val = sub.reduce((s,r) =&gt; s+(parseFloat(r[valueCol])||0), 0);

                        mRow[ph] = val;
                        total += val;
                        if(val &gt; gMaxPivotVal) gMaxPivotVal = val;

                        if(val &gt; 0) {
                            const pRow = {};
                            pRow['分析维度'] = targetDim;
                            fixedDims.forEach(d =&gt; pRow[d] = gData.meta[d]);
                            pRow['属性值'] = gData.meta[targetDim];
                            pRow[pivotCol] = ph;
                            pRow['指标值'] = val;
                            tempProcess.push(pRow);
                        }
                    });
                    mRow['总计'] = total;
                    grandTotal += total;
                    mRow._groupKey = fixedDims.map(d =&gt; gData.meta[d]).join('|||');
                    dimRows.push(mRow);
                });

                const buckets = {};
                dimRows.forEach(r =&gt; {
                    if(!buckets[r._groupKey]) buckets[r._groupKey] = [];
                    buckets[r._groupKey].push(r);
                });

                Object.values(buckets).forEach(arr =&gt; {
                    arr.sort((a,b) =&gt; b['总计'] - a['总计']);
                    if(arr.length &amp;&amp; arr[0]['总计'] &gt; 0) {
                        arr[0]._isChampion = true;
                        championCount++;
                    }
                    tempMatrix.push(...arr);
                });
            });

            gMatrixData = tempMatrix;
            gProcessData = tempProcess;
            gFixedDims = fixedDims;
            gMatrixCols = ['分析维度', ...fixedDims, '属性值', ...pHeaders, '总计'];

            document.getElementById('statRawCount').innerText = rawData.length.toLocaleString();
            document.getElementById('statGroupCount').innerText = new Set(tempMatrix.map(r=&gt;r._groupKey)).size;
            document.getElementById('statChampionCount').innerText = championCount;
            document.getElementById('statTotalValue').innerText = Math.round(grandTotal).toLocaleString();

            renderMatrix(gMatrixData);
            renderProcess(gProcessData);
            initFilters();

            document.getElementById('cardStep3').style.display = 'block';
            document.getElementById('cardStep3').scrollIntoView({behavior:'smooth'});
        });

        // 页面表格渲染
        function renderMatrix(data) {
            const th = document.querySelector('#matrixTable thead');
            th.innerHTML = `&lt;tr&gt;${gMatrixCols.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join('')}&lt;/tr&gt;`;
            const tb = document.querySelector('#matrixTable tbody');
            tb.innerHTML = '';

            const mergeCols = ['分析维度', ...gFixedDims];
            const spanMap = {};

            mergeCols.forEach((col, colIdx) =&gt; {
                let startRow = 0;
                for (let i = 1; i &lt;= data.length; i++) {
                    let isDiff = false;
                    if (i === data.length) {
                        isDiff = true;
                    } else {
                        if (data[i][col] !== data[startRow][col]) isDiff = true;
                        for (let p = 0; p &lt; colIdx; p++) {
                            const parentCol = mergeCols[p];
                            if (data[i][parentCol] !== data[startRow][parentCol]) {
                                isDiff = true;
                                break;
                            }
                        }
                    }

                    if (isDiff) {
                        const span = i - startRow;
                        spanMap[`${startRow}-${col}`] = span;
                        for (let k = startRow + 1; k &lt; i; k++) {
                            spanMap[`${k}-${col}`] = 0;
                        }
                        startRow = i;
                    }
                }
            });

            data.forEach((r, rowIndex) =&gt; {
                const tr = document.createElement('tr');
                if(r._isChampion) tr.className = 'row-champion';

                gMatrixCols.forEach(col =&gt; {
                    if (mergeCols.includes(col)) {
                        const span = spanMap[`${rowIndex}-${col}`];
                        if (span === 0) return;

                        const td = document.createElement('td');
                        if (span &gt; 1) td.rowSpan = span;
                        td.className = 'merged-cell';

                        let v = r[col] !== undefined ? r[col] : '';
                        td.innerHTML = `&lt;div class=&quot;sticky-wrapper&quot;&gt;${v}&lt;/div&gt;`;
                        tr.appendChild(td);

                    } else if (col === '属性值') {
                        const td = document.createElement('td');
                        let content = r[col];
                        if(r._isChampion) {
                            content += ` &lt;span class=&quot;champion-badge&quot;&gt;&lt;i class=&quot;bi bi-trophy-fill&quot;&gt;&lt;/i&gt; TOP 1&lt;/span&gt;`;
                        }
                        td.innerHTML = content;
                        tr.appendChild(td);
                    } else {
                        const td = document.createElement('td');
                        let v = r[col] !== undefined ? r[col] : 0;

                        if(typeof v === 'number') {
                            const percent = Math.min(100, Math.round((v / gMaxPivotVal) * 100));
                            td.innerHTML = `
                                &lt;div class=&quot;cell-value-wrapper&quot;&gt;
                                    ${v &gt; 0 ? `&lt;div class=&quot;cell-data-bar&quot; style=&quot;width: ${percent}%;&quot;&gt;&lt;/div&gt;` : ''}
                                    &lt;span style=&quot;${v === 0 ? 'color: #cbd5e1;' : 'font-weight: 500;'}&quot;&gt;${v.toLocaleString()}&lt;/span&gt;
                                &lt;/div&gt;
                            `;
                        } else {
                            td.innerText = v;
                        }
                        tr.appendChild(td);
                    }
                });
                tb.appendChild(tr);
            });
        }

        function renderProcess(data) {
            const pCol = document.getElementById('pivotSelect').value;
            const cols = ['分析维度', ...gFixedDims, '属性值', pCol, '指标值'];
            const th = document.querySelector('#processTable thead');
            th.innerHTML = `&lt;tr&gt;${cols.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join('')}&lt;/tr&gt;`;
            const tb = document.querySelector('#processTable tbody');
            tb.innerHTML = '';
            data.slice(0, 1000).forEach(r =&gt; {
                const tr = document.createElement('tr');
                cols.forEach(c =&gt; {
                    const td = document.createElement('td');
                    td.innerText = typeof r[c] === 'number' ? r[c].toLocaleString() : r[c];
                    tr.appendChild(td);
                });
                tb.appendChild(tr);
            });
        }

        function initFilters() {
            const bar = document.getElementById('filterToolbar');
            bar.innerHTML = '&lt;span class=&quot;small fw-bold text-muted me-2&quot;&gt;&lt;i class=&quot;bi bi-funnel-fill&quot;&gt;&lt;/i&gt; 快速筛选:&lt;/span&gt;';
            ['分析维度', ...gFixedDims].forEach(k =&gt; {
                const vals = Array.from(new Set(gMatrixData.map(r=&gt;r[k]))).sort();
                const sel = document.createElement('select');
                sel.className = 'form-select form-select-sm border-secondary border-opacity-25';
                sel.style.width='auto'; sel.style.display='inline-block';
                sel.dataset.k = k;
                sel.innerHTML = `&lt;option value=&quot;&quot;&gt;全部 ${k}&lt;/option&gt;`;
                vals.forEach(v =&gt; sel.add(new Option(v,v)));
                sel.onchange = () =&gt; {
                    let d = gMatrixData;
                    document.querySelectorAll('#filterToolbar select').forEach(s =&gt; {
                        if(s.value) d = d.filter(r =&gt; r[s.dataset.k] === s.value);
                    });
                    renderMatrix(d);
                };
                bar.appendChild(sel);
            });
        }

        // ========================================================
        // 💎 核心升级：导出 100% 还原网页视觉的高颜值 Excel
        // ========================================================
        function exportToExcel() {
            try {
                if (!gMatrixData || !gMatrixData.length) {
                    alert(&quot;暂无可导出的数据，请先生成分析报表！&quot;);
                    return;
                }

                const wb = XLSX.utils.book_new();

                // 1. 准备透视表二维数组
                const excelRows = [];
                // 表头
                excelRows.push(gMatrixCols);

                // 数据行
                gMatrixData.forEach(r =&gt; {
                    const rowData = [];
                    gMatrixCols.forEach(col =&gt; {
                        let val = r[col] !== undefined ? r[col] : '';
                        if (col === '属性值' &amp;&amp; r._isChampion) {
                            val = `${val} 👑 TOP 1`; // 导出时也保留冠军标志
                        }
                        rowData.push(val);
                    });
                    excelRows.push(rowData);
                });

                const ws1 = XLSX.utils.aoa_to_sheet(excelRows);

                // 2. 计算并注入【单元格合并】
                const mergeCols = ['分析维度', ...gFixedDims];
                const merges = [];

                mergeCols.forEach((col) =&gt; {
                    const colIdx = gMatrixCols.indexOf(col);
                    if (colIdx === -1) return;

                    let startRow = 0;
                    for (let i = 1; i &lt;= gMatrixData.length; i++) {
                        let isDiff = false;
                        if (i === gMatrixData.length) {
                            isDiff = true;
                        } else {
                            if (gMatrixData[i][col] !== gMatrixData[startRow][col]) isDiff = true;
                            for (let p = 0; p &lt; mergeCols.indexOf(col); p++) {
                                const parentCol = mergeCols[p];
                                if (gMatrixData[i][parentCol] !== gMatrixData[startRow][parentCol]) {
                                    isDiff = true;
                                    break;
                                }
                            }
                        }

                        if (isDiff) {
                            const span = i - startRow;
                            if (span &gt; 1) {
                                // r: 1-based (加上表头第0行)
                                merges.push({
                                    s: { r: startRow + 1, c: colIdx },
                                    e: { r: startRow + span, c: colIdx }
                                });
                            }
                            startRow = i;
                        }
                    }
                });
                ws1['!merges'] = merges;

                // 3. 样式定义
                const styleHeader = {
                    fill: { fgColor: { rgb: &quot;F1F5F9&quot; } },
                    font: { bold: true, color: { rgb: &quot;1E293B&quot; }, sz: 11 },
                    alignment: { horizontal: &quot;center&quot;, vertical: &quot;center&quot;, wrapText: true },
                    border: {
                        top: { style: &quot;thin&quot;, color: { rgb: &quot;CBD5E1&quot; } },
                        bottom: { style: &quot;medium&quot;, color: { rgb: &quot;94A3B8&quot; } },
                        left: { style: &quot;thin&quot;, color: { rgb: &quot;CBD5E1&quot; } },
                        right: { style: &quot;thin&quot;, color: { rgb: &quot;CBD5E1&quot; } }
                    }
                };

                const styleChampion = {
                    fill: { fgColor: { rgb: &quot;FEF3C7&quot; } }, // 淡金黄色
                    font: { bold: true, color: { rgb: &quot;92400E&quot; }, sz: 10 },
                    alignment: { horizontal: &quot;center&quot;, vertical: &quot;center&quot; },
                    border: {
                        top: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } },
                        bottom: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } },
                        left: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } },
                        right: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } }
                    }
                };

                const styleNormal = {
                    fill: { fgColor: { rgb: &quot;FFFFFF&quot; } },
                    font: { color: { rgb: &quot;334155&quot; }, sz: 10 },
                    alignment: { horizontal: &quot;center&quot;, vertical: &quot;center&quot; },
                    border: {
                        top: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } },
                        bottom: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } },
                        left: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } },
                        right: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } }
                    }
                };

                const styleZero = {
                    ...styleNormal,
                    font: { color: { rgb: &quot;94A3B8&quot; }, sz: 10 }
                };

                // 4. 为每个单元格应用样式
                const range = XLSX.utils.decode_range(ws1['!ref']);
                for (let R = range.s.r; R &lt;= range.e.r; ++R) {
                    for (let C = range.s.c; C &lt;= range.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws1[cellAddress]) {
                            ws1[cellAddress] = { t: 's', v: '' };
                        }
                        const cell = ws1[cellAddress];

                        if (R === 0) {
                            // 表头
                            cell.s = styleHeader;
                        } else {
                            // 数据行
                            const rowDataObj = gMatrixData[R - 1];
                            const isChamp = rowDataObj &amp;&amp; rowDataObj._isChampion;
                            const isValZero = (typeof cell.v === 'number' &amp;&amp; cell.v === 0);

                            if (isChamp) {
                                cell.s = styleChampion;
                            } else if (isValZero) {
                                cell.s = styleZero;
                            } else {
                                cell.s = styleNormal;
                            }
                        }
                    }
                }

                // 5. 自动计算列宽
                const colWidths = gMatrixCols.map((col, idx) =&gt; {
                    let maxLen = col.length * 2.2;
                    gMatrixData.forEach(r =&gt; {
                        const str = String(r[col] || '');
                        if (str.length * 1.5 &gt; maxLen) maxLen = str.length * 1.5;
                    });
                    return { wch: Math.max(12, Math.min(30, Math.ceil(maxLen + 4))) };
                });
                ws1['!cols'] = colWidths;

                // 6. 添加透视 Sheet
                XLSX.utils.book_append_sheet(wb, ws1, &quot;透视分析总表&quot;);

                // 7. 处理并美化过程明细 Sheet
                const pCol = document.getElementById('pivotSelect').value;
                const pCols = ['分析维度', ...gFixedDims, '属性值', pCol, '指标值'];
                const ws2Rows = [pCols];
                gProcessData.forEach(r =&gt; {
                    ws2Rows.push(pCols.map(c =&gt; r[c] !== undefined ? r[c] : ''));
                });
                const ws2 = XLSX.utils.aoa_to_sheet(ws2Rows);

                // 美化明细表
                const range2 = XLSX.utils.decode_range(ws2['!ref']);
                for (let R = range2.s.r; R &lt;= range2.e.r; ++R) {
                    for (let C = range2.s.c; C &lt;= range2.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws2[cellAddress]) ws2[cellAddress] = { t: 's', v: '' };
                        ws2[cellAddress].s = (R === 0) ? styleHeader : styleNormal;
                    }
                }
                ws2['!cols'] = pCols.map(c =&gt; ({ wch: Math.max(14, c.length * 2 + 4) }));
                XLSX.utils.book_append_sheet(wb, ws2, &quot;过程聚合明细&quot;);

                // 8. 导出下载
                XLSX.writeFile(wb, &quot;智能属性透视分析报告(带样式).xlsx&quot;);

            } catch (err) {
                console.error(&quot;导出 Excel 出现错误:&quot;, err);
                alert(&quot;导出失败：&quot; + err.message);
            }
        }
