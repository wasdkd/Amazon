&lt;body&gt;
    &lt;div class=&quot;background-container&quot;&gt;
        &lt;h1&gt;图片批量下载工具&lt;/h1&gt;
        &lt;p class=&quot;subtitle&quot;&gt;上传Excel文件，批量下载图片并打包为ZIP&lt;/p&gt;

        &lt;div class=&quot;container&quot;&gt;
            &lt;!-- 添加使用说明 --&gt;
            &lt;div class=&quot;instructions&quot;&gt;
                &lt;h2&gt;使用说明&lt;/h2&gt;
                &lt;ol&gt;
                    &lt;li&gt;准备一个Excel文件，其中必须包含名为&lt;code&gt;ASIN&lt;/code&gt;和&lt;code&gt;图片链接&lt;/code&gt;的列&lt;/li&gt;
                    &lt;li&gt;点击上传区域或拖拽Excel文件到指定区域&lt;/li&gt;
                    &lt;li&gt;选择下载模式（单线程或多线程）和线程数（多线程模式下）&lt;/li&gt;
                &lt;/ol&gt;
            &lt;/div&gt;

            &lt;div class=&quot;upload-area&quot; id=&quot;uploadArea&quot;&gt;
                &lt;i&gt;📁&lt;/i&gt;
                &lt;p&gt;拖放Excel文件到此处或&lt;span class=&quot;browse&quot;&gt;点击浏览&lt;/span&gt;&lt;/p&gt;
                &lt;p class=&quot;file-info&quot; id=&quot;fileInfo&quot;&gt;支持格式: .xlsx, .xls&lt;/p&gt;
                &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.xlsx,.xls&quot; class=&quot;hidden&quot;&gt;
            &lt;/div&gt;

            &lt;div class=&quot;settings&quot;&gt;
                &lt;div class=&quot;setting-row&quot;&gt;
                    &lt;label for=&quot;downloadMode&quot;&gt;下载模式:&lt;/label&gt;
                    &lt;select id=&quot;downloadMode&quot;&gt;
                        &lt;option value=&quot;single&quot;&gt;单线程下载&lt;/option&gt;
                        &lt;option value=&quot;multi&quot;&gt;多线程下载&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;

                &lt;div class=&quot;setting-row&quot; id=&quot;threadCountRow&quot;&gt;
                    &lt;label for=&quot;threadCount&quot;&gt;线程数量:&lt;/label&gt;
                    &lt;input type=&quot;number&quot; id=&quot;threadCount&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;5&quot;&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;button id=&quot;downloadBtn&quot; class=&quot;download-btn&quot; disabled&gt;
                &lt;span class=&quot;spinner hidden&quot; id=&quot;spinner&quot;&gt;&lt;/span&gt;
                &lt;span id=&quot;btnText&quot;&gt;开始下载&lt;/span&gt;
            &lt;/button&gt;

            &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
                &lt;div class=&quot;progress-header&quot;&gt;
                    &lt;span&gt;下载进度&lt;/span&gt;
                    &lt;span id=&quot;progressText&quot;&gt;0%&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class=&quot;progress-bar&quot;&gt;
                    &lt;div class=&quot;progress&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;status&quot; id=&quot;statusText&quot;&gt;准备中...&lt;/div&gt;
                &lt;div class=&quot;log&quot; id=&quot;log&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 引入必要的库 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const downloadMode = document.getElementById('downloadMode');
        const threadCountRow = document.getElementById('threadCountRow');
        const threadCount = document.getElementById('threadCount');
        const downloadBtn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 变量
        let excelData = null;
        let isProcessing = false;

        // 事件监听
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#e8f4fc';
            uploadArea.style.borderColor = '#2980b9';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.background = '#f8fafc';
            uploadArea.style.borderColor = '#3498db';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f8fafc';
            uploadArea.style.borderColor = '#3498db';

            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        downloadMode.addEventListener('change', updateDownloadModeUI);
        downloadBtn.addEventListener('click', startDownload);

        // 初始化UI状态
        function initUI() {
            updateDownloadModeUI();
        }

        // 更新下载模式UI
        function updateDownloadModeUI() {
            const isMulti = downloadMode.value === 'multi';
            threadCountRow.style.display = isMulti ? 'flex' : 'none';
        }

        // 处理上传的文件
        function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/)) {
                alert('请上传Excel文件(.xlsx或.xls)');
                return;
            }

            fileInfo.textContent = `已选择: ${file.name}`;
            downloadBtn.disabled = false;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(firstSheet);

                    if (!excelData.length || !excelData[0].hasOwnProperty('ASIN') || !excelData[0].hasOwnProperty('图片链接')) {
                        alert('Excel文件必须包含&quot;ASIN&quot;和&quot;图片链接&quot;两列');
                        downloadBtn.disabled = true;
                        return;
                    }

                    addLog('Excel文件解析成功，找到 ' + excelData.length + ' 条记录', 'success');
                } catch (error) {
                    alert('解析Excel文件时出错: ' + error.message);
                    downloadBtn.disabled = true;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 开始下载
        function startDownload() {
            if (!excelData || isProcessing) return;

            isProcessing = true;
            downloadBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            const mode = downloadMode.value;
            const maxWorkers = mode === 'multi' ? parseInt(threadCount.value) : 1;

            downloadImages(excelData, mode, maxWorkers);
        }

        // 下载图片
        async function downloadImages(data, mode, maxWorkers) {
            const zip = new JSZip();
            const total = data.length;
            let completed = 0;
            let successCount = 0;
            let failCount = 0;

            updateProgress(0, total, '开始下载图片...');

            // 清理Amazon图片URL
            function cleanAmazonImageUrl(url) {
                const cleanedUrl = url.replace(/(\/I\/[^/.]+)(\.[^/]*)(\.[a-zA-Z]+)$/, '$1$3');
                return cleanedUrl;
            }

            // 下载单个图片
            async function downloadSingleImage(item) {
                const name = item['ASIN'].toString().trim();
                let imageUrl = item['图片链接'].toString().trim();

                // 清理URL
                const originalUrl = imageUrl;
                imageUrl = cleanAmazonImageUrl(imageUrl);

                if (imageUrl !== originalUrl) {
                    addLog(`URL已清理: ${name}`, 'info');
                }

                try {
                    // 尝试使用清理后的URL
                    let response = await fetch(imageUrl);

                    // 如果清理后的URL失败，尝试原始URL
                    if (!response.ok &amp;&amp; imageUrl !== originalUrl) {
                        addLog(`清理URL失败，尝试原始URL: ${name}`, 'info');
                        response = await fetch(originalUrl);
                        imageUrl = originalUrl;
                    }

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const blob = await response.blob();

                    // 获取文件扩展名
                    const urlObj = new URL(imageUrl);
                    let extension = '.' + urlObj.pathname.split('.').pop();
                    if (extension.length &gt; 5) extension = '.jpg'; // 防止错误扩展名

                    // 添加到ZIP
                    const filename = name + extension;
                    zip.file(filename, blob);

                    completed++;
                    successCount++;
                    updateProgress(completed, total, `成功下载: ${filename}`);
                    addLog(`成功: ${filename}`, 'success');

                    return true;
                } catch (error) {
                    completed++;
                    failCount++;
                    updateProgress(completed, total, `下载失败: ${name}`);
                    addLog(`失败: ${name} - ${error.message}`, 'error');
                    return false;
                }
            }

            // 单线程下载
            async function singleThreadDownload() {
                for (const item of data) {
                    if (!isProcessing) break; // 如果用户取消了
                    await downloadSingleImage(item);
                }
            }

            // 多线程下载
            async function multiThreadDownload() {
                const workers = Math.min(maxWorkers, data.length);
                const chunkSize = Math.ceil(data.length / workers);

                const chunks = [];
                for (let i = 0; i &lt; workers; i++) {
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, data.length);
                    chunks.push(data.slice(start, end));
                }

                // 使用Promise.all并行处理所有块
                await Promise.all(chunks.map(async (chunk) =&gt; {
                    for (const item of chunk) {
                        if (!isProcessing) break; // 如果用户取消了
                        await downloadSingleImage(item);
                    }
                }));
            }

            // 执行下载
            try {
                if (mode === 'single') {
                    await singleThreadDownload();
                } else {
                    await multiThreadDownload();
                }

                if (!isProcessing) {
                    addLog('下载已取消', 'info');
                    resetUI();
                    return;
                }

                // 生成ZIP文件
                updateProgress(total, total, '正在生成ZIP文件...');

                const content = await zip.generateAsync({type: 'blob'});
                saveAs(content, '下载图片.zip');

                addLog(`下载完成! 成功: ${successCount}, 失败: ${failCount}`, 'success');
                statusText.textContent = `下载完成! 成功: ${successCount}, 失败: ${failCount}`;

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
            } finally {
                resetUI();
            }
        }

        // 更新进度
        function updateProgress(completed, total, status) {

                &lt;p class=&quot;file-info&quot; id=&quot;imageFileInfo&quot;&gt;支持格式: .zip&lt;/p&gt;
                &lt;input type=&quot;file&quot; id=&quot;imageFileInput&quot; accept=&quot;.zip&quot; class=&quot;hidden&quot;&gt;

    &lt;script&gt;
        // DOM元素
        const excelUploadArea = document.getElementById('excelUploadArea');
        const excelFileInput = document.getElementById('excelFileInput');
        const excelFileInfo = document.getElementById('excelFileInfo');
        const imageUploadArea = document.getElementById('imageUploadArea');
        const imageFileInput = document.getElementById('imageFileInput');
        const imageFileInfo = document.getElementById('imageFileInfo');
        const processBtn = document.getElementById('processBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 变量
        let imageFiles = new Map();
        let isProcessing = false;

        // 事件监听
        excelUploadArea.addEventListener('click', () =&gt; excelFileInput.click());
        excelUploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            excelUploadArea.style.background = '#e8ecfa';
            excelUploadArea.style.borderColor = '#5a6fd8';
        });
        excelUploadArea.addEventListener('dragleave', () =&gt; {
            excelUploadArea.style.background = '#f8f9fa';
            excelUploadArea.style.borderColor = '#667eea';
        });
        excelUploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            excelUploadArea.style.background = '#f8f9fa';
            excelUploadArea.style.borderColor = '#667eea';

            if (e.dataTransfer.files.length) {
                handleExcelFile(e.dataTransfer.files[0]);
            }
        });

        excelFileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleExcelFile(e.target.files[0]);
            }
        });

        imageUploadArea.addEventListener('click', () =&gt; imageFileInput.click());
        imageUploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            imageUploadArea.style.background = '#e8ecfa';
            imageUploadArea.style.borderColor = '#5a6fd8';
        });
        imageUploadArea.addEventListener('dragleave', () =&gt; {
            imageUploadArea.style.background = '#f8f9fa';
            imageUploadArea.style.borderColor = '#667eea';
        });
        imageUploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            imageUploadArea.style.background = '#f8f9fa';
            imageUploadArea.style.borderColor = '#667eea';

            if (e.dataTransfer.files.length) {
                handleImageFile(e.dataTransfer.files[0]);
            }
        });

        imageFileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleImageFile(e.target.files[0]);
            }
        });

        processBtn.addEventListener('click', processFiles);

        // 处理Excel文件
        function handleExcelFile(file) {
            if (!file.name.match(/\.(xlsx)$/)) {
                alert('请上传.xlsx格式的Excel文件');
                return;
            }

            excelFileInfo.textContent = `已选择: ${file.name}`;
            checkFilesReady();

            addLog(`已选择Excel文件: ${file.name}`, 'info');
        }

        // 处理图片文件
        async function handleImageFile(file) {
            if (!file.name.match(/\.(zip)$/)) {
                alert('请上传.zip格式的图片压缩包');
                return;
            }

            imageFileInfo.textContent = `已选择: ${file.name}`;

            try {
                addLog('正在解析图片压缩包...', 'info');

                const data = await readFileAsArrayBuffer(file);
                const zip = await JSZip.loadAsync(data);

                // 清空之前的图片
                imageFiles.clear();

                // 遍历ZIP文件中的所有图片
                let imageCount = 0;
                for (const [filename, fileEntry] of Object.entries(zip.files)) {
                    if (!fileEntry.dir &amp;&amp; filename.match(/\.(jpg|jpeg|png|gif|bmp)$/i)) {
                        const blob = await fileEntry.async('blob');
                        const asin = filename.split('.')[0]; // 假设文件名就是ASIN
                        imageFiles.set(asin, blob);
                        imageCount++;
                    }
                }

                addLog(`在压缩包中找到 ${imageCount} 张图片`, 'success');
                checkFilesReady();

            } catch (error) {
                addLog(`解析图片压缩包时出错: ${error.message}`, 'error');
            }
        }

        // 检查是否已准备好处理
        function checkFilesReady() {
            const excelReady = excelFileInput.files.length &gt; 0;
            const imageReady = imageFiles.size &gt; 0;

            processBtn.disabled = !(excelReady &amp;&amp; imageReady);
        }

        // 读取文件为ArrayBuffer
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = (e) =&gt; resolve(e.target.result);
                reader.onerror = (e) =&gt; reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        // 将Blob转换为Base64
        function blobToBase64(blob) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = () =&gt; {
                    const dataUrl = reader.result;
                    const base64 = dataUrl.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // 获取图片扩展名
        function getImageExtension(blob) {
            const type = blob.type;
            if (type === 'image/jpeg') return 'jpeg';
            if (type === 'image/png') return 'png';
            if (type === 'image/gif') return 'gif';
            if (type === 'image/bmp') return 'bmp';
            return 'jpeg'; // 默认
        }

        // 处理文件
        async function processFiles() {
            if (!excelFileInput.files.length || imageFiles.size === 0) return;

            isProcessing = true;
            processBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            try {
                addLog('开始处理文件...', 'info');

                // 读取Excel文件
                const excelFile = excelFileInput.files[0];
                const excelData = await readFileAsArrayBuffer(excelFile);

                // 使用ExcelJS读取Excel文件
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(excelData);

                // 获取第一个工作表
                const worksheet = workbook.getWorksheet(1);

                // 查找ASIN列
                let asinColumnIndex = -1;
                const headerRow = worksheet.getRow(1);
                headerRow.eachCell((cell, colNumber) =&gt; {
                    if (cell.value &amp;&amp; cell.value.toString().trim() === 'ASIN') {
                        asinColumnIndex = colNumber;
                    }
                });

                if (asinColumnIndex === -1) {
                    throw new Error('未找到名为&quot;ASIN&quot;的列');
                }

                addLog(`找到ASIN列，位于第 ${asinColumnIndex} 列`, 'success');

                // 确定图片列的位置（ASIN列的下一个列）
                const imageColumnIndex = asinColumnIndex + 1;

                // 设置图片列标题
                if (!worksheet.getRow(1).getCell(imageColumnIndex).value) {
                    worksheet.getRow(1).getCell(imageColumnIndex).value = '图片';
                }

                // 调整列宽以适应图片
                worksheet.getColumn(imageColumnIndex).width = 15;

                // 处理每一行数据
                const renamedImages = new Map();
                let imageCounter = 1;
                let matchedCount = 0;
                let missingCount = 0;

                // 从第二行开始遍历
                for (let rowIndex = 2; rowIndex &lt;= worksheet.rowCount; rowIndex++) {
                    const row = worksheet.getRow(rowIndex);
                    const asinCell = row.getCell(asinColumnIndex);
                    const asin = asinCell.value ? asinCell.value.toString().trim() : '';

                    if (!asin) {
                        continue; // 跳过空ASIN
                    }

                    // 查找匹配的图片
                    if (imageFiles.has(asin)) {
                        try {
                            const imageBlob = imageFiles.get(asin);
                            const imageBase64 = await blobToBase64(imageBlob);
                            const extension = getImageExtension(imageBlob);

                            // 将图片添加到工作簿
                            const imageId = workbook.addImage({
                                base64: imageBase64,
                                extension: extension,
                            });

                            // 插入图片到工作表 [citation:1]
                            // 图片将插入到当前行的图片列，并调整行高以适应图片
                            worksheet.addImage(imageId, {
                                tl: { col: imageColumnIndex - 1, row: rowIndex - 1 },
                                br: { col: imageColumnIndex, row: rowIndex },
                                editAs: 'oneCell'
                            });

                            // 调整行高以显示图片
                            worksheet.getRow(rowIndex).height = 100;

                            // 记录重命名的图片
                            const newImageName = `图片${imageCounter}.${extension}`;
                            renamedImages.set(newImageName, imageBlob);

                            imageCounter++;
                            matchedCount++;

                            addLog(`匹配成功: ${asin} -&gt; ${newImageName}`, 'success');

                        } catch (error) {
                            addLog(`插入图片失败 ${asin}: ${error.message}`, 'error');
                            missingCount++;
                        }
                    } else {
                        missingCount++;
                        addLog(`未找到匹配图片: ${asin}`, 'error');
                    }

                    // 更新进度
                    const progress = Math.round(((rowIndex - 1) / (worksheet.rowCount - 1)) * 100);
                    updateProgress(progress, 100, `处理中: ${rowIndex - 1}/${worksheet.rowCount - 1}`);

                    // 避免阻塞UI，让出控制权
                    if (rowIndex % 5 === 0) {
                        await new Promise(resolve =&gt; setTimeout(resolve, 0));
                    }
                }

                // 生成Excel文件的ArrayBuffer
                addLog('正在生成Excel文件...', 'info');
                const excelBuffer = await workbook.xlsx.writeBuffer();

                // 创建结果ZIP文件
                addLog('正在创建结果ZIP文件...', 'info');
                const resultZip = new JSZip();

                // 添加Excel文件
                resultZip.file('嵌入图片的Excel文件.xlsx', excelBuffer);

                // 添加重命名的图片
                const imagesFolder = resultZip.folder('重命名图片');
                for (const [filename, blob] of renamedImages.entries()) {
                    imagesFolder.file(filename, blob);
                }

                // 生成ZIP文件
                updateProgress(100, 100, '正在生成最终文件...');
                const zipContent = await resultZip.generateAsync({type: 'blob'});

                // 下载文件
                saveAs(zipContent, 'Excel图片处理结果.zip');

                addLog(`处理完成! 成功插入 ${matchedCount} 张图片, 未匹配: ${missingCount}`, 'success');
                statusText.textContent = `处理完成! 成功插入 ${matchedCount} 张图片, 未匹配: ${missingCount}`;

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
            } finally {
                resetUI();
            }
        }

        // 更新进度
        function updateProgress(completed, total, status) {
            const percent = Math.round((completed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            statusText.textContent = status;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 重置UI
        function resetUI() {
            isProcessing = false;
            processBtn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = '处理文件';
        }

&lt;body&gt;

                &lt;li&gt;Excel文件的第二列应为嵌入的图片（浮动图片）&lt;/li&gt;
                &lt;li&gt;上传Excel文件后，点击提取按钮&lt;/li&gt;
                &lt;li&gt;工具将提取所有图片并打包为ZIP文件下载&lt;/li&gt;
                &lt;li&gt;注意：此工具仅支持从.xlsx格式的Excel文件中提取图片&lt;/li&gt;
            &lt;/ol&gt;
        &lt;/div&gt;

        &lt;div class=&quot;upload-area&quot; id=&quot;uploadArea&quot;&gt;
            &lt;i&gt;📁&lt;/i&gt;
            &lt;p&gt;拖放Excel文件到此处或&lt;span class=&quot;browse&quot;&gt;点击浏览&lt;/span&gt;&lt;/p&gt;
            &lt;p class=&quot;file-info&quot; id=&quot;fileInfo&quot;&gt;支持格式: .xlsx&lt;/p&gt;
            &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.xlsx&quot; class=&quot;hidden&quot;&gt;
        &lt;/div&gt;

        &lt;button id=&quot;extractBtn&quot; class=&quot;extract-btn&quot; disabled&gt;
            &lt;span class=&quot;spinner hidden&quot; id=&quot;spinner&quot;&gt;&lt;/span&gt;
            &lt;span id=&quot;btnText&quot;&gt;提取图片&lt;/span&gt;
        &lt;/button&gt;

        &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
            &lt;div class=&quot;progress-header&quot;&gt;
                &lt;span&gt;提取进度&lt;/span&gt;
                &lt;span id=&quot;progressText&quot;&gt;0%&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;progress-bar&quot;&gt;
                &lt;div class=&quot;progress&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;status&quot; id=&quot;statusText&quot;&gt;准备中...&lt;/div&gt;
            &lt;div class=&quot;log&quot; id=&quot;log&quot;&gt;&lt;/div&gt;

    &lt;!-- 引入必要的库 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const extractBtn = document.getElementById('extractBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 事件监听
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f0e6f5';
            uploadArea.style.borderColor = '#8e44ad';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.background = '#f8f9fa';
            uploadArea.style.borderColor = '#9b59b6';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f8f9fa';
            uploadArea.style.borderColor = '#9b59b6';

            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        extractBtn.addEventListener('click', extractImages);

        // 处理上传的文件
        function handleFile(file) {
            if (!file.name.match(/\.(xlsx)$/)) {
                alert('请上传.xlsx格式的Excel文件');
                return;
            }

            fileInfo.textContent = `已选择: ${file.name}`;
            extractBtn.disabled = false;

            addLog(`已选择文件: ${file.name}`, 'info');
        }

        // 提取图片
        async function extractImages() {
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            extractBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            try {
                addLog('开始解析Excel文件...', 'info');

                // 读取Excel文件
                const data = await readFileAsArrayBuffer(file);
                const workbook = XLSX.read(data, {type: 'array'});

                // 获取第一个工作表
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                // 获取工作表数据
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                if (!jsonData.length || jsonData.length &lt; 2) {
                    throw new Error('Excel文件没有数据或数据格式不正确');
                }

                addLog(`找到 ${jsonData.length - 1} 行数据`, 'success');

                // 解析Excel文件以提取图片
                const images = await extractImagesFromExcel(data, jsonData);

                if (images.length === 0) {
                    throw new Error('未在Excel文件中找到图片');
                }

                addLog(`成功提取 ${images.length} 张图片`, 'success');

                // 创建ZIP文件
                await createZipFile(images);

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
                resetUI();
            }
        }

        // 读取文件为ArrayBuffer
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = (e) =&gt; resolve(e.target.result);
                reader.onerror = (e) =&gt; reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        // 从Excel文件中提取图片
        async function extractImagesFromExcel(data, jsonData) {
            addLog('正在提取图片...', 'info');

            // 将Excel文件作为ZIP文件处理
            const zip = await JSZip.loadAsync(data);

            // 查找媒体文件
            const mediaFiles = [];
            zip.forEach((relativePath, zipEntry) =&gt; {
                if (relativePath.startsWith('xl/media/')) {
                    mediaFiles.push(zipEntry);
                }
            });

            addLog(`在Excel文件中找到 ${mediaFiles.length} 个媒体文件`, 'info');

            // 查找绘图文件（包含图片位置信息）
            let drawings = [];
            try {
                const drawingsXml = await zip.file('xl/drawings/drawing1.xml').async('text');
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(drawingsXml, 'text/xml');

                // 解析图片引用
                const twoCellAnchors = xmlDoc.getElementsByTagName('xdr:twoCellAnchor');

                for (let i = 0; i &lt; twoCellAnchors.length; i++) {
                    const anchor = twoCellAnchors[i];

                    // 获取图片引用
                    const blipFill = anchor.getElementsByTagName('xdr:blipFill')[0];
                    if (blipFill) {
                        const blip = blipFill.getElementsByTagName('a:blip')[0];
                        if (blip) {
                            const embedId = blip.getAttribute('r:embed');

                            // 获取图片位置
                            const from = anchor.getElementsByTagName('xdr:from')[0];
                            if (from) {
                                const col = from.getElementsByTagName('xdr:col')[0].textContent;
                                const row = from.getElementsByTagName('xdr:row')[0].textContent;

                                if (col === '1' &amp;&amp; row &gt; 0) { // 假设图片在第二列(B列)
                                    drawings.push({
                                        embedId: embedId,
                                        row: parseInt(row)
                                    });
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                addLog('无法解析图片位置信息，将使用默认顺序', 'info');
                // 如果无法解析绘图文件，则按顺序分配图片
                for (let i = 1; i &lt; jsonData.length &amp;&amp; i &lt;= mediaFiles.length; i++) {
                    drawings.push({
                        embedId: `rId${i}`,
                        row: i
                    });
                }
            }

            // 查找图片关系
            let imageRelations = {};
            try {
                const relsXml = await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('text');
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(relsXml, 'text/xml');

                const relationships = xmlDoc.getElementsByTagName('Relationship');
                for (let i = 0; i &lt; relationships.length; i++) {
                    const rel = relationships[i];
                    const id = rel.getAttribute('Id');
                    const target = rel.getAttribute('Target');
                    imageRelations[id] = target;
                }
            } catch (e) {
                addLog('无法解析图片关系，将使用默认映射', 'info');
                // 如果无法解析关系文件，则创建默认映射
                for (let i = 1; i &lt;= mediaFiles.length; i++) {
                    imageRelations[`rId${i}`] = `../media/image${i}.png`;
                }
            }

            // 提取图片
            const images = [];
            for (const drawing of drawings) {
                const relation = imageRelations[drawing.embedId];
                if (!relation) continue;

                const imagePath = relation.replace('../', 'xl/');
                const imageFile = zip.file(imagePath);

                if (imageFile) {
                    const imageData = await imageFile.async('blob');
                    const imageName = jsonData[drawing.row] &amp;&amp; jsonData[drawing.row][0] ?
                                     `${jsonData[drawing.row][0]}.png` : `图片${drawing.row}.png`;

                    images.push({
                        name: imageName,
                        data: imageData
                    });

                    addLog(`提取图片: ${imageName}`, 'success');
                    updateProgress(images.length, drawings.length, `已提取 ${images.length}/${drawings.length} 张图片`);
                }
            }

            return images;
        }

        // 创建ZIP文件
        async function createZipFile(images) {
            addLog('正在创建ZIP文件...', 'info');

            const zip = new JSZip();

            for (const image of images) {
                zip.file(image.name, image.data);
            }

            updateProgress(100, 100, '正在生成ZIP文件...');

            const content = await zip.generateAsync({type: 'blob'});
            saveAs(content, '提取的图片.zip');

            addLog(`提取完成! 成功提取 ${images.length} 张图片`, 'success');
            statusText.textContent = `提取完成! 成功提取 ${images.length} 张图片`;

            resetUI();
        }

        // 更新进度
        function updateProgress(completed, total, status) {
            const percent = Math.round((completed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            statusText.textContent = status;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 重置UI
        function resetUI() {
            extractBtn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = '提取图片';
        }
    &lt;/script&gt;
&lt;/body&gt;

  &lt;!-- XLSX library (SheetJS) --&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;📊 Excel表格合并工具&lt;/h1&gt;
  &lt;a href=&quot;https://wasdkd.github.io/Amazon/AmazonDigitsPlatform&quot;&gt;
    &lt;button class=&quot;back-button&quot;&gt;← 返回平台&lt;/button&gt;
  &lt;/a&gt;

  &lt;div class=&quot;instructions&quot;&gt;
    &lt;h3&gt;📘 使用说明&lt;/h3&gt;
    &lt;ol&gt;
      &lt;li&gt;&lt;span class=&quot;step-number&quot;&gt;1&lt;/span&gt;上传包含Excel文件的文件夹或选择多个Excel文件&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;step-number&quot;&gt;2&lt;/span&gt;（可选）筛选包含特定关键字的工作表&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;设置表头行号和需要合并的子表数量&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;执行合并操作并下载结果&lt;/li&gt;
    &lt;/ol&gt;
    &lt;p&gt;💡 提示：可以直接执行合并，无需筛选；也可以先筛选再合并&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;top-sections&quot;&gt;
    &lt;div class=&quot;upload-section-container&quot;&gt;
      &lt;div class=&quot;section&quot; id=&quot;upload-section&quot;&gt;
        &lt;h2&gt;📁 上传Excel文件或文件夹&lt;/h2&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;label&gt;选择文件：&lt;/label&gt;
          &lt;input id=&quot;fileInputFiles&quot; type=&quot;file&quot; multiple accept=&quot;.xlsx,.xls,.csv&quot; /&gt;
        &lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;label&gt;或选择文件夹：&lt;/label&gt;
          &lt;input id=&quot;fileInputFolder&quot; type=&quot;file&quot; webkitdirectory directory accept=&quot;.xlsx,.xls,.csv&quot; /&gt;
        &lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;button id=&quot;btnSelectAll&quot; disabled&gt;全选&lt;/button&gt;
          &lt;button id=&quot;btnDeselectAll&quot; disabled&gt;全不选&lt;/button&gt;
          &lt;button id=&quot;btnParseSelected&quot; disabled&gt;解析所选文件&lt;/button&gt;
          &lt;button id=&quot;btnClear&quot;&gt;清空&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;file-list&quot; id=&quot;selectionList&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;filter-section-container&quot;&gt;
      &lt;div class=&quot;section&quot; id=&quot;filter-section&quot;&gt;
        &lt;h2&gt;🔍 ① 筛选子表（可自选关键字）&lt;/h2&gt;
        &lt;div class=&quot;tips&quot;&gt;
          可选步骤：如果需要只合并特定工作表，可以在此步骤筛选包含关键字的工作表
        &lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;label for=&quot;sheetKeyword&quot;&gt;子表关键字：&lt;/label&gt;
          &lt;input id=&quot;sheetKeyword&quot; type=&quot;text&quot; value=&quot;变体对比&quot; style=&quot;width:160px;&quot; /&gt;
          &lt;button id=&quot;btnFilter&quot; disabled&gt;筛选&lt;/button&gt;
          &lt;button id=&quot;btnDownloadFiltered&quot; disabled&gt;下载筛选结果（xlsx）&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;summary&quot; id=&quot;filterSummary&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;preview&quot; id=&quot;filterPreview&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;section&quot; id=&quot;merge-section&quot;&gt;
    &lt;h2&gt;🔗 ② 合并子表（指定表头行与子表个数）&lt;/h2&gt;
    &lt;div class=&quot;tips&quot;&gt;
      合并设置说明：表头行是包含列名的行号；子表个数是指每个工作表中需要合并的数据块数量
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label for=&quot;headerRow&quot;&gt;表头所在行：&lt;/label&gt;
      &lt;input id=&quot;headerRow&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;1&quot; /&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label for=&quot;subtableCount&quot;&gt;需要合并的子表个数：&lt;/label&gt;
      &lt;input id=&quot;subtableCount&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;1&quot; /&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnMerge&quot; disabled&gt;执行合并&lt;/button&gt;
      &lt;button id=&quot;btnDownloadMergedXlsx&quot; class=&quot;primary&quot; disabled&gt;📥 下载合并结果（xlsx）&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;summary&quot; id=&quot;mergeSummary&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;preview&quot; id=&quot;mergePreview&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    // 全局状态
    let pickedFilesRaw = []; // [{ file, name, path, selected }]
    let uploadedFiles = []; // [{ name, path, workbook }]
    let filteredSheets = []; // [{ sourceFile, sheetName, worksheet }]
    let mergedData = []; // Array of row objects

    const fileInputFiles = document.getElementById('fileInputFiles');
    const fileInputFolder = document.getElementById('fileInputFolder');
    const btnSelectAll = document.getElementById('btnSelectAll');
    const btnDeselectAll = document.getElementById('btnDeselectAll');
    const btnParseSelected = document.getElementById('btnParseSelected');
    const btnClear = document.getElementById('btnClear');
    const selectionList = document.getElementById('selectionList');
    const btnFilter = document.getElementById('btnFilter');
    const btnDownloadFiltered = document.getElementById('btnDownloadFiltered');
    const sheetKeyword = document.getElementById('sheetKeyword');
    const filterSummary = document.getElementById('filterSummary');
    const filterPreview = document.getElementById('filterPreview');
    const headerRowInput = document.getElementById('headerRow');
    const subtableCountInput = document.getElementById('subtableCount');
    const btnMerge = document.getElementById('btnMerge');
    const btnDownloadMergedXlsx = document.getElementById('btnDownloadMergedXlsx');
    const mergeSummary = document.getElementById('mergeSummary');
    const mergePreview = document.getElementById('mergePreview');

    // 工具方法
    function escapeHtml(str) {
      return String(str).replace(/[&amp;&lt;&gt;&quot;']/g, function (m) {
        return ({ '&amp;': '&amp;amp;', '&lt;': '&amp;lt;', '&gt;': '&amp;gt;', '&quot;': '&amp;quot;', &quot;'&quot;: '&amp;#39;' })[m];
      });
    }

    function isRowEmpty(row) {
      if (!row || !Array.isArray(row)) return true;
      return row.every(cell =&gt; {
        const v = (cell == null ? '' : String(cell)).trim();
        return v === '';
      });
    }

    function renderTable(container, data2D, maxRows = 30) {
      container.innerHTML = '';
      if (!data2D || data2D.length === 0) {
        container.textContent = '无数据可预览';
        return;
      }
      const headers = (data2D[0] || []).map(h =&gt; String(h || '').trim());
      const rows = data2D.slice(1, 1 + maxRows);
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const trh = document.createElement('tr');
      headers.forEach(h =&gt; {
        const th = document.createElement('th');
        th.textContent = h || '(空)';
        trh.appendChild(th);
      });
      thead.appendChild(trh);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      rows.forEach(r =&gt; {
        const tr = document.createElement('tr');
        for (let i = 0; i &lt; headers.length; i++) {
          const td = document.createElement('td');
          td.textContent = r[i] == null ? '' : String(r[i]);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      container.appendChild(table);
    }

    function uniqueSheetName(base, existing) {
      let name = base;
      let idx = 1;
      while (existing.has(name)) {
        name = `${base}_${idx++}`;
      }
      existing.add(name);
      return name;
    }

    // 文件选择（文件模式）
    function handlePickedFiles(files) {
      const excelFiles = Array.from(files || []).filter(f =&gt; /(\.xlsx|\.xls|\.csv)$/i.test(f.name));
      if (!excelFiles.length) {
        selectionList.textContent = '未选择Excel/CSV文件。';
        btnSelectAll.disabled = true;
        btnDeselectAll.disabled = true;
        btnParseSelected.disabled = true;
        return;
      }
      pickedFilesRaw = excelFiles.map((f) =&gt; ({
        file: f,
        name: f.name,
        path: f.webkitRelativePath ? f.webkitRelativePath : f.name,
        selected: true,
      }));
      renderSelectionList();
    }

    fileInputFiles.addEventListener('change', (e) =&gt; {
      resetStateExceptSelection();
      handlePickedFiles(e.target.files);
    });
    fileInputFolder.addEventListener('change', (e) =&gt; {
      resetStateExceptSelection();
      handlePickedFiles(e.target.files);
    });

    function renderSelectionList() {
      selectionList.innerHTML = '';
      const count = pickedFilesRaw.length;
      const summary = document.createElement('div');
      summary.className = 'summary';
      summary.textContent = `共选择 ${count} 个Excel/CSV 文件，可勾选需要解析的文件。`;
      selectionList.appendChild(summary);

      const list = document.createElement('div');
      pickedFilesRaw.forEach((item, idx) =&gt; {
        const id = `chk_${idx}`;
        const row = document.createElement('div');
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = id;
        chk.checked = item.selected;
        chk.addEventListener('change', () =&gt; {
          item.selected = chk.checked;
          updateParseButtonsState();
        });
        const label = document.createElement('label');
        label.setAttribute('for', id);
        label.textContent = ` ${item.path}`;
        row.appendChild(chk);
        row.appendChild(label);
        list.appendChild(row);
      });
      selectionList.appendChild(list);
      btnSelectAll.disabled = false;
      btnDeselectAll.disabled = false;
      updateParseButtonsState();
    }

    function updateParseButtonsState() {
      const anySelected = pickedFilesRaw.some(x =&gt; x.selected);
      btnParseSelected.disabled = !anySelected;
    }

    btnSelectAll.addEventListener('click', () =&gt; {
      pickedFilesRaw.forEach(x =&gt; x.selected = true);
      renderSelectionList();
    });
    btnDeselectAll.addEventListener('click', () =&gt; {
      pickedFilesRaw.forEach(x =&gt; x.selected = false);
      renderSelectionList();
    });

    btnParseSelected.addEventListener('click', async () =&gt; {
      // 重置解析后状态
      uploadedFiles = [];
      filteredSheets = [];
      mergedData = [];
      filterSummary.textContent = '';
      filterPreview.innerHTML = '';
      mergeSummary.textContent = '';
      mergePreview.innerHTML = '';
      btnFilter.disabled = true;
      btnDownloadFiltered.disabled = true;
      btnMerge.disabled = true;
      btnDownloadMergedXlsx.disabled = true;

      const toParse = pickedFilesRaw.filter(x =&gt; x.selected);
      if (!toParse.length) {
        selectionList.textContent = '请勾选至少一个文件再解析。';
        return;
      }
      const status = document.createElement('div');
      status.className = 'summary';
      status.textContent = '正在解析所选文件……';
      selectionList.appendChild(status);

      const tasks = toParse.map(async ({ file, name, path }) =&gt; {
        try {
          let wb;
          if (/\.csv$/i.test(name)) {
            const text = await file.text();
            wb = XLSX.read(text, { type: 'string' });
          } else {
            const buf = await file.arrayBuffer();
            wb = XLSX.read(buf, { type: 'array' });
          }
          uploadedFiles.push({ name, path, workbook: wb });
        } catch (err) {
          console.error('解析失败:', name, err);
        }
      });
      await Promise.all(tasks);

      status.textContent = '';
      if (!uploadedFiles.length) {
        const err = document.createElement('div');
        err.className = 'summary';
        err.textContent = '解析失败或没有可用的Excel/CSV文件。';
        selectionList.appendChild(err);
        return;
      }
      const details = uploadedFiles.map(u =&gt; `${u.path}（工作表：${u.workbook.SheetNames.length}）`).join('； ');
      const ok = document.createElement('div');
      ok.className = 'summary';
      ok.textContent = `已解析 ${uploadedFiles.length} 个文件：${details}`;
      selectionList.appendChild(ok);
      // 允许直接合并（无需先筛选）
      btnFilter.disabled = false;
      btnMerge.disabled = false;
    });

    function resetStateExceptSelection() {
      // 不清空 pickedFilesRaw，以便重新选择另一个输入源时覆盖
      uploadedFiles = [];
      filteredSheets = [];
      mergedData = [];
      filterSummary.textContent = '';
      filterPreview.innerHTML = '';
      mergeSummary.textContent = '';
      mergePreview.innerHTML = '';
      btnFilter.disabled = true;
      btnDownloadFiltered.disabled = true;
      btnMerge.disabled = true;
      btnDownloadMergedXlsx.disabled = true;
    }

    btnClear.addEventListener('click', () =&gt; {
      fileInputFiles.value = '';
      fileInputFolder.value = '';
      pickedFilesRaw = [];
      resetStateExceptSelection();
      selectionList.textContent = '';
      btnSelectAll.disabled = true;
      btnDeselectAll.disabled = true;
      btnParseSelected.disabled = true;
    });

    // ① 筛选含指定关键字的子表
    btnFilter.addEventListener('click', () =&gt; {
      if (!uploadedFiles.length) {
        filterSummary.textContent = '请先上传文件再进行筛选。';
        return;
      }
      filteredSheets = [];
      const kwInput = sheetKeyword.value.trim();
      const keyword = kwInput || '变体对比';
      uploadedFiles.forEach(({ name, workbook }) =&gt; {
        const matched = (workbook.SheetNames || []).filter(sn =&gt; String(sn).includes(keyword));
        matched.forEach(sn =&gt; {
          const ws = workbook.Sheets[sn];
          if (ws) {
            filteredSheets.push({ sourceFile: name, sheetName: sn, worksheet: ws });
          }
        });
      });

      if (!filteredSheets.length) {
        filterSummary.textContent = `未在任何文件中找到包含&quot;${keyword}&quot;的子表。`;
        filterPreview.innerHTML = '';
        btnDownloadFiltered.disabled = true;
        return;
      }

      const total = filteredSheets.length;
      const perFile = {};
      filteredSheets.forEach(fs =&gt; {
        perFile[fs.sourceFile] = (perFile[fs.sourceFile] || 0) + 1;
      });
      const breakdown = Object.entries(perFile).map(([fn, cnt]) =&gt; `${fn}: ${cnt}`).join('； ');
      filterSummary.textContent = `共筛选到 ${total} 个子表。分布：${breakdown}`;

      // 预览第一张匹配子表的前若干行
      const first = filteredSheets[0].worksheet;
      const arr = XLSX.utils.sheet_to_json(first, { header: 1, blankrows: false, defval: '' });
      if (arr.length) {
        renderTable(filterPreview, arr, 30);
      } else {
        filterPreview.textContent = '子表为空。';
      }

      btnDownloadFiltered.disabled = false;
      // 筛选完成后允许进行合并
      btnMerge.disabled = false;
    });

    // 下载筛选结果工作簿
    btnDownloadFiltered.addEventListener('click', () =&gt; {
      if (!filteredSheets.length) return;
      const wbNew = XLSX.utils.book_new();
      const names = new Set();
      filteredSheets.forEach(({ sourceFile, sheetName, worksheet }) =&gt; {
        const base = `${sourceFile} - ${sheetName}`.slice(0, 28);
        const unique = uniqueSheetName(base, names);
        XLSX.utils.book_append_sheet(wbNew, worksheet, unique);
      });
      XLSX.writeFile(wbNew, '筛选结果.xlsx');
    });

    // ② 合并子表（指定表头行与子表个数；筛选可选）
    btnMerge.addEventListener('click', () =&gt; {
      // 若未筛选，则遍历所有上传文件的全部工作表
      const candidateSheets = filteredSheets.length ? filteredSheets : (function collectAllSheets(){
        const all = [];
        uploadedFiles.forEach(({ name, workbook }) =&gt; {
          (workbook.SheetNames || []).forEach(sn =&gt; {
            const ws = workbook.Sheets[sn];
            if (ws) all.push({ sourceFile: name, sheetName: sn, worksheet: ws });
          });
        });
        return all;
      })();
      if (!candidateSheets.length) {
        mergeSummary.textContent = '未找到可合并的子表，请先上传文件或调整筛选关键字。';
        return;
      }
      const headerRowIdxInput = parseInt(headerRowInput.value, 10);
      const subCount = parseInt(subtableCountInput.value, 10);
      if (isNaN(headerRowIdxInput) || headerRowIdxInput &lt; 1) {
        mergeSummary.textContent = '表头所在行必须为 ≥ 1 的数字。';
        return;
      }
      if (isNaN(subCount) || subCount &lt; 1) {
        mergeSummary.textContent = '子表个数必须为 ≥ 1 的数字。';
        return;
      }

      const headerRowIdx = headerRowIdxInput - 1; // 转为 0-based
      mergedData = [];
      let sheetsUsed = 0;
      let rowsMerged = 0;

      candidateSheets.forEach(({ sourceFile, sheetName, worksheet }) =&gt; {
        const arr = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: true, defval: '' });
        if (!arr.length || headerRowIdx &gt;= arr.length) return;
        const headers = (arr[headerRowIdx] || []).map(h =&gt; String(h || '').trim());
        const colCount = headers.length;
        let i = headerRowIdx + 1;
        let subMerged = 0;
        while (i &lt; arr.length &amp;&amp; subMerged &lt; subCount) {
          // 跳过连续空行，找到子表开始
          while (i &lt; arr.length &amp;&amp; isRowEmpty(arr[i])) i++;
          if (i &gt;= arr.length) break;
          const block = [];
          // 收集到下一个空行前的连续数据行为一个子表
          while (i &lt; arr.length &amp;&amp; !isRowEmpty(arr[i])) {
            block.push(arr[i]);
            i++;
          }
          if (block.length) {
            // 行对象化
            block.forEach(row =&gt; {
              const obj = {};
              for (let c = 0; c &lt; colCount; c++) {
                const key = headers[c] || `列${c+1}`;
                obj[key] = row[c] == null ? '' : row[c];
              }
              // 附加来源信息，便于追溯
              obj['__来源文件'] = sourceFile;
              obj['__来源子表'] = sheetName;
              mergedData.push(obj);
              rowsMerged++;
            });
            subMerged++;
          }
          // 此处 i 指向空行或末尾，循环会继续
        }
        if (subMerged &gt; 0) sheetsUsed++;
      });

      if (!mergedData.length) {
        mergeSummary.textContent = '未提取到可合并的行，请检查表头行与子表个数设置。';
        mergePreview.innerHTML = '';
        btnDownloadMergedXlsx.disabled = true;
        return;
      }

      // 预览（限制50行）
      const headersAll = Object.keys(mergedData[0]);
      const data2D = [headersAll].concat(mergedData.slice(0, 50).map(obj =&gt; headersAll.map(h =&gt; obj[h])));
      renderTable(mergePreview, data2D, 50);

      mergeSummary.textContent = `合并完成：共 ${rowsMerged} 行，涉及 ${sheetsUsed} 个子表。${filteredSheets.length ? '' : '（未筛选，已遍历所有子表）'}`;
      btnDownloadMergedXlsx.disabled = false;
    });

    // 下载合并结果（xlsx）
    btnDownloadMergedXlsx.addEventListener('click', () =&gt; {
      if (!mergedData.length) return;
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(mergedData);
      XLSX.utils.book_append_sheet(wb, ws, 'Merged');
      XLSX.writeFile(wb, '合并结果.xlsx');
    });
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

">

     </div>

   </div>

  <script>
   // 导航到指定报告
            function navigateToReport(index) {
                const sections = document.querySelectorAll('.visualization-section');
                sections.forEach((section, i) => {
                    section.style.display = i === index ? 'block' : 'none';
                });

                // 更新按钮状态
                document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                    if (i === index) {
                        btn.classList.add('active');
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 更新URL hash
                window.location.hash = `#report-${index + 1}`;
            }

            // 页面加载时显示第一个报告
            document.addEventListener('DOMContentLoaded', () => {
                // 从URL hash获取报告索引
                const hash = window.location.hash;
                let initialIndex = 0;

                if (hash.startsWith('#report-')) {
                    const reportNum = parseInt(hash.replace('#report-', ''));
                    if (!isNaN(reportNum) && reportNum > 0) {
                        initialIndex = reportNum - 1;
                    }
                }


                // 显示报告
                if (document.querySelectorAll('.visualization-section').length > 0) {
                    navigateToReport(initialIndex);
                }

                // 显示当前日期
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 显示最后更新时间
                document.getElementById('lastUpdate').textContent = now.toLocaleDateString('zh-CN', {
                    month: 'short',
                    day: 'numeric'
                });

                // 显示报告数量
                const reportCount = document.querySelectorAll('.visualization-section').length;
                document.getElementById('reportCount').textContent = reportCount;

                // 显示图表总数（估算）
                document.getElementById('totalCharts').textContent = reportCount * 3;
            });
  </script>
