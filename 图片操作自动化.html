        }

        .excel-actions {
            display: flex;
            gap: 10px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .action-icon-btn:hover {
            color: #1d6f42;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .action-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .primary-btn {
            background-color: #1d6f42;
            color: white;
        }

        .primary-btn:hover {
            background-color: #14532d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 111, 66, 0.3);
        }

        .secondary-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .secondary-btn:hover {
            background-color: #e9ecef;
        }

        .file-list {
            margin-top: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item i {
            color: #1d6f42;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1d6f42;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .results-actions {
            display: flex;
            gap: 10px;
        }

        .results-textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: monospace;
            resize: vertical;
            background-color: #f8f9fa;
        }

        .results-count {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
            text-align: right;
        }

        /* 批量重命名样式 */
        .rename-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #495057;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: #1d6f42;
            box-shadow: 0 0 0 3px rgba(29, 111, 66, 0.1);
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .excel-table th {
            background-color: #f8f9fa;
            padding: 15px 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            color: #495057;
        }

        .excel-table td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        .excel-table tr:hover {
            background-color: #f8f9fa;
        }

        .original-name {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* 创建功能左右布局 */
        .create-content {
            display: flex;
            gap: 30px;
        }

        .create-left {
            flex: 1;
        }

        .create-right {
            flex: 1;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 8px;
            }

            header {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .function-content {
                padding: 20px;
            }

            .function-selector {
                flex-direction: column;
            }

            .function-tab {
                border-right: none;
                border-bottom: 1px solid #dee2e6;
            }

            .actions {
                flex-direction: column;
                gap: 10px;
            }

            .action-btn {
                justify-content: center;
            }

            .rename-controls {
                flex-direction: column;
            }

            .create-content {
                flex-direction: column;
            }
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;header&gt;
            &lt;h1&gt;&lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt; 批量Excel表管理工具&lt;/h1&gt;
            &lt;p class=&quot;subtitle&quot;&gt;批量创建Excel表 | 批量重命名Excel表 | 提取Excel表名称&lt;/p&gt;
        &lt;/header&gt;

        &lt;div class=&quot;function-selector&quot;&gt;
            &lt;div class=&quot;function-tab active&quot; data-function=&quot;create&quot;&gt;
                &lt;i class=&quot;fas fa-plus-circle&quot;&gt;&lt;/i&gt; 批量创建Excel表
            &lt;/div&gt;
            &lt;div class=&quot;function-tab&quot; data-function=&quot;rename&quot;&gt;
                &lt;i class=&quot;fas fa-edit&quot;&gt;&lt;/i&gt; 批量重命名Excel表
            &lt;/div&gt;
            &lt;div class=&quot;function-tab&quot; data-function=&quot;extract&quot;&gt;
                &lt;i class=&quot;fas fa-list&quot;&gt;&lt;/i&gt; 提取Excel表名称
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 批量创建Excel表功能 --&gt;
        &lt;div class=&quot;function-content active&quot; id=&quot;create-function&quot;&gt;
            &lt;div class=&quot;input-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-pen-alt&quot;&gt;&lt;/i&gt; 输入Excel表名称&lt;/h3&gt;

                &lt;div class=&quot;create-content&quot;&gt;
                    &lt;div class=&quot;create-left&quot;&gt;
                        &lt;!-- 文本输入区域 --&gt;
                        &lt;div class=&quot;input-area text-input active&quot; id=&quot;create-text-input&quot;&gt;
                            &lt;textarea placeholder=&quot;请输入要创建的Excel表名称，每行一个名称，例如：&amp;#10;客户信息表&amp;#10;销售数据统计&amp;#10;财务报告2024&amp;#10;员工档案&quot;&gt;&lt;/textarea&gt;
                            &lt;div class=&quot;hint&quot;&gt;
                                &lt;i class=&quot;fas fa-info-circle&quot;&gt;&lt;/i&gt; 每个Excel表名称占一行，将按此列表批量创建Excel文件
                            &lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;div class=&quot;create-right&quot;&gt;
                        &lt;!-- Excel上传区域 --&gt;
                        &lt;div class=&quot;input-area file-upload&quot; id=&quot;create-excel-upload&quot;&gt;
                            &lt;div class=&quot;file-upload&quot;&gt;
                                &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                                &lt;p&gt;上传Excel文件，文件应包含一列Excel表名称&lt;/p&gt;
                                &lt;input type=&quot;file&quot; id=&quot;create-excel-file&quot; accept=&quot;.xlsx, .xls&quot; style=&quot;display: none;&quot;&gt;
                                &lt;button class=&quot;upload-btn&quot; id=&quot;create-browse-btn&quot;&gt;选择Excel文件&lt;/button&gt;
                                &lt;div class=&quot;file-list&quot; id=&quot;create-file-list&quot;&gt;&lt;/div&gt;
                                &lt;a href=&quot;#&quot; class=&quot;template-download&quot; id=&quot;create-template-download&quot;&gt;
                                    &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 下载Excel模板
                                &lt;/a&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;preview-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-eye&quot;&gt;&lt;/i&gt; 预览将要创建的Excel表&lt;/h3&gt;
                &lt;div class=&quot;excel-preview&quot; id=&quot;create-excel-preview&quot;&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;客户信息表.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;销售数据统计.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;财务报告2024.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;员工档案.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;actions&quot;&gt;
                &lt;button class=&quot;action-btn secondary-btn&quot; id=&quot;create-clear-btn&quot;&gt;
                    &lt;i class=&quot;fas fa-eraser&quot;&gt;&lt;/i&gt; 清空
                &lt;/button&gt;
                &lt;button class=&quot;action-btn primary-btn&quot; id=&quot;create-execute-btn&quot;&gt;
                    &lt;i class=&quot;fas fa-play-circle&quot;&gt;&lt;/i&gt; 执行批量创建
                &lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 批量重命名Excel表功能 --&gt;
        &lt;div class=&quot;function-content&quot; id=&quot;rename-function&quot;&gt;
            &lt;div class=&quot;input-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-upload&quot;&gt;&lt;/i&gt; 上传Excel文件夹&lt;/h3&gt;

                &lt;div class=&quot;input-method-selector&quot;&gt;
                    &lt;div class=&quot;method-btn active&quot; data-method=&quot;folder&quot;&gt;上传文件夹&lt;/div&gt;
                    &lt;div class=&quot;method-btn&quot; data-method=&quot;mapping&quot;&gt;上传映射Excel&lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 文件夹上传区域 --&gt;
                &lt;div class=&quot;input-area folder-upload active&quot; id=&quot;rename-folder-upload&quot;&gt;
                    &lt;div class=&quot;file-upload&quot; id=&quot;rename-upload-area&quot;&gt;
                        &lt;i class=&quot;fas fa-folder-open&quot;&gt;&lt;/i&gt;
                        &lt;p&gt;点击或拖拽包含Excel文件的文件夹到此区域上传&lt;/p&gt;
                        &lt;input type=&quot;file&quot; id=&quot;rename-file-input&quot; webkitdirectory multiple accept=&quot;.xlsx,.xls&quot; style=&quot;display: none;&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;rename-browse-btn&quot;&gt;选择文件夹&lt;/button&gt;
                        &lt;div class=&quot;file-list&quot; id=&quot;rename-file-list&quot;&gt;&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 映射Excel上传区域 --&gt;
                &lt;div class=&quot;input-area mapping-excel-upload&quot; id=&quot;rename-mapping-upload&quot; style=&quot;display: none;&quot;&gt;
                    &lt;div class=&quot;file-upload&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;p&gt;上传包含原文件名和新文件名映射关系的Excel文件&lt;/p&gt;
                        &lt;input type=&quot;file&quot; id=&quot;rename-mapping-file&quot; accept=&quot;.xlsx, .xls&quot; style=&quot;display: none;&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;rename-mapping-browse-btn&quot;&gt;选择映射Excel文件&lt;/button&gt;
                        &lt;div class=&quot;hint&quot;&gt;
                            &lt;i class=&quot;fas fa-info-circle&quot;&gt;&lt;/i&gt; Excel文件应包含两列：原文件名、新文件名
                        &lt;/div&gt;
                        &lt;a href=&quot;#&quot; class=&quot;template-download&quot; id=&quot;rename-template-download&quot;&gt;
                            &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 下载映射模板
                        &lt;/a&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;rename-controls&quot;&gt;
                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;重命名模式：&lt;/label&gt;
                    &lt;select id=&quot;rename-pattern&quot;&gt;
                        &lt;option value=&quot;custom&quot;&gt;自定义命名&lt;/option&gt;
                        &lt;option value=&quot;sequential&quot;&gt;顺序编号 (文件1, 文件2, ...)&lt;/option&gt;
                        &lt;option value=&quot;date&quot;&gt;日期+序号 (2024-01-01_1, 2024-01-01_2, ...)&lt;/option&gt;
                        &lt;option value=&quot;replace&quot;&gt;查找替换&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;起始编号：&lt;/label&gt;
                    &lt;input type=&quot;number&quot; id=&quot;rename-start-number&quot; value=&quot;1&quot; min=&quot;1&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;新文件名前缀：&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;rename-prefix&quot; placeholder=&quot;例如: 报告_&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot; id=&quot;replace-controls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;label&gt;查找内容：&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;rename-find&quot; placeholder=&quot;要查找的文本&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot; id=&quot;replace-with-controls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;label&gt;替换为：&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;rename-replace&quot; placeholder=&quot;替换后的文本&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;&amp;nbsp;&lt;/label&gt;
                    &lt;button class=&quot;upload-btn&quot; id=&quot;apply-rename-btn&quot; style=&quot;width: 100%;&quot;&gt;应用重命名规则&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;preview-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-list&quot;&gt;&lt;/i&gt; Excel文件列表&lt;/h3&gt;
                &lt;div class=&quot;excel-preview&quot;&gt;
                    &lt;table class=&quot;excel-table&quot; id=&quot;rename-table&quot;&gt;
                        &lt;thead&gt;
                            &lt;tr&gt;
                                &lt;th&gt;序号&lt;/th&gt;
                                &lt;th&gt;原始文件名&lt;/th&gt;
                                &lt;th&gt;新文件名&lt;/th&gt;
                                &lt;th&gt;操作&lt;/th&gt;
                            &lt;/tr&gt;
                        &lt;/thead&gt;
                        &lt;tbody id=&quot;rename-table-body&quot;&gt;
                            &lt;!-- Excel文件将通过JavaScript动态添加 --&gt;
                        &lt;/tbody&gt;
                    &lt;/table&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;actions&quot;&gt;
                &lt;button class=&quot;action-btn secondary-btn&quot; id=&quot;rename-clear-btn&quot;&gt;
                    &lt;i class=&quot;fas fa-eraser&quot;&gt;&lt;/i&gt; 重置
                &lt;/button&gt;
                &lt;button class=&quot;action-btn primary-btn&quot; id=&quot;rename-execute-btn&quot; disabled&gt;
                    &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 下载重命名后的文件
                &lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 提取Excel表名称功能 --&gt;
        &lt;div class=&quot;function-content&quot; id=&quot;extract-function&quot;&gt;
            &lt;div class=&quot;input-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-upload&quot;&gt;&lt;/i&gt; 上传Excel文件夹&lt;/h3&gt;

                &lt;div class=&quot;file-upload&quot; id=&quot;extract-upload-area&quot;&gt;
                    &lt;i class=&quot;fas fa-folder-open&quot;&gt;&lt;/i&gt;
                    &lt;p&gt;点击或拖拽包含Excel文件的文件夹到此区域上传&lt;/p&gt;
                    &lt;input type=&quot;file&quot; id=&quot;extract-file-input&quot; webkitdirectory multiple accept=&quot;.xlsx,.xls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;button class=&quot;upload-btn&quot; id=&quot;extract-browse-btn&quot;&gt;选择文件夹&lt;/button&gt;
                    &lt;div class=&quot;file-list&quot; id=&quot;extract-file-list&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;results-section&quot;&gt;
                &lt;div class=&quot;results-header&quot;&gt;
                    &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-file-alt&quot;&gt;&lt;/i&gt; 提取的Excel表名称&lt;/h3&gt;
                    &lt;div class=&quot;results-actions&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;copy-names-btn&quot;&gt;
                            &lt;i class=&quot;fas fa-copy&quot;&gt;&lt;/i&gt; 复制名称
                        &lt;/button&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;export-excel-btn&quot;&gt;
                            &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 导出为Excel
                        &lt;/button&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;textarea class=&quot;results-textarea&quot; id=&quot;extracted-names&quot; placeholder=&quot;Excel表名称将显示在这里，每行一个...&quot;&gt;&lt;/textarea&gt;
                &lt;div class=&quot;results-count&quot; id=&quot;extract-count&quot;&gt;0 个Excel文件&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 加载指示器 --&gt;
        &lt;div class=&quot;loading&quot; id=&quot;loading-indicator&quot;&gt;
            &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
            &lt;p&gt;正在处理文件，请稍候...&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // 切换功能选项卡
        const functionTabs = document.querySelectorAll('.function-tab');
        const functionContents = document.querySelectorAll('.function-content');

        functionTabs.forEach(tab =&gt; {
            tab.addEventListener('click', () =&gt; {
                const functionId = tab.getAttribute('data-function');

                // 更新选项卡状态
                functionTabs.forEach(t =&gt; t.classList.remove('active'));
                tab.classList.add('active');

                // 更新内容显示
                functionContents.forEach(content =&gt; content.classList.remove('active'));
                document.getElementById(`${functionId}-function`).classList.add('active');
            });
        });

        // 显示/隐藏加载指示器
        function showLoading(show) {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (show) {
                loadingIndicator.classList.add('active');
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        // ==================== 批量创建Excel表功能 ====================
        // 存储从上传Excel文件中读取的表名
        let uploadedExcelNames = [];

        // 创建Excel表 - 文本输入变化时更新预览
        const createTextInput = document.querySelector('#create-text-input textarea');
        const createExcelPreview = document.getElementById('create-excel-preview');

        createTextInput.addEventListener('input', updateCreatePreview);

        function updateCreatePreview() {
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
            const allNames = [...textNames, ...uploadedExcelNames];

            if (allNames.length === 0) {
                createExcelPreview.innerHTML = `
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;客户信息表.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;销售数据统计.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;财务报告2024.xlsx&lt;/div&gt;
                    &lt;/div&gt;

            const excelFiles = Array.from(fileList).filter(file =&gt;
                file.name.match(/\.(xlsx|xls)$/)
            );

            if (excelFiles.length === 0) {
                extractFileList.innerHTML = '&lt;div class=&quot;file-item&quot;&gt;未找到Excel文件，请上传包含Excel文件的文件夹&lt;/div&gt;';
                extractCount.textContent = '0 个Excel文件';
                return;
            }

            // 显示文件列表
            excelFiles.forEach((file, index) =&gt; {
                extractFileList.innerHTML += `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 创建文件对象
                const fileObj = {
                    id: index + 1,
                    name: file.name,
                    size: file.size,
                    file: file
                };

                extractFilesData.push(fileObj);
            });

            // 提取名称到文本区域
            const names = extractFilesData.map(f =&gt; f.name);
            extractedNamesTextarea.value = names.join('\n');
            extractCount.textContent = `${extractFilesData.length} 个Excel文件`;
        }

        // 复制名称
        document.getElementById('copy-names-btn').addEventListener('click', function() {
            if (extractFilesData.length === 0) {
                alert('没有可复制的Excel表名称！');
                return;
            }

            extractedNamesTextarea.select();
            document.execCommand('copy');

            // 显示复制成功提示
            const originalText = this.innerHTML;
            this.innerHTML = '&lt;i class=&quot;fas fa-check&quot;&gt;&lt;/i&gt; 已复制';
            this.style.backgroundColor = '#28a745';

            setTimeout(() =&gt; {
                this.innerHTML = originalText;
                this.style.backgroundColor = '';
            }, 2000);
        });

        // 导出为Excel
        document.getElementById('export-excel-btn').addEventListener('click', function() {
            if (extractFilesData.length === 0) {
                alert('没有可导出的Excel表名称！');
                return;
            }

            // 创建工作簿
            const wb = XLSX.utils.book_new();

            // 创建工作表数据
            const wsData = [
                ['Excel表名称列表'],
                ['生成时间', new Date().toLocaleString()],
                ['文件数量', extractFilesData.length],
                [''],
                ['序号', '文件名', '文件大小(KB)']
            ];

            // 添加每个文件的数据
            extractFilesData.forEach((fileObj, index) =&gt; {
                wsData.push([
                    index + 1,
                    fileObj.name,
                    (fileObj.size / 1024).toFixed(2)
                ]);
            });

            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // 设置列宽
            const wscols = [
                {wch: 8},  // 序号
                {wch: 40}, // 文件名
                {wch: 15}  // 文件大小
            ];
            ws['!cols'] = wscols;

            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, &quot;Excel表列表&quot;);

            // 生成Excel文件并下载
            XLSX.writeFile(wb, 'Excel表名称列表.xlsx');

            alert('Excel文件已生成并下载！');
        });

        // 初始化预览
        updateCreatePreview();

    &lt;script&gt;
        // 默认初始示例
        const DEFAULT_ITEMS = [
            'src/',
            'src/index.js',
            'src/style.css',
            'index.html',
            'README.md',
            'config.json',
            'assets/images/'
        ];

        const textInput = document.querySelector('#create-text-input textarea');
        const previewContainer = document.getElementById('create-preview-list');
        const statsBadge = document.getElementById('preview-stats');
        textInput.value = DEFAULT_ITEMS.join('\n');

        // 切换输入方式
        const methodBtns = document.querySelectorAll('.method-btn');
        methodBtns.forEach(btn =&gt; {
            btn.addEventListener('click', () =&gt; {
                const method = btn.getAttribute('data-method');
                const parentSection = btn.closest('.input-section');

                parentSection.querySelectorAll('.method-btn').forEach(b =&gt; b.classList.remove('active'));
                btn.classList.add('active');

                const textInputDiv = parentSection.querySelector('.text-input');
                const excelUploadDiv = parentSection.querySelector('.file-upload');

                if (method === 'text') {
                    textInputDiv.classList.add('active');
                    excelUploadDiv.classList.remove('active');
                } else {
                    textInputDiv.classList.remove('active');
                    excelUploadDiv.classList.add('active');
                }
            });
        });

        // 判断项目是“文件”还是“文件夹”
        // 规则：
        // 1. 如果以 / 或 \ 结尾 =&gt; 文件夹
        // 2. 获取最后一节名称，如果包含 '.' 且不是以 '.' 开头隐藏文件（或有明确后缀）=&gt; 文件
        // 3. 否则 =&gt; 文件夹
        function parseItemType(rawPath) {
            let path = rawPath.replace(/\\/g, '/').trim();
            if (!path) return null;

            const isForceFolder = path.endsWith('/');
            const cleanPath = path.replace(/\/+$/, ''); // 去掉末尾斜杠
            const segments = cleanPath.split('/');
            const lastName = segments[segments.length - 1];

            // 检查末尾段是否包含合法扩展名
            // 匹配格式如：file.js, .eslintrc.json, style.min.css
            const hasExt = !isForceFolder &amp;&amp; /\.[a-zA-Z0-9_-]+$/.test(lastName);

            return {
                original: path,
                cleanPath: cleanPath,
                isFile: hasExt,
                ext: hasExt ? lastName.split('.').pop().toLowerCase() : ''
            };
        }

        // 根据文件扩展名返回对应的图标样式
        function getIconMeta(parsed) {
            if (!parsed.isFile) {
                return { iconClass: 'fas fa-folder item-icon folder-icon', typeText: '文件夹' };
            }

            const ext = parsed.ext;
            switch(ext) {
                case 'js':
                case 'mjs':
                case 'cjs':
                case 'ts':
                    return { iconClass: 'fa-brands fa-js item-icon code-icon', typeText: `${ext.toUpperCase()} 脚本` };
                case 'html':
                case 'htm':
                    return { iconClass: 'fa-brands fa-html5 item-icon web-icon', typeText: 'HTML 网页' };
                case 'css':
                case 'less':
                case 'scss':
                    return { iconClass: 'fa-brands fa-css3-alt item-icon style-icon', typeText: 'CSS 样式' };
                case 'json':
                case 'xml':
                case 'yaml':
                case 'yml':
                    return { iconClass: 'fas fa-code item-icon code-icon', typeText: `${ext.toUpperCase()} 数据` };
                case 'md':
                case 'txt':
                case 'log':
                    return { iconClass: 'fas fa-file-lines item-icon text-icon', typeText: '文本文档' };
                case 'png':
                case 'jpg':
                case 'jpeg':
                case 'gif':
                case 'svg':
                case 'webp':
                    return { iconClass: 'fas fa-file-image item-icon web-icon', typeText: '图片文件' };
                case 'xlsx':
                case 'xls':
                case 'csv':
                    return { iconClass: 'fas fa-file-excel item-icon data-icon', typeText: '表格文件' };
                case 'zip':
                case 'rar':
                case '7z':
                case 'tar':
                case 'gz':
                    return { iconClass: 'fas fa-file-zipper item-icon style-icon', typeText: '压缩包' };
                default:
                    return { iconClass: 'fas fa-file item-icon file-icon', typeText: `${ext ? ext.toUpperCase() + ' ' : ''}文件` };
            }
        }

        // 更新预览列表
        function updatePreview() {
            const lines = textInput.value.split('\n');
            const items = [];
            let folderCount = 0;
            let fileCount = 0;

            lines.forEach(line =&gt; {
                const parsed = parseItemType(line);
                if (parsed &amp;&amp; parsed.cleanPath) {
                    items.push(parsed);
                    if (parsed.isFile) fileCount++;
                    else folderCount++;
                }
            });

            statsBadge.textContent = `文件夹: ${folderCount} | 文件: ${fileCount}`;

            if (items.length === 0) {
                previewContainer.innerHTML = `&lt;div style=&quot;text-align:center; color:#999; padding: 20px;&quot;&gt;暂无解析内容，请在上方输入路径或上传文件&lt;/div&gt;`;
                return;
            }

            previewContainer.innerHTML = '';
            items.forEach(item =&gt; {
                const meta = getIconMeta(item);
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    &lt;i class=&quot;${meta.iconClass}&quot;&gt;&lt;/i&gt;
                    &lt;div class=&quot;item-name&quot;&gt;${item.cleanPath}&lt;/div&gt;
                    &lt;span class=&quot;item-type-tag&quot;&gt;${meta.typeText}&lt;/span&gt;
                `;
                previewContainer.appendChild(row);
            });
        }

        textInput.addEventListener('input', updatePreview);

        // Excel 上传逻辑
        const browseBtn = document.getElementById('create-browse-btn');
        const excelFileInput = document.getElementById('create-excel-file');
        const fileListDiv = document.getElementById('create-file-list');

        browseBtn.addEventListener('click', () =&gt; excelFileInput.click());

        excelFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileListDiv.style.display = 'block';
            fileListDiv.innerHTML = `
                &lt;div class=&quot;file-item&quot;&gt;
                    &lt;i class=&quot;fas fa-file-excel&quot; style=&quot;color:#2e7d32&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(1)} KB)&lt;/span&gt;
                &lt;/div&gt;
            `;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                    const parsedNames = [];
                    for (let i = 1; i &lt; sheetData.length; i++) {
                        const row = sheetData[i];
                        if (row &amp;&amp; row[0] !== undefined &amp;&amp; String(row[0]).trim() !== '') {
                            parsedNames.push(String(row[0]).trim());
                        }
                    }

                    if (parsedNames.length &gt; 0) {
                        textInput.value = parsedNames.join('\n');
                        updatePreview();
                        alert(`成功读取 ${parsedNames.length} 个项目！`);
                    } else {
                        alert('Excel 第一列中未找到有效名称，请检查数据！');
                    }
                } catch (err) {
                    console.error('解析 Excel 失败:', err);
                    alert('Excel 解析失败，请确认文件格式正确。');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // 下载 Excel 模板
        document.getElementById('create-template-download').addEventListener('click', function(e) {
            e.preventDefault();
            const data = [
                ['文件或文件夹名称'],
                ['src/'],
                ['src/index.js'],
                ['src/style.css'],
                ['index.html'],
                ['README.md'],
                ['docs/用户手册.docx'],
                ['config.json']
            ];

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '项目清单');
            XLSX.writeFile(wb, '批量创建模板.xlsx');
        });

        // 清空按钮
        document.getElementById('create-clear-btn').addEventListener('click', function() {
            textInput.value = '';
            fileListDiv.style.display = 'none';
            fileListDiv.innerHTML = '';
            excelFileInput.value = '';
            updatePreview();
        });

        // 打包下载 ZIP
        function showLoading(show) {
            const indicator = document.getElementById('loading-indicator');
            indicator.classList.toggle('active', show);
        }

        document.getElementById('create-execute-btn').addEventListener('click', async function() {
            const lines = textInput.value.split('\n');
            const validItems = [];

            lines.forEach(line =&gt; {
                const parsed = parseItemType(line);
                if (parsed &amp;&amp; parsed.cleanPath) {
                    validItems.push(parsed);
                }
            });

            if (validItems.length === 0) {
                alert('请先输入要创建的文件或文件夹名称！');
                return;
            }

            showLoading(true);

            try {
                const zip = new JSZip();

                validItems.forEach(item =&gt; {
                    if (item.isFile) {
                        // JSZip 创建文件：如果是 'a/b/index.js'，JSZip 会自动创建对应父层目录
                        zip.file(item.cleanPath, &quot;&quot;);
                    } else {
                        // 创建文件夹
                        zip.folder(item.cleanPath);
                    }
                });

                const content = await zip.generateAsync({ type: &quot;blob&quot; });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `批量生成结构_${new Date().getTime().toString().slice(-6)}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            } catch (error) {
                console.error('打包生成失败:', error);
                alert('创建 ZIP 过程中出现异常，请检查名称是否包含非法路径字符。');
            } finally {
                showLoading(false);
            }
        });

        // 页面初始化
        updatePreview();

        function loadDemoData() {
            rawData = JSON.parse(JSON.stringify(DEMO_DATASET));
            headers = Object.keys(rawData[0]);
            initConfigUI();

            document.getElementById('cardStep1').style.display = 'none';
            document.getElementById('cardStep2').style.display = 'block';

            setTagActive('fixedContainer', '品类');
            setTagActive('analysisContainer', '颜色');
            setTagActive('analysisContainer', '材质');
            setTagActive('analysisContainer', '风格');

            document.getElementById('pivotSelect').value = '季度';
            document.getElementById('valueSelect').value = '销量';
            document.getElementById('aggSum').checked = true;

            document.getElementById('btnAnalyze').click();
        }

        function setTagActive(containerId, tagText) {
            const tag = Array.from(document.querySelectorAll(`#${containerId} .custom-tag`)).find(t =&gt; t.dataset.v === tagText);
            if(tag &amp;&amp; !tag.classList.contains('active')) {
                tag.click();
            }
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('loader');

        dropZone.onclick = () =&gt; fileInput.click();
        dropZone.ondragover = (e) =&gt; { e.preventDefault(); dropZone.style.borderColor = 'var(--primary-color)'; dropZone.style.background = '#eef2ff'; };
        dropZone.ondragleave = (e) =&gt; { e.preventDefault(); dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafafa'; };
        dropZone.ondrop = (e) =&gt; {
            e.preventDefault();
            dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafafa';
            if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) =&gt; { if(e.target.files[0]) handleFile(e.target.files[0]); };

        function handleFile(file) {
            document.getElementById('uploadContent').style.display = 'none';
            loader.style.display = 'block';
            const reader = new FileReader();
            reader.onload = (e) =&gt; {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                    rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: &quot;&quot;});
                    if (rawData.length &gt; 0) {
                        headers = Object.keys(rawData[0]);
                        initConfigUI();
                        document.getElementById('cardStep1').style.display = 'none';
                        document.getElementById('cardStep2').style.display = 'block';
                    } else { alert(&quot;Excel文件为空！&quot;); resetUpload(); }
                } catch (err) { alert(&quot;文件读取失败，请确保格式正确&quot;); resetUpload(); }
            };
            reader.readAsArrayBuffer(file);
        }

        function resetUpload() {
            loader.style.display = 'none';
            document.getElementById('uploadContent').style.display = 'block';
        }

        function initConfigUI() {
            const addTag = (id, txt) =&gt; {
                const t = document.createElement('div');
                t.className = 'custom-tag';
                t.innerHTML = `&lt;i class=&quot;bi bi-tag text-secondary&quot;&gt;&lt;/i&gt; ${txt}`;
                t.dataset.v = txt;
                t.onclick = function() {
                    this.classList.toggle('active');
                    this.querySelector('i').className = this.classList.contains('active') ? 'bi bi-check-circle-fill' : 'bi bi-tag text-secondary';
                };
                document.getElementById(id).appendChild(t);
            };
            document.getElementById('fixedContainer').innerHTML = '';
            document.getElementById('analysisContainer').innerHTML = '';
            const pSel = document.getElementById('pivotSelect'); pSel.innerHTML = '';
            const vSel = document.getElementById('valueSelect'); vSel.innerHTML = '';
            headers.forEach(h =&gt; {
                addTag('fixedContainer', h);
                addTag('analysisContainer', h);
                pSel.add(new Option(h, h));
                vSel.add(new Option(h, h));
            });
        }

        document.getElementById('btnAnalyze').addEventListener('click', () =&gt; {
            const getTags = (id) =&gt; Array.from(document.querySelectorAll(`#${id} .custom-tag.active`)).map(e =&gt; e.dataset.v);
            const fixedDims = getTags('fixedContainer');
            const analysisDims = getTags('analysisContainer');
            const pivotCol = document.getElementById('pivotSelect').value;
            const valueCol = document.getElementById('valueSelect').value || pivotCol;
            const agg = document.querySelector('input[name=&quot;agg&quot;]:checked').value;

            if (!analysisDims.length) { alert(&quot;请在【分析维度】中至少选择一个属性！&quot;); return; }
            if (!pivotCol) { alert(&quot;请选择【透视列】！&quot;); return; }

            const pHeaders = Array.from(new Set(rawData.map(r =&gt; r[pivotCol] !== undefined ? String(r[pivotCol]) : &quot;(空)&quot;))).sort();

            let tempMatrix = [];
            let tempProcess = [];
            let grandTotal = 0;
            let championCount = 0;
            gMaxPivotVal = 1;

            analysisDims.forEach(targetDim =&gt; {
                const aggMap = new Map();
                rawData.forEach(row =&gt; {
                    const fixedValues = fixedDims.map(d =&gt; row[d] !== undefined ? row[d] : '');
                    const uniqueKey = [...fixedValues, targetDim, row[targetDim]].join('|||');
                    if(!aggMap.has(uniqueKey)) aggMap.set(uniqueKey, { meta: row, rows: [] });
                    aggMap.get(uniqueKey).rows.push(row);
                });

                const dimRows = [];
                aggMap.forEach((gData) =&gt; {
                    const mRow = {};
                    mRow['分析维度'] = targetDim;
                    fixedDims.forEach(d =&gt; mRow[d] = gData.meta[d]);
                    mRow['属性值'] = gData.meta[targetDim];

                    let total = 0;
                    pHeaders.forEach(ph =&gt; {
                        const sub = gData.rows.filter(r =&gt; String(r[pivotCol]!==undefined?r[pivotCol]:&quot;(空)&quot;) === ph);
                        let val = 0;
                        if(agg==='COUNT') val = sub.length;
                        else val = sub.reduce((s,r) =&gt; s+(parseFloat(r[valueCol])||0), 0);

                        mRow[ph] = val;
                        total += val;
                        if(val &gt; gMaxPivotVal) gMaxPivotVal = val;

                        if(val &gt; 0) {
                            const pRow = {};
                            pRow['分析维度'] = targetDim;
                            fixedDims.forEach(d =&gt; pRow[d] = gData.meta[d]);
                            pRow['属性值'] = gData.meta[targetDim];
                            pRow[pivotCol] = ph;
                            pRow['指标值'] = val;
                            tempProcess.push(pRow);
                        }
                    });
                    mRow['总计'] = total;
                    grandTotal += total;
                    mRow._groupKey = fixedDims.map(d =&gt; gData.meta[d]).join('|||');
                    dimRows.push(mRow);
                });

                const buckets = {};
                dimRows.forEach(r =&gt; {
                    if(!buckets[r._groupKey]) buckets[r._groupKey] = [];
                    buckets[r._groupKey].push(r);
                });

                Object.values(buckets).forEach(arr =&gt; {
                    arr.sort((a,b) =&gt; b['总计'] - a['总计']);
                    if(arr.length &amp;&amp; arr[0]['总计'] &gt; 0) {
                        arr[0]._isChampion = true;
                        championCount++;
                    }
                    tempMatrix.push(...arr);
                });
            });

            gMatrixData = tempMatrix;
            gProcessData = tempProcess;
            gFixedDims = fixedDims;
            gMatrixCols = ['分析维度', ...fixedDims, '属性值', ...pHeaders, '总计'];

            document.getElementById('statRawCount').innerText = rawData.length.toLocaleString();
            document.getElementById('statGroupCount').innerText = new Set(tempMatrix.map(r=&gt;r._groupKey)).size;
            document.getElementById('statChampionCount').innerText = championCount;
            document.getElementById('statTotalValue').innerText = Math.round(grandTotal).toLocaleString();

            renderMatrix(gMatrixData);
            renderProcess(gProcessData);
            initFilters();

            document.getElementById('cardStep3').style.display = 'block';
            document.getElementById('cardStep3').scrollIntoView({behavior:'smooth'});
        });

        // 页面表格渲染
        function renderMatrix(data) {
            const th = document.querySelector('#matrixTable thead');
            th.innerHTML = `&lt;tr&gt;${gMatrixCols.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join('')}&lt;/tr&gt;`;
            const tb = document.querySelector('#matrixTable tbody');
            tb.innerHTML = '';

            const mergeCols = ['分析维度', ...gFixedDims];
            const spanMap = {};

            mergeCols.forEach((col, colIdx) =&gt; {
                let startRow = 0;
                for (let i = 1; i &lt;= data.length; i++) {
                    let isDiff = false;
                    if (i === data.length) {
                        isDiff = true;
                    } else {
                        if (data[i][col] !== data[startRow][col]) isDiff = true;
                        for (let p = 0; p &lt; colIdx; p++) {
                            const parentCol = mergeCols[p];
                            if (data[i][parentCol] !== data[startRow][parentCol]) {
                                isDiff = true;
                                break;
                            }
                        }
                    }

                    if (isDiff) {
                        const span = i - startRow;
                        spanMap[`${startRow}-${col}`] = span;
                        for (let k = startRow + 1; k &lt; i; k++) {
                            spanMap[`${k}-${col}`] = 0;
                        }
                        startRow = i;
                    }
                }
            });

            data.forEach((r, rowIndex) =&gt; {
                const tr = document.createElement('tr');
                if(r._isChampion) tr.className = 'row-champion';

                gMatrixCols.forEach(col =&gt; {
                    if (mergeCols.includes(col)) {
                        const span = spanMap[`${rowIndex}-${col}`];
                        if (span === 0) return;

                        const td = document.createElement('td');
                        if (span &gt; 1) td.rowSpan = span;
                        td.className = 'merged-cell';

                        let v = r[col] !== undefined ? r[col] : '';
                        td.innerHTML = `&lt;div class=&quot;sticky-wrapper&quot;&gt;${v}&lt;/div&gt;`;
                        tr.appendChild(td);

                    } else if (col === '属性值') {
                        const td = document.createElement('td');
                        let content = r[col];
                        if(r._isChampion) {
                            content += ` &lt;span class=&quot;champion-badge&quot;&gt;&lt;i class=&quot;bi bi-trophy-fill&quot;&gt;&lt;/i&gt; TOP 1&lt;/span&gt;`;
                        }
                        td.innerHTML = content;
                        tr.appendChild(td);
                    } else {
                        const td = document.createElement('td');
                        let v = r[col] !== undefined ? r[col] : 0;

                        if(typeof v === 'number') {
                            const percent = Math.min(100, Math.round((v / gMaxPivotVal) * 100));
                            td.innerHTML = `
                                &lt;div class=&quot;cell-value-wrapper&quot;&gt;
                                    ${v &gt; 0 ? `&lt;div class=&quot;cell-data-bar&quot; style=&quot;width: ${percent}%;&quot;&gt;&lt;/div&gt;` : ''}
                                    &lt;span style=&quot;${v === 0 ? 'color: #cbd5e1;' : 'font-weight: 500;'}&quot;&gt;${v.toLocaleString()}&lt;/span&gt;
                                &lt;/div&gt;
                            `;
                        } else {
                            td.innerText = v;
                        }
                        tr.appendChild(td);
                    }
                });
                tb.appendChild(tr);
            });
        }

        function renderProcess(data) {
            const pCol = document.getElementById('pivotSelect').value;
            const cols = ['分析维度', ...gFixedDims, '属性值', pCol, '指标值'];
            const th = document.querySelector('#processTable thead');
            th.innerHTML = `&lt;tr&gt;${cols.map(c=&gt;`&lt;th&gt;${c}&lt;/th&gt;`).join('')}&lt;/tr&gt;`;
            const tb = document.querySelector('#processTable tbody');
            tb.innerHTML = '';
            data.slice(0, 1000).forEach(r =&gt; {
                const tr = document.createElement('tr');
                cols.forEach(c =&gt; {
                    const td = document.createElement('td');
                    td.innerText = typeof r[c] === 'number' ? r[c].toLocaleString() : r[c];
                    tr.appendChild(td);
                });
                tb.appendChild(tr);
            });
        }

        function initFilters() {
            const bar = document.getElementById('filterToolbar');
            bar.innerHTML = '&lt;span class=&quot;small fw-bold text-muted me-2&quot;&gt;&lt;i class=&quot;bi bi-funnel-fill&quot;&gt;&lt;/i&gt; 快速筛选:&lt;/span&gt;';
            ['分析维度', ...gFixedDims].forEach(k =&gt; {
                const vals = Array.from(new Set(gMatrixData.map(r=&gt;r[k]))).sort();
                const sel = document.createElement('select');
                sel.className = 'form-select form-select-sm border-secondary border-opacity-25';
                sel.style.width='auto'; sel.style.display='inline-block';
                sel.dataset.k = k;
                sel.innerHTML = `&lt;option value=&quot;&quot;&gt;全部 ${k}&lt;/option&gt;`;
                vals.forEach(v =&gt; sel.add(new Option(v,v)));
                sel.onchange = () =&gt; {
                    let d = gMatrixData;
                    document.querySelectorAll('#filterToolbar select').forEach(s =&gt; {
                        if(s.value) d = d.filter(r =&gt; r[s.dataset.k] === s.value);
                    });
                    renderMatrix(d);
                };
                bar.appendChild(sel);
            });
        }

        // ========================================================
        // 💎 核心升级：导出 100% 还原网页视觉的高颜值 Excel
        // ========================================================
        function exportToExcel() {
            try {
                if (!gMatrixData || !gMatrixData.length) {
                    alert(&quot;暂无可导出的数据，请先生成分析报表！&quot;);
                    return;
                }

                const wb = XLSX.utils.book_new();

                // 1. 准备透视表二维数组
                const excelRows = [];
                // 表头
                excelRows.push(gMatrixCols);

                // 数据行
                gMatrixData.forEach(r =&gt; {
                    const rowData = [];
                    gMatrixCols.forEach(col =&gt; {
                        let val = r[col] !== undefined ? r[col] : '';
                        if (col === '属性值' &amp;&amp; r._isChampion) {
                            val = `${val} 👑 TOP 1`; // 导出时也保留冠军标志
                        }
                        rowData.push(val);
                    });
                    excelRows.push(rowData);
                });

                const ws1 = XLSX.utils.aoa_to_sheet(excelRows);

                // 2. 计算并注入【单元格合并】
                const mergeCols = ['分析维度', ...gFixedDims];
                const merges = [];

                mergeCols.forEach((col) =&gt; {
                    const colIdx = gMatrixCols.indexOf(col);
                    if (colIdx === -1) return;

                    let startRow = 0;
                    for (let i = 1; i &lt;= gMatrixData.length; i++) {
                        let isDiff = false;
                        if (i === gMatrixData.length) {
                            isDiff = true;
                        } else {
                            if (gMatrixData[i][col] !== gMatrixData[startRow][col]) isDiff = true;
                            for (let p = 0; p &lt; mergeCols.indexOf(col); p++) {
                                const parentCol = mergeCols[p];
                                if (gMatrixData[i][parentCol] !== gMatrixData[startRow][parentCol]) {
                                    isDiff = true;
                                    break;
                                }
                            }
                        }

                        if (isDiff) {
                            const span = i - startRow;
                            if (span &gt; 1) {
                                // r: 1-based (加上表头第0行)
                                merges.push({
                                    s: { r: startRow + 1, c: colIdx },
                                    e: { r: startRow + span, c: colIdx }
                                });
                            }
                            startRow = i;
                        }
                    }
                });
                ws1['!merges'] = merges;

                // 3. 样式定义
                const styleHeader = {
                    fill: { fgColor: { rgb: &quot;F1F5F9&quot; } },
                    font: { bold: true, color: { rgb: &quot;1E293B&quot; }, sz: 11 },
                    alignment: { horizontal: &quot;center&quot;, vertical: &quot;center&quot;, wrapText: true },
                    border: {
                        top: { style: &quot;thin&quot;, color: { rgb: &quot;CBD5E1&quot; } },
                        bottom: { style: &quot;medium&quot;, color: { rgb: &quot;94A3B8&quot; } },
                        left: { style: &quot;thin&quot;, color: { rgb: &quot;CBD5E1&quot; } },
                        right: { style: &quot;thin&quot;, color: { rgb: &quot;CBD5E1&quot; } }
                    }
                };

                const styleChampion = {
                    fill: { fgColor: { rgb: &quot;FEF3C7&quot; } }, // 淡金黄色
                    font: { bold: true, color: { rgb: &quot;92400E&quot; }, sz: 10 },
                    alignment: { horizontal: &quot;center&quot;, vertical: &quot;center&quot; },
                    border: {
                        top: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } },
                        bottom: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } },
                        left: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } },
                        right: { style: &quot;thin&quot;, color: { rgb: &quot;FCD34D&quot; } }
                    }
                };

                const styleNormal = {
                    fill: { fgColor: { rgb: &quot;FFFFFF&quot; } },
                    font: { color: { rgb: &quot;334155&quot; }, sz: 10 },
                    alignment: { horizontal: &quot;center&quot;, vertical: &quot;center&quot; },
                    border: {
                        top: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } },
                        bottom: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } },
                        left: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } },
                        right: { style: &quot;thin&quot;, color: { rgb: &quot;E2E8F0&quot; } }
                    }
                };

                const styleZero = {
                    ...styleNormal,
                    font: { color: { rgb: &quot;94A3B8&quot; }, sz: 10 }
                };

                // 4. 为每个单元格应用样式
                const range = XLSX.utils.decode_range(ws1['!ref']);
                for (let R = range.s.r; R &lt;= range.e.r; ++R) {
                    for (let C = range.s.c; C &lt;= range.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws1[cellAddress]) {
                            ws1[cellAddress] = { t: 's', v: '' };
                        }
                        const cell = ws1[cellAddress];

                        if (R === 0) {
                            // 表头
                            cell.s = styleHeader;
                        } else {
                            // 数据行
                            const rowDataObj = gMatrixData[R - 1];
                            const isChamp = rowDataObj &amp;&amp; rowDataObj._isChampion;
                            const isValZero = (typeof cell.v === 'number' &amp;&amp; cell.v === 0);

                            if (isChamp) {
                                cell.s = styleChampion;
                            } else if (isValZero) {
                                cell.s = styleZero;
                            } else {
                                cell.s = styleNormal;
                            }
                        }
                    }
                }

                // 5. 自动计算列宽
                const colWidths = gMatrixCols.map((col, idx) =&gt; {
                    let maxLen = col.length * 2.2;
                    gMatrixData.forEach(r =&gt; {
                        const str = String(r[col] || '');
                        if (str.length * 1.5 &gt; maxLen) maxLen = str.length * 1.5;
                    });
                    return { wch: Math.max(12, Math.min(30, Math.ceil(maxLen + 4))) };
                });
                ws1['!cols'] = colWidths;

                // 6. 添加透视 Sheet
                XLSX.utils.book_append_sheet(wb, ws1, &quot;透视分析总表&quot;);

                // 7. 处理并美化过程明细 Sheet
                const pCol = document.getElementById('pivotSelect').value;
                const pCols = ['分析维度', ...gFixedDims, '属性值', pCol, '指标值'];
                const ws2Rows = [pCols];
                gProcessData.forEach(r =&gt; {
                    ws2Rows.push(pCols.map(c =&gt; r[c] !== undefined ? r[c] : ''));
                });
                const ws2 = XLSX.utils.aoa_to_sheet(ws2Rows);

                // 美化明细表
                const range2 = XLSX.utils.decode_range(ws2['!ref']);
                for (let R = range2.s.r; R &lt;= range2.e.r; ++R) {
                    for (let C = range2.s.c; C &lt;= range2.e.c; ++C) {
                        const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws2[cellAddress]) ws2[cellAddress] = { t: 's', v: '' };
                        ws2[cellAddress].s = (R === 0) ? styleHeader : styleNormal;
                    }
                }
                ws2['!cols'] = pCols.map(c =&gt; ({ wch: Math.max(14, c.length * 2 + 4) }));
                XLSX.utils.book_append_sheet(wb, ws2, &quot;过程聚合明细&quot;);

                // 8. 导出下载
                XLSX.writeFile(wb, &quot;智能属性透视分析报告(带样式).xlsx&quot;);

            } catch (err) {
                console.error(&quot;导出 Excel 出现错误:&quot;, err);
                alert(&quot;导出失败：&quot; + err.message);
            }
        }
    &lt;/script&gt;
&lt;/body&gt;

                        &lt;th&gt;新后缀&lt;/th&gt;
