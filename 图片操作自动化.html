                &lt;button class=&quot;action-btn primary-btn&quot; id=&quot;create-execute-btn&quot;&gt;
                    &lt;i class=&quot;fas fa-play-circle&quot;&gt;&lt;/i&gt; 执行批量创建
                &lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 批量重命名Excel表功能 --&gt;
        &lt;div class=&quot;function-content&quot; id=&quot;rename-function&quot;&gt;
            &lt;div class=&quot;input-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-upload&quot;&gt;&lt;/i&gt; 上传Excel文件夹&lt;/h3&gt;

                &lt;div class=&quot;input-method-selector&quot;&gt;
                    &lt;div class=&quot;method-btn active&quot; data-method=&quot;folder&quot;&gt;上传文件夹&lt;/div&gt;
                    &lt;div class=&quot;method-btn&quot; data-method=&quot;mapping&quot;&gt;上传映射Excel&lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 文件夹上传区域 --&gt;
                &lt;div class=&quot;input-area folder-upload active&quot; id=&quot;rename-folder-upload&quot;&gt;
                    &lt;div class=&quot;file-upload&quot; id=&quot;rename-upload-area&quot;&gt;
                        &lt;i class=&quot;fas fa-folder-open&quot;&gt;&lt;/i&gt;
                        &lt;p&gt;点击或拖拽包含Excel文件的文件夹到此区域上传&lt;/p&gt;
                        &lt;input type=&quot;file&quot; id=&quot;rename-file-input&quot; webkitdirectory multiple accept=&quot;.xlsx,.xls&quot; style=&quot;display: none;&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;rename-browse-btn&quot;&gt;选择文件夹&lt;/button&gt;
                        &lt;div class=&quot;file-list&quot; id=&quot;rename-file-list&quot;&gt;&lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 映射Excel上传区域 --&gt;
                &lt;div class=&quot;input-area mapping-excel-upload&quot; id=&quot;rename-mapping-upload&quot; style=&quot;display: none;&quot;&gt;
                    &lt;div class=&quot;file-upload&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;p&gt;上传包含原文件名和新文件名映射关系的Excel文件&lt;/p&gt;
                        &lt;input type=&quot;file&quot; id=&quot;rename-mapping-file&quot; accept=&quot;.xlsx, .xls&quot; style=&quot;display: none;&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;rename-mapping-browse-btn&quot;&gt;选择映射Excel文件&lt;/button&gt;
                        &lt;div class=&quot;hint&quot;&gt;
                            &lt;i class=&quot;fas fa-info-circle&quot;&gt;&lt;/i&gt; Excel文件应包含两列：原文件名、新文件名
                        &lt;/div&gt;
                        &lt;a href=&quot;#&quot; class=&quot;template-download&quot; id=&quot;rename-template-download&quot;&gt;
                            &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 下载映射模板
                        &lt;/a&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;rename-controls&quot;&gt;
                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;重命名模式：&lt;/label&gt;
                    &lt;select id=&quot;rename-pattern&quot;&gt;
                        &lt;option value=&quot;custom&quot;&gt;自定义命名&lt;/option&gt;
                        &lt;option value=&quot;sequential&quot;&gt;顺序编号 (文件1, 文件2, ...)&lt;/option&gt;
                        &lt;option value=&quot;date&quot;&gt;日期+序号 (2024-01-01_1, 2024-01-01_2, ...)&lt;/option&gt;
                        &lt;option value=&quot;replace&quot;&gt;查找替换&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;起始编号：&lt;/label&gt;
                    &lt;input type=&quot;number&quot; id=&quot;rename-start-number&quot; value=&quot;1&quot; min=&quot;1&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;新文件名前缀：&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;rename-prefix&quot; placeholder=&quot;例如: 报告_&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot; id=&quot;replace-controls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;label&gt;查找内容：&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;rename-find&quot; placeholder=&quot;要查找的文本&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot; id=&quot;replace-with-controls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;label&gt;替换为：&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;rename-replace&quot; placeholder=&quot;替换后的文本&quot;&gt;
                &lt;/div&gt;

                &lt;div class=&quot;control-group&quot;&gt;
                    &lt;label&gt;&amp;nbsp;&lt;/label&gt;
                    &lt;button class=&quot;upload-btn&quot; id=&quot;apply-rename-btn&quot; style=&quot;width: 100%;&quot;&gt;应用重命名规则&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;preview-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-list&quot;&gt;&lt;/i&gt; Excel文件列表&lt;/h3&gt;
                &lt;div class=&quot;excel-preview&quot;&gt;
                    &lt;table class=&quot;excel-table&quot; id=&quot;rename-table&quot;&gt;
                        &lt;thead&gt;
                            &lt;tr&gt;
                                &lt;th&gt;序号&lt;/th&gt;
                                &lt;th&gt;原始文件名&lt;/th&gt;
                                &lt;th&gt;新文件名&lt;/th&gt;
                                &lt;th&gt;操作&lt;/th&gt;
                            &lt;/tr&gt;
                        &lt;/thead&gt;
                        &lt;tbody id=&quot;rename-table-body&quot;&gt;
                            &lt;!-- Excel文件将通过JavaScript动态添加 --&gt;
                        &lt;/tbody&gt;
                    &lt;/table&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;actions&quot;&gt;
                &lt;button class=&quot;action-btn secondary-btn&quot; id=&quot;rename-clear-btn&quot;&gt;
                    &lt;i class=&quot;fas fa-eraser&quot;&gt;&lt;/i&gt; 重置
                &lt;/button&gt;
                &lt;button class=&quot;action-btn primary-btn&quot; id=&quot;rename-execute-btn&quot; disabled&gt;
                    &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 下载重命名后的文件
                &lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 提取Excel表名称功能 --&gt;
        &lt;div class=&quot;function-content&quot; id=&quot;extract-function&quot;&gt;
            &lt;div class=&quot;input-section&quot;&gt;
                &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-upload&quot;&gt;&lt;/i&gt; 上传Excel文件夹&lt;/h3&gt;

                &lt;div class=&quot;file-upload&quot; id=&quot;extract-upload-area&quot;&gt;
                    &lt;i class=&quot;fas fa-folder-open&quot;&gt;&lt;/i&gt;
                    &lt;p&gt;点击或拖拽包含Excel文件的文件夹到此区域上传&lt;/p&gt;
                    &lt;input type=&quot;file&quot; id=&quot;extract-file-input&quot; webkitdirectory multiple accept=&quot;.xlsx,.xls&quot; style=&quot;display: none;&quot;&gt;
                    &lt;button class=&quot;upload-btn&quot; id=&quot;extract-browse-btn&quot;&gt;选择文件夹&lt;/button&gt;
                    &lt;div class=&quot;file-list&quot; id=&quot;extract-file-list&quot;&gt;&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;results-section&quot;&gt;
                &lt;div class=&quot;results-header&quot;&gt;
                    &lt;h3 class=&quot;section-title&quot;&gt;&lt;i class=&quot;fas fa-file-alt&quot;&gt;&lt;/i&gt; 提取的Excel表名称&lt;/h3&gt;
                    &lt;div class=&quot;results-actions&quot;&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;copy-names-btn&quot;&gt;
                            &lt;i class=&quot;fas fa-copy&quot;&gt;&lt;/i&gt; 复制名称
                        &lt;/button&gt;
                        &lt;button class=&quot;upload-btn&quot; id=&quot;export-excel-btn&quot;&gt;
                            &lt;i class=&quot;fas fa-download&quot;&gt;&lt;/i&gt; 导出为Excel
                        &lt;/button&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;textarea class=&quot;results-textarea&quot; id=&quot;extracted-names&quot; placeholder=&quot;Excel表名称将显示在这里，每行一个...&quot;&gt;&lt;/textarea&gt;
                &lt;div class=&quot;results-count&quot; id=&quot;extract-count&quot;&gt;0 个Excel文件&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 加载指示器 --&gt;
        &lt;div class=&quot;loading&quot; id=&quot;loading-indicator&quot;&gt;
            &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
            &lt;p&gt;正在处理文件，请稍候...&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // 切换功能选项卡
        const functionTabs = document.querySelectorAll('.function-tab');
        const functionContents = document.querySelectorAll('.function-content');

        functionTabs.forEach(tab =&gt; {
            tab.addEventListener('click', () =&gt; {
                const functionId = tab.getAttribute('data-function');

                // 更新选项卡状态
                functionTabs.forEach(t =&gt; t.classList.remove('active'));
                tab.classList.add('active');

                // 更新内容显示
                functionContents.forEach(content =&gt; content.classList.remove('active'));
                document.getElementById(`${functionId}-function`).classList.add('active');
            });
        });

        // 显示/隐藏加载指示器
        function showLoading(show) {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (show) {
                loadingIndicator.classList.add('active');
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        // ==================== 批量创建Excel表功能 ====================
        // 存储从上传Excel文件中读取的表名
        let uploadedExcelNames = [];

        // 创建Excel表 - 文本输入变化时更新预览
        const createTextInput = document.querySelector('#create-text-input textarea');
        const createExcelPreview = document.getElementById('create-excel-preview');

        createTextInput.addEventListener('input', updateCreatePreview);

        function updateCreatePreview() {
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
            const allNames = [...textNames, ...uploadedExcelNames];

            if (allNames.length === 0) {
                createExcelPreview.innerHTML = `
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;客户信息表.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;销售数据统计.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;财务报告2024.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;excel-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;div class=&quot;excel-name&quot;&gt;员工档案.xlsx&lt;/div&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            createExcelPreview.innerHTML = '';
            allNames.forEach(name =&gt; {
                const excelItem = document.createElement('div');
                excelItem.className = 'excel-item';
                // 确保文件名以.xlsx结尾
                const fileName = name.trim().endsWith('.xlsx') || name.trim().endsWith('.xls') ? name.trim() : name.trim() + '.xlsx';
                excelItem.innerHTML = `
                    &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                    &lt;div class=&quot;excel-name&quot;&gt;${fileName}&lt;/div&gt;
                `;
                createExcelPreview.appendChild(excelItem);
            });
        }

        // 创建Excel表 - Excel上传
        const createBrowseBtn = document.getElementById('create-browse-btn');
        const createExcelFile = document.getElementById('create-excel-file');
        const createFileList = document.getElementById('create-file-list');

        createBrowseBtn.addEventListener('click', () =&gt; {
            createExcelFile.click();
        });

        createExcelFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                createFileList.innerHTML = `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 使用 SheetJS 解析 Excel 文件
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                        // 处理数据（假设第一列是Excel表名称）
                        const excelNames = [];
                        for (let i = 1; i &lt; sheetData.length; i++) {
                            const row = sheetData[i];
                            if (row &amp;&amp; row[0]) {
                                excelNames.push(row[0].toString());
                            }
                        }

                        // 保存上传的Excel表名
                        uploadedExcelNames = excelNames;

                        // 更新预览
                        updateCreatePreview();

                        alert(`成功从Excel文件读取 ${excelNames.length} 个Excel表名称！`);
                    } catch (error) {
                        console.error('解析Excel文件时出错:', error);
                        alert('解析Excel文件时出错，请确保文件格式正确且第一列包含Excel表名称。');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 创建Excel表 - 下载模板（包含上传文件中的表名）
        document.getElementById('create-template-download').addEventListener('click', function(e) {
            e.preventDefault();

            // 获取文本框中的表名
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');

            // 合并文本框中的表名和上传Excel中的表名
            const allNames = [...textNames, ...uploadedExcelNames];

            // 构建模板数据
            const data = [['Excel表名称']];

            if (allNames.length &gt; 0) {
                allNames.forEach(name =&gt; {
                    data.push([name]);
                });
            } else {
                // 默认模板数据
                data.push(['客户信息表']);
                data.push(['销售数据统计']);
                data.push(['财务报告2024']);
                data.push(['员工档案']);
            }

            // 使用 SheetJS 创建工作簿
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Excel表列表');

            // 导出为 .xlsx 文件
            XLSX.writeFile(wb, 'Excel表创建模板.xlsx');
        });

        // 创建Excel表 - 清空按钮
        document.getElementById('create-clear-btn').addEventListener('click', function() {
            createTextInput.value = '';
            createFileList.innerHTML = '';
            createExcelFile.value = '';
            uploadedExcelNames = [];
            updateCreatePreview();
        });

        // 创建Excel表 - 执行按钮
        document.getElementById('create-execute-btn').addEventListener('click', async function() {
            const textNames = createTextInput.value.split('\n').filter(name =&gt; name.trim() !== '');
            const allNames = [...textNames, ...uploadedExcelNames];

            if (allNames.length === 0) {
                alert('请先输入要创建的Excel表名称！');
                return;
            }

            showLoading(true);

            try {
                // 使用 JSZip 创建包含多个Excel文件的ZIP
                const zip = new JSZip();

                // 为每个Excel表名称创建一个简单的Excel文件
                for (const excelName of allNames) {
                    // 确保文件名以.xlsx结尾
                    const fileName = excelName.trim().endsWith('.xlsx') || excelName.trim().endsWith('.xls') ?
                        excelName.trim() : excelName.trim() + '.xlsx';

                    // 创建一个简单的工作表
                    const worksheetData = [
                        ['这是自动生成的Excel文件'],
                        ['文件名', fileName],
                        ['生成时间', new Date().toLocaleString()],
                        ['', ''],
                        ['列1', '列2', '列3'],
                        ['数据1', '数据2', '数据3'],
                        ['数据4', '数据5', '数据6']
                    ];

                    const worksheet = XLSX.utils.aoa_to_sheet(worksheetData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');

                    // 将工作簿转换为二进制数据
                    const excelData = XLSX.write(workbook, {type: 'array', bookType: 'xlsx'});

                    // 将Excel文件添加到ZIP
                    zip.file(fileName, excelData);
                }

                // 生成 ZIP 文件并下载
                const content = await zip.generateAsync({type: &quot;blob&quot;});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = '批量创建Excel表.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                alert(`成功创建包含 ${allNames.length} 个Excel文件的压缩包！`);
            } catch (error) {
                console.error('创建Excel文件失败:', error);
                alert('创建Excel文件时发生错误，请重试。');
            } finally {
                showLoading(false);
            }
        });

        // ==================== 批量重命名Excel表功能 ====================
        let renameFilesData = [];

        // 切换重命名输入方法
        const renameMethodBtns = document.querySelectorAll('#rename-function .method-btn');
        const renameFolderUpload = document.getElementById('rename-folder-upload');
        const renameMappingUpload = document.getElementById('rename-mapping-upload');

        renameMethodBtns.forEach(btn =&gt; {
            btn.addEventListener('click', () =&gt; {
                const method = btn.getAttribute('data-method');

                // 更新按钮状态
                renameMethodBtns.forEach(b =&gt; b.classList.remove('active'));
                btn.classList.add('active');

                // 切换显示区域
                if (method === 'folder') {
                    renameFolderUpload.style.display = 'block';
                    renameMappingUpload.style.display = 'none';
                } else {
                    renameFolderUpload.style.display = 'none';
                    renameMappingUpload.style.display = 'block';
                }
            });
        });

        // 上传文件夹
        const renameUploadArea = document.getElementById('rename-upload-area');
        const renameFileInput = document.getElementById('rename-file-input');
        const renameFileList = document.getElementById('rename-file-list');
        const renameBrowseBtn = document.getElementById('rename-browse-btn');

        renameBrowseBtn.addEventListener('click', () =&gt; {
            renameFileInput.click();
        });

        // 注意：删除了 renameUploadArea.addEventListener('click', ...) 以避免重复触发

        renameUploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            renameUploadArea.style.backgroundColor = '#e3e9ff';
        });

        renameUploadArea.addEventListener('dragleave', () =&gt; {
            renameUploadArea.style.backgroundColor = '#f8faff';
        });

        renameUploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            renameUploadArea.style.backgroundColor = '#f8faff';
            handleRenameFolderDrop(e);
        });

        renameFileInput.addEventListener('change', (e) =&gt; {
            handleRenameFiles(e.target.files);
        });

        // 处理拖放文件夹
        async function handleRenameFolderDrop(e) {
            const items = e.dataTransfer.items;
            const files = [];

            for (const item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    await traverseFileTreeForRename(entry, files);
                }
            }

            const fileList = {
                length: files.length,
                item: (index) =&gt; files[index],
                ...files
            };

            handleRenameFiles(fileList);
        }

        // 遍历文件树（用于拖放文件夹）
        async function traverseFileTreeForRename(entry, files) {
            if (entry.isFile) {
                return new Promise((resolve) =&gt; {
                    entry.file((file) =&gt; {
                        // 只处理Excel文件
                        if (file.name.match(/\.(xlsx|xls)$/)) {
                            files.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                return new Promise((resolve) =&gt; {
                    reader.readEntries(async (entries) =&gt; {
                        for (const childEntry of entries) {
                            await traverseFileTreeForRename(childEntry, files);
                        }
                        resolve();
                    });
                });
            }
        }

        // 处理上传的文件
        function handleRenameFiles(fileList) {
            if (fileList.length === 0) return;

            // 清空现有数据
            renameFilesData = [];
            renameFileList.innerHTML = '';
            document.getElementById('rename-table-body').innerHTML = '';
            document.getElementById('rename-execute-btn').disabled = true;

            // 筛选Excel文件
            const excelFiles = Array.from(fileList).filter(file =&gt;
                file.name.match(/\.(xlsx|xls)$/)
            );

            if (excelFiles.length === 0) {
                renameFileList.innerHTML = '&lt;div class=&quot;file-item&quot;&gt;未找到Excel文件，请上传包含Excel文件的文件夹&lt;/div&gt;';
                return;
            }

            // 显示文件列表
            excelFiles.forEach((file, index) =&gt; {
                renameFileList.innerHTML += `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 创建文件对象
                const lastDotIndex = file.name.lastIndexOf('.');
                const nameWithoutExt = lastDotIndex &gt; 0 ? file.name.substring(0, lastDotIndex) : file.name;
                const extension = lastDotIndex &gt; 0 ? file.name.substring(lastDotIndex) : '.xlsx';

                const fileObj = {
                    id: index + 1,
                    originalName: file.name,
                    originalNameWithoutExt: nameWithoutExt,
                    originalExtension: extension,
                    newNameWithoutExt: nameWithoutExt,
                    newExtension: extension,
                    file: file,
                    status: '未更改'
                };

                renameFilesData.push(fileObj);

                // 添加到表格
                addFileToRenameTable(fileObj);
            });

            document.getElementById('rename-execute-btn').disabled = false;
        }

        // 添加文件到重命名表格
        function addFileToRenameTable(fileObj) {
            const tableBody = document.getElementById('rename-table-body');
            const row = document.createElement('tr');
            row.dataset.id = fileObj.id;

            row.innerHTML = `
                &lt;td&gt;${fileObj.id}&lt;/td&gt;
                &lt;td&gt;
                    &lt;div&gt;${fileObj.originalName}&lt;/div&gt;
                    &lt;div class=&quot;original-name&quot;&gt;原始名称&lt;/div&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;input type=&quot;text&quot; class=&quot;excel-name-input&quot; value=&quot;${fileObj.newNameWithoutExt}&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;div class=&quot;excel-actions&quot;&gt;
                        &lt;button class=&quot;action-icon-btn&quot; title=&quot;恢复原始名称&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                            &lt;i class=&quot;fas fa-undo&quot;&gt;&lt;/i&gt;
                        &lt;/button&gt;
                    &lt;/div&gt;
                &lt;/td&gt;
            `;

            tableBody.appendChild(row);

            // 添加事件监听器
            const nameInput = row.querySelector('.excel-name-input');
            const undoBtn = row.querySelector('.action-icon-btn');

            nameInput.addEventListener('input', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateRenameFileName(id, e.target.value);
            });

            undoBtn.addEventListener('click', (e) =&gt; {
                const id = parseInt(e.target.closest('button').dataset.id);
                const fileObj = renameFilesData.find(f =&gt; f.id === id);
                if (fileObj) {
                    const nameInput = document.querySelector(`.excel-name-input[data-id=&quot;${id}&quot;]`);
                    nameInput.value = fileObj.originalNameWithoutExt;
                    updateRenameFileName(id, fileObj.originalNameWithoutExt);
                }
            });
        }

        // 更新重命名文件名
        function updateRenameFileName(id, newNameWithoutExt) {
            const fileObj = renameFilesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            fileObj.newNameWithoutExt = newNameWithoutExt;
        }

        // 重命名模式变化
        const renamePattern = document.getElementById('rename-pattern');
        const replaceControls = document.getElementById('replace-controls');
        const replaceWithControls = document.getElementById('replace-with-controls');

        renamePattern.addEventListener('change', function() {
            if (this.value === 'replace') {
                replaceControls.style.display = 'block';
                replaceWithControls.style.display = 'block';
            } else {
                replaceControls.style.display = 'none';
                replaceWithControls.style.display = 'none';
            }
        });

        // 应用重命名规则
        document.getElementById('apply-rename-btn').addEventListener('click', function() {
            if (renameFilesData.length === 0) {
                alert('请先上传Excel文件！');
                return;
            }

            const pattern = document.getElementById('rename-pattern').value;
            const startNumber = parseInt(document.getElementById('rename-start-number').value) || 1;
            const prefix = document.getElementById('rename-prefix').value;
            const findText = document.getElementById('rename-find').value;
            const replaceText = document.getElementById('rename-replace').value;

            renameFilesData.forEach((fileObj, index) =&gt; {
                let newName = '';

                switch (pattern) {
                    case 'sequential':
                        newName = `文件${startNumber + index}`;
                        break;
                    case 'date':
                        const today = new Date();
                        const dateStr = today.toISOString().split('T')[0];
                        newName = `${dateStr}_${startNumber + index}`;
                        break;
                    case 'replace':
                        newName = fileObj.originalNameWithoutExt.replace(new RegExp(findText, 'g'), replaceText);
                        break;
                    case 'custom':
                    default:
                        newName = prefix ? `${prefix}${startNumber + index}` : fileObj.originalNameWithoutExt;
                        break;
                }

                // 更新表格中的输入框
                const nameInput = document.querySelector(`.excel-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                if (nameInput) {
                    nameInput.value = newName;
                }

                // 更新文件对象
                fileObj.newNameWithoutExt = newName;
            });
        });

        // 重置重命名
        document.getElementById('rename-clear-btn').addEventListener('click', function() {
            if (renameFilesData.length === 0) return;

            if (!confirm('确定要重置所有更改吗？这将恢复所有文件到原始名称。')) {
                return;
            }

            renameFilesData.forEach(fileObj =&gt; {
                fileObj.newNameWithoutExt = fileObj.originalNameWithoutExt;
                const nameInput = document.querySelector(`.excel-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                if (nameInput) {
                    nameInput.value = fileObj.originalNameWithoutExt;
                }
            });
        });

        // 执行重命名并下载
        document.getElementById('rename-execute-btn').addEventListener('click', async function() {
            if (renameFilesData.length === 0) return;

            showLoading(true);

            try {
                const zip = new JSZip();

                for (const fileObj of renameFilesData) {
                    const newFileName = fileObj.newNameWithoutExt + fileObj.newExtension;
                    zip.file(newFileName, fileObj.file);
                }

                const content = await zip.generateAsync({type: &quot;blob&quot;});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = '重命名后的Excel文件.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                alert(`成功打包并下载 ${renameFilesData.length} 个Excel文件！`);
            } catch (error) {
                console.error('创建ZIP文件时出错:', error);
                alert('创建ZIP文件时出错，请重试。');
            } finally {
                showLoading(false);
            }
        });

        // 新增：映射Excel文件处理
        const renameMappingBrowseBtn = document.getElementById('rename-mapping-browse-btn');
        const renameMappingFile = document.getElementById('rename-mapping-file');

        renameMappingBrowseBtn.addEventListener('click', () =&gt; {
            renameMappingFile.click();
        });

        renameMappingFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

                        // 解析映射关系（假设第1列是原文件名，第2列是新文件名）
                        const mapping = {};
                        for (let i = 1; i &lt; sheetData.length; i++) {
                            const row = sheetData[i];
                            if (row &amp;&amp; row[0] &amp;&amp; row[1]) {
                                mapping[row[0].toString().trim()] = row[1].toString().trim();
                            }
                        }

                        // 应用映射关系到现有的文件列表
                        applyMappingToFiles(mapping);

                        alert(`成功读取映射关系，共 ${Object.keys(mapping).length} 条记录`);
                    } catch (error) {
                        console.error('解析映射Excel文件时出错:', error);
                        alert('解析Excel文件时出错，请确保文件格式正确。');
                    }
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // 应用映射关系到文件列表
        function applyMappingToFiles(mapping) {
            if (renameFilesData.length === 0) {
                alert('请先上传需要重命名的Excel文件！');
                return;
            }

            let appliedCount = 0;
            renameFilesData.forEach(fileObj =&gt; {
                // 查找是否有对应的映射关系
                if (mapping[fileObj.originalName]) {
                    // 更新新文件名
                    const newName = mapping[fileObj.originalName];
                    const lastDotIndex = newName.lastIndexOf('.');
                    const newNameWithoutExt = lastDotIndex &gt; 0 ? newName.substring(0, lastDotIndex) : newName;
                    const newExtension = lastDotIndex &gt; 0 ? newName.substring(lastDotIndex) : fileObj.originalExtension;

                    fileObj.newNameWithoutExt = newNameWithoutExt;
                    fileObj.newExtension = newExtension;

                    // 更新表格中的输入框
                    const nameInput = document.querySelector(`.excel-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                    if (nameInput) {
                        nameInput.value = newNameWithoutExt;
                    }
                    appliedCount++;
                }
            });

            if (appliedCount &gt; 0) {
                alert(`成功应用 ${appliedCount} 个文件的重命名规则`);
            } else {
                alert('未找到匹配的文件名映射关系');
            }
        }

        // 重命名映射模板下载（包含当前上传的文件名）
        document.getElementById('rename-template-download').addEventListener('click', function(e) {
            e.preventDefault();

            // 如果有上传的文件，则使用这些文件名作为模板数据
            let data = [
                ['原文件名', '新文件名']
            ];

            if (renameFilesData.length &gt; 0) {
                renameFilesData.forEach(fileObj =&gt; {
                    data.push([fileObj.originalName, fileObj.originalName]);
                });
            } else {
                // 默认模板数据
                data.push(['原文件1.xlsx', '新文件1.xlsx']);
                data.push(['原文件2.xlsx', '新文件2.xlsx']);
                data.push(['原文件3.xlsx', '新文件3.xlsx']);
            }

            // 使用 SheetJS 创建工作簿
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '文件名映射');

            // 导出为 .xlsx 文件
            XLSX.writeFile(wb, '文件名映射模板.xlsx');
        });

        // ==================== 提取Excel表名称功能 ====================
        let extractFilesData = [];

        // 上传文件夹
        const extractUploadArea = document.getElementById('extract-upload-area');
        const extractFileInput = document.getElementById('extract-file-input');
        const extractFileList = document.getElementById('extract-file-list');
        const extractBrowseBtn = document.getElementById('extract-browse-btn');
        const extractedNamesTextarea = document.getElementById('extracted-names');
        const extractCount = document.getElementById('extract-count');

        extractBrowseBtn.addEventListener('click', () =&gt; {
            extractFileInput.click();
        });

        // 注意：删除了 extractUploadArea.addEventListener('click', ...) 以避免重复触发

        extractUploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            extractUploadArea.style.backgroundColor = '#e3e9ff';
        });

        extractUploadArea.addEventListener('dragleave', () =&gt; {
            extractUploadArea.style.backgroundColor = '#f8faff';
        });

        extractUploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            extractUploadArea.style.backgroundColor = '#f8faff';
            handleExtractFolderDrop(e);
        });

        extractFileInput.addEventListener('change', (e) =&gt; {
            handleExtractFiles(e.target.files);
        });

        // 处理拖放文件夹
        async function handleExtractFolderDrop(e) {
            const items = e.dataTransfer.items;
            const files = [];

            for (const item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    await traverseFileTreeForExtract(entry, files);
                }
            }

            const fileList = {
                length: files.length,
                item: (index) =&gt; files[index],
                ...files
            };

            handleExtractFiles(fileList);
        }

        // 遍历文件树（用于拖放文件夹）
        async function traverseFileTreeForExtract(entry, files) {
            if (entry.isFile) {
                return new Promise((resolve) =&gt; {
                    entry.file((file) =&gt; {
                        // 只处理Excel文件
                        if (file.name.match(/\.(xlsx|xls)$/)) {
                            files.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                return new Promise((resolve) =&gt; {
                    reader.readEntries(async (entries) =&gt; {
                        for (const childEntry of entries) {
                            await traverseFileTreeForExtract(childEntry, files);
                        }
                        resolve();
                    });
                });
            }
        }

        // 处理上传的文件
        function handleExtractFiles(fileList) {
            if (fileList.length === 0) return;

            // 清空现有数据
            extractFilesData = [];
            extractFileList.innerHTML = '';
            extractedNamesTextarea.value = '';

            // 筛选Excel文件
            const excelFiles = Array.from(fileList).filter(file =&gt;
                file.name.match(/\.(xlsx|xls)$/)
            );

            if (excelFiles.length === 0) {
                extractFileList.innerHTML = '&lt;div class=&quot;file-item&quot;&gt;未找到Excel文件，请上传包含Excel文件的文件夹&lt;/div&gt;';
                extractCount.textContent = '0 个Excel文件';
                return;
            }

            // 显示文件列表
            excelFiles.forEach((file, index) =&gt; {
                extractFileList.innerHTML += `
                    &lt;div class=&quot;file-item&quot;&gt;
                        &lt;i class=&quot;fas fa-file-excel&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;${file.name} (${(file.size / 1024).toFixed(2)} KB)&lt;/span&gt;
                    &lt;/div&gt;
                `;

                // 创建文件对象
                const fileObj = {
                    id: index + 1,
                    name: file.name,
                    size: file.size,
                    file: file
                };

                extractFilesData.push(fileObj);
            });

            // 提取名称到文本区域
            const names = extractFilesData.map(f =&gt; f.name);
            extractedNamesTextarea.value = names.join('\n');
            extractCount.textContent = `${extractFilesData.length} 个Excel文件`;
        }

        // 复制名称
        document.getElementById('copy-names-btn').addEventListener('click', function() {
            if (extractFilesData.length === 0) {
                alert('没有可复制的Excel表名称！');
                return;
            }

            extractedNamesTextarea.select();
            document.execCommand('copy');

            // 显示复制成功提示
            const originalText = this.innerHTML;
            this.innerHTML = '&lt;i class=&quot;fas fa-check&quot;&gt;&lt;/i&gt; 已复制';
            this.style.backgroundColor = '#28a745';

            setTimeout(() =&gt; {
                this.innerHTML = originalText;
                this.style.backgroundColor = '';
            }, 2000);
        });

        // 导出为Excel
        document.getElementById('export-excel-btn').addEventListener('click', function() {
            if (extractFilesData.length === 0) {
                alert('没有可导出的Excel表名称！');
                return;
            }

            // 创建工作簿
            const wb = XLSX.utils.book_new();

            // 创建工作表数据
            const wsData = [
                ['Excel表名称列表'],
                ['生成时间', new Date().toLocaleString()],
                ['文件数量', extractFilesData.length],
                [''],
                ['序号', '文件名', '文件大小(KB)']
            ];

            // 添加每个文件的数据
            extractFilesData.forEach((fileObj, index) =&gt; {
                wsData.push([
                    index + 1,
                    fileObj.name,
                    (fileObj.size / 1024).toFixed(2)
                ]);
            });

            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // 设置列宽
            const wscols = [
                {wch: 8},  // 序号
                {wch: 40}, // 文件名
                {wch: 15}  // 文件大小
            ];
            ws['!cols'] = wscols;

            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, &quot;Excel表列表&quot;);

            // 生成Excel文件并下载
            XLSX.writeFile(wb, 'Excel表名称列表.xlsx');

            alert('Excel文件已生成并下载！');
        });

        // 初始化预览
        updateCreatePreview();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
">

     </div>

  <script>
   // 导航到指定报告
            function navigateToReport(index) {
                const sections = document.querySelectorAll('.visualization-section');
                sections.forEach((section, i) => {
                    section.style.display = i === index ? 'block' : 'none';
                });

                // 更新按钮状态
                document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                    if (i === index) {
                        btn.classList.add('active');
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 更新URL hash
                window.location.hash = `#report-${index + 1}`;
            }

            // 页面加载时显示第一个报告
            document.addEventListener('DOMContentLoaded', () => {
                // 从URL hash获取报告索引
                const hash = window.location.hash;
                let initialIndex = 0;

                if (hash.startsWith('#report-')) {
                    const reportNum = parseInt(hash.replace('#report-', ''));
                    if (!isNaN(reportNum) && reportNum > 0) {
                        initialIndex = reportNum - 1;
                    }
                }


                // 显示报告
                if (document.querySelectorAll('.visualization-section').length > 0) {
                    navigateToReport(initialIndex);
                }

                // 显示当前日期
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 显示最后更新时间
                document.getElementById('lastUpdate').textContent = now.toLocaleDateString('zh-CN', {
                    month: 'short',
                    day: 'numeric'
                });

                // 显示报告数量
                const reportCount = document.querySelectorAll('.visualization-section').length;
                document.getElementById('reportCount').textContent = reportCount;

                // 显示图表总数（估算）
                document.getElementById('totalCharts').textContent = reportCount * 3;
            });
  </script>
