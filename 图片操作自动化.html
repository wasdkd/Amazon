    function syncMetricRow(row, forceName) {
        const agg = row.querySelector('.metric-agg').value;
        const col = row.querySelector('.metric-col').value;
        row.querySelector('.metric-weight-cell').style.display = (agg === 'wavg') ? '' : 'none';

        const nameInput = row.querySelector('.metric-name');
        if (forceName || !row.dataset.nameEdited) {
            nameInput.value = autoMetricName(col, agg);
        }
    }

    function computeMetricValue(rows, m) {
        if (m.agg === 'count') {
            let c = 0;
            rows.forEach(r =&gt; {
                const v = r[m.col];
                if (v !== null &amp;&amp; v !== undefined &amp;&amp; String(v).trim() !== '') c++;
            });
            return c;
        }
        if (m.agg === 'countd') {
            const set = new Set();
            rows.forEach(r =&gt; {
                const v = r[m.col];
                if (v !== null &amp;&amp; v !== undefined &amp;&amp; String(v).trim() !== '') {
                    set.add(String(v).trim());
                }
            });
            return set.size;
        }

        const pairs = [];
        rows.forEach(r =&gt; {
            const v = toNumber(r[m.col]);
            if (isNaN(v)) return;
            let w = 1;
            if (m.agg === 'wavg') {
                const wv = toNumber(r[m.weight]);
                w = isNaN(wv) ? 0 : wv;
            }
            pairs.push([v, w]);
        });

        if (pairs.length === 0) return (m.agg === 'sum') ? 0 : '';

        switch (m.agg) {
            case 'sum':  return round2(pairs.reduce((a, p) =&gt; a + p[0], 0));
            case 'avg':  return round2(pairs.reduce((a, p) =&gt; a + p[0], 0) / pairs.length);
            case 'wavg': {
                const totalW = pairs.reduce((a, p) =&gt; a + p[1], 0);
                if (totalW &gt; 0) return round2(pairs.reduce((a, p) =&gt; a + p[0] * p[1], 0) / totalW);
                return round2(pairs.reduce((a, p) =&gt; a + p[0], 0) / pairs.length);
            }
            case 'max':  return round2(Math.max(...pairs.map(p =&gt; p[0])));
            case 'min':  return round2(Math.min(...pairs.map(p =&gt; p[0])));
            default:     return '';
        }
    }

    function collectMetrics() {
        const rows = document.querySelectorAll('#metricList .metric-row');
        const list = [];
        const usedNames = new Set();

        rows.forEach(row =&gt; {
            const col = row.querySelector('.metric-col').value;
            if (!col) return;

            const agg = row.querySelector('.metric-agg').value;
            const weight = row.querySelector('.metric-weight').value;
            let name = (row.querySelector('.metric-name').value || '').trim() || autoMetricName(col, agg);

            let base = name, i = 2;
            while (usedNames.has(name)) {
                name = `${base}_${i++}`;
            }
            usedNames.add(name);

            list.push({ col, agg, weight, name });
        });

        return list;
    }

    function getFirstNonEmptyVal(rows, col) {
        for (let r of rows) {
            const val = r[col];
            if (val !== undefined &amp;&amp; val !== null &amp;&amp; String(val).trim() !== '') return val;
        }
        return '';
    }

    /* ================= 执行核心聚合与占比计算 ================= */
    function executeAdvancedGroupAggregation() {
        const rawData = appState.group.rawData;
        if (!rawData || rawData.length === 0) {
            alert('请先上传 Excel 文件！');
            return;
        }

        const largeGroupCols = groupSelection.large.slice();
        const subGroupCols = groupSelection.sub.slice();

        if (largeGroupCols.length === 0 &amp;&amp; subGroupCols.length === 0) {
            alert('请至少在一级大类或二级细分组中选择一个分组字段！');
            return;
        }

        const metrics = collectMetrics();
        if (metrics.length === 0) {
            alert('请至少添加一条有效的指标配置！');
            return;
        }

        const GROUP_SEP = '|||';
        const allGroupKeys = Array.from(new Set([...largeGroupCols, ...subGroupCols]));

        // 占比配置参数
        const enableCrossRatio = document.getElementById('enableCrossRatio').checked;
        const ratioSalesCol = document.getElementById('ratioSalesCol').value;
        const ratioSubjectCol = document.getElementById('ratioSubjectCol').value;
        const ratioDimCol = document.getElementById('ratioDimCol').value;

        const nameColCurrentSales = (document.getElementById('nameColCurrentSales').value || '当前颜色在SKU中的销量').trim();
        const nameColTotalSales = (document.getElementById('nameColTotalSales').value || 'SKU全部颜色总销量').trim();
        const nameColRatio = (document.getElementById('nameColRatio').value || '色号占SKU销售比例').trim();
        const enableSubGroupShare = document.getElementById('enableSubGroupShare').checked;

        /* ---------- 1. 全局主体销量汇总 (分母：SKU全部颜色总销量) ---------- */
        const subjectGlobalSalesMap = new Map();
        if (enableCrossRatio &amp;&amp; ratioSubjectCol &amp;&amp; ratioSalesCol) {
            rawData.forEach(r =&gt; {
                const subjVal = String(r[ratioSubjectCol] !== undefined &amp;&amp; r[ratioSubjectCol] !== null ? r[ratioSubjectCol] : '').trim();
                const v = toNumber(r[ratioSalesCol]) || 0;
                subjectGlobalSalesMap.set(subjVal, (subjectGlobalSalesMap.get(subjVal) || 0) + v);
            });
        }

        /* ---------- 2. 一级大类汇总 (面料色号_组总销量) ---------- */
        const largeMap = new Map();
        rawData.forEach(row =&gt; {
            const lk = largeGroupCols
                .map(k =&gt; String(row[k] !== undefined &amp;&amp; row[k] !== null ? row[k] : ''))
                .join(GROUP_SEP);
            if (!largeMap.has(lk)) largeMap.set(lk, []);
            largeMap.get(lk).push(row);
        });

        // 命名大组销量指标列名
        let largeSalesColName = '大组总销量';
        if (largeGroupCols.length &gt; 0) {
            largeSalesColName = largeGroupCols.map(c =&gt; c.replace(/修正/g, '')).join('') + '_组总销量';
        }

        const largeMetricMap = new Map();
        largeMap.forEach((rows, lk) =&gt; {
            const vals = {};
            metrics.forEach(m =&gt; {
                vals[m.name] = computeMetricValue(rows, m);
            });
            // 大组销量汇总值（用于计算细组占比）
            let mainLargeSales = 0;
            if (ratioSalesCol) {
                mainLargeSales = rows.reduce((acc, r) =&gt; acc + (toNumber(r[ratioSalesCol]) || 0), 0);
            } else {
                mainLargeSales = vals[metrics[0].name] || 0;
            }
            vals.__largeTotalSales = mainLargeSales;
            largeMetricMap.set(lk, vals);
        });

        /* ---------- 3. 二级细组聚合 ---------- */
        const subMap = new Map();
        rawData.forEach(row =&gt; {
            const key = allGroupKeys
                .map(k =&gt; String(row[k] !== undefined &amp;&amp; row[k] !== null ? row[k] : ''))
                .join(GROUP_SEP);
            if (!subMap.has(key)) subMap.set(key, []);
            subMap.get(key).push(row);
        });

        const subResults = [];
        const metricSourceCols = new Set(metrics.map(m =&gt; m.col));
        if (ratioSalesCol) metricSourceCols.add(ratioSalesCol);

        // 细组名称（如 SKU销量占比）
        const subMainCol = subGroupCols[0] || '细组';
        const subShareColName = `${subMainCol}销量占比`;

        subMap.forEach((rows) =&gt; {
            const summaryRow = {};

            // 1. 一级分组字段
            largeGroupCols.forEach(k =&gt; {
                summaryRow[k] = rows[0][k] !== undefined ? rows[0][k] : '';
            });

            // 大组总指标（面料色号_组总销量）
            const lk = largeGroupCols
                .map(k =&gt; String(rows[0][k] !== undefined &amp;&amp; rows[0][k] !== null ? rows[0][k] : ''))
                .join(GROUP_SEP);
            const lv = largeMetricMap.get(lk) || {};

            const largeSalesValue = round2(lv.__largeTotalSales || 0);
            summaryRow[largeSalesColName] = largeSalesValue;

            // 2. 二级分组字段
            subGroupCols.forEach(k =&gt; {
                if (!(k in summaryRow)) summaryRow[k] = rows[0][k] !== undefined ? rows[0][k] : '';
            });

            // 细组各项指标计算
            metrics.forEach(m =&gt; {
                summaryRow[m.name] = computeMetricValue(rows, m);
            });

            // 细组销量值
            const currentSubSales = round2(rows.reduce((acc, r) =&gt; acc + (toNumber(r[ratioSalesCol]) || 0), 0));

            // 3. 细组在大组中的销量占比 (如 SKU销量占比)
            if (enableSubGroupShare) {
                summaryRow[subShareColName] = formatPercent(currentSubSales, largeSalesValue);
            }

            // 4. 交叉占比计算 (当前色号在SKU中的销量 / SKU全部色号总销量 / 色号占SKU销售比例)
            if (enableCrossRatio) {
                const subjVal = String(rows[0][ratioSubjectCol] !== undefined &amp;&amp; rows[0][ratioSubjectCol] !== null ? rows[0][ratioSubjectCol] : '').trim();
                const totalSubjectSales = round2(subjectGlobalSalesMap.get(subjVal) || 0);

                summaryRow[nameColCurrentSales] = currentSubSales;
                summaryRow[nameColTotalSales] = totalSubjectSales;
                summaryRow[nameColRatio] = formatPercent(currentSubSales, totalSubjectSales);
            }

            // 5. 原表其余列提取第一个非空值
            appState.group.rawColumns.forEach(origCol =&gt; {
                if (!allGroupKeys.includes(origCol) &amp;&amp; !metricSourceCols.has(origCol) &amp;&amp; !(origCol in summaryRow)) {
                    summaryRow[origCol] = getFirstNonEmptyVal(rows, origCol);
                }
            });

            summaryRow.__largeSortVal = largeSalesValue;
            summaryRow.__subSortVal = currentSubSales;
            subResults.push(summaryRow);
        });

        /* ---------- 4. 排序：大组销量降序 → 一级分组升序 → 细组销量降序 ---------- */
        subResults.sort((a, b) =&gt; {
            if (b.__largeSortVal !== a.__largeSortVal) return b.__largeSortVal - a.__largeSortVal;

            for (const lk of largeGroupCols) {
                const cmp = String(a[lk] !== undefined ? a[lk] : '')
                    .localeCompare(String(b[lk] !== undefined ? b[lk] : ''), 'zh-CN', { numeric: true });
                if (cmp !== 0) return cmp;
            }

            return b.__subSortVal - a.__subSortVal;
        });

        /* ---------- 5. 构建规范的表头顺序（紧贴截图结构） ---------- */
        const orderedCols = [];

        // 1. 一级分组字段（如 修正面料、色号）
        largeGroupCols.forEach(c =&gt; { if (!orderedCols.includes(c)) orderedCols.push(c); });

        // 2. 大组总销量（如 面料色号_组总销量）
        if (!orderedCols.includes(largeSalesColName)) orderedCols.push(largeSalesColName);

        // 3. 二级细组字段（如 SKU）
        subGroupCols.forEach(c =&gt; { if (!orderedCols.includes(c)) orderedCols.push(c); });

        // 4. 细组核心销量列（若指标中有“销量”或“SKU销量”）
        const salesMetric = metrics.find(m =&gt; m.agg === 'sum');
        if (salesMetric &amp;&amp; !orderedCols.includes(salesMetric.name)) orderedCols.push(salesMetric.name);

        // 5. 细组在大组销量占比（如 SKU销量占比）
        if (enableSubGroupShare &amp;&amp; !orderedCols.includes(subShareColName)) orderedCols.push(subShareColName);

        // 6. 核心交叉占比三列（如 当前颜色在SKU中的销量、SKU全部颜色总销量、色号占SKU销售比例）
        if (enableCrossRatio) {
            [nameColCurrentSales, nameColTotalSales, nameColRatio].forEach(c =&gt; {
                if (!orderedCols.includes(c)) orderedCols.push(c);
            });
        }

        // 7. 其余细组指标（如 SKU销售均价_加权平均、算术平均）
        metrics.forEach(m =&gt; {
            if (!orderedCols.includes(m.name)) orderedCols.push(m.name);
        });

        // 8. 原始表格其余所有列
        appState.group.rawColumns.forEach(c =&gt; {
            if (!orderedCols.includes(c) &amp;&amp; !metricSourceCols.has(c)) {
                orderedCols.push(c);
            }
        });

        // 清理排序临时字段
        subResults.forEach(r =&gt; {
            delete r.__largeSortVal;
            delete r.__subSortVal;
        });

        appState.group.data = subResults;
        appState.group.columns = orderedCols;

        document.getElementById('groupResultCount').textContent =
            `共聚合出 ${subResults.length} 个细分组 / ${orderedCols.length} 个字段`;
        document.getElementById('groupDownloadBtn').disabled = false;

        initColumnTags('group');
        renderPreviewTable('group');
    }

    /* ================= 通用：表头拖拽 / 预览 / 下载 ================= */
    let draggedIndex = null;

    function isRatioColumn(col) {
        return /占|比例|全部.*总销量|当前.*销量|占比/.test(col);
    }

    function isComputedColumn(type, col) {
        if (type === 'group') {
            if (isRatioColumn(col) || /_组总销量|均价|平均/.test(col)) return true;
            return !(appState.group.rawColumns || []).includes(col);
        }
        return ['SKU', '颜色', '颜色英文', '材质(成分)'].includes(col);
    }

    function initColumnTags(type) {
        const section = document.getElementById(`${type}ColumnOrderSection`);
        const container = document.getElementById(`${type}ColumnTags`);
        container.innerHTML = '';
        section.style.display = 'block';

        const columns = appState[type].columns;

        columns.forEach((col, index) =&gt; {
            const tag = document.createElement('div');
            const isRatio = isRatioColumn(col);
            const isNew = isComputedColumn(type, col);

            let tagClass = 'col-tag';
            if (isRatio) tagClass += ' is-ratio';
            else if (isNew) tagClass += ' is-new';

            tag.className = tagClass;
            tag.draggable = true;
            tag.dataset.index = index;

            tag.innerHTML = `
                &lt;button class=&quot;col-btn-arrow&quot; onclick=&quot;moveColumn('${type}', ${index}, -1)&quot; title=&quot;前移&quot;&gt;◀&lt;/button&gt;
                &lt;span&gt;${escHtml(col)}&lt;/span&gt;
                &lt;button class=&quot;col-btn-arrow&quot; onclick=&quot;moveColumn('${type}', ${index}, 1)&quot; title=&quot;后移&quot;&gt;▶&lt;/button&gt;
            `;

            tag.addEventListener('dragstart', () =&gt; { draggedIndex = index; tag.style.opacity = '0.4'; });
            tag.addEventListener('dragend', () =&gt; { tag.style.opacity = '1'; draggedIndex = null; });
            tag.addEventListener('dragover', (e) =&gt; e.preventDefault());
            tag.addEventListener('drop', (e) =&gt; {
                e.preventDefault();
                const targetIndex = parseInt(tag.dataset.index);
                if (draggedIndex !== null &amp;&amp; draggedIndex !== targetIndex) {
                    const item = columns.splice(draggedIndex, 1)[0];
                    columns.splice(targetIndex, 0, item);
                    initColumnTags(type);
                    renderPreviewTable(type);
                }
            });

            container.appendChild(tag);
        });
    }

    function moveColumn(type, index, direction) {
        const columns = appState[type].columns;
        const targetIndex = index + direction;
        if (targetIndex &lt; 0 || targetIndex &gt;= columns.length) return;
        const temp = columns[index];
        columns[index] = columns[targetIndex];
        columns[targetIndex] = temp;
        initColumnTags(type);
        renderPreviewTable(type);
    }

    function renderPreviewTable(type) {
        const table = document.getElementById(`${type}Table`);
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');
        const previewSection = document.getElementById(`${type}PreviewSection`);

        thead.innerHTML = '';
        tbody.innerHTML = '';

        const data = appState[type].data;
        const columns = appState[type].columns;
        if (!data || data.length === 0 || !columns) return;

        const limit = (type === 'group') ? 100 : 10;
        const previewRows = data.slice(0, limit);

        const trHead = document.createElement('tr');
        columns.forEach(h =&gt; {
            const th = document.createElement('th');
            if (isRatioColumn(h)) {
                th.innerHTML = `${escHtml(h)} &lt;span class=&quot;badge-ratio&quot;&gt;占比分析&lt;/span&gt;`;
            } else if (isComputedColumn(type, h)) {
                th.innerHTML = `${escHtml(h)} &lt;span class=&quot;badge-new&quot;&gt;计算字段&lt;/span&gt;`;
            } else {
                th.textContent = h;
            }
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        previewRows.forEach(row =&gt; {
            const tr = document.createElement('tr');
            columns.forEach(h =&gt; {
                const td = document.createElement('td');
                td.textContent = row[h] !== undefined ? row[h] : '';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        previewSection.style.display = 'block';
    }

    function downloadExcel(type) {
        const target = appState[type];
        if (!target.data || !target.columns) return;

        const worksheet = XLSX.utils.json_to_sheet(target.data, { header: target.columns });
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, &quot;统计结果&quot;);
        XLSX.writeFile(workbook, target.fileName || '统计结果.xlsx');
    }
&lt;/script&gt;

&lt;!--    &lt;/div&gt;--&gt;

&lt;!--    &amp;lt;!&amp;ndash; 功能一：提取SKU &amp; 颜色（未改动） &amp;ndash;&amp;gt;--&gt;
&lt;!--    &lt;div id=&quot;skuTab&quot; class=&quot;tab-content active&quot;&gt;--&gt;

&lt;script&gt;
  // 全局状态
  let currentMode = 'file';
  let parsedExcelData = [];
  let rawAsinBatches = []; // 存储原生 ASIN 二维数组 [['B001','B002'], ['B003'...]]
  let uploadedFileName = 'ASIN_分组结果';
  const TARGET_WINDOW_NAME = 'SellerSpriteTab'; // 保证始终在同一个标签页中复用

  function switchTab(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) =&gt; {
      btn.classList.toggle('active', (mode === 'file' &amp;&amp; idx === 0) || (mode === 'text' &amp;&amp; idx === 1));
    });
    document.getElementById('fileTab').style.display = mode === 'file' ? 'block' : 'none';
    document.getElementById('textTab').style.display = mode === 'text' ? 'block' : 'none';
  }

  function setBatchSize(val) {
    document.getElementById('batchSize').value = val;
  }

  // 拖拽支持
  const dropzone = document.getElementById('dropzone');
  ['dragenter', 'dragover'].forEach(name =&gt; {
    dropzone.addEventListener(name, (e) =&gt; { e.preventDefault(); dropzone.classList.add('dragover'); }, false);
  });
  ['dragleave', 'drop'].forEach(name =&gt; {
    dropzone.addEventListener(name, (e) =&gt; { e.preventDefault(); dropzone.classList.remove('dragover'); }, false);
  });
  dropzone.addEventListener('drop', (e) =&gt; {
    const files = e.dataTransfer.files;
    if (files.length &gt; 0) handleFile(files[0]);
  });

  function handleFileUpload(e) {
    if (e.target.files.length &gt; 0) handleFile(e.target.files[0]);
  }

  // 解析 Excel 文件
  function handleFile(file) {
    uploadedFileName = file.name.replace(/\.[^/.]+$/, &quot;&quot;);
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        parsedExcelData = XLSX.utils.sheet_to_json(worksheet, { defval: &quot;&quot; });

        if (parsedExcelData.length === 0) {
          showToast(&quot;表格中未读取到数据！&quot;);
          return;
        }

        const headers = Object.keys(parsedExcelData[0]);
        const select = document.getElementById('columnSelect');
        select.innerHTML = '';

        let autoSelected = false;
        headers.forEach(h =&gt; {
          const opt = document.createElement('option');
          opt.value = h;
          opt.textContent = h;
          if (!autoSelected &amp;&amp; /asin|商品编码|标准件号|parent/i.test(h)) {
            opt.selected = true;
            autoSelected = true;
          }
          select.appendChild(opt);
        });

        document.getElementById('columnSelectWrapper').style.display = 'block';
        dropzone.querySelector('p').textContent = `✅ 已加载文件: ${file.name} (${parsedExcelData.length} 行)`;
        processData();
      } catch (err) {
        alert(&quot;解析 Excel 失败: &quot; + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function onColumnChange() {
    processData();
  }

  // 核心分组处理
  function processData() {
    let rawList = [];

    if (currentMode === 'file') {
      if (parsedExcelData.length === 0) {
        showToast(&quot;请先上传 Excel/CSV 文件！&quot;);
        return;
      }
      const colName = document.getElementById('columnSelect').value;
      rawList = parsedExcelData.map(row =&gt; String(row[colName] || ''));
    } else {
      const text = document.getElementById('rawTextInput').value;
      if (!text.trim()) {
        showToast(&quot;请先输入 ASIN 文本！&quot;);
        return;
      }
      rawList = text.split(/[\r\n,;\t\s]+/);
    }

    const totalRead = rawList.length;

    // 清洗参数
    const optTrim = document.getElementById('optTrim').checked;
    const optUppercase = document.getElementById('optUppercase').checked;
    const optDeduplicate = document.getElementById('optDeduplicate').checked;
    const batchSize = parseInt(document.getElementById('batchSize').value, 10) || 100;

    let cleaned = rawList.map(item =&gt; optTrim ? item.trim() : item).filter(item =&gt; item.length &gt; 0);

    if (optUppercase) {
      cleaned = cleaned.map(item =&gt; item.toUpperCase());
    }

    if (optDeduplicate) {
      cleaned = Array.from(new Set(cleaned));
    }

    // 分批存储原始 ASIN 数组
    rawAsinBatches = [];
    for (let i = 0; i &lt; cleaned.length; i += batchSize) {
      rawAsinBatches.push(cleaned.slice(i, i + batchSize));
    }

    // 更新面板
    document.getElementById('statTotal').textContent = totalRead;
    document.getElementById('statValid').textContent = cleaned.length;
    document.getElementById('statBatches').textContent = rawAsinBatches.length;

    renderBatchList(cleaned, batchSize);
  }

  // 渲染视图
  function renderBatchList(cleanedList, batchSize) {
    const container = document.getElementById('batchListContainer');
    if (rawAsinBatches.length === 0) {
      container.innerHTML = `&lt;div class=&quot;empty-placeholder&quot;&gt;&lt;p&gt;未提取到有效数据&lt;/p&gt;&lt;/div&gt;`;
      return;
    }

    let html = '';
    rawAsinBatches.forEach((batchArr, idx) =&gt; {
      const startIdx = idx * batchSize + 1;
      const endIdx = Math.min((idx + 1) * batchSize, cleanedList.length);
      const count = batchArr.length;
      const asinCommaStr = batchArr.join(', ');

      html += `
        &lt;div class=&quot;batch-item&quot; id=&quot;batch-item-${idx}&quot;&gt;
          &lt;div class=&quot;batch-item-header&quot;&gt;
            &lt;div&gt;
              &lt;span class=&quot;batch-index&quot;&gt;第 ${idx + 1} 组&lt;/span&gt;
              &lt;span class=&quot;batch-count-tag&quot; style=&quot;margin-left: 6px;&quot;&gt;(共 ${count} 个 ASIN)&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;batch-actions&quot;&gt;
              &lt;!-- 快捷跳转按钮 --&gt;
              &lt;button class=&quot;btn btn-sellersprite&quot; id=&quot;btn-seller-${idx}&quot; onclick=&quot;jumpToSellerSprite(${idx})&quot;&gt;
                🚀 打开卖家精灵查此组 (${count})
              &lt;/button&gt;
              &lt;button class=&quot;btn btn-outline&quot; onclick=&quot;copySingleBatch(${idx})&quot;&gt;
                📋 复制本组
              &lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;batch-content&quot;&gt;${escapeHtml(asinCommaStr)}&lt;/div&gt;
        &lt;/div&gt;
      `;
    });

    container.innerHTML = html;
  }

  // 核心功能：打开卖家精灵并在同一个窗口刷新
  function jumpToSellerSprite(idx) {
    const asinList = rawAsinBatches[idx];
    if (!asinList || asinList.length === 0) return;

    // 获取选中的站点
    const market = document.getElementById('marketSelect').value || 'US';

    // 格式化为 JSON 并转为 URL 编码: [&quot;B01&quot;,&quot;B02&quot;] -&gt; %5B%22B01%22%2C%22B02%22%5D
    const encodedAsins = encodeURIComponent(JSON.stringify(asinList));

    // 构造精准查询链接
    const targetUrl = `https://www.sellersprite.com/v3/competitor-lookup?market=${market}&amp;monthName=bsr_sales_nearly&amp;asins=${encodedAsins}&amp;page=1&amp;nodeIdPaths=%5B%5D&amp;symbolFlag=false&amp;size=100&amp;order%5Bfield%5D=total_units&amp;order%5Bdesc%5D=true&amp;lowPrice=N&amp;salesGrowthType=30d`;

    // 关键点：第二个参数传入固定名字 'SellerSpriteTab'
    // 首次点击会弹出新窗口，第二次点击不会再新建窗口，而是直接在这个已经打开的窗口内重新加载！
    window.open(targetUrl, TARGET_WINDOW_NAME);

    // 视觉辅助：标记此条目正在操作中，且按钮变色提示已查过
    document.querySelectorAll('.batch-item').forEach(el =&gt; el.classList.remove('active-working'));
    const itemEl = document.getElementById(`batch-item-${idx}`);
    if (itemEl) itemEl.classList.add('active-working');

    const btn = document.getElementById(`btn-seller-${idx}`);
    if (btn) {
      btn.classList.add('visited');
      btn.innerHTML = `🔄 重新载入第 ${idx + 1} 组`;
    }

    // 自动同时帮用户把逗号分隔的文本拷贝到剪贴板备用
    copyToClipboard(asinList.join(','), false);
    showToast(`正在页面中加载第 ${idx + 1} 组数据 (已复用同一个标签页)`);
  }

  // 复制本组
  function copySingleBatch(idx) {
    if (rawAsinBatches[idx]) {
      copyToClipboard(rawAsinBatches[idx].join(','), true);
    }
  }

  // 复制全部
  function copyAllBatches() {
    if (rawAsinBatches.length === 0) return;
    const fullText = rawAsinBatches.map(b =&gt; b.join(',')).join('\n');
    copyToClipboard(fullText, true);
  }

  // 导出表格
  function exportToExcel() {
    if (rawAsinBatches.length === 0) {
      showToast(&quot;没有可导出的数据！&quot;);
      return;
    }
    const rows = rawAsinBatches.map((b, i) =&gt; ({
      &quot;分组编号&quot;: `第 ${i + 1} 组`,
      &quot;ASIN数量&quot;: b.length,
      &quot;ASIN列表(逗号分隔)&quot;: b.join(',')
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, &quot;分组数据&quot;);

    const batchSize = document.getElementById('batchSize').value || 100;
    XLSX.writeFile(wb, `${uploadedFileName}_${batchSize}分组.xlsx`);
    showToast(&quot;Excel 已导出！&quot;);
  }

  function copyToClipboard(text, notify = true) {
    if (navigator.clipboard &amp;&amp; window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() =&gt; { if (notify) showToast(&quot;已复制到剪贴板！&quot;); });
    } else {
      const ta = document.createElement(&quot;textarea&quot;);
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      if (notify) showToast(&quot;已复制到剪贴板！&quot;);
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() =&gt; { toast.style.display = 'none'; }, 2500);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&amp;/g, '&amp;amp;')
      .replace(/&lt;/g, '&amp;lt;')
      .replace(/&gt;/g, '&amp;gt;')
      .replace(/&quot;/g, '&amp;quot;');
  }
&lt;/script&gt;

  background:#1e293b;color:#fff;padding:11px 22px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);
  max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- 通用模态弹窗 (Modal) ---------- */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,0.68);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:900;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-card{
  background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,0.25);
  max-width:96vw;max-height:92vh;display:flex;flex-direction:column;
  position:relative;animation:modalPop .24s cubic-bezier(0.16,1,0.3,1);
  overflow:hidden;
}
@keyframes modalPop{
  from{transform:scale(0.96);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
.modal-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  border:none;background:#f1f5f9;color:#64748b;font-size:18px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
  z-index:10;
}
.modal-close:hover{background:#fee2e2;color:#ef4444;}

/* 图片查看弹窗 */
.img-modal-content{
  padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;
}
.img-modal-img{
  max-width:85vw;max-height:80vh;object-fit:contain;border-radius:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.12);
}
.img-modal-foot{margin-top:12px;font-size:13px;color:#64748b;max-width:85vw;line-height:1.4;}

/* 图表明细弹窗 */
.chart-modal-card{width:1550px;max-width:95vw;}
.chart-modal-head{padding:16px 22px 12px;border-bottom:1px solid #f0f3f8;}
.chart-modal-title{font-size:16px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.chart-modal-title a{color:var(--primary);text-decoration:none;font-family:monospace;}
.chart-modal-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1100px;}

.chart-stats-bar{
  display:flex;flex-wrap:wrap;gap:10px;padding:12px 22px;background:#f8fafc;border-bottom:1px solid var(--line);
}
.c-stat-pill{
  background:#fff;border:1px solid #e2e8f0;padding:5px 12px;border-radius:999px;font-size:12px;color:#475569;
}
.c-stat-pill b{color:#1e293b;}
.c-stat-pill.max b{color:#e85520;}
.c-stat-pill.min b{color:#0e9f6e;}

.chart-scroll-wrap{
  padding:16px 20px 22px;overflow-x:auto;overflow-y:hidden;background:#ffffff;
  -webkit-overflow-scrolling:touch;
}
.chart-svg-container{position:relative;height:380px;}

/* 全局交互 Tooltip */
.chart-tooltip{
  position:fixed;background:rgba(15,23,42,0.94);color:#fff;padding:8px 12px;border-radius:8px;
  font-size:12px;pointer-events:none;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  display:none;transform:translate(-50%, -125%);line-height:1.55;white-space:nowrap;
  backdrop-filter:blur(4px);
}
.chart-tooltip b{color:#60a5fa;}

/* ---------- 进度条 ---------- */
.progress-float{
  position:fixed;right:20px;bottom:20px;width:320px;max-width:calc(100vw - 40px);
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 32px rgba(16,24,40,.18);padding:14px 16px;z-index:500;
  transition:opacity .2s, transform .2s;
}
.progress-float[hidden]{display:none !important;}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.progress-title{font-size:13px;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:7px;}
.progress-dot{
  width:8px;height:8px;border-radius:50%;background:#4f7cff;
  box-shadow:0 0 0 3px rgba(79,124,255,.18);animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);}}
.progress-sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.progress-bar{height:8px;background:#eef2f8;border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#7ba2ff,#4f7cff);transition:width .18s ease;}
.progress-text{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;}
.progress-text b{color:#1e293b;}
.progress-mini{display:flex;justify-content:flex-end;margin-top:8px;}
.progress-mini button{border:none;background:transparent;color:#94a3b8;font-size:11px;cursor:pointer;padding:2px 4px;}
.progress-mini button:hover{color:#4f7cff;}

/* =========================================================
 *  IndexedDB 本地持久化数据库封装
 * ========================================================= */
const DB_NAME = 'AmazonHotFinderDB';
const DB_VERSION = 1;
const STORE_NAME = 'dataset';

const dbHelper = {
  db: null,
  async open(){
    if (this.db) return this.db;
    return new Promise((resolve, reject) =&gt; {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e =&gt; {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)){
          db.createObjectStore(STORE_NAME);
        }
      };
      req.onsuccess = e =&gt; {
        this.db = e.target.result;
        resolve(this.db);
      };
      req.onerror = e =&gt; reject(e.target.error);
    });
  },
  async set(key, val){
    const db = await this.open();
    return new Promise((resolve, reject) =&gt; {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(val, key);
      req.onsuccess = () =&gt; resolve();
      req.onerror = () =&gt; reject(req.error);
    });
  },
  async get(key){
    const db = await this.open();
    return new Promise((resolve, reject) =&gt; {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(key);
      req.onsuccess = () =&gt; resolve(req.result);
      req.onerror = () =&gt; reject(req.error);
    });
  },
  async clear(){
    const db = await this.open();
    return new Promise((resolve, reject) =&gt; {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.clear();
      req.onsuccess = () =&gt; resolve();
      req.onerror = () =&gt; reject(req.error);
    });
  }
};

/* =========================================================

const MONTH_RE = /^\d{4}-\d{2}$/;

/* =========================================================
 *  工具函数
 * ========================================================= */
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&amp;&lt;&gt;&quot;']/g, c =&gt; ({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]));
}
function fmtNum(v){
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n.toLocaleString('en-US');
}
function toNum(v){
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/[$,%\s]/g, '').replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}
function pick(obj, names){
  for (const n of names){
    if (obj[n] !== undefined &amp;&amp; obj[n] !== null &amp;&amp; obj[n] !== '') return obj[n];
  }
  const keys = Object.keys(obj);
  for (const n of names){
    const nn = n.replace(/\s/g, '');
    const k = keys.find(k =&gt; k.replace(/\s/g, '').includes(nn));
    if (k !== undefined &amp;&amp; obj[k] !== undefined &amp;&amp; obj[k] !== null &amp;&amp; obj[k] !== '') return obj[k];
  }
  return '';
}
function toDate(v){
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  if (typeof v === 'number'){
    const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000);
    return isNaN(d.getTime()) ? null : d;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{4})[-\/](\d{1,2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, 1);
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(d){
  if (!d) return '—';
  const p = n =&gt; String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function tsName(){
  const d = new Date(), p = n =&gt; String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
}
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() =&gt; el.classList.remove('show'), 2600);
}
function extractFabric(detail){
  if (!detail) return '';
  const s = String(detail);
  const m = s.match(/Fabric\s*type\s*[:：]\s*([^|｜]+)/i);
  return m ? m[1].trim() : '';
}
function trimLeadingZeros(series){
  if (!series || !series.length) return [];
  const firstPos = series.findIndex(s =&gt; s.val &gt; 0);
  if (firstPos === -1) return series.slice(-6);
  return series.slice(firstPos);
}

/* =========================================================
 *  并发执行器（图片并发下载控制）
 * ========================================================= */
async function mapLimit(items, limit, fn, onProgress){
  let idx = 0, done = 0;
  const total = items.length;
  const workers = new Array(Math.min(limit, total || 1)).fill(0).map(async () =&gt; {
    while (true){
      const i = idx++;
      if (i &gt;= total) break;
      try { await fn(items[i], i); }
      catch(e){ }
      done++;
      if (onProgress) onProgress(done, total);
    }
  });
  await Promise.all(workers);
}

/* =========================================================
 *  Excel 解析与读取
 * ========================================================= */
function readWorkbook(file){
  return new Promise((resolve, reject) =&gt; {
    const reader = new FileReader();
    reader.onload = e =&gt; {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
        resolve(wb);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function sheetToTable(ws){
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', blankrows:false, raw:true });
  let hIdx = -1;
  for (let i = 0; i &lt; Math.min(aoa.length, 20); i++){
    const row = aoa[i] || [];
    if (row.some(c =&gt; String(c).trim().toUpperCase() === 'ASIN')){ hIdx = i; break; }
  }
  if (hIdx === -1) hIdx = 0;

  const headers = (aoa[hIdx] || []).map(h =&gt; String(h === null || h === undefined ? '' : h).trim());
  const asinIdx = headers.findIndex(h =&gt; h.toUpperCase() === 'ASIN');

  const rows = [];
  for (let i = hIdx + 1; i &lt; aoa.length; i++){
    const r = aoa[i] || [];
    if (!r.length) continue;
    if (r.every(c =&gt; c === '' || c === null || c === undefined)) continue;
    if (asinIdx &gt;= 0){
      const a = String(r[asinIdx] === undefined ? '' : r[asinIdx]).trim();
      if (!a) continue;
    }
    const obj = {};
    headers.forEach((h, j) =&gt; { if (h) obj[h] = (r[j] === undefined ? '' : r[j]); });
    rows.push(obj);
  }
  return { headers, rows };
}

async function handleCurrentFile(f){
  if (!f) return;
  try{
    const wb = await readWorkbook(f);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const t = sheetToTable(ws);
    state.curFileName = f.name;
    state.curHeaders = t.headers;
    state.curRows = t.rows;
    $('dropCur').classList.add('done');
    $('curName').innerHTML = '✅ ' + esc(f.name) + '（' + t.rows.length + ' 条商品）';
    toast('当前商品已载入并自动保存：' + t.rows.length + ' 条');
    computeAll();
    saveAllToStorage();
  }catch(err){
    console.error(err);
    alert('读取当前商品数据失败：' + err.message);
  }
}

  const files = Array.from(fileList || []).filter(f =&gt; /\.(xlsx|xls|csv)$/i.test(f.name));
  if (!files.length) return;

  toast(`正在解析 ${files.length} 个历史数据文件...`);
  try{
    const rawBooks = [];
    const allSheetNamesSet = new Set();
    for (const f of files){
      const wb = await readWorkbook(f);
      rawBooks.push({ name: f.name, wb });
      (wb.SheetNames || []).forEach(sn =&gt; allSheetNamesSet.add(sn));
    }
    state.histRawBooks = rawBooks;
    state.detectedSheetNames = Array.from(allSheetNamesSet);

    // 智能更新页面上的子表候选标签
    renderDetectedSheetChips();

}

function processHistoryMerge(){
  if (!state.histRawBooks || !state.histRawBooks.length) return;

  const keyword = ($('histSheetKeyword').value || '').trim();
  let matchedSheetCount = 0;
  let totalSheetsScanned = 0;
  const allRows = [];
  const monthColsSet = new Set();
  const allHeadersSet = new Set();

  state.histRawBooks.forEach(item =&gt; {
    const wb = item.wb;
    const names = wb.SheetNames || [];
    totalSheetsScanned += names.length;

    let targetNames = [];
    if (keyword){
      targetNames = names.filter(sn =&gt; sn.includes(keyword));
    }
    // 若未匹配到，则尝试退化使用首个子表保底
    if (!targetNames.length){
      if (keyword){
        console.warn(`文件 ${item.name} 中未找到包含「${keyword}」的子表，已自动退化使用首个子表：${names[0]}`);
      }
      targetNames = names.length ? [names[0]] : [];
    }

    targetNames.forEach(sn =&gt; {
      matchedSheetCount++;
      const ws = wb.Sheets[sn];
      if (!ws) return;
      const t = sheetToTable(ws);
      t.headers.forEach(h =&gt; {
        allHeadersSet.add(h);
        if (MONTH_RE.test(h)) monthColsSet.add(h);
      });
      allRows.push(...t.rows);
    });
  });

  state.histHeaders = Array.from(allHeadersSet);
  state.histRows = allRows;
  state.histMonthCols = Array.from(monthColsSet).sort((a, b) =&gt; (a &lt; b ? 1 : -1));

  // ASIN 销量累加映射表
  const map = {};
  allRows.forEach(o =&gt; {
    const asin = String(o['ASIN'] || '').trim().toUpperCase();
    if (!asin) return;
    if (!map[asin]) map[asin] = {};
    state.histMonthCols.forEach(m =&gt; {
      const v = toNum(o[m]);
      if (v) map[asin][m] = (map[asin][m] || 0) + v;
    });
  });
  state.histMap = map;

  const filesLabel = state.histRawBooks.length &gt; 1
    ? `${state.histRawBooks.length} 个文件`
    : state.histRawBooks[0].name;

  state.histFileName = filesLabel;

  $('dropHist').classList.add('done');
  $('histName').innerHTML = `✅ ${esc(filesLabel)}（合并 ${matchedSheetCount} 个「${keyword || '全部'}」子表 · 共 ${allRows.length} 条记录 · ${state.histMonthCols.length} 个月份列）`;

  toast(`✅ 成功合并 ${matchedSheetCount} 个子表，共提取 ${allRows.length} 条历史记录`);
  computeAll();
  saveAllToStorage();
}

function bindDrop(dropEl, inputEl, handler, isMulti = false){
  ['dragenter','dragover'].forEach(ev =&gt; {
    dropEl.addEventListener(ev, e =&gt; {
      e.preventDefault(); e.stopPropagation();
      dropEl.classList.add('dragover');
    });
  });
  ['dragleave','drop'].forEach(ev =&gt; {
    dropEl.addEventListener(ev, e =&gt; {
      e.preventDefault(); e.stopPropagation();
      if (ev === 'dragleave' &amp;&amp; dropEl.contains(e.relatedTarget)) return;
      dropEl.classList.remove('dragover');
    });
  });
  dropEl.addEventListener('drop', e =&gt; {
    const files = e.dataTransfer &amp;&amp; e.dataTransfer.files;
    if (files &amp;&amp; files.length){
      inputEl.files = files;
      if (isMulti) handler(files);
      else handler(files[0]);
    }
  });
}

/* =========================================================
 *  计算与业务规则
 * ========================================================= */
function getConfig(){
  const n = (id, def) =&gt; {
    const v = parseFloat($(id).value);
    return isNaN(v) ? def : v;
  };
  return {
    newDays:      n('cfgNewDays', 365),
    newSales:     n('cfgNewSales', 10000),
    oldSales12:   n('cfgOldSales12', 30000),
    oldSalesYear: n('cfgOldSalesYear', 30000),
    recentMonths: Math.max(1, n('cfgRecentMonths', 12)),
    year: (($('cfgYear').value || '2025').trim()),
  };
}

function computeAll(){
  const cfg = getConfig();
  state.yearLabel = cfg.year;

  const recentCols = state.histMonthCols.slice(0, cfg.recentMonths);
  const yearCols   = state.histMonthCols.filter(m =&gt; m.indexOf(cfg.year + '-') === 0);
  const today = new Date();

  const chronoMonths = [...state.histMonthCols].sort();

  state.merged = state.curRows.map(raw =&gt; {
    const asinRaw = String(pick(raw, ['ASIN']) || '').trim();
    const key = asinRaw.toUpperCase();
    const hist = state.histMap[key] || {};

    let last12 = 0;
    recentCols.forEach(m =&gt; last12 += toNum(hist[m]));
    let yearSales = 0;
    yearCols.forEach(m =&gt; yearSales += toNum(hist[m]));

    const launchRaw = pick(raw, ['上架时间', '上架日期', '上架']);
    const launchDate = toDate(launchRaw);
    let days = toNum(pick(raw, ['上架天数']));
    if (!days || days &lt;= 0){
      days = launchDate ? Math.floor((today - launchDate) / 86400000) : null;
    } else {
      days = Math.round(days);
    }

    const isNew = (days !== null &amp;&amp; days &lt;= cfg.newDays);

    let isHot = false, hotReason = '';
    if (isNew){
      if (last12 &gt;= cfg.newSales){
        isHot = true;
        hotReason = '新品近' + cfg.recentMonths + '月销量 ≥ ' + cfg.newSales.toLocaleString();
      }
    } else {
      if (last12 &gt;= cfg.oldSales12){
        isHot = true;
        hotReason = '老品近' + cfg.recentMonths + '月销量 ≥ ' + cfg.oldSales12.toLocaleString();
      } else if (yearSales &gt;= cfg.oldSalesYear){
        isHot = true;
        hotReason = '老品' + cfg.year + '年销量 ≥ ' + cfg.oldSalesYear.toLocaleString();
      }
    }

    const asin   = asinRaw;
    const title  = String(pick(raw, ['商品标题', '标题']) || '');
    const brand  = String(pick(raw, ['品牌']) || '');
    const img    = String(pick(raw, ['商品主图', '主图', '图片']) || '');
    const linkRaw= String(pick(raw, ['商品详情页链接', '链接', 'URL']) || '');
    const link   = linkRaw || (asin ? ('https://www.amazon.com/dp/' + asin) : '#');
    const parent = String(pick(raw, ['父ASIN']) || '');
    const bigCat = String(pick(raw, ['大类目']) || '');
    const bsr    = pick(raw, ['大类BSR']);
    const smallBsr = pick(raw, ['小类BSR']);
    const smallCat = String(pick(raw, ['小类目']) || '');
    const recentSales = toNum(pick(raw, ['月销量']));
    const price  = pick(raw, ['价格($)', '价格']);
    const reviews= toNum(pick(raw, ['评分数']));
    const rating = pick(raw, ['评分']);
    const fulfill= String(pick(raw, ['配送方式']) || '');
    const detail = String(pick(raw, ['详细参数']) || '');
    const fabric = extractFabric(detail);

    const rawSeries = chronoMonths.map(m =&gt; ({ month: m, val: toNum(hist[m]) }));
    const series = trimLeadingZeros(rawSeries);

    const positiveSeries = series.filter(s =&gt; s.val &gt; 0);
    let maxVal = 0, minVal = 0;
    if (positiveSeries.length &gt; 0){
      maxVal = Math.max(...positiveSeries.map(s =&gt; s.val));
      minVal = Math.min(...positiveSeries.map(s =&gt; s.val));
    }

    return {
      raw, asin, key, title, brand, img, link, parent, bigCat,
      bsr, smallBsr, smallCat, recentSales, price, reviews, rating,
      fulfill, detail, fabric,
      launchDate, days, isNew, isHot, hotReason,
      last12, yearSales, series, rawSeries, maxVal, minVal
    };
  });

  state.page = 1;
  render();
}

/* =========================================================
 *  迷你折线图生成
 * ========================================================= */
function renderMiniChart(p){
  const series = p.series || [];
  if (!series.length){
    return `
      &lt;div class=&quot;trend-head&quot;&gt;&lt;span&gt;历史月销量走势&lt;/span&gt;&lt;span class=&quot;trend-zoom&quot;&gt;🔍 放大&lt;/span&gt;&lt;/div&gt;
      &lt;div style=&quot;height:46px;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:11px;&quot;&gt;无历史数据&lt;/div&gt;
    `;
  }

  const maxVal = p.maxVal;
  const minVal = p.minVal;
  const maxSeriesVal = Math.max(...series.map(s =&gt; s.val), 1);

  const padTop = 15, padBottom = 10;
  const usableH = 46 - padTop - padBottom;
  const step = series.length &gt; 1 ? 100 / (series.length - 1) : 100;

  let maxPt = null, minPt = null;

  const points = series.map((s, idx) =&gt; {
    const x = idx * step;
    const y = 46 - padBottom - (s.val / maxSeriesVal) * usableH;
    const pt = { x, y, val: s.val, month: s.month };
    if (maxVal &gt; 0 &amp;&amp; s.val === maxVal &amp;&amp; !maxPt) maxPt = pt;
    if (minVal &gt; 0 &amp;&amp; s.val === minVal &amp;&amp; !minPt) minPt = pt;
    return pt;
  });

  const pathD = points.map((pt, i) =&gt; (i === 0 ? `M ${pt.x} ${pt.y}` : `L ${pt.x} ${pt.y}`)).join(' ');
  const areaD = `${pathD} L ${points[points.length-1].x} 46 L ${points[0].x} 46 Z`;

  let keyMarkers = '';
  if (maxPt){
    keyMarkers += `&lt;circle cx=&quot;${maxPt.x}&quot; cy=&quot;${maxPt.y}&quot; r=&quot;3&quot; fill=&quot;#ff6b35&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;1.5&quot;/&gt;`;
  }
  if (minPt &amp;&amp; minPt !== maxPt){
    keyMarkers += `&lt;circle cx=&quot;${minPt.x}&quot; cy=&quot;${minPt.y}&quot; r=&quot;2.8&quot; fill=&quot;#10b981&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;1.5&quot;/&gt;`;
  }

  let badgesHtml = '';
  if (maxPt){
    let transform = 'translate(-50%, -105%)';
    if (maxPt.x &gt; 75) transform = 'translate(-92%, -105%)';
    else if (maxPt.x &lt; 25) transform = 'translate(-8%, -105%)';

    badgesHtml += `
      &lt;div class=&quot;mini-badge max&quot; style=&quot;left:${maxPt.x.toFixed(1)}%;top:${Math.max(maxPt.y - 1, 1).toFixed(1)}px;transform:${transform};&quot;&gt;
        MAX ${fmtNum(maxVal)}
      &lt;/div&gt;
    `;
  }

  if (minPt &amp;&amp; minPt !== maxPt){
    let transform = 'translate(-50%, -105%)';
    let topPx = minPt.y - 1;
    if (minPt.y &lt; 22){
      topPx = minPt.y + 11;
      transform = 'translate(-50%, 0%)';
    }
    if (minPt.x &gt; 75) transform = transform.replace('-50%', '-92%');
    else if (minPt.x &lt; 25) transform = transform.replace('-50%', '-8%');

    badgesHtml += `
      &lt;div class=&quot;mini-badge min&quot; style=&quot;left:${minPt.x.toFixed(1)}%;top:${topPx.toFixed(1)}px;transform:${transform};&quot;&gt;
        MIN ${fmtNum(minVal)}
      &lt;/div&gt;
    `;
  }

  return `
    &lt;div class=&quot;trend-head&quot;&gt;
      &lt;span&gt;月销量走势 (${series.length}个月)&lt;/span&gt;
      &lt;span class=&quot;trend-zoom&quot;&gt;🔍 点击放大&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;trend-svg-box&quot; onmousemove=&quot;handleMiniMove(event, '${esc(p.asin)}')&quot; onmouseleave=&quot;hideTip()&quot;&gt;
      &lt;svg viewBox=&quot;0 0 100 46&quot; preserveAspectRatio=&quot;none&quot;&gt;
        &lt;defs&gt;
          &lt;linearGradient id=&quot;g_${p.asin}&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;
            &lt;stop offset=&quot;0%&quot; stop-color=&quot;#4f7cff&quot; stop-opacity=&quot;0.22&quot;/&gt;
            &lt;stop offset=&quot;100%&quot; stop-color=&quot;#4f7cff&quot; stop-opacity=&quot;0.0&quot;/&gt;
          &lt;/linearGradient&gt;
        &lt;/defs&gt;
        &lt;path d=&quot;${areaD}&quot; fill=&quot;url(#g_${p.asin})&quot;/&gt;
        &lt;path d=&quot;${pathD}&quot; fill=&quot;none&quot; stroke=&quot;#3b82f6&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
        ${keyMarkers}
      &lt;/svg&gt;
      ${badgesHtml}
    &lt;/div&gt;
  `;
}

window.handleMiniMove = function(e, asin){
  const p = state.merged.find(item =&gt; item.asin === asin);
  if (!p || !p.series || !p.series.length) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const idx = Math.round(ratio * (p.series.length - 1));
  const item = p.series[idx];
  if (item){
    showTip(e, item.month, item.val);
  }
};

/* =========================================================
 *  Tooltip 悬浮提示
 * ========================================================= */
const tipEl = $('chartTooltip');
window.showTip = function(e, month, val, extraHtml){
  tipEl.innerHTML = `&lt;div&gt;月份：&lt;b&gt;${month}&lt;/b&gt;&lt;/div&gt;&lt;div&gt;销量：&lt;b&gt;${fmtNum(val)}&lt;/b&gt;&lt;/div&gt;${extraHtml || ''}`;
  tipEl.style.display = 'block';
  moveTip(e);
};
window.moveTip = function(e){
  tipEl.style.left = e.clientX + 'px';
  tipEl.style.top = (e.clientY - 12) + 'px';
};
window.hideTip = function(){
  tipEl.style.display = 'none';
};

/* =========================================================
 *  放大大图表弹窗
 * ========================================================= */
window.openChartModal = function(asin){
  const p = state.merged.find(item =&gt; item.asin === asin);
  if (!p) return;

  $('cmAsinLink').textContent = p.asin;
  $('cmAsinLink').href = p.link;
  $('cmTitle').textContent = p.title || '（无商品标题）';

  const series = p.series || [];
  const maxVal = p.maxVal;
  const minVal = p.minVal;
  let totalSales = 0;
  series.forEach(s =&gt; totalSales += s.val);
  const avgSales = series.length ? Math.round(totalSales / series.length) : 0;

  $('cmStatsBar').innerHTML = `
    &lt;div class=&quot;c-stat-pill&quot;&gt;有效销售期：&lt;b&gt;${series.length} 个月&lt;/b&gt;（已省去未起步0值）&lt;/div&gt;
    &lt;div class=&quot;c-stat-pill&quot;&gt;累计销量：&lt;b&gt;${fmtNum(totalSales)}&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;c-stat-pill&quot;&gt;月均销量：&lt;b&gt;${fmtNum(avgSales)}&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;c-stat-pill max&quot;&gt;最高月(MAX)：&lt;b&gt;${maxVal &gt; 0 ? fmtNum(maxVal) : '—'}&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;c-stat-pill min&quot;&gt;最低月(MIN&gt;0)：&lt;b&gt;${minVal &gt; 0 ? fmtNum(minVal) : '—'}&lt;/b&gt;&lt;/div&gt;
  `;

  if (!series.length){
    $('cmChartBox').innerHTML = `&lt;div style=&quot;text-align:center;padding:120px 0;color:#94a3b8;&quot;&gt;未匹配到该产品的有效销量明细&lt;/div&gt;`;
    openModal('chartModal');
    return;
  }

  const wrapEl = $('cmScrollWrap');
  const availableW = Math.max(920, (wrapEl ? wrapEl.clientWidth - 40 : 1200));

  const colWidth = Math.max(52, Math.floor((availableW - 100) / series.length));
  const leftPad = 65, rightPad = 35, topPad = 52, btmPad = 52;
  const chartW = Math.max(availableW, leftPad + rightPad + series.length * colWidth);
  const chartH = 360;
  const innerH = chartH - topPad - btmPad;

  const maxV = Math.max(...series.map(s =&gt; s.val), 10);
  const yMax = Math.ceil(maxV * 1.25);

  const gridSteps = 4;
  let gridLines = '';
  for (let i = 0; i &lt;= gridSteps; i++){
    const y = topPad + innerH - (i / gridSteps) * innerH;
    const val = Math.round((yMax / gridSteps) * i);
    gridLines += `
      &lt;line x1=&quot;${leftPad}&quot; y1=&quot;${y}&quot; x2=&quot;${chartW - rightPad}&quot; y2=&quot;${y}&quot; stroke=&quot;#edf2f7&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;3,3&quot;/&gt;
      &lt;text x=&quot;${leftPad - 10}&quot; y=&quot;${y + 4}&quot; font-size=&quot;10&quot; fill=&quot;#94a3b8&quot; text-anchor=&quot;end&quot;&gt;${fmtNum(val)}&lt;/text&gt;
    `;
  }

  const barW = Math.min(16, Math.max(12, Math.floor(colWidth * 0.32)));
  const hist = state.histMap[p.key] || {};

  const points = series.map((s, idx) =&gt; {
    const cx = leftPad + idx * colWidth + colWidth / 2;
    const barH = (s.val / yMax) * innerH;
    const barY = topPad + innerH - barH;

    const parts = s.month.split('-');
    const lastYearMonth = (parseInt(parts[0], 10) - 1) + '-' + parts[1];
    const lastYearVal = hist[lastYearMonth];

    let yoyText = '';
    if (lastYearVal !== undefined &amp;&amp; lastYearVal !== null){
      const lyv = toNum(lastYearVal);
      if (lyv &gt; 0){
        const diff = s.val - lyv;
        const rate = ((diff / lyv) * 100).toFixed(1);
        const sign = diff &gt;= 0 ? '+' : '';
        const color = diff &gt;= 0 ? '#4ade80' : '#f87171';
        yoyText = `&lt;div style=&quot;font-size:11px;color:${color};&quot;&gt;同比去年同期 (${lastYearMonth})：&lt;b&gt;${sign}${rate}%&lt;/b&gt; (${sign}${fmtNum(diff)})&lt;/div&gt;`;
      } else {
        yoyText = `&lt;div style=&quot;font-size:11px;color:#94a3b8;&quot;&gt;同比去年同期 (${lastYearMonth})：去年为 0&lt;/div&gt;`;
      }
    } else {
      yoyText = `&lt;div style=&quot;font-size:11px;color:#94a3b8;&quot;&gt;同比去年同期 (${lastYearMonth})：无去年数据&lt;/div&gt;`;
    }

    return { month: s.month, val: s.val, cx, barY, barH, idx, yoyText };
  });

  currentChartData = { p, points, maxVal, minVal };
  const lineD = points.map((pt, i) =&gt; (i === 0 ? `M ${pt.cx} ${pt.barY}` : `L ${pt.cx} ${pt.barY}`)).join(' ');

  let barsHtml = '';
  let labelsHtml = '';
  let hitAreas = '';
  let guideLine = `&lt;line id=&quot;cmGuideLine&quot; x1=&quot;0&quot; y1=&quot;${topPad}&quot; x2=&quot;0&quot; y2=&quot;${topPad + innerH}&quot; stroke=&quot;#94a3b8&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;3,3&quot; opacity=&quot;0&quot;/&gt;`;

  points.forEach((pt, i) =&gt; {
    const isMax = maxVal &gt; 0 &amp;&amp; pt.val === maxVal;
    const isMin = minVal &gt; 0 &amp;&amp; pt.val === minVal;

    let barFill = 'url(#cmBarGradNormal)';
    if (isMax) barFill = 'url(#cmBarGradMax)';
    else if (isMin) barFill = 'url(#cmBarGradMin)';

    barsHtml += `
      &lt;rect id=&quot;cmBar_${i}&quot; x=&quot;${pt.cx - barW/2}&quot; y=&quot;${pt.barY}&quot; width=&quot;${barW}&quot; height=&quot;${Math.max(pt.barH, 2)}&quot; rx=&quot;3&quot; ry=&quot;3&quot; fill=&quot;${barFill}&quot;/&gt;
    `;

    let numColor = '#334155';
    let valText = fmtNum(pt.val);
    if (isMax) numColor = '#e85520';
    if (isMin) numColor = '#0e9f6e';

    let badge = '';
    if (isMax){
      badge = `
        &lt;rect x=&quot;${pt.cx - 24}&quot; y=&quot;${pt.barY - 34}&quot; width=&quot;48&quot; height=&quot;15&quot; rx=&quot;7.5&quot; fill=&quot;#ff6b35&quot;/&gt;
        &lt;text x=&quot;${pt.cx}&quot; y=&quot;${pt.barY - 23}&quot; font-size=&quot;9&quot; fill=&quot;#ffffff&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;&gt;MAX 🔥&lt;/text&gt;
      `;
    } else if (isMin){
      badge = `
        &lt;rect x=&quot;${pt.cx - 22}&quot; y=&quot;${pt.barY - 34}&quot; width=&quot;44&quot; height=&quot;15&quot; rx=&quot;7.5&quot; fill=&quot;#10b981&quot;/&gt;
        &lt;text x=&quot;${pt.cx}&quot; y=&quot;${pt.barY - 23}&quot; font-size=&quot;9&quot; fill=&quot;#ffffff&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;&gt;MIN 📍&lt;/text&gt;
      `;
    }

    labelsHtml += `
      ${badge}
      &lt;text x=&quot;${pt.cx}&quot; y=&quot;${isMax || isMin ? pt.barY - 7 : pt.barY - 6}&quot; font-size=&quot;10.5&quot; font-weight=&quot;700&quot; fill=&quot;${numColor}&quot; text-anchor=&quot;middle&quot;&gt;${valText}&lt;/text&gt;
      &lt;text x=&quot;${pt.cx}&quot; y=&quot;${chartH - btmPad + 18}&quot; font-size=&quot;10.5&quot; fill=&quot;#64748b&quot; text-anchor=&quot;middle&quot;&gt;${pt.month}&lt;/text&gt;
    `;

    hitAreas += `
      &lt;rect x=&quot;${pt.cx - colWidth/2}&quot; y=&quot;${topPad}&quot; width=&quot;${colWidth}&quot; height=&quot;${innerH + btmPad}&quot;
            fill=&quot;transparent&quot; style=&quot;cursor:pointer;&quot;
            onmouseenter=&quot;hoverCol(event, ${i})&quot;
            onmousemove=&quot;moveTip(event)&quot;
            onmouseleave=&quot;unhoverCol(${i})&quot;/&gt;
    `;
  });

  const circlesHtml = points.map((pt, i) =&gt; {
    const isMax = maxVal &gt; 0 &amp;&amp; pt.val === maxVal;
    const isMin = minVal &gt; 0 &amp;&amp; pt.val === minVal;
    let r = 3.5, fill = '#3b82f6', stroke = '#fff';
    if (isMax){ r = 5.5; fill = '#ff6b35'; }
    else if (isMin){ r = 5.0; fill = '#10b981'; }
    return `&lt;circle id=&quot;cmDot_${i}&quot; cx=&quot;${pt.cx}&quot; cy=&quot;${pt.barY}&quot; r=&quot;${r}&quot; fill=&quot;${fill}&quot; stroke=&quot;${stroke}&quot; stroke-width=&quot;2&quot;/&gt;`;
  }).join('');

  $('cmChartBox').innerHTML = `
    &lt;svg width=&quot;${chartW}&quot; height=&quot;${chartH}&quot; style=&quot;display:block;&quot;&gt;
      &lt;defs&gt;
        &lt;linearGradient id=&quot;cmBarGradNormal&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0%&quot; stop-color=&quot;#93c5fd&quot; stop-opacity=&quot;0.85&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#dbeafe&quot; stop-opacity=&quot;0.3&quot;/&gt;
        &lt;/linearGradient&gt;
        &lt;linearGradient id=&quot;cmBarGradMax&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0%&quot; stop-color=&quot;#ff7a45&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#ffd5c2&quot; stop-opacity=&quot;0.4&quot;/&gt;
        &lt;/linearGradient&gt;
        &lt;linearGradient id=&quot;cmBarGradMin&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0%&quot; stop-color=&quot;#10b981&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#bbf7d0&quot; stop-opacity=&quot;0.4&quot;/&gt;
        &lt;/linearGradient&gt;
      &lt;/defs&gt;
      ${gridLines}
      ${barsHtml}
      &lt;path d=&quot;${lineD}&quot; fill=&quot;none&quot; stroke=&quot;#2563eb&quot; stroke-width=&quot;2.5&quot; stroke-linejoin=&quot;round&quot; stroke-linecap=&quot;round&quot;/&gt;
      ${circlesHtml}
      ${guideLine}
      ${labelsHtml}
      ${hitAreas}
    &lt;/svg&gt;
  `;

  openModal('chartModal');
};

window.hoverCol = function(e, idx){
  if (!currentChartData || !currentChartData.points) return;
  const pt = currentChartData.points[idx];
  if (!pt) return;

  const isMax = currentChartData.maxVal &gt; 0 &amp;&amp; pt.val === currentChartData.maxVal;
  const isMin = currentChartData.minVal &gt; 0 &amp;&amp; pt.val === currentChartData.minVal;

  let extra = pt.yoyText || '';
  if (isMax) extra += `&lt;div style=&quot;color:#fb923c;font-weight:600;&quot;&gt;🔥 历史最高销量月份&lt;/div&gt;`;
  if (isMin) extra += `&lt;div style=&quot;color:#34d399;font-weight:600;&quot;&gt;📍 历史起步/最低月份&lt;/div&gt;`;

  showTip(e, pt.month, pt.val, extra);

  const guide = $('cmGuideLine');
  if (guide){
    guide.setAttribute('x1', pt.cx);
    guide.setAttribute('x2', pt.cx);
    guide.setAttribute('opacity', '0.7');
  }
  const dot = $('cmDot_' + idx);
  if (dot) dot.setAttribute('stroke-width', '3.5');
  const bar = $('cmBar_' + idx);
  if (bar) bar.style.filter = 'brightness(0.9)';
};

window.unhoverCol = function(idx){
  hideTip();
  const guide = $('cmGuideLine');
  if (guide) guide.setAttribute('opacity', '0');
  const dot = $('cmDot_' + idx);
  if (dot) dot.setAttribute('stroke-width', '2');
  const bar = $('cmBar_' + idx);
  if (bar) bar.style.filter = 'none';
};

/* =========================================================
 *  列表与卡片渲染
 * ========================================================= */
function currentList(){
  const kw = state.keyword.trim().toLowerCase();
  let list = state.merged.filter(p =&gt; {
    if (state.onlyHot &amp;&amp; !p.isHot) return false;
    if (state.gradeFilter === 'new' &amp;&amp; !p.isNew) return false;
    if (state.gradeFilter === 'old' &amp;&amp; p.isNew) return false;
    if (kw){
      const hay = (p.asin + ' ' + p.title + ' ' + p.brand).toLowerCase();
      if (hay.indexOf(kw) === -1) return false;
    }
    return true;
  });
  list.sort((a, b) =&gt; b.last12 - a.last12 || b.yearSales - a.yearSales);
  return list;
}

function render(){
  const list = currentList();
  state.filtered = list;

  const cfg = getConfig();
  const total = state.merged.length;
  const hotCount = state.merged.filter(p =&gt; p.isHot).length;
  const newCount = state.merged.filter(p =&gt; p.isNew).length;
  const oldCount = total - newCount;

  $('stats').innerHTML = `
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;商品总数&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${total.toLocaleString()}&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat hot&quot;&gt;&lt;div class=&quot;k&quot;&gt;爆品数量&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${hotCount.toLocaleString()}&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;当前筛选结果&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${list.length.toLocaleString()}&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;k&quot;&gt;新品 / 老品&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${newCount} / ${oldCount}&lt;/div&gt;&lt;/div&gt;
  `;

  if (!state.curRows.length){
    $('listArea').innerHTML = `&lt;div class=&quot;empty&quot;&gt;
      📄 还没有数据&lt;br&gt;
      &lt;span style=&quot;font-size:13px;&quot;&gt;请先上传「当前商品数据」和「历史销量数据」Excel 文件（支持多子表合并 · 支持拖拽 · 自动记忆）&lt;/span&gt;
    &lt;/div&gt;`;
    $('pagerArea').innerHTML = '';
    return;
  }

  if (!list.length){
    $('listArea').innerHTML = `&lt;div class=&quot;empty&quot;&gt;
      🔍 没有符合条件的产品&lt;br&gt;
      &lt;span style=&quot;font-size:13px;&quot;&gt;试试关闭「只看爆品」、切换新老品筛选，或放宽爆品阈值&lt;/span&gt;
    &lt;/div&gt;`;
    $('pagerArea').innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (state.page &gt; totalPages) state.page = totalPages;
  const start = (state.page - 1) * PAGE_SIZE;
  const pageItems = list.slice(start, start + PAGE_SIZE);

  $('listArea').innerHTML = '&lt;div class=&quot;grid&quot;&gt;' + pageItems.map(p =&gt; renderCard(p, cfg)).join('') + '&lt;/div&gt;';
  $('pagerArea').innerHTML = renderPager(list.length, totalPages);
}

function renderCard(p, cfg){
  const imgHtml = p.img
    ? `&lt;img src=&quot;${esc(p.img)}&quot; loading=&quot;lazy&quot; referrerpolicy=&quot;no-referrer&quot; alt=&quot;&quot;
         onclick=&quot;openImgModal('${esc(p.img)}', '${esc(p.asin)} - ${esc(p.title)}')&quot;
         onerror=&quot;this.outerHTML='&amp;lt;div class=\\'noimg\\'&amp;gt;无图&amp;lt;/div&amp;gt;'&quot;&gt;
       &lt;div class=&quot;thumb-zoom-hint&quot;&gt;🔍 点击放大&lt;/div&gt;`
    : `&lt;div class=&quot;noimg&quot;&gt;无图&lt;/div&gt;`;

  const hotTag = p.isHot
    ? `&lt;span class=&quot;tag tag-hot&quot; title=&quot;${esc(p.hotReason)}&quot;&gt;🔥 爆品&lt;/span&gt;`
    : `&lt;span class=&quot;tag tag-plain&quot;&gt;非爆品&lt;/span&gt;`;

  const newTag = p.isNew
    ? `&lt;span class=&quot;tag tag-new&quot;&gt;新品&lt;/span&gt;`
    : `&lt;span class=&quot;tag tag-old&quot;&gt;老品&lt;/span&gt;`;

  const brandHtml = `&lt;span class=&quot;brand-badge&quot; title=&quot;品牌：${esc(p.brand)}&quot;&gt;品牌：&lt;b&gt;${esc(p.brand) || '—'}&lt;/b&gt;&lt;/span&gt;`;

  const daysTxt = (p.days === null || p.days === undefined || isNaN(p.days)) ? '—' : (p.days + ' 天');
  const launchTxt = fmtDate(p.launchDate);

  const priceTxt = (p.price === '' || p.price === null || p.price === undefined)
    ? '—' : ('$' + (isNaN(Number(p.price)) ? p.price : Number(p.price).toFixed(2)));

  const ratingTxt = (p.rating === '' || p.rating === null || p.rating === undefined) ? '—' : p.rating;

  const bsrTxt = (p.bsr === '' || p.bsr === null || p.bsr === undefined)
    ? '—' : ('#' + Math.round(toNum(p.bsr)).toLocaleString());

  return `
  &lt;div class=&quot;card ${p.isHot ? 'is-hot' : ''}&quot;&gt;
    &lt;div class=&quot;thumb&quot; title=&quot;点击放大查看原图&quot;&gt;${imgHtml}&lt;/div&gt;
    &lt;div class=&quot;info&quot;&gt;
      &lt;div class=&quot;row1&quot;&gt;
        &lt;a class=&quot;asin&quot; href=&quot;${esc(p.link)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; title=&quot;点击跳转到 Amazon 详情页&quot;&gt;${esc(p.asin)}&lt;/a&gt;
        ${newTag}
        ${hotTag}
        ${brandHtml}
      &lt;/div&gt;
      &lt;div class=&quot;ttl&quot; title=&quot;${esc(p.title)}&quot;&gt;${esc(p.title) || '（无标题）'}&lt;/div&gt;

      &lt;div class=&quot;metrics&quot;&gt;
        &lt;div class=&quot;metric hl&quot;&gt;&lt;span&gt;近${cfg.recentMonths}月销量&lt;/span&gt;&lt;b&gt;${fmtNum(p.last12)}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;metric&quot;&gt;&lt;span&gt;${esc(cfg.year)}年销量&lt;/span&gt;&lt;b&gt;${fmtNum(p.yearSales)}&lt;/b&gt;&lt;/div&gt;

        &lt;div class=&quot;metric&quot;&gt;&lt;span&gt;当前价格&lt;/span&gt;&lt;b&gt;${priceTxt}&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;metric metric-trend&quot; onclick=&quot;openChartModal('${esc(p.asin)}')&quot;&gt;
          ${renderMiniChart(p)}
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;meta&quot;&gt;
        &lt;span&gt;评分：&lt;b&gt;${esc(ratingTxt)}&lt;/b&gt;（&lt;b&gt;${fmtNum(p.reviews)}&lt;/b&gt;）&lt;/span&gt;
        &lt;span&gt;上架：&lt;b&gt;${launchTxt}&lt;/b&gt;（&lt;b&gt;${daysTxt}&lt;/b&gt;）&lt;/span&gt;
        &lt;span&gt;配送：&lt;b&gt;${esc(p.fulfill) || '—'}&lt;/b&gt;&lt;/span&gt;
        ${p.smallCat ? `&lt;span&gt;小类目：&lt;b&gt;${esc(p.smallCat)}&lt;/b&gt;${p.smallBsr !== '' ? ' #' + Math.round(toNum(p.smallBsr)) : ''}&lt;/span&gt;` : ''}
        ${p.parent ? `&lt;span&gt;父ASIN：&lt;b&gt;${esc(p.parent)}&lt;/b&gt;&lt;/span&gt;` : ''}

      &lt;div class=&quot;fabric&quot; title=&quot;Fabric type：${esc(p.fabric)}&quot;&gt;
        &lt;b&gt;材质：&lt;/b&gt;${esc(p.fabric) || '未识别到 Fabric type'}

}

function renderPager(total, totalPages){
  const p = state.page;
  return `
  &lt;div class=&quot;pager&quot;&gt;
    &lt;span class=&quot;pager-info&quot;&gt;共 &lt;b&gt;${total.toLocaleString()}&lt;/b&gt; 条 · 第 &lt;b&gt;${p}&lt;/b&gt; / ${totalPages} 页&lt;/span&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;gotoPage(1)&quot; ${p === 1 ? 'disabled' : ''}&gt;首页&lt;/button&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;gotoPage(${p - 1})&quot; ${p === 1 ? 'disabled' : ''}&gt;上一页&lt;/button&gt;
    &lt;input class=&quot;page-input&quot; type=&quot;number&quot; min=&quot;1&quot; max=&quot;${totalPages}&quot; value=&quot;${p}&quot;
           onchange=&quot;gotoPage(parseInt(this.value)||1)&quot;&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;gotoPage(${p + 1})&quot; ${p === totalPages ? 'disabled' : ''}&gt;下一页&lt;/button&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;gotoPage(${totalPages})&quot; ${p === totalPages ? 'disabled' : ''}&gt;末页&lt;/button&gt;
  &lt;/div&gt;`;
}

window.gotoPage = function(n){
  const total = state.filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  n = parseInt(n) || 1;
  if (n &lt; 1) n = 1;
  if (n &gt; totalPages) n = totalPages;
  state.page = n;
  render();
  const top = document.querySelector('.stats');
  if (top) window.scrollTo({ top: top.offsetTop - 80, behavior: 'smooth' });
};

function dataURLtoBase64(dataURL){
  const m = dataURL.match(/^data:image\/(png|jpeg|jpg|gif|webp);base64,(.*)$/i);
  if (!m) throw new Error('不支持的图片格式');
  let ext = m[1].toLowerCase();
  if (ext === 'jpg') ext = 'jpeg';
  if (ext === 'webp') ext = 'png';
  return { base64: m[2], extension: ext };
}

async function fetchImageBase64(url){
  const res = await fetch(url, { mode:'cors', credentials:'omit', cache:'force-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();
  return await new Promise((resolve, reject) =&gt; {
    const fr = new FileReader();
    fr.onload = () =&gt; resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

async function doExport(withImages){
  if (!state.curRows.length){ toast('请先上传「当前商品数据」文件'); return; }
  if (!state.filtered.length){ toast('当前筛选结果为空，没有可导出的数据'); return; }

  const menuBtn = $('btnExportMenu');
  menuBtn.disabled = true;

  try{
    const cfg = getConfig();
    const baseHeaders = state.curHeaders.filter(h =&gt; h &amp;&amp; h.trim() !== '');
    const extraHeaders = ['爆品标识', '新老品', '近' + cfg.recentMonths + '月销量', cfg.year + '年销量'];
    const rowsData = state.filtered;

    if (withImages){
      showProgress('正在生成 Excel（含图片）', '共 ' + rowsData.length + ' 条商品，可继续浏览产品');
      updateProgress(0, rowsData.length, '准备中…');
    }

    const wb = new ExcelJS.Workbook();
    wb.creator = '爆品筛选工具';
    const ws = wb.addWorksheet('爆品筛选结果', {
      views: [{ state:'frozen', ySplit: 1 }]
    });

    const headerRow = ws.addRow(['图片', ...baseHeaders, ...extraHeaders]);
    headerRow.height = 26;
    headerRow.font = { bold: true, size: 11, color: { argb:'FF1F2937' } };
    headerRow.alignment = { vertical:'middle', horizontal:'center' };
    headerRow.eachCell(c =&gt; {
      c.fill = { type:'pattern', pattern:'solid', fgColor: { argb:'FFEEF3FF' } };
      c.border = { bottom: { style:'thin', color: { argb:'FFD6E0F0' } } };
    });

    if (withImages){
      ws.getColumn(1).width = 17;
    } else {
      ws.getColumn(1).width = 12;
    }
    baseHeaders.forEach((h, i) =&gt; {
      ws.getColumn(i + 2).width = Math.min(Math.max(String(h).length + 4, 10), 40);
    });
    extraHeaders.forEach((h, i) =&gt; {
      ws.getColumn(baseHeaders.length + 2 + i).width = 15;
    });

    const rowsMeta = [];
    rowsData.forEach(p =&gt; {
      const rowVals = baseHeaders.map(h =&gt; {
        const v = p.raw[h];
        if (v instanceof Date) return fmtDate(v);
        if (v === null || v === undefined) return '';
        return v;
      });
      rowVals.push(
        p.isHot ? '爆品' : '非爆品',
        p.isNew ? '新品' : '老品',
        p.last12,
        p.yearSales
      );

      const r = ws.addRow(['', ...rowVals]);
      r.height = withImages ? 100 : 20;
      r.alignment = { vertical:'middle' };
      rowsMeta.push({ row: r.number, img: p.img });
    });

    let ok = 0, fail = 0;

    if (withImages){
      const IMG_W = 110;
      const IMG_H = 130;

      await mapLimit(rowsMeta, 8, async (m) =&gt; {
        if (!m.img){
          const c = ws.getCell(m.row, 1);
          c.value = '无图';
          c.alignment = { vertical:'middle', horizontal:'center' };
          c.font = { size: 10, color: { argb:'FF94A3B8' } };
          return;
        }
        try{
          const dataURL = await fetchImageBase64(m.img);
          const { base64, extension } = dataURLtoBase64(dataURL);
          const imgId = wb.addImage({ base64, extension });
          ws.addImage(imgId, {
            tl: { col: 0.1, row: m.row - 1 + 0.05 },
            ext: { width: IMG_W, height: IMG_H },
            editAs: 'oneCell'
          });
          ok++;
        }catch(err){
          fail++;
          const c = ws.getCell(m.row, 1);
          c.value = { text: '查看图片', hyperlink: m.img, tooltip: m.img };
          c.font = { color: { argb:'FF4F7CFF' }, underline: true, size: 10 };
          c.alignment = { vertical:'middle', horizontal:'center' };
        }
      }, (done, total) =&gt; {
        updateProgress(done, total, '已处理图片 ' + done + ' / ' + total);
      });

      ws.getColumn(1).alignment = { vertical:'middle', horizontal:'center' };
    }

    if (withImages) updateProgress(rowsData.length, rowsData.length, '正在写入文件…');

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `爆品筛选_${withImages ? '含图片_' : '不含图片_'}${state.onlyHot ? '只看爆品_' : ''}${rowsData.length}条_${tsName()}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() =&gt; URL.revokeObjectURL(url), 4000);

    if (withImages) hideProgress();

    if (withImages){
      toast(`导出完成：${rowsData.length} 条，图片成功 ${ok} 张` + (fail ? `，${fail} 张因跨域受限已改为链接` : ''));
    } else {
      toast(`导出完成：${rowsData.length} 条（不含图片）`);
    }
  }catch(err){
    console.error(err);
    hideProgress();
    alert('导出失败：' + err.message);
  }finally{
    menuBtn.disabled = false;
  }
}

            font-size: 1.1rem;

            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #dee2e6;

            border-right: none;

            background-color: #e9ecef;
        }

        .function-tab.active {
            background-color: white;
            color: #1d6f42;
            border-bottom: 3px solid #1d6f42;

        .function-tab i {
            margin-right: 10px;
        }

        .function-content {
            padding: 30px;
            display: none;
        }

        .function-content.active {
            display: block;
            animation: fadeIn 0.5s ease;

            from { opacity: 0; }

            background-color: #1d6f42;
            color: white;
        }

            margin-bottom: 25px;

            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            transition: border 0.3s;

            border-color: #1d6f42;
