    &lt;!-- 引入SheetJS库用于Excel处理 --&gt;
    &lt;script src=&quot;https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
    &lt;!-- 引入JSZip库用于创建ZIP文件 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // 文件数据存储
        let filesData = [];
        let originalFilesData = [];

        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileTableBody = document.getElementById('fileTableBody');
        const fileCountElement = document.getElementById('fileCount');
        const uploadStatus = document.getElementById('uploadStatus');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const applyRenamesBtn = document.getElementById('applyRenamesBtn');
        const resetBtn = document.getElementById('resetBtn');
        const previewNameBtn = document.getElementById('previewNameBtn');
        const applyNameChangesBtn = document.getElementById('applyNameChangesBtn');
        const previewExtBtn = document.getElementById('previewExtBtn');
        const applyExtChangesBtn = document.getElementById('applyExtChangesBtn');
        const downloadExcelBtn = document.getElementById('downloadExcelBtn');
        const uploadExcelBtn = document.getElementById('uploadExcelBtn');
        const excelFileInput = document.getElementById('excelFileInput');

        // 事件监听器
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#e3e9ff';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.backgroundColor = '#f8faff';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.backgroundColor = '#f8faff';
            handleFolderDrop(e);
        });

        fileInput.addEventListener('change', (e) =&gt; {
            handleFiles(e.target.files);
        });

        applyRenamesBtn.addEventListener('click', applyAllRenames);
        resetBtn.addEventListener('click', resetAll);

        previewNameBtn.addEventListener('click', previewNameChanges);
        previewExtBtn.addEventListener('click', previewExtChanges);

        downloadExcelBtn.addEventListener('click', downloadExcelTemplate);
        uploadExcelBtn.addEventListener('click', () =&gt; excelFileInput.click());
        excelFileInput.addEventListener('change', handleExcelUpload);

        // 处理拖放文件夹
        async function handleFolderDrop(e) {
            const items = e.dataTransfer.items;
            const files = [];

            // 遍历拖放的项目
            for (const item of items) {
                const entry = item.webkitGetAsEntry();
                if (entry) {
                    await traverseFileTree(entry, files);
                }
            }

            // 转换为FileList类似对象
            const fileList = {
                length: files.length,
                item: (index) =&gt; files[index],
                ...files
            };

            handleFiles(fileList);
        }

        // 遍历文件树（用于拖放文件夹）
        async function traverseFileTree(entry, files) {
            if (entry.isFile) {
                return new Promise((resolve) =&gt; {
                    entry.file((file) =&gt; {
                        // 只处理图片文件
                        if (file.type.startsWith('image/')) {
                            files.push(file);
                        }
                        resolve();
                    });
                });
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                return new Promise((resolve) =&gt; {
                    reader.readEntries(async (entries) =&gt; {
                        for (const childEntry of entries) {
                            await traverseFileTree(childEntry, files);
                        }
                        resolve();
                    });
                });
            }
        }

        // 处理上传的文件
        function handleFiles(fileList) {
            if (fileList.length === 0) return;

            loadingIndicator.classList.add('active');

            // 清空现有数据
            filesData = [];
            originalFilesData = [];
            fileTableBody.innerHTML = '';

            // 筛选图片文件
            const imageFiles = Array.from(fileList).filter(file =&gt;
                file.type.startsWith('image/')
            );

            if (imageFiles.length === 0) {
                uploadStatus.textContent = '未找到图片文件，请上传包含图片的文件夹';
                uploadStatus.style.color = '#dc3545';
                loadingIndicator.classList.remove('active');
                return;
            }

            uploadStatus.textContent = `成功加载 ${imageFiles.length} 个图片文件`;
            uploadStatus.style.color = '#28a745';

            // 处理每个文件
            imageFiles.forEach((file, index) =&gt; {
                // 提取文件名和扩展名
                const lastDotIndex = file.name.lastIndexOf('.');
                const nameWithoutExt = lastDotIndex &gt; 0 ? file.name.substring(0, lastDotIndex) : file.name;
                const extension = lastDotIndex &gt; 0 ? file.name.substring(lastDotIndex) : '';

                // 创建文件对象
                const fileObj = {
                    id: index + 1,
                    originalName: file.name,
                    originalNameWithoutExt: nameWithoutExt,
                    originalExtension: extension,
                    newNameWithoutExt: nameWithoutExt,
                    newExtension: extension,
                    file: file,
                    previewUrl: URL.createObjectURL(file),
                    status: '未更改'
                };

                filesData.push(fileObj);
                originalFilesData.push({...fileObj}); // 保存原始数据副本

                // 创建表格行
                addFileToTable(fileObj);
            });

            updateFileCount();
            loadingIndicator.classList.remove('active');
            applyRenamesBtn.disabled = false;

            // 更新Excel下载按钮状态
            downloadExcelBtn.disabled = false;
        }

        // 添加文件到表格
        function addFileToTable(fileObj) {
            const row = document.createElement('tr');
            row.dataset.id = fileObj.id;

            row.innerHTML = `
                &lt;td&gt;${fileObj.id}&lt;/td&gt;
                &lt;td&gt;
                    &lt;img src=&quot;${fileObj.previewUrl}&quot; alt=&quot;预览&quot; class=&quot;preview-img&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;div class=&quot;filename-cell&quot;&gt;
                        &lt;i class=&quot;fas fa-file-image file-icon&quot;&gt;&lt;/i&gt;
                        &lt;div&gt;
                            &lt;div&gt;${fileObj.originalName}&lt;/div&gt;
                            &lt;div class=&quot;original-name&quot;&gt;原始名称&lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/td&gt;
                &lt;td&gt;
                    &lt;input type=&quot;text&quot; class=&quot;new-name-input&quot; value=&quot;${fileObj.newNameWithoutExt}&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                &lt;/td&gt;
                &lt;td&gt;${fileObj.originalExtension}&lt;/td&gt;
                &lt;td&gt;
                    &lt;select class=&quot;new-ext-select&quot; data-id=&quot;${fileObj.id}&quot;&gt;
                        &lt;option value=&quot;.jpg&quot; ${fileObj.newExtension === '.jpg' ? 'selected' : ''}&gt;.jpg&lt;/option&gt;
                        &lt;option value=&quot;.png&quot; ${fileObj.newExtension === '.png' ? 'selected' : ''}&gt;.png&lt;/option&gt;
                        &lt;option value=&quot;.gif&quot; ${fileObj.newExtension === '.gif' ? 'selected' : ''}&gt;.gif&lt;/option&gt;
                        &lt;option value=&quot;.webp&quot; ${fileObj.newExtension === '.webp' ? 'selected' : ''}&gt;.webp&lt;/option&gt;
                        &lt;option value=&quot;.bmp&quot; ${fileObj.newExtension === '.bmp' ? 'selected' : ''}&gt;.bmp&lt;/option&gt;
                        &lt;option value=&quot;.jpeg&quot; ${fileObj.newExtension === '.jpeg' ? 'selected' : ''}&gt;.jpeg&lt;/option&gt;
                        &lt;option value=&quot;.svg&quot; ${fileObj.newExtension === '.svg' ? 'selected' : ''}&gt;.svg&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/td&gt;
                &lt;td class=&quot;status-cell&quot; data-id=&quot;${fileObj.id}&quot;&gt;${fileObj.status}&lt;/td&gt;
            `;

            fileTableBody.appendChild(row);

            // 添加事件监听器
            const nameInput = row.querySelector('.new-name-input');
            const extSelect = row.querySelector('.new-ext-select');
            const statusCell = row.querySelector('.status-cell');

            nameInput.addEventListener('input', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateFileName(id, e.target.value, null);
                updateStatus(id);
                updateFileCount();
            });

            extSelect.addEventListener('change', (e) =&gt; {
                const id = parseInt(e.target.dataset.id);
                updateFileName(id, null, e.target.value);
                updateStatus(id);
                updateFileCount();
            });
        }

        // 更新文件名
        function updateFileName(id, newNameWithoutExt, newExtension) {
            const fileObj = filesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            if (newNameWithoutExt !== null) {
                fileObj.newNameWithoutExt = newNameWithoutExt;
            }

            if (newExtension !== null) {
                fileObj.newExtension = newExtension;
            }

            // 检查是否有更改
            const isNameChanged = fileObj.newNameWithoutExt !== fileObj.originalNameWithoutExt;
            const isExtChanged = fileObj.newExtension !== fileObj.originalExtension;

            if (isNameChanged || isExtChanged) {
                fileObj.status = '已修改';
            } else {
                fileObj.status = '未更改';
            }
        }

        // 更新状态显示
        function updateStatus(id) {
            const fileObj = filesData.find(f =&gt; f.id === id);
            if (!fileObj) return;

            const statusCell = document.querySelector(`.status-cell[data-id=&quot;${id}&quot;]`);
            if (statusCell) {
                statusCell.textContent = fileObj.status;
                statusCell.style.color = fileObj.status === '已修改' ? '#28a745' : '#6c757d';
            }
        }

        // 更新文件计数
        function updateFileCount() {
            const count = filesData.length;
            const modifiedCount = filesData.filter(f =&gt; f.status === '已修改').length;

            fileCountElement.textContent = `${count} 个文件${modifiedCount &gt; 0 ? ` (${modifiedCount} 个已修改)` : ''}`;
        }

        // 预览名称更改
        function previewNameChanges() {
    const pattern = document.getElementById('namePattern').value;
    const startNumber = parseInt(document.getElementById('startNumber').value) || 1;
    const customPrefix = document.getElementById('customPrefix').value;

    filesData.forEach((fileObj, index) =&gt; {
        let newName = '';

        switch (pattern) {
            case 'sequential':
                newName = `图片${startNumber + index}`;
                break;
            case 'date':
                const today = new Date();
                const dateStr = today.toISOString().split('T')[0];
                newName = `${dateStr}_${startNumber + index}`;
                break;
            case 'timestamp':
                const timestamp = Math.floor(Date.now() / 1000);
                newName = `${timestamp}_${startNumber + index}`;
                break;
            case 'custom':
            default:
                newName = customPrefix ? `${customPrefix}${startNumber + index}` : fileObj.originalNameWithoutExt;
                break;
        }

        // 更新表格中的输入框
        const nameInput = document.querySelector(`.new-name-input[data-id=&quot;${fileObj.id}&quot;]`);
        if (nameInput) {
            nameInput.value = newName;
        }

        // 直接调用updateFileName来更新状态
        updateFileName(fileObj.id, newName, null);
    });

    updateFileCount();
}



        // 预览后缀更改
        function previewExtChanges() {
    const currentExtFilter = document.getElementById('currentExtFilter').value;
    const newExtension = document.getElementById('newExtension').value;

    filesData.forEach((fileObj) =&gt; {
        // 检查是否满足筛选条件
        if (currentExtFilter !== 'all' &amp;&amp; fileObj.originalExtension !== currentExtFilter) {
            return;
        }

        // 更新表格中的选择框
        const extSelect = document.querySelector(`.new-ext-select[data-id=&quot;${fileObj.id}&quot;]`);
        if (extSelect) {
            extSelect.value = newExtension;
        }

        // 直接调用updateFileName来更新状态
        updateFileName(fileObj.id, null, newExtension);
    });

    updateFileCount();
}



        // 下载Excel模板
        function downloadExcelTemplate() {
            if (filesData.length === 0) {
                alert('请先上传图片文件！');
                return;
            }

            // 创建工作簿
            const wb = XLSX.utils.book_new();

            // 创建工作表数据
            const wsData = [
                ['原始文件名', '新文件名（请在此列填写）', '原始后缀', '新后缀（可选）'],
                ['说明：请在第二列填写您想要的新文件名（不需要填写后缀）', '', '', '']
            ];

            // 添加每个文件的数据
            filesData.forEach(fileObj =&gt; {
                wsData.push([
                    fileObj.originalName,
                    fileObj.originalNameWithoutExt, // 初始值设为原始文件名（不带后缀）
                    fileObj.originalExtension,
                    fileObj.originalExtension // 初始值设为原始后缀
                ]);
            });

            // 创建工作表
            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // 设置列宽
            const wscols = [
                {wch: 30}, // 原始文件名
                {wch: 30}, // 新文件名
                {wch: 10}, // 原始后缀
                {wch: 10}  // 新后缀
            ];
            ws['!cols'] = wscols;

            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, &quot;图片重命名&quot;);

            // 生成Excel文件并下载
            XLSX.writeFile(wb, '图片重命名模板.xlsx');

            alert('Excel模板已生成！请填写第二列&quot;新文件名&quot;和第四列&quot;新后缀&quot;，然后上传Excel文件以应用更改。');
        }

        // 处理Excel文件上传
        function handleExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    // 检查文件类型
    if (!file.name.match(/\.(xlsx|xls)$/)) {
        alert('请上传Excel文件（.xlsx或.xls格式）');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});

            // 获取第一个工作表
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const sheetData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});

            // 跳过表头行
            const dataRows = sheetData.slice(2); // 跳过标题行和说明行

            if (dataRows.length === 0) {
                alert('Excel文件中没有数据！');
                return;
            }

            // 用于统计更新了多少文件
            let updatedCount = 0;

            // 遍历Excel数据行
            dataRows.forEach(row =&gt; {
                const originalName = row[0]; // 第一列：原始文件名
                const newName = row[1]; // 第二列：新文件名
                const newExtension = row[3]; // 第四列：新后缀（可选）

                // 查找匹配的文件
                const fileObj = filesData.find(f =&gt; f.originalName === originalName);

                if (fileObj &amp;&amp; newName) {
                    // 更新文件名（不带后缀）
                    fileObj.newNameWithoutExt = newName;

                    // 更新表格中的输入框
                    const nameInput = document.querySelector(`.new-name-input[data-id=&quot;${fileObj.id}&quot;]`);
                    if (nameInput) {
                        nameInput.value = newName;
                    }

                    // 关键修复：手动调用更新文件名函数来确保状态正确更新
                    updateFileName(fileObj.id, newName, null);
                    updatedCount++;
                }

                // 如果有新后缀，更新后缀
                if (fileObj &amp;&amp; newExtension &amp;&amp; newExtension.startsWith('.')) {
                    fileObj.newExtension = newExtension;

                    // 更新表格中的选择框
                    const extSelect = document.querySelector(`.new-ext-select[data-id=&quot;${fileObj.id}&quot;]`);
                    if (extSelect) {
                        extSelect.value = newExtension;
                    }

                    // 关键修复：手动调用更新文件名函数来确保状态正确更新
                    updateFileName(fileObj.id, null, newExtension);
                }

                // 更新状态
                if (fileObj) {
                    updateStatus(fileObj.id);
                }
            });

            // 更新文件计数
            updateFileCount();

            // 清空文件输入
            excelFileInput.value = '';

            alert(`成功从Excel文件更新了 ${updatedCount} 个文件的名称！`);

        } catch (error) {
            console.error('解析Excel文件时出错:', error);
            alert('解析Excel文件时出错，请确保文件格式正确。');
        }
    };

    reader.readAsArrayBuffer(file);
}

        // 应用所有重命名并下载
        function applyAllRenames() {
            if (filesData.length === 0) return;

            const modifiedFiles = filesData.filter(f =&gt; f.status === '已修改');
            if (modifiedFiles.length === 0) {
                alert('没有文件被修改，请先修改文件名或后缀。');
                return;
            }

            // 创建Zip文件
            const zip = new JSZip();

            modifiedFiles.forEach(fileObj =&gt; {
                const newFileName = fileObj.newNameWithoutExt + fileObj.newExtension;
                zip.file(newFileName, fileObj.file);
            });

            // 生成Zip文件并下载
            zip.generateAsync({type: &quot;blob&quot;})
                .then(function(content) {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = '重命名后的图片.zip';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // 更新状态
                    filesData.forEach(fileObj =&gt; {
                        if (fileObj.status === '已修改') {
                            fileObj.status = '已下载';
                            updateStatus(fileObj.id);
                        }
                    });

                    alert(`成功打包并下载 ${modifiedFiles.length} 个文件！`);
                })
                .catch(error =&gt; {
                    console.error('创建ZIP文件时出错:', error);
                    alert('创建ZIP文件时出错，请重试。');
                });
        }

        // 重置所有更改
        function resetAll() {
            if (filesData.length === 0) return;

            if (!confirm('确定要重置所有更改吗？这将恢复所有文件到原始名称。')) {
                return;
            }

            // 恢复原始数据
            filesData = originalFilesData.map(f =&gt; ({...f}));

            // 更新表格
            fileTableBody.innerHTML = '';
            filesData.forEach(fileObj =&gt; {
                addFileToTable(fileObj);
            });

            updateFileCount();
            alert('所有更改已重置！');
        }

        // 初始化页面

                uploadStatus.textContent = '请上传包含图片的文件夹，或拖放文件夹到此区域';
                uploadStatus.style.color = '#666';
            }, 100);
        });

    excel: ['.xlsx', '.xls', '.csv'],
    image: ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg', '.bmp', '.avif', '.ico'],
    doc: ['.pdf', '.doc', '.docx', '.txt', '.rtf', '.md', '.ppt', '.pptx'],
    archive: ['.zip', '.rar', '.7z', '.tar', '.gz'],
    video: ['.mp4', '.mov', '.avi', '.mkv', '.wmv', '.flv']
  };

  const folderInput = document.getElementById('folderInput');
  const targetKeywords = document.getElementById('targetKeywords');
  const excludeKeywords = document.getElementById('excludeKeywords');
  const kwCount = document.getElementById('kwCount');
  const btnFilter = document.getElementById('btnFilter');
  const uploadText = document.getElementById('uploadText');
  const resultCard = document.getElementById('resultCard');
  const resultBody = document.getElementById('resultBody');
  const missedAlert = document.getElementById('missedAlert');
  const customExtInput = document.getElementById('customExtInput');

  // 1. 文件夹拖拽与选择
  folderInput.addEventListener('change', (e) =&gt; handleSelectedFiles(e.target.files));

  const dropArea = document.getElementById('dropArea');
  ['dragenter', 'dragover'].forEach(n =&gt; dropArea.addEventListener(n, (e) =&gt; { e.preventDefault(); dropArea.style.borderColor = '#2563eb'; }));
  ['dragleave', 'drop'].forEach(n =&gt; dropArea.addEventListener(n, (e) =&gt; { e.preventDefault(); dropArea.style.borderColor = '#cbd5e1'; }));
  dropArea.addEventListener('drop', (e) =&gt; {
    e.preventDefault();
    if (e.dataTransfer.files?.length) handleSelectedFiles(e.dataTransfer.files);
  });

  function handleSelectedFiles(fileList) {
    rawFiles = Array.from(fileList);
    if (!rawFiles.length) return;
    uploadText.innerHTML = `已就绪：已索引文件夹内 &lt;b&gt;${rawFiles.length}&lt;/b&gt; 个文件`;
    checkReady();
  }

  // 2. 格式预设过滤器切换
  document.querySelectorAll('.pill').forEach(pill =&gt; {
    pill.addEventListener('click', () =&gt; {
      document.querySelectorAll('.pill').forEach(p =&gt; p.classList.remove('active'));
      pill.classList.add('active');
      currentPreset = pill.dataset.preset;
      customExtInput.value = '';
    });
  });

  customExtInput.addEventListener('input', () =&gt; {
    if (customExtInput.value.trim()) {
      document.querySelectorAll('.pill').forEach(p =&gt; p.classList.remove('active'));
      currentPreset = 'custom';
    } else {
      document.querySelector('.pill[data-preset=&quot;all&quot;]').classList.add('active');
      currentPreset = 'all';
    }
  });

  // 3. 目标关键词输入解析
  targetKeywords.addEventListener('input', () =&gt; {
    const list = parseInputList(targetKeywords.value);
    kwCount.textContent = list.length;
    checkReady();
  });

  function parseInputList(text) {
    if (!text) return [];
    return Array.from(new Set(text.split(/[\s,，;；\r\n]+/).map(s =&gt; s.trim()).filter(Boolean)));
  }

  function checkReady() {
    const kws = parseInputList(targetKeywords.value);
    btnFilter.disabled = !(rawFiles.length &gt; 0 &amp;&amp; kws.length &gt; 0);
  }

  function clearAllInputs() {
    targetKeywords.value = '';
    excludeKeywords.value = '';
    kwCount.textContent = '0';
    checkReady();
  }

  // 获取允许的后缀列表
  function getAllowedExtensions() {
    if (currentPreset === 'custom') {
      return customExtInput.value.split(/[,，\s]+/)
        .map(s =&gt; s.trim().toLowerCase())
        .filter(Boolean)
        .map(s =&gt; s.startsWith('.') ? s : '.' + s);
    }
    return PRESETS[currentPreset] || [];
  }

  // 4. 执行多维筛选
  function doFilter() {
    const targets = parseInputList(targetKeywords.value);
    const excludes = parseInputList(excludeKeywords.value);
    const allowedExts = getAllowedExtensions();
    const mode = document.getElementById('matchMode').value;
    const caseSensitive = document.getElementById('caseSensitive').checked;

    matchedList = [];
    const hitKeywordsSet = new Set();

    // 预编译正则提高几十倍速度
    let regexTargets = [];
    if (mode === 'regex') {
      regexTargets = targets.map(t =&gt; {
        try { return { kw: t, reg: new RegExp(t, caseSensitive ? '' : 'i') }; }
        catch (e) { return null; }
      }).filter(Boolean);
    }

    for (const file of rawFiles) {
      const fileName = file.name;
      const lowerName = fileName.toLowerCase();

      // 1. 检查扩展名是否符合过滤规则
      if (allowedExts.length &gt; 0) {
        const hasExt = allowedExts.some(ext =&gt; lowerName.endsWith(ext));
        if (!hasExt) continue;
      }

      // 2. 检查排除词
      if (excludes.length &gt; 0) {
        const testTarget = caseSensitive ? fileName : lowerName;
        const isExcluded = excludes.some(ex =&gt; {
          const exClean = caseSensitive ? ex : ex.toLowerCase();
          return testTarget.includes(exClean);
        });
        if (isExcluded) continue;
      }

      // 3. 匹配目标关键词
      let matchedKeyword = null;
      if (mode === 'regex') {
        for (const rObj of regexTargets) {
          if (rObj.reg.test(fileName)) {
            matchedKeyword = rObj.kw;
            break;
          }
        }
      } else if (mode === 'exactWord') {
        // 使用分隔符（标点、空格、下划线、减号等）全词边界匹配
        for (const kw of targets) {
          const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;');
          const borderReg = new RegExp(`(^|[^a-zA-Z0-9])` + escaped + `([^a-zA-Z0-9]|$)`, caseSensitive ? '' : 'i');
          if (borderReg.test(fileName)) {
            matchedKeyword = kw;
            break;
          }
        }
      } else {
        // 包含匹配 (contains)
        const checkStr = caseSensitive ? fileName : lowerName;
        for (const kw of targets) {
          const kwStr = caseSensitive ? kw : kw.toLowerCase();
          if (checkStr.includes(kwStr)) {
            matchedKeyword = kw;
            break;
          }
        }
      }

      if (matchedKeyword) {
        matchedList.push({ file, matchedKeyword, selected: true });
        hitKeywordsSet.add(matchedKeyword);
      }
    }

    renderResults(targets, hitKeywordsSet);
  }

  // 渲染结果
  function renderResults(targets, hitKeywordsSet) {
    resultCard.style.display = 'block';
    document.getElementById('totalScanned').textContent = rawFiles.length;
    document.getElementById('matchedCount').textContent = matchedList.length;

    // 未命中关键词展示
    const missed = targets.filter(t =&gt; !hitKeywordsSet.has(t));
    if (missed.length &gt; 0) {
      missedAlert.style.display = 'block';
      document.getElementById('missedCountNum').textContent = missed.length;
      document.getElementById('missedListText').textContent = missed.join(', ');
      window._lastMissed = missed;
    } else {
      missedAlert.style.display = 'none';
      window._lastMissed = [];
    }

    renderTable();
    updateSelectedSummary();
    resultCard.scrollIntoView({ behavior: 'smooth' });
  }

  function getFileIcon(filename) {
    const ext = filename.slice(filename.lastIndexOf('.')).toLowerCase();
    if (['.xlsx', '.xls', '.csv'].includes(ext)) return '📊';
    if (['.jpg', '.jpeg', '.png', '.webp', '.gif', '.svg'].includes(ext)) return '🖼️';
    if (['.pdf'].includes(ext)) return '📕';
    if (['.doc', '.docx', '.txt', '.md'].includes(ext)) return '📄';
    if (['.zip', '.rar', '.7z', '.tar'].includes(ext)) return '📦';
    if (['.mp4', '.mov', '.avi'].includes(ext)) return '🎬';
    return '📎';
  }

  function renderTable() {
    resultBody.innerHTML = '';
    if (!matchedList.length) {
      resultBody.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;7&quot; style=&quot;text-align:center; padding:32px; color:var(--text-sub);&quot;&gt;没有找到符合当前条件的文件。&lt;/td&gt;&lt;/tr&gt;`;
      return;
    }

    const fragment = document.createDocumentFragment();
    matchedList.forEach((item, index) =&gt; {
      const tr = document.createElement('tr');
      const ext = item.file.name.slice(item.file.name.lastIndexOf('.')).toLowerCase() || '未知';
      const sizeStr = item.file.size &gt; 1048576
        ? (item.file.size / 1048576).toFixed(2) + ' MB'
        : (item.file.size / 1024).toFixed(1) + ' KB';
      const displayPath = item.file.webkitRelativePath || item.file.name;

      tr.innerHTML = `
        &lt;td style=&quot;text-align: center;&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;row-check&quot; data-idx=&quot;${index}&quot; ${item.selected ? 'checked' : ''}&gt;&lt;/td&gt;
        &lt;td style=&quot;color:var(--text-sub);&quot;&gt;${index + 1}&lt;/td&gt;
        &lt;td&gt;&lt;span class=&quot;tag-ext&quot;&gt;${getFileIcon(item.file.name)} ${ext}&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;&lt;span class=&quot;tag-kw&quot;&gt;${item.matchedKeyword}&lt;/span&gt;&lt;/td&gt;
        &lt;td style=&quot;word-break:break-all;&quot;&gt;&lt;b&gt;${item.file.name}&lt;/b&gt;&lt;div style=&quot;font-size:11px;color:var(--text-sub);&quot;&gt;${displayPath}&lt;/div&gt;&lt;/td&gt;
        &lt;td style=&quot;color:var(--text-sub); font-size:12px;&quot;&gt;${sizeStr}&lt;/td&gt;
        &lt;td style=&quot;text-align: center;&quot;&gt;
          &lt;button class=&quot;btn-outline btn-sm&quot; onclick=&quot;downloadSingle(${index})&quot;&gt;下载&lt;/button&gt;
        &lt;/td&gt;
      `;
      fragment.appendChild(tr);
    });
    resultBody.appendChild(fragment);

    // 绑定多选框
    resultBody.querySelectorAll('.row-check').forEach(ck =&gt; {
      ck.addEventListener('change', (e) =&gt; {
        const idx = parseInt(e.target.dataset.idx, 10);
        matchedList[idx].selected = e.target.checked;
        updateSelectedSummary();
      });
    });
  }

  function updateSelectedSummary() {
    const selected = matchedList.filter(item =&gt; item.selected);
    document.getElementById('selectedCount').textContent = selected.length;
    const totalBytes = selected.reduce((sum, item) =&gt; sum + item.file.size, 0);
    document.getElementById('totalSize').textContent = (totalBytes / (1024 * 1024)).toFixed(2) + ' MB';
    document.getElementById('checkMaster').checked = (selected.length === matchedList.length &amp;&amp; matchedList.length &gt; 0);
  }

  function toggleSelectAll(val) {
    matchedList.forEach(item =&gt; item.selected = val);
    renderTable();
    updateSelectedSummary();
  }
  function toggleSelectInvert() {
    matchedList.forEach(item =&gt; item.selected = !item.selected);
    renderTable();
    updateSelectedSummary();
  }

  function copyMissedKeywords() {
    if (!window._lastMissed?.length) return;
    navigator.clipboard.writeText(window._lastMissed.join('\n')).then(() =&gt; {
      alert('已复制未命中的关键词列表到剪贴板！');
    });
  }

  function downloadSingle(idx) {
    const item = matchedList[idx];
    if (!item) return;
    const url = URL.createObjectURL(item.file);
    const a = document.createElement('a');
    a.href = url;
    a.download = item.file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // 5. 直接写入本地目标文件夹 (File System Access API)
  async function exportToFolder() {
    const itemsToExport = matchedList.filter(i =&gt; i.selected);
    if (!itemsToExport.length) { alert('请至少勾选一个文件！'); return; }

    if (!('showDirectoryPicker' in window)) {
      alert('您的浏览器不支持直接向本地文件夹写入文件，将为您自动采用【ZIP 打包下载】方式。（建议使用 Chrome 或 Edge 体验直接保存文件夹功能）');
      exportToZip();
      return;
    }

    try {
      const dirHandle = await window.showDirectoryPicker();
      showProgress(true);
      const keepStructure = document.getElementById('keepFolderStructure').checked;
      const total = itemsToExport.length;

      for (let i = 0; i &lt; total; i++) {
        const item = itemsToExport[i];
        updateProgress(i + 1, total, `正在写入本地 (${i + 1}/${total}): ${item.file.name}`);

        let targetDir = dirHandle;
        // 如果选择保留层级结构
        if (keepStructure &amp;&amp; item.file.webkitRelativePath) {
          const parts = item.file.webkitRelativePath.split('/').slice(1, -1);
          for (const p of parts) {
            targetDir = await targetDir.getDirectoryHandle(p, { create: true });
          }
        }

        const fileHandle = await targetDir.getFileHandle(item.file.name, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(item.file);
        await writable.close();
      }

      showProgress(false);
      alert(`🎉 导出完成！已成功将 ${total} 个文件原样写入所选本地文件夹。`);
    } catch (err) {
      showProgress(false);
      if (err.name !== 'AbortError') alert('写入文件夹失败: ' + err.message);
    }
  }

  // 6. 打包导出 ZIP
  async function exportToZip() {
    const itemsToExport = matchedList.filter(i =&gt; i.selected);
    if (!itemsToExport.length) { alert('请至少勾选一个文件！'); return; }

    try {
      showProgress(true);
      const zip = new JSZip();
      const keepStructure = document.getElementById('keepFolderStructure').checked;
      const total = itemsToExport.length;

      for (let i = 0; i &lt; total; i++) {
        const item = itemsToExport[i];
        updateProgress(i + 1, total, `正在添加压缩包 (${i + 1}/${total}): ${item.file.name}`);

        if (keepStructure &amp;&amp; item.file.webkitRelativePath) {
          const cleanRelPath = item.file.webkitRelativePath.replace(/^[^/]+\//, '');
          zip.file(cleanRelPath, item.file);
        } else {
          zip.file(item.file.name, item.file);
        }
      }

      updateProgress(total, total, '正在生成 ZIP 压缩文件...');
      const content = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }, (metadata) =&gt; {
        updateProgress(metadata.percent, 100, `打包进度: ${metadata.percent.toFixed(0)}%`);
      });

      const a = document.createElement('a');
      const url = URL.createObjectURL(content);
      a.href = url;
      a.download = `Filtered_Files_${new Date().toISOString().slice(0,10)}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showProgress(false);
    } catch (err) {
      showProgress(false);
      alert('打包 ZIP 失败: ' + err.message);
    }
  }

  function showProgress(show) {
    document.getElementById('progressBarWrap').style.display = show ? 'block' : 'none';
    document.getElementById('progressText').style.display = show ? 'block' : 'none';
    if (!show) document.getElementById('progressBar').style.width = '0%';
  }
  function updateProgress(curr, total, txt) {
    const p = Math.round((curr / total) * 100);
    document.getElementById('progressBar').style.width = p + '%';
    document.getElementById('progressText').textContent = txt;
  }
&lt;/script&gt;

  <script>
   // 导航到指定报告
            function navigateToReport(index) {
                const sections = document.querySelectorAll('.visualization-section');
                sections.forEach((section, i) => {
                    section.style.display = i === index ? 'block' : 'none';
                });

                // 更新按钮状态
                document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                    if (i === index) {
                        btn.classList.add('active');
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 更新URL hash
                window.location.hash = `#report-${index + 1}`;
            }

            // 页面加载时显示第一个报告
            document.addEventListener('DOMContentLoaded', () => {
                // 从URL hash获取报告索引
                const hash = window.location.hash;
                let initialIndex = 0;

                if (hash.startsWith('#report-')) {
                    const reportNum = parseInt(hash.replace('#report-', ''));
                    if (!isNaN(reportNum) && reportNum > 0) {
                        initialIndex = reportNum - 1;
                    }
                }


                // 显示报告
                if (document.querySelectorAll('.visualization-section').length > 0) {
                    navigateToReport(initialIndex);
                }

                // 显示当前日期
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 显示最后更新时间
                document.getElementById('lastUpdate').textContent = now.toLocaleDateString('zh-CN', {
                    month: 'short',
                    day: 'numeric'
                });

                // 显示报告数量
                const reportCount = document.querySelectorAll('.visualization-section').length;
                document.getElementById('reportCount').textContent = reportCount;

                // 显示图表总数（估算）
                document.getElementById('totalCharts').textContent = reportCount * 3;
            });
