                        &lt;button class=&quot;mini-btn&quot; onclick=&quot;event.stopPropagation(); document.getElementById('folderInput2').click()&quot;&gt;📂 选择 文件夹&lt;/button&gt;

                    &lt;div class=&quot;file-info&quot; id=&quot;mediaInfo2&quot;&gt;&lt;/div&gt;
                    &lt;input type=&quot;file&quot; id=&quot;zipInput2&quot; accept=&quot;.zip&quot; style=&quot;display:none;&quot;&gt;
                    &lt;input type=&quot;file&quot; id=&quot;folderInput2&quot; webkitdirectory directory multiple style=&quot;display:none;&quot;&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;config-card&quot; id=&quot;configCard2&quot;&gt;
                &lt;div class=&quot;config-title&quot;&gt;
                    &lt;span&gt;⚙️ 模式二匹配设置&lt;/span&gt;
                &lt;/div&gt;

                &lt;div class=&quot;settings-grid&quot;&gt;
                    &lt;div class=&quot;setting-item&quot;&gt;
                        &lt;label for=&quot;matchColSelect2&quot; style=&quot;color: #1d4ed8;&quot;&gt;🎯 选择与图片文件名对应的【匹配列】:&lt;/label&gt;
                        &lt;select id=&quot;matchColSelect2&quot;&gt;&lt;/select&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;setting-item&quot;&gt;
                        &lt;label for=&quot;mergeSheetMode2&quot;&gt;📑 多工作表处理方式:&lt;/label&gt;
                        &lt;select id=&quot;mergeSheetMode2&quot;&gt;
                            &lt;option value=&quot;merge&quot;&gt;合并所有子表为一个工作表&lt;/option&gt;
                            &lt;option value=&quot;keep&quot;&gt;保留各子表独立处理&lt;/option&gt;
                        &lt;/select&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div class=&quot;preview-section&quot;&gt;
                    &lt;div class=&quot;preview-header-bar&quot;&gt;
                        &lt;span class=&quot;preview-title&quot;&gt;📋 数据预览 (展示前 10 行)：&lt;/span&gt;
                        &lt;span id=&quot;previewSheetName2&quot; style=&quot;font-size: 12px; color: #6366f1; font-weight: 600;&quot;&gt;&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;table-wrap&quot;&gt;
                        &lt;table id=&quot;previewTable2&quot;&gt;
                            &lt;thead id=&quot;previewThead2&quot;&gt;&lt;/thead&gt;
                            &lt;tbody id=&quot;previewTbody2&quot;&gt;&lt;/tbody&gt;
                        &lt;/table&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;button id=&quot;startBtn2&quot; class=&quot;process-btn&quot;&gt;开始匹配插入并生成 Excel&lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 进度条与日志 (全局复用) --&gt;
        &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
            &lt;div class=&quot;progress-stats&quot;&gt;
                &lt;span id=&quot;statusText&quot;&gt;等待开始...&lt;/span&gt;
                &lt;span id=&quot;progressText&quot;&gt;0%&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;progress-bar-bg&quot;&gt;
                &lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;log&quot; id=&quot;logBox&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 依赖库 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        const AUTO_GEN_KEY = &quot;__AUTO_GENERATE_UNIQUE_CODE__&quot;;

        // Tab 切换逻辑
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b =&gt; b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p =&gt; p.classList.remove('active'));
            if (tabName === 'download') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tabDownload').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tabLocal').classList.add('active');
            }
        }

        // 单元格纯化函数 (解决公式冲突关键)
        function extractPureValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (val.result !== undefined) return val.result;
                if (val.richText) return val.richText.map(t =&gt; t.text).join('');
                if (val.text !== undefined) return val.text;
                if (val.formula !== undefined) return '';
            }
            return val;
        }

        function sanitizeFilename(val, fallback) {
            if (!val) return fallback;
            const str = val.toString().trim().replace(/[\\/:*?&quot;&lt;&gt;|]/g, '_');
            return str || fallback;
        }

        function getImageDimensions(blob) {
            return new Promise((resolve) =&gt; {
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () =&gt; {
                    URL.revokeObjectURL(url);
                    resolve({ w: img.naturalWidth || 100, h: img.naturalHeight || 100 });
                };
                img.onerror = () =&gt; {
                    URL.revokeObjectURL(url);
                    resolve({ w: 100, h: 100 });
                };
                img.src = url;
            });
        }

        const readFileAsArrayBuffer = (f) =&gt; new Promise((resolve, reject) =&gt; {
            const reader = new FileReader();
            reader.onload = (e) =&gt; resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsArrayBuffer(f);
        });

        const blobToBase64 = (blob) =&gt; new Promise((resolve, reject) =&gt; {
            const reader = new FileReader();
            reader.onloadend = () =&gt; resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });

        function updateProgress(done, total) {
            const pct = Math.round((done / total) * 100) + '%';
            document.getElementById('progressBar').style.width = pct;
            document.getElementById('progressText').innerText = pct;
            document.getElementById('statusText').innerText = `已完成 ${done} / ${total}`;
        }

        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            const logBox = document.getElementById('logBox');
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // =========================================================================
        // 模式一：在线图片链接下载并插入 (保持原有逻辑不变)
        // =========================================================================
        let loadedWorkbook1 = null;
        let detectedHeaders1 = [];
        const dropArea1 = document.getElementById('dropArea1');
        const excelInput1 = document.getElementById('excelInput1');
        const nameColSelect1 = document.getElementById('nameColSelect1');
        const urlColSelect1 = document.getElementById('urlColSelect1');
        const startBtn1 = document.getElementById('startBtn1');

        ['dragover', 'dragleave', 'drop'].forEach(evt =&gt; {
            dropArea1.addEventListener(evt, (e) =&gt; {
                e.preventDefault();
                if (evt === 'dragover') dropArea1.classList.add('active');
                else dropArea1.classList.remove('active');
            });
        });
        dropArea1.addEventListener('drop', (e) =&gt; { if (e.dataTransfer.files.length) handleUpload1(e.dataTransfer.files[0]); });
        excelInput1.addEventListener('change', (e) =&gt; { if (e.target.files.length) handleUpload1(e.target.files[0]); });

        async function handleUpload1(file) {
            if (!file.name.match(/\.xlsx$/i)) return alert('请上传 .xlsx 格式文件！');
            document.getElementById('fileInfo1').textContent = `已载入: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                loadedWorkbook1 = new ExcelJS.Workbook();
                await loadedWorkbook1.xlsx.load(arrayBuffer);
                const firstSheet = loadedWorkbook1.worksheets[0];
                if (!firstSheet || firstSheet.rowCount &lt; 1) return alert('Excel 为空！');
                initSelectors1(firstSheet);
                document.getElementById('configCard1').style.display = 'block';
            } catch (err) { alert('解析失败: ' + err.message); }
        }

        function initSelectors1(sheet) {
            document.getElementById('previewSheetName1').textContent = `当前预览: [${sheet.name}]`;
            detectedHeaders1 = [];
            nameColSelect1.innerHTML = '';
            urlColSelect1.innerHTML = '';

            nameColSelect1.add(new Option(&quot;➕ [推荐] 自动生成唯一编码列 (自增编号)&quot;, AUTO_GEN_KEY));
            sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, colNumber) =&gt; {
                const val = extractPureValue(cell.value);
                const str = (val !== null &amp;&amp; val !== undefined) ? val.toString().trim() : '';
                detectedHeaders1.push({ colNumber, name: str || `列 ${colNumber}` });
            });

            detectedHeaders1.forEach(h =&gt; {
                nameColSelect1.add(new Option(h.name, h.name));
                urlColSelect1.add(new Option(h.name, h.name));
            });

            let defName = AUTO_GEN_KEY;
            let defUrl = detectedHeaders1[detectedHeaders1.length - 1].name;
            detectedHeaders1.forEach(h =&gt; {
                const l = h.name.toLowerCase();
                if (/asin|sku|编号|编码|款号|名称|id|货号/.test(l)) defName = h.name;
                if (/图片|链接|url|image|img|主图|photo|pic/.test(l)) defUrl = h.name;
            });
            nameColSelect1.value = defName;
            urlColSelect1.value = defUrl;

            renderPreview1(sheet);
            nameColSelect1.onchange = () =&gt; { toggleAutoCode1(); updateHighlight1(); };
            urlColSelect1.onchange = () =&gt; updateHighlight1();
            toggleAutoCode1();
            updateHighlight1();
        }

        function toggleAutoCode1() {
            document.getElementById('autoCodeConfig1').style.display = (nameColSelect1.value === AUTO_GEN_KEY) ? 'grid' : 'none';
        }

        function renderPreview1(sheet) {
            const thead = document.getElementById('previewThead1');
            const tbody = document.getElementById('previewTbody1');
            thead.innerHTML = ''; tbody.innerHTML = '';
            const trHead = document.createElement('tr');
            detectedHeaders1.forEach(h =&gt; {
                const th = document.createElement('th');
                th.textContent = h.name;
                th.setAttribute('data-colname', h.name);
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
            const maxRow = Math.min(sheet.rowCount, 11);
            for (let r = 2; r &lt;= maxRow; r++) {
                const row = sheet.getRow(r);
                const tr = document.createElement('tr');
                detectedHeaders1.forEach(h =&gt; {
                    const td = document.createElement('td');
                    const val = extractPureValue(row.getCell(h.colNumber).value);
                    td.textContent = (val !== null &amp;&amp; val !== undefined) ? val.toString() : '';
                    td.setAttribute('data-colname', h.name);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        }

        function updateHighlight1() {
            const n = nameColSelect1.value;
            const u = urlColSelect1.value;
            document.querySelectorAll('#previewTable1 [data-colname]').forEach(el =&gt; {
                const name = el.getAttribute('data-colname');
                el.classList.remove('col-highlight-name', 'col-highlight-url');
                if (name === n) el.classList.add('col-highlight-name');
                if (name === u) el.classList.add('col-highlight-url');
            });
        }

        startBtn1.addEventListener('click', async () =&gt; {
            if (!loadedWorkbook1) return;
            const nameHeader = nameColSelect1.value;
            const urlHeader = urlColSelect1.value;
            if (!urlHeader) return alert('请指定【图片链接列】！');

            startBtn1.disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('logBox').innerHTML = '';
            try {
                await processDownloadMode(nameHeader, urlHeader);
            } catch (err) {
                addLog(`处理出错: ${err.message}`, 'error');
            } finally {
                startBtn1.disabled = false;
            }
        });

        async function processDownloadMode(targetNameHeader, targetUrlHeader) {
            const shouldMerge = document.getElementById('mergeSheetMode1').value === 'merge';
            const concurrency = parseInt(document.getElementById('concurrencyCount1').value) || 5;
            const proxyMode = document.getElementById('corsProxySelect1').value;
            const isAutoCode = (targetNameHeader === AUTO_GEN_KEY);
            const autoTitle = document.getElementById('autoCodeHeaderName1').value.trim() || '系统唯一编号';
            const prefix = document.getElementById('autoCodePrefix1').value.trim();

            const finalWorkbook = new ExcelJS.Workbook();
            const downloadTasks = [];
            let autoIdx = 1;

            if (shouldMerge) {
                addLog('[模式一] 正在合并各子表数据...', 'info');
                const mergedSheet = finalWorkbook.addWorksheet('合并汇总');
                let mergedHeaders = null;

                loadedWorkbook1.eachSheet((sheet) =&gt; {
                    if (sheet.rowCount &lt; 2) return;
                    let urlCol = -1, nameCol = -1;
                    sheet.getRow(1).eachCell({ includeEmpty: false }, (c, col) =&gt; {
                        const val = (extractPureValue(c.value) || '').toString().trim();
                        if (!isAutoCode &amp;&amp; val === targetNameHeader) nameCol = col;
                        if (val === targetUrlHeader) urlCol = col;
                    });
                    if (urlCol === -1 || (!isAutoCode &amp;&amp; nameCol === -1)) return;

                    if (!mergedHeaders) {
                        mergedHeaders = ['图片'];
                        if (isAutoCode) mergedHeaders.push(autoTitle);
                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell) =&gt; mergedHeaders.push(extractPureValue(cell.value)));
                        mergedSheet.getRow(1).values = mergedHeaders;
                        mergedSheet.getRow(1).commit();
                        mergedSheet.getColumn(1).width = 20;
                    }

                    for (let r = 2; r &lt;= sheet.rowCount; r++) {
                        const row = sheet.getRow(r);
                        const urlVal = extractPureValue(row.getCell(urlCol).value);
                        if (!urlVal &amp;&amp; !row.hasValues) continue;

                        const customName = isAutoCode ? `${prefix}${autoIdx++}` : sanitizeFilename(extractPureValue(row.getCell(nameCol).value), `ROW_${r}`);
                        const rowData = [''];
                        if (isAutoCode) rowData.push(customName);
                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, cNum) =&gt; rowData.push(extractPureValue(row.getCell(cNum).value)));

                        const appendedRow = mergedSheet.addRow(rowData);
                        downloadTasks.push({ sheet: mergedSheet, rowIdx: appendedRow.number, customName, url: (urlVal || '').toString().trim() });
                    }
                });
            } else {
                addLog('[模式一] 正在独立处理各个子表...', 'info');
                loadedWorkbook1.eachSheet((sheet) =&gt; {
                    if (sheet.rowCount &lt; 2) return;
                    let urlCol = -1, nameCol = -1;
                    sheet.getRow(1).eachCell({ includeEmpty: false }, (c, col) =&gt; {
                        const val = (extractPureValue(c.value) || '').toString().trim();
                        if (!isAutoCode &amp;&amp; val === targetNameHeader) nameCol = col;
                        if (val === targetUrlHeader) urlCol = col;
                    });
                    if (urlCol === -1 || (!isAutoCode &amp;&amp; nameCol === -1)) return;

                    const newSheet = finalWorkbook.addWorksheet(sheet.name);
                    const newHeaders = ['图片'];
                    if (isAutoCode) newHeaders.push(autoTitle);
                    sheet.getRow(1).eachCell({ includeEmpty: false }, (cell) =&gt; newHeaders.push(extractPureValue(cell.value)));
                    newSheet.getRow(1).values = newHeaders;
                    newSheet.getColumn(1).width = 20;

                    for (let r = 2; r &lt;= sheet.rowCount; r++) {
                        const row = sheet.getRow(r);
                        const urlVal = extractPureValue(row.getCell(urlCol).value);
                        if (!urlVal &amp;&amp; !row.hasValues) continue;

                        const customName = isAutoCode ? `${prefix}${autoIdx++}` : sanitizeFilename(extractPureValue(row.getCell(nameCol).value), `ROW_${r}`);
                        const rowData = [''];
                        if (isAutoCode) rowData.push(customName);
                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, cNum) =&gt; rowData.push(extractPureValue(row.getCell(cNum).value)));

                        const appendedRow = newSheet.addRow(rowData);
                        downloadTasks.push({ sheet: newSheet, rowIdx: appendedRow.number, customName, url: (urlVal || '').toString().trim() });
                    }
                });
            }

            if (downloadTasks.length === 0) throw new Error('未检索到有效数据行');
            addLog(`检索到 ${downloadTasks.length} 条有效记录，启动并发下载...`, 'info');

            const namedZip = new JSZip();
            const seqZip = new JSZip();
            const CELL_PIXEL_W = 145, CELL_PIXEL_H = 160, ROW_HEIGHT = 120, EMU = 9525;
            let completed = 0, success = 0, failed = 0;

            let cursor = 0;
            const workers = Array(Math.min(concurrency, downloadTasks.length)).fill(0).map(async () =&gt; {
                while (cursor &lt; downloadTasks.length) {
                    const taskIdx = cursor++;
                    const task = downloadTasks[taskIdx];
                    const seqIndex = taskIdx + 1;

                    if (!task.url) { completed++; failed++; updateProgress(completed, downloadTasks.length); continue; }
                    try {
                        const blob = await fetchImageWithBypass(task.url, proxyMode);
                        const ext = getExtension(blob, task.url);

                        namedZip.file(`${task.customName}.${ext}`, blob);
                        seqZip.file(`图片${seqIndex}.${ext}`, blob);

                        const base64 = await blobToBase64(blob);
                        const dim = await getImageDimensions(blob);
                        const scale = Math.min(CELL_PIXEL_W / dim.w, CELL_PIXEL_H / dim.h);
                        const finalW = Math.max(1, Math.floor(dim.w * scale));
                        const finalH = Math.max(1, Math.floor(dim.h * scale));
                        const offsetX = Math.floor((CELL_PIXEL_W - finalW) / 2 * EMU);
                        const offsetY = Math.floor((CELL_PIXEL_H - finalH) / 2 * EMU);

                        const imgId = finalWorkbook.addImage({ base64, extension: ext === 'jpg' ? 'jpeg' : ext });
                        task.sheet.addImage(imgId, {
                            tl: { col: 0, row: task.rowIdx - 1, nativeColOff: offsetX, nativeRowOff: offsetY },
                            ext: { width: finalW, height: finalH },
                            editAs: 'oneCell'
                        });
                        task.sheet.getRow(task.rowIdx).height = ROW_HEIGHT;
                        success++;
                        addLog(`[${seqIndex}] 成功: ${task.customName}`, 'success');
                    } catch (e) {
                        failed++;
                        addLog(`[${seqIndex}] 失败: ${task.customName} (${e.message})`, 'error');
                    } finally {
                        completed++;
                        updateProgress(completed, downloadTasks.length);
                    }
                    await new Promise(r =&gt; setTimeout(r, 60));
                }
            });
            await Promise.all(workers);

            addLog(`处理完毕！成功: ${success}，失败: ${failed}。正在导出...`, 'info');
            const excelBuffer = await finalWorkbook.xlsx.writeBuffer();
            const rootZip = new JSZip();
            rootZip.file(&quot;处理结果.xlsx&quot;, excelBuffer);
            const folderNamed = rootZip.folder(&quot;唯一编码命名图片&quot;);
            namedZip.forEach((path, file) =&gt; folderNamed.file(path, file.async('blob')));
            const folderSeq = rootZip.folder(&quot;按表格顺序重命名图片&quot;);
            seqZip.forEach((path, file) =&gt; folderSeq.file(path, file.async('blob')));

            const finalBlob = await rootZip.generateAsync({ type: &quot;blob&quot; });
            saveAs(finalBlob, `Excel图片下载处理结果_${new Date().toISOString().slice(0,10)}.zip`);
            addLog('🎉 模式一处理完成，压缩包已下载！', 'success');
        }

        async function fetchImageWithBypass(rawUrl, proxyMode) {
            let targetUrl = rawUrl.trim();
            if (targetUrl.startsWith('//')) targetUrl = 'https:' + targetUrl;
            targetUrl = targetUrl.replace(/(\/I\/[^/.]+)(\.[^/]*)(\.[a-zA-Z]+)$/, '$1$3');

            if (proxyMode === 'always') return await fetchViaProxy(targetUrl);
            if (proxyMode === 'none') {
                const res = await fetch(targetUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            }
            try {
                const res = await fetch(targetUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            } catch (err) {
                return await fetchViaProxy(targetUrl);
            }
        }

        async function fetchViaProxy(url) {
            const enc = encodeURIComponent(url);
            const proxyList = [
                `https://images.weserv.nl/?url=${enc}&amp;default=${enc}`,
                `https://api.allorigins.win/raw?url=${enc}`,
                `https://corsproxy.io/?url=${enc}`
            ];
            let lastErr = null;
            for (let p of proxyList) {
                try {
                    const res = await fetch(p);
                    if (res.ok) {
                        const b = await res.blob();
                        if (b.size &gt; 200) return b;
                    }
                } catch (e) { lastErr = e; }
            }
            throw new Error(`跨域穿透失败: ${lastErr ? lastErr.message : '全部代理无响应'}`);
        }

        function getExtension(blob, url) {
            if (blob.type) {
                const sub = blob.type.split('/')[1];
                if (sub &amp;&amp; sub.length &lt;= 4) return sub.replace('jpeg', 'jpg');
            }
            try {
                const p = new URL(url).pathname;
                const ext = p.split('.').pop().toLowerCase();
                if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) return ext === 'jpeg' ? 'jpg' : ext;
            } catch (e) {}
            return 'jpg';
        }

        // =========================================================================
        // 模式二：本地已有图片匹配插入 Excel (完整独立保留并升级)
        // =========================================================================
        let loadedWorkbook2 = null;
        let localImageFiles = new Map(); // Key: 纯文件名(大写无后缀), Value: File / Blob
        let detectedHeaders2 = [];

        const dropArea2 = document.getElementById('dropArea2');
        const excelInput2 = document.getElementById('excelInput2');
        const mediaArea2 = document.getElementById('mediaArea2');
        const zipInput2 = document.getElementById('zipInput2');
        const folderInput2 = document.getElementById('folderInput2');
        const matchColSelect2 = document.getElementById('matchColSelect2');
        const startBtn2 = document.getElementById('startBtn2');

        // Excel 拖拽
        ['dragover', 'dragleave', 'drop'].forEach(evt =&gt; {
            dropArea2.addEventListener(evt, (e) =&gt; {
                e.preventDefault();
                if (evt === 'dragover') dropArea2.classList.add('active');
                else dropArea2.classList.remove('active');
            });
        });
        dropArea2.addEventListener('drop', (e) =&gt; { if (e.dataTransfer.files.length) handleUpload2(e.dataTransfer.files[0]); });
        excelInput2.addEventListener('change', (e) =&gt; { if (e.target.files.length) handleUpload2(e.target.files[0]); });

        async function handleUpload2(file) {
            if (!file.name.match(/\.xlsx$/i)) return alert('请上传 .xlsx 格式文件！');
            document.getElementById('fileInfo2').textContent = `已载入: ${file.name}`;
            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                loadedWorkbook2 = new ExcelJS.Workbook();
                await loadedWorkbook2.xlsx.load(arrayBuffer);
                const firstSheet = loadedWorkbook2.worksheets[0];
                if (!firstSheet || firstSheet.rowCount &lt; 1) return alert('Excel 内容为空！');

                initSelectors2(firstSheet);
                document.getElementById('configCard2').style.display = 'block';
                checkReady2();
            } catch (err) { alert('解析 Excel 失败: ' + err.message); }
        }

        function initSelectors2(sheet) {
            document.getElementById('previewSheetName2').textContent = `当前预览: [${sheet.name}]`;
            detectedHeaders2 = [];
            matchColSelect2.innerHTML = '';

            sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, colNumber) =&gt; {
                const val = extractPureValue(cell.value);
                const str = (val !== null &amp;&amp; val !== undefined) ? val.toString().trim() : '';
                detectedHeaders2.push({ colNumber, name: str || `列 ${colNumber}` });
                matchColSelect2.add(new Option(str || `列 ${colNumber}`, str || `列 ${colNumber}`));
            });

            // 智能预选 ASIN、款号、编号、SKU
            let defMatch = detectedHeaders2[0].name;
            detectedHeaders2.forEach(h =&gt; {
                if (/asin|sku|编号|编码|款号|货号|名称/i.test(h.name)) defMatch = h.name;
            });
            matchColSelect2.value = defMatch;

            renderPreview2(sheet);
            matchColSelect2.onchange = () =&gt; updateHighlight2();
            updateHighlight2();
        }

        function renderPreview2(sheet) {
            const thead = document.getElementById('previewThead2');
            const tbody = document.getElementById('previewTbody2');
            thead.innerHTML = ''; tbody.innerHTML = '';
            const trHead = document.createElement('tr');
            detectedHeaders2.forEach(h =&gt; {
                const th = document.createElement('th');
                th.textContent = h.name;
                th.setAttribute('data-colname', h.name);
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            const maxRow = Math.min(sheet.rowCount, 11);
            for (let r = 2; r &lt;= maxRow; r++) {
                const row = sheet.getRow(r);
                const tr = document.createElement('tr');
                detectedHeaders2.forEach(h =&gt; {
                    const td = document.createElement('td');
                    const val = extractPureValue(row.getCell(h.colNumber).value);
                    td.textContent = (val !== null &amp;&amp; val !== undefined) ? val.toString() : '';
                    td.setAttribute('data-colname', h.name);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            }
        }

        function updateHighlight2() {
            const m = matchColSelect2.value;
            document.querySelectorAll('#previewTable2 [data-colname]').forEach(el =&gt; {
                const name = el.getAttribute('data-colname');
                el.classList.remove('col-highlight-name');
                if (name === m) el.classList.add('col-highlight-name');
            });
        }

        // 本地图片资源上传逻辑 (拖拽 / ZIP / 文件夹)
        ['dragover', 'dragleave', 'drop'].forEach(evt =&gt; {
            mediaArea2.addEventListener(evt, (e) =&gt; {
                e.preventDefault();
                if (evt === 'dragover') mediaArea2.classList.add('active');
                else mediaArea2.classList.remove('active');
            });
        });

        zipInput2.addEventListener('change', async (e) =&gt; {
            if (e.target.files.length) {
                localImageFiles.clear();
                await handleZip2(e.target.files[0]);
                updateMediaInfo2();
            }
        });

        folderInput2.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                localImageFiles.clear();
                Array.from(e.target.files).forEach(f =&gt; collectLocalImage(f));
                updateMediaInfo2();
            }
        });

        mediaArea2.addEventListener('drop', async (e) =&gt; {
            localImageFiles.clear();
            const items = e.dataTransfer.items;
            const promises = [];
            for (let i = 0; i &lt; items.length; i++) {
                const item = items[i];
                const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                if (entry) {
                    if (entry.isFile) {
                        promises.push(new Promise(res =&gt; {
                            entry.file(async f =&gt; {
                                if (f.name.match(/\.zip$/i)) await handleZip2(f);
                                else collectLocalImage(f);
                                res();
                            });
                        }));
                    } else if (entry.isDirectory) {
                        promises.push(traverseDir(entry));
                    }
                }
            }
            await Promise.all(promises);
            updateMediaInfo2();
        });

        function traverseDir(item) {
            return new Promise((resolve) =&gt; {
                if (item.isFile) {
                    item.file(f =&gt; { collectLocalImage(f); resolve(); });
                } else if (item.isDirectory) {
                    let dirReader = item.createReader();
                    let allEntries = [];
                    const readEntries = () =&gt; {
                        dirReader.readEntries(async (entries) =&gt; {
                            if (entries.length &gt; 0) {
                                allEntries = allEntries.concat(entries);
                                readEntries();
                            } else {
                                await Promise.all(allEntries.map(e =&gt; traverseDir(e)));
                                resolve();
                            }
                        });
                    };
                    readEntries();
                }
            });
        }

        async function handleZip2(file) {
            addLog(`正在解压 ZIP 文件: ${file.name}...`, 'info');
            try {
                const zip = await JSZip.loadAsync(file);
                let count = 0;
                for (const [path, entry] of Object.entries(zip.files)) {
                    if (!entry.dir &amp;&amp; isImgFile(entry.name)) {
                        if (entry.name.includes('__MACOSX') || entry.name.split('/').pop().startsWith('.')) continue;
                        const blob = await entry.async('blob');
                        blob.name = entry.name.split('/').pop();
                        collectLocalImage(blob);
                        count++;
                    }
                }
                addLog(`ZIP 解压完成，提取了 ${count} 张有效图片`, 'success');
            } catch (err) {
                addLog(`ZIP 解压失败: ${err.message}`, 'error');
            }
        }

        function collectLocalImage(file) {
            if (!isImgFile(file.name) || file.name.startsWith('.')) return;
            const pureName = file.name.split('/').pop().split('.')[0].trim().toUpperCase();
            localImageFiles.set(pureName, file);
        }

        function isImgFile(name) { return /\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(name); }

        function updateMediaInfo2() {
            const count = localImageFiles.size;
            document.getElementById('mediaInfo2').textContent = `已扫描入库: ${count} 张本地图片`;
            checkReady2();
        }

        function checkReady2() {
            startBtn2.disabled = !(loadedWorkbook2 &amp;&amp; localImageFiles.size &gt; 0);
        }

        // 模式二：开始本地匹配与插入
        startBtn2.addEventListener('click', async () =&gt; {
            if (!loadedWorkbook2 || localImageFiles.size === 0) return;
            startBtn2.disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('logBox').innerHTML = '';

            try {
                await processLocalMatchMode();
            } catch (err) {
                addLog(`模式二处理失败: ${err.message}`, 'error');
            } finally {
                startBtn2.disabled = false;
            }
        });

        async function processLocalMatchMode() {
            const matchHeader = matchColSelect2.value;
            const shouldMerge = document.getElementById('mergeSheetMode2').value === 'merge';

            const finalWorkbook = new ExcelJS.Workbook();
            const matchTasks = [];

            if (shouldMerge) {
                addLog('[模式二] 正在合并工作表并匹配本地图片...', 'info');
                const mergedSheet = finalWorkbook.addWorksheet('合并汇总');
                let mergedHeaders = null;

                loadedWorkbook2.eachSheet((sheet) =&gt; {
                    if (sheet.rowCount &lt; 2) return;
                    let matchCol = -1;
                    sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, col) =&gt; {
                        const val = (extractPureValue(cell.value) || '').toString().trim();
                        if (val === matchHeader) matchCol = col;
                    });
                    if (matchCol === -1) return;

                    if (!mergedHeaders) {
                        mergedHeaders = ['图片'];
                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell) =&gt; mergedHeaders.push(extractPureValue(cell.value)));
                        mergedSheet.getRow(1).values = mergedHeaders;
                        mergedSheet.getColumn(1).width = 20;
                    }

                    for (let r = 2; r &lt;= sheet.rowCount; r++) {
                        const row = sheet.getRow(r);
                        const matchVal = extractPureValue(row.getCell(matchCol).value);
                        if (!matchVal &amp;&amp; !row.hasValues) continue;

                        const rowData = [''];
                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, cNum) =&gt; rowData.push(extractPureValue(row.getCell(cNum).value)));
                        const appendedRow = mergedSheet.addRow(rowData);

                        matchTasks.push({
                            sheet: mergedSheet,
                            rowIdx: appendedRow.number,
                            matchKey: matchVal ? matchVal.toString().trim().toUpperCase() : ''
                        });
                    }
                });
            } else {
                addLog('[模式二] 正在独立各子表匹配本地图片...', 'info');
                loadedWorkbook2.eachSheet((sheet) =&gt; {
                    if (sheet.rowCount &lt; 2) return;
                    let matchCol = -1;
                    sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, col) =&gt; {
                        const val = (extractPureValue(cell.value) || '').toString().trim();
                        if (val === matchHeader) matchCol = col;
                    });
                    if (matchCol === -1) return;

                    const newSheet = finalWorkbook.addWorksheet(sheet.name);
                    const newHeaders = ['图片'];
                    sheet.getRow(1).eachCell({ includeEmpty: false }, (cell) =&gt; newHeaders.push(extractPureValue(cell.value)));
                    newSheet.getRow(1).values = newHeaders;
                    newSheet.getColumn(1).width = 20;

                    for (let r = 2; r &lt;= sheet.rowCount; r++) {
                        const row = sheet.getRow(r);
                        const matchVal = extractPureValue(row.getCell(matchCol).value);
                        if (!matchVal &amp;&amp; !row.hasValues) continue;

                        const rowData = [''];
                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, cNum) =&gt; rowData.push(extractPureValue(row.getCell(cNum).value)));
                        const appendedRow = newSheet.addRow(rowData);

                        matchTasks.push({
                            sheet: newSheet,
                            rowIdx: appendedRow.number,
                            matchKey: matchVal ? matchVal.toString().trim().toUpperCase() : ''
                        });
                    }
                });
            }

            if (matchTasks.length === 0) throw new Error('未检索到有效数据行');

            const CELL_PIXEL_W = 145, CELL_PIXEL_H = 160, ROW_HEIGHT = 120, EMU = 9525;
            let success = 0, fail = 0;
            const seqZip = new JSZip();

            for (let i = 0; i &lt; matchTasks.length; i++) {
                const task = matchTasks[i];
                const seqIndex = i + 1;

                if (task.matchKey &amp;&amp; localImageFiles.has(task.matchKey)) {
                    const blob = localImageFiles.get(task.matchKey);
                    const base64 = await blobToBase64(blob);
                    const ext = (blob.name ? blob.name.split('.').pop().toLowerCase() : 'jpg').replace('jpeg', 'jpg');

                    // 存入顺序命名压缩包
                    seqZip.file(`图片${success + 1}.${ext}`, blob);

                    // 居中不拉伸缩放
                    const dim = await getImageDimensions(blob);
                    const scale = Math.min(CELL_PIXEL_W / dim.w, CELL_PIXEL_H / dim.h);
                    const finalW = Math.max(1, Math.floor(dim.w * scale));
                    const finalH = Math.max(1, Math.floor(dim.h * scale));
                    const offsetX = Math.floor((CELL_PIXEL_W - finalW) / 2 * EMU);
                    const offsetY = Math.floor((CELL_PIXEL_H - finalH) / 2 * EMU);

                    const imgId = finalWorkbook.addImage({ base64, extension: ext === 'jpg' ? 'jpeg' : ext });
                    task.sheet.addImage(imgId, {
                        tl: { col: 0, row: task.rowIdx - 1, nativeColOff: offsetX, nativeRowOff: offsetY },
                        ext: { width: finalW, height: finalH },
                        editAs: 'oneCell'
                    });
                    task.sheet.getRow(task.rowIdx).height = ROW_HEIGHT;
                    success++;
                } else {
                    fail++;
                }

                if (seqIndex % 10 === 0 || seqIndex === matchTasks.length) {
                    updateProgress(seqIndex, matchTasks.length);
                    await new Promise(r =&gt; setTimeout(r, 0));
                }
            }

            addLog(`本地图片匹配完成！成功插入: ${success} 张，未匹配: ${fail} 条。`, 'success');
            const excelBuffer = await finalWorkbook.xlsx.writeBuffer();
            const rootZip = new JSZip();
            rootZip.file(&quot;图片匹配插入结果.xlsx&quot;, excelBuffer);
            const folderSeq = rootZip.folder(&quot;按表格顺序重命名图片&quot;);
            seqZip.forEach((path, file) =&gt; folderSeq.file(path, file.async('blob')));

            const finalBlob = await rootZip.generateAsync({ type: &quot;blob&quot; });
            saveAs(finalBlob, `本地图片匹配结果_${new Date().toISOString().slice(0,10)}.zip`);
            addLog('🎉 模式二处理完成，打包 ZIP 已下载！', 'success');
        }

&lt;!--    &lt;div class=&quot;container&quot;&gt;--&gt;
&lt;!--        &lt;h1&gt;Excel 图片下载与排版插入工具&lt;/h1&gt;--&gt;
&lt;!--        &lt;p class=&quot;subtitle&quot;&gt;智能跨域绕行 · 消除公式冲突 · 自动生成唯一码 · 首列自适应居中&lt;/p&gt;--&gt;

&lt;!--        &amp;lt;!&amp;ndash; 上传区域 &amp;ndash;&amp;gt;--&gt;
&lt;!--        &lt;div class=&quot;upload-area&quot; id=&quot;dropArea&quot; onclick=&quot;document.getElementById('excelInput').click()&quot;&gt;--&gt;
&lt;!--            &lt;span class=&quot;upload-icon&quot;&gt;📊&lt;/span&gt;--&gt;
&lt;!--            &lt;h3&gt;点击或拖拽上传 Excel 文件&lt;/h3&gt;--&gt;
&lt;!--            &lt;p style=&quot;color:#64748b; font-size:12px; margin-top:4px;&quot;&gt;支持 .xlsx 格式文件&lt;/p&gt;--&gt;
&lt;!--            &lt;div class=&quot;file-info&quot; id=&quot;fileInfo&quot;&gt;&lt;/div&gt;--&gt;
&lt;!--            &lt;input type=&quot;file&quot; id=&quot;excelInput&quot; accept=&quot;.xlsx&quot; style=&quot;display:none;&quot;&gt;--&gt;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const extractBtn = document.getElementById('extractBtn');
        const btnText = document.getElementById('btnText');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 事件监听
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f0e6f5';
            uploadArea.style.borderColor = '#8e44ad';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.background = '#f8f9fa';
            uploadArea.style.borderColor = '#9b59b6';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f8f9fa';
            uploadArea.style.borderColor = '#9b59b6';

            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        extractBtn.addEventListener('click', extractImages);

        // 处理上传的文件
        function handleFile(file) {
            if (!file.name.match(/\.(xlsx)$/)) {
                alert('请上传.xlsx格式的Excel文件');
                return;
            }

            fileInfo.textContent = `已选择: ${file.name}`;
            extractBtn.disabled = false;

            addLog(`已选择文件: ${file.name}`, 'info');
        }

        // 提取图片
        async function extractImages() {
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            extractBtn.disabled = true;
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            try {
                addLog('开始解析Excel文件...', 'info');

                // 读取Excel文件
                const data = await readFileAsArrayBuffer(file);
                const workbook = XLSX.read(data, {type: 'array'});

                // 获取第一个工作表
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                // 获取工作表数据
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                if (!jsonData.length || jsonData.length &lt; 2) {
                    throw new Error('Excel文件没有数据或数据格式不正确');
                }

                addLog(`找到 ${jsonData.length - 1} 行数据`, 'success');

                // 解析Excel文件以提取图片
                const images = await extractImagesFromExcel(data, jsonData);

                if (images.length === 0) {
                    throw new Error('未在Excel文件中找到图片');
                }

                addLog(`成功提取 ${images.length} 张图片`, 'success');

                // 创建ZIP文件
                await createZipFile(images);

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
                resetUI();
            }
        }

        // 读取文件为ArrayBuffer
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = (e) =&gt; resolve(e.target.result);
                reader.onerror = (e) =&gt; reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        // 从Excel文件中提取图片
        async function extractImagesFromExcel(data, jsonData) {
            addLog('正在提取图片...', 'info');

            // 将Excel文件作为ZIP文件处理
            const zip = await JSZip.loadAsync(data);

            // 查找媒体文件
            const mediaFiles = [];
            zip.forEach((relativePath, zipEntry) =&gt; {
                if (relativePath.startsWith('xl/media/')) {
                    mediaFiles.push(zipEntry);
                }
            });

            addLog(`在Excel文件中找到 ${mediaFiles.length} 个媒体文件`, 'info');

            // 查找绘图文件（包含图片位置信息）
            let drawings = [];
            try {
                const drawingsXml = await zip.file('xl/drawings/drawing1.xml').async('text');
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(drawingsXml, 'text/xml');

                // 解析图片引用
                const twoCellAnchors = xmlDoc.getElementsByTagName('xdr:twoCellAnchor');

                for (let i = 0; i &lt; twoCellAnchors.length; i++) {
                    const anchor = twoCellAnchors[i];

                    // 获取图片引用
                    const blipFill = anchor.getElementsByTagName('xdr:blipFill')[0];
                    if (blipFill) {
                        const blip = blipFill.getElementsByTagName('a:blip')[0];
                        if (blip) {
                            const embedId = blip.getAttribute('r:embed');

                            // 获取图片位置
                            const from = anchor.getElementsByTagName('xdr:from')[0];
                            if (from) {
                                const col = from.getElementsByTagName('xdr:col')[0].textContent;
                                const row = from.getElementsByTagName('xdr:row')[0].textContent;

                                if (col === '1' &amp;&amp; row &gt; 0) { // 假设图片在第二列(B列)
                                    drawings.push({
                                        embedId: embedId,
                                        row: parseInt(row)
                                    });
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                addLog('无法解析图片位置信息，将使用默认顺序', 'info');
                // 如果无法解析绘图文件，则按顺序分配图片
                for (let i = 1; i &lt; jsonData.length &amp;&amp; i &lt;= mediaFiles.length; i++) {
                    drawings.push({
                        embedId: `rId${i}`,
                        row: i
                    });
                }
            }

            // 查找图片关系
            let imageRelations = {};
            try {
                const relsXml = await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('text');
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(relsXml, 'text/xml');

                const relationships = xmlDoc.getElementsByTagName('Relationship');
                for (let i = 0; i &lt; relationships.length; i++) {
                    const rel = relationships[i];
                    const id = rel.getAttribute('Id');
                    const target = rel.getAttribute('Target');
                    imageRelations[id] = target;
                }
            } catch (e) {
                addLog('无法解析图片关系，将使用默认映射', 'info');
                // 如果无法解析关系文件，则创建默认映射
                for (let i = 1; i &lt;= mediaFiles.length; i++) {
                    imageRelations[`rId${i}`] = `../media/image${i}.png`;
                }
            }

            // 提取图片
            const images = [];
            for (const drawing of drawings) {
                const relation = imageRelations[drawing.embedId];
                if (!relation) continue;

                const imagePath = relation.replace('../', 'xl/');
                const imageFile = zip.file(imagePath);

                if (imageFile) {
                    const imageData = await imageFile.async('blob');
                    const imageName = jsonData[drawing.row] &amp;&amp; jsonData[drawing.row][0] ?
                                     `${jsonData[drawing.row][0]}.png` : `图片${drawing.row}.png`;

                    images.push({
                        name: imageName,
                        data: imageData
                    });

                    addLog(`提取图片: ${imageName}`, 'success');
                    updateProgress(images.length, drawings.length, `已提取 ${images.length}/${drawings.length} 张图片`);
                }
            }

            return images;
        }

        // 创建ZIP文件
        async function createZipFile(images) {
            addLog('正在创建ZIP文件...', 'info');

            const zip = new JSZip();

            for (const image of images) {
                zip.file(image.name, image.data);
            }

            updateProgress(100, 100, '正在生成ZIP文件...');

            const content = await zip.generateAsync({type: 'blob'});
            saveAs(content, '提取的图片.zip');

            addLog(`提取完成! 成功提取 ${images.length} 张图片`, 'success');
            statusText.textContent = `提取完成! 成功提取 ${images.length} 张图片`;

            resetUI();
        }

        // 更新进度
        function updateProgress(completed, total, status) {
            const percent = Math.round((completed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            statusText.textContent = status;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 重置UI
        function resetUI() {
            extractBtn.disabled = false;
            btnText.textContent = '提取图片';
        }

      &lt;li&gt;&lt;span class=&quot;step-number&quot;&gt;3&lt;/span&gt;设置“每个文件合并 Sheet 数量”。设为 1 则只取第一个 Sheet。&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;step-number&quot;&gt;4&lt;/span&gt;点击合并并下载。&lt;b&gt;来源列将确保在最右侧。&lt;/b&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;

  &lt;div class=&quot;top-sections&quot;&gt;
    &lt;div class=&quot;upload-section-container&quot;&gt;
      &lt;div class=&quot;section&quot; id=&quot;upload-section&quot;&gt;
        &lt;h2&gt;📁 1. 上传与解析&lt;/h2&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;label&gt;选择文件：&lt;/label&gt;
          &lt;input id=&quot;fileInputFiles&quot; type=&quot;file&quot; multiple accept=&quot;.xlsx,.xls,.csv&quot; /&gt;

        &lt;div class=&quot;row&quot;&gt;

          &lt;input id=&quot;fileInputFolder&quot; type=&quot;file&quot; webkitdirectory directory accept=&quot;.xlsx,.xls,.csv&quot; /&gt;

        &lt;div class=&quot;row&quot;&gt;
          &lt;button id=&quot;btnParseSelected&quot; disabled&gt;解析文件&lt;/button&gt;
          &lt;button id=&quot;btnClear&quot;&gt;清空&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;file-list&quot; id=&quot;selectionList&quot;&gt;等待上传...&lt;/div&gt;
      &lt;/div&gt;

    &lt;div class=&quot;filter-section-container&quot;&gt;
      &lt;div class=&quot;section&quot; id=&quot;filter-section&quot;&gt;

        &lt;div class=&quot;tips&quot;&gt;
          状态：&lt;strong id=&quot;filterStateText&quot; style=&quot;color:#666;&quot;&gt;未筛选 (使用所有 Sheet)&lt;/strong&gt;
        &lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;label&gt;关键字：&lt;/label&gt;
          &lt;input id=&quot;sheetKeyword&quot; type=&quot;text&quot; value=&quot;&quot; /&gt;
          &lt;button id=&quot;btnFilter&quot; disabled&gt;筛选&lt;/button&gt;
          &lt;button id=&quot;btnResetFilter&quot; disabled&gt;重置&lt;/button&gt;
        &lt;/div&gt;

  &lt;div class=&quot;section&quot; id=&quot;merge-section&quot;&gt;
    &lt;h2&gt;🔗 3. 合并设置与执行&lt;/h2&gt;
    &lt;div class=&quot;tips&quot;&gt;
      &lt;b&gt;表头修复：&lt;/b&gt; 程序会自动收集所有列名，确保“来源文件”和“来源Sheet”永远在所有数据列的后面。
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;表头所在行：&lt;/label&gt;
      &lt;input id=&quot;headerRow&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;1&quot; /&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;label&gt;每个文件取前 N 个 Sheet：&lt;/label&gt;
      &lt;input id=&quot;sheetLimitCount&quot; type=&quot;number&quot; min=&quot;1&quot; value=&quot;1&quot; title=&quot;每个Excel文件只读取前N个Sheet&quot; /&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;
      &lt;button id=&quot;btnMerge&quot; disabled&gt;执行合并&lt;/button&gt;
      &lt;button id=&quot;btnDownloadMergedXlsx&quot; disabled&gt;📥 下载结果&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;summary&quot; id=&quot;mergeSummary&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;preview&quot; id=&quot;mergePreview&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    // --- 状态变量 ---
    let parsedWorkbooks = [];
    let isFiltered = false;
    let mergedData = [];
    let allDataColumns = new Set(); // 新增：用于收集所有遇到的数据列名

    // --- DOM ---
    const fileInputFiles = document.getElementById('fileInputFiles');
    const fileInputFolder = document.getElementById('fileInputFolder');
    const btnParseSelected = document.getElementById('btnParseSelected');
    const btnClear = document.getElementById('btnClear');
    const selectionList = document.getElementById('selectionList');

    const sheetKeyword = document.getElementById('sheetKeyword');
    const btnFilter = document.getElementById('btnFilter');
    const btnResetFilter = document.getElementById('btnResetFilter');
    const filterStateText = document.getElementById('filterStateText');
    const filterSummary = document.getElementById('filterSummary');

    const headerRowInput = document.getElementById('headerRow');
    const sheetLimitInput = document.getElementById('sheetLimitCount');
    const btnMerge = document.getElementById('btnMerge');
    const btnDownloadMergedXlsx = document.getElementById('btnDownloadMergedXlsx');
    const mergeSummary = document.getElementById('mergeSummary');
    const mergePreview = document.getElementById('mergePreview');

    // --- 1. 上传与解析 ---
    function handleFiles(files) {
      const excelFiles = Array.from(files).filter(f =&gt; /(\.xlsx|\.xls|\.csv)$/i.test(f.name));
      if (excelFiles.length === 0) return;

      selectionList.innerHTML = `&lt;div&gt;已选择 ${excelFiles.length} 个文件，点击“解析文件”。&lt;/div&gt;` +
                                excelFiles.map(f =&gt; `&lt;div&gt;📄 ${f.name}&lt;/div&gt;`).join('');
      btnParseSelected.disabled = false;
      fileInputFiles.tempFiles = excelFiles;
    }

    fileInputFiles.addEventListener('change', (e) =&gt; handleFiles(e.target.files));
    fileInputFolder.addEventListener('change', (e) =&gt; handleFiles(e.target.files));

    btnParseSelected.addEventListener('click', async () =&gt; {
      const files = fileInputFiles.tempFiles || [];
      if (files.length === 0) return;

      btnParseSelected.textContent = '解析中...';
      btnParseSelected.disabled = true;
      parsedWorkbooks = [];
      resetDownstream();

      try {
        for (const file of files) {
          const ab = await file.arrayBuffer();
          const wb = XLSX.read(ab, { type: 'array', cellDates: true });
          parsedWorkbooks.push({ name: file.name, workbook: wb });
        }
        selectionList.innerHTML = `&lt;div style=&quot;color:green&quot;&gt;✅ 成功解析 ${parsedWorkbooks.length} 个文件&lt;/div&gt;`;
        btnFilter.disabled = false;
        btnMerge.disabled = false;
      } catch (e) {
        alert(&quot;解析失败: &quot; + e.message);
      } finally {
        btnParseSelected.textContent = '解析文件';
      }
    });

    btnClear.addEventListener('click', () =&gt; {
      parsedWorkbooks = [];
      fileInputFiles.value = '';
      fileInputFolder.value = '';
      selectionList.textContent = '等待上传...';
      btnParseSelected.disabled = true;
      resetDownstream();
    });

    function resetDownstream() {
      isFiltered = false;
      mergedData = [];
      allDataColumns.clear();
      filterSummary.textContent = '';
      mergeSummary.textContent = '';
      mergePreview.innerHTML = '';
      btnFilter.disabled = true;
      btnResetFilter.disabled = true;
      btnMerge.disabled = true;
      btnDownloadMergedXlsx.disabled = true;
      filterStateText.innerHTML = '未筛选 (使用所有 Sheet)';
      filterStateText.style.color = '#666';
    }

    // --- 2. 筛选 ---
    btnFilter.addEventListener('click', () =&gt; {
      const kw = sheetKeyword.value.trim();
      if (!kw) { alert(&quot;请输入关键字&quot;); return; }

      let matchCount = 0;
      parsedWorkbooks.forEach(({ workbook }) =&gt; {
        workbook.SheetNames.forEach(sn =&gt; {
          if (sn.includes(kw)) matchCount++;
        });
      });

      if (matchCount &gt; 0) {
        isFiltered = true;
        filterStateText.innerHTML = `✅ 已开启筛选 (需包含 &quot;${kw}&quot;)`;
        filterStateText.style.color = 'green';
        filterSummary.textContent = `预览：所有文件中共有 ${matchCount} 个符合条件的 Sheet`;
        btnResetFilter.disabled = false;
      } else {
        alert(`未在任何文件中找到包含 &quot;${kw}&quot; 的 Sheet`);
      }
    });

    btnResetFilter.addEventListener('click', () =&gt; {
      isFiltered = false;
      filterStateText.innerHTML = '未筛选 (使用所有 Sheet)';
      filterStateText.style.color = '#666';
      filterSummary.textContent = '筛选已重置';
      btnResetFilter.disabled = true;
      sheetKeyword.value = '变体对比';
    });

    // --- 3. 合并 (修复表头顺序) ---
    btnMerge.addEventListener('click', () =&gt; {
      mergedData = [];
      allDataColumns.clear(); // 清空列名记录
      mergePreview.innerHTML = '';
      mergeSummary.textContent = '正在合并...';

      const headerIdx = parseInt(headerRowInput.value) - 1;
      const sheetLimit = parseInt(sheetLimitInput.value);

      if (isNaN(headerIdx) || headerIdx &lt; 0) { alert(&quot;表头行无效&quot;); return; }
      if (isNaN(sheetLimit) || sheetLimit &lt; 1) { alert(&quot;Sheet 数量限制无效&quot;); return; }

      let totalSheetsProcessed = 0;

      // 遍历文件
      parsedWorkbooks.forEach(({ name, workbook }) =&gt; {
        let targetSheets = workbook.SheetNames;
        if (isFiltered) {
          const kw = sheetKeyword.value.trim();
          targetSheets = targetSheets.filter(sn =&gt; sn.includes(kw));
        }

        // 截取 Sheet 数量
        const finalSheetsToProcess = targetSheets.slice(0, sheetLimit);

        finalSheetsToProcess.forEach(sheetName =&gt; {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });

          if (!jsonData || jsonData.length &lt;= headerIdx) return;

          const rawHeaders = jsonData[headerIdx];
          if (!rawHeaders) return;

          const validCols = [];
          rawHeaders.forEach((h, idx) =&gt; {
            if (h &amp;&amp; String(h).trim() !== '') {
              const colName = String(h).trim();
              validCols.push({ idx: idx, name: colName });
              // 【重点】记录所有遇到的数据列名
              allDataColumns.add(colName);
            }
          });
          if (validCols.length === 0) return;

          // 读取数据
          for (let i = headerIdx + 1; i &lt; jsonData.length; i++) {
            const rowArr = jsonData[i];
            const isEmpty = rowArr.every(c =&gt; c === undefined || c === null || String(c).trim() === '');
            if (isEmpty) continue;

            const rowObj = {};
            validCols.forEach(col =&gt; {
              let val = rowArr[col.idx];
              if (val instanceof Date) val = val.toLocaleDateString();
              rowObj[col.name] = (val === undefined || val === null) ? '' : val;
            });

            // 添加来源
            rowObj['__来源文件'] = name;
            rowObj['__来源Sheet'] = sheetName;

            mergedData.push(rowObj);
          }
          totalSheetsProcessed++;
        });
      });

      if (mergedData.length === 0) {
        mergeSummary.textContent = '⚠️ 未找到任何有效数据。请检查表头行设置或筛选条件。';
      } else {
        mergeSummary.textContent = `✅ 合并完成！共处理 ${totalSheetsProcessed} 个 Sheet，生成 ${mergedData.length} 行数据。`;
        btnDownloadMergedXlsx.disabled = false;
        renderPreview();
      }
    });

    // --- 辅助函数：构造完美的表头顺序 ---
    function getFinalHeaders() {
      // 1. 获取所有收集到的数据列名
      const dataCols = Array.from(allDataColumns);
      // 2. 强制添加系统列到最后
      const sysCols = ['__来源文件', '__来源Sheet'];
      // 3. 返回合并后的数组
      return [...dataCols, ...sysCols];
    }

    // 4. 预览
    function renderPreview() {
      const displayData = mergedData.slice(0, 50);
      if (displayData.length === 0) return;

      // 使用强制排序后的表头
      const headers = getFinalHeaders();

      let html = '&lt;table&gt;&lt;thead&gt;&lt;tr&gt;';
      headers.forEach(h =&gt; html += `&lt;th&gt;${h}&lt;/th&gt;`);
      html += '&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;';

      displayData.forEach(row =&gt; {
        html += '&lt;tr&gt;';
        headers.forEach(h =&gt; {
          // 处理 undefined
          const val = (row[h] === undefined || row[h] === null) ? '' : row[h];
          html += `&lt;td&gt;${val}&lt;/td&gt;`;
        });
        html += '&lt;/tr&gt;';
      });
      html += '&lt;/tbody&gt;&lt;/table&gt;';

      if (mergedData.length &gt; 50) {
        html += `&lt;div style=&quot;text-align:center; padding:10px; color:#666;&quot;&gt;... 还有 ${mergedData.length - 50} 行数据未显示 ...&lt;/div&gt;`;
      }
      mergePreview.innerHTML = html;
    }

    // 5. 下载
    btnDownloadMergedXlsx.addEventListener('click', () =&gt; {
      if (mergedData.length === 0) return;

      // 【关键修复】显式传递 header 数组给 json_to_sheet
      // 这样 xlsx 插件就会严格按照这个顺序写入列，不会把多余的列插到中间
      const finalHeaders = getFinalHeaders();

      const ws = XLSX.utils.json_to_sheet(mergedData, { header: finalHeaders });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, &quot;合并结果&quot;);
      XLSX.writeFile(wb, `合并结果_${new Date().getTime()}.xlsx`);
    });
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;">

        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid var(--border-color);
            border-radius: 6px; max-height: 520px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; white-space: nowrap; }
        th, td { padding: 10px 14px; border-bottom: 1px solid var(--border-color); border-right: 1px solid #f1f5f9; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; position: sticky; top: 0; z-index: 1; }
        tr:nth-child(even) td { background-color: #fafafa; }
        tr:hover td { background-color: #f1f5f9; }

        .badge-new { background-color: #dbeafe; color: #1d4ed8; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
        .badge-ratio { background-color: #fef08a; color: #854d0e; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }

        .status-msg { margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 6px; display: none; }
        .status-msg.error { display: block; background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .status-msg.success { display: block; background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;div class=&quot;container&quot;&gt;

                    &lt;span id=&quot;groupResultCount&quot; style=&quot;font-size: 12px; color: var(--text-sub);&quot;&gt;&lt;/span&gt;

&lt;script&gt;
    /* ================= 全局状态 ================= */
    const appState = {
        sku: { rawData: null, data: null, fileName: &quot;&quot;, columns: [] },
        fabric: { rawData: null, data: null, fileName: &quot;&quot;, columns: [] },
        group: { rawData: null, data: null, fileName: &quot;&quot;, columns: [], rawColumns: [] }
    };

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-btn').forEach(btn =&gt; btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content =&gt; content.classList.remove('active'));
        element.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function readExcelFile(file) {
        return new Promise((resolve, reject) =&gt; {
            const reader = new FileReader();
            reader.onload = (e) =&gt; {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: &quot;&quot; });
                    resolve(jsonData);
                } catch (err) { reject(err); }
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    async function handleFile(event, type) {
        const files = Array.from(event.target.files);
        if (!files || files.length === 0) return;

        const statusEl = document.getElementById(`${type}Status`);
        const downloadBtn = document.getElementById(`${type}DownloadBtn`);
        const previewSection = document.getElementById(`${type}PreviewSection`);

        statusEl.className = 'status-msg';
        statusEl.style.display = 'none';

        try {
            const results = await Promise.all(files.map(f =&gt; readExcelFile(f)));
            let mergedData = [];
            let columnSet = new Set();

            results.forEach(sheetData =&gt; {
                if (sheetData &amp;&amp; sheetData.length &gt; 0) {
                    Object.keys(sheetData[0]).forEach(k =&gt; columnSet.add(k));
                    mergedData.push(...sheetData);
                }
            });

            if (mergedData.length === 0) throw new Error(&quot;所选文件中没有发现有效数据！&quot;);

            const baseName = files.length === 1 ? files[0].name.replace(/\.[^/.]+$/, &quot;&quot;) : `已合并_${files.length}个文件`;
            const allCols = Array.from(columnSet);

            if (type === 'sku') {
                processSkuData(mergedData, baseName, files.length, allCols);
            } else if (type === 'fabric') {
                processFabricData(mergedData, baseName, files.length, allCols);
            } else if (type === 'group') {
                initTwoLevelGroupTool(mergedData, baseName, files.length, allCols);
            }
        } catch (err) {
            statusEl.textContent = `❌ 解析出错：${err.message}`;
            statusEl.className = 'status-msg error';
            downloadBtn.disabled = true;
            previewSection.style.display = 'none';
        }
    }

    /* ================= 逻辑 1：SKU &amp; 颜色（未改动） ================= */
    function extractSku(p) {
        if (!p || typeof p !== 'string') return p || '';
        const patterns = [/_[\u4e00-\u9fa5].*/, /-[\u4e00-\u9fa5].*/, / [\u4e00-\u9fa5].*/, /[\u4e00-\u9fa5].*/];
        for (let pat of patterns) if (pat.test(p)) return p.replace(pat, '').trim();
        return p.trim();
    }
    function extractColor(p) {
        if (!p || typeof p !== 'string') return '';
        const match = p.match(/[\u4e00-\u9fa5]/g);
        return match ? match.join('') : '';
    }
    function extractColorEnglish(orig, sku) {
        if (!orig || typeof orig !== 'string') return '';
        let c = orig;
        if (sku) c = c.replace(new RegExp(sku.replace(/[.*+?^${}()|[\]\\]/g, '\\$&amp;'), 'g'), '');
        if (c.includes('_')) c = c.substring(0, c.lastIndexOf('_'));
        return c.replace(/^[_ \s]+|[_ \s]+$/g, '');
    }
    function processSkuData(data, baseName, count, initialCols) {
        data.forEach(row =&gt; {
            const productName = String(row['品名'] !== undefined ? row['品名'] : '');
            let originalEnglish = '';
            if (row['MSKU'] !== undefined) originalEnglish = String(row['MSKU']);
            else if (row['*SKU'] !== undefined) originalEnglish = String(row['*SKU']);
            else if (row['msku'] !== undefined) originalEnglish = String(row['msku']);
            else if (row['sku'] !== undefined) originalEnglish = String(row['sku']);

            const sku = extractSku(productName);
            row['SKU'] = sku;
            row['颜色'] = extractColor(productName);
            row['颜色英文'] = extractColorEnglish(originalEnglish, sku);
        });
        let finalColumns = [...initialCols];

    /* ================= 逻辑 2：拆解材质（未改动） ================= */
    function containsForbiddenWords(t) {
        return ['women', 'sexy', 'womens', 'size', 'this'].some(w =&gt; t.toLowerCase().includes(w));
    }
    function parseFabricType(detail) {
        if (!detail) return '';
        const match = String(detail).match(/Fabric type[:：]\s*(.*?)(?:\||$)/i);
        if (!match) return '';
        const content = match[1].trim();
        const matches = [...content.matchAll(/(\d+(?:\.\d+)?)%\s*([a-zA-Z]+)/g)];
        if (matches.length &gt; 0) {
            const parts = [];
            for (let m of matches) {
                if (m[2].toLowerCase() === 'brand') continue;
                parts.push(`${m[1]}% ${m[2].trim()}`);
            }
            return parts.join('，');
        } else {
            let res = '';
            if (content.includes('.')) {
                res = content.split('.')[0].trim();
                if (res.split(/\s+/).filter(Boolean).length &gt; 8 || containsForbiddenWords(res)) res = '';
            } else {
                const words = content.trim().split(/\s+/).filter(Boolean);
                res = (words.length &gt; 5 || containsForbiddenWords(content)) ? '' : content.trim();
            }
            return res;
        }
    }
    function processFabricData(data, baseName, count, initialCols) {
        data.forEach(row =&gt; { row['材质(成分)'] = parseFabricType(row['详细参数']); });
        let finalColumns = [...initialCols];
        if (!finalColumns.includes('材质(成分)')) finalColumns.push('材质(成分)');

        appState.fabric.data = data;
        appState.fabric.fileName = `${baseName}_已拆材质.xlsx`;
        appState.fabric.columns = finalColumns;

        document.getElementById('fabricFileInfo').innerHTML = `已加载: &lt;span&gt;${count &gt; 1 ? `${count} 个文件` : baseName}&lt;/span&gt; (共 ${data.length} 行)`;
        document.getElementById('fabricStatus').textContent = `✅ 成功处理 ${data.length} 行数据！`;
        document.getElementById('fabricStatus').className = 'status-msg success';
        document.getElementById('fabricDownloadBtn').disabled = false;

        initColumnTags('fabric');
        renderPreviewTable('fabric');
    }

        count: '计数',
        countd: '去重计数'
    };

    function escHtml(s) {
        return String(s).replace(/[&amp;&lt;&gt;&quot;']/g, c =&gt; ({
            '&amp;': '&amp;amp;', '&lt;': '&amp;lt;', '&gt;': '&amp;gt;', '&quot;': '&amp;quot;', &quot;'&quot;: '&amp;#39;'
        }[c]));
    }
    function round2(n) { return Math.round(n * 100) / 100; }
    function formatPercent(num, den) {
        if (!den || isNaN(den) || den === 0) return '0.00%';
        const p = (Number(num) / Number(den)) * 100;
        return (Math.round(p * 100) / 100).toFixed(2) + '%';
    }
    function toNumber(v) {
        if (v === null || v === undefined || v === '') return NaN;
        if (typeof v === 'number') return v;
        const n = Number(String(v).replace(/,/g, '').trim());
        return isNaN(n) ? NaN : n;
    }

    function onGroupCheckboxChange(scope, col, checked) {

    let dragOrderInfo = null;

    function renderOrderList(scope) {
        const listEl = document.getElementById(`${scope}OrderList`);
        const boxEl = document.getElementById(`${scope}OrderBox`);
        const arr = groupSelection[scope];

        listEl.innerHTML = '';

        if (!arr || arr.length === 0) {
            boxEl.style.display = 'none';
            return;
        }
        boxEl.style.display = 'block';

        arr.forEach((col, idx) =&gt; {
            const item = document.createElement('div');
            item.className = 'order-item';
            item.draggable = true;
            item.dataset.index = idx;
            item.dataset.scope = scope;
            item.innerHTML =
                `&lt;span class=&quot;order-num&quot;&gt;${idx + 1}&lt;/span&gt;` +
                `&lt;span class=&quot;order-name&quot;&gt;${escHtml(col)}&lt;/span&gt;` +
                `&lt;button type=&quot;button&quot; class=&quot;col-btn-arrow&quot; title=&quot;上移&quot; onclick=&quot;moveGroupOrder('${scope}', ${idx}, -1)&quot;&gt;▲&lt;/button&gt;` +
                `&lt;button type=&quot;button&quot; class=&quot;col-btn-arrow&quot; title=&quot;下移&quot; onclick=&quot;moveGroupOrder('${scope}', ${idx}, 1)&quot;&gt;▼&lt;/button&gt;`;

            item.addEventListener('dragstart', () =&gt; {
                dragOrderInfo = { scope, index: idx };
                item.classList.add('dragging');
            });
            item.addEventListener('dragend', () =&gt; {
                item.classList.remove('dragging');
                dragOrderInfo = null;
            });
            item.addEventListener('dragover', e =&gt; e.preventDefault());
            item.addEventListener('drop', e =&gt; {
                e.preventDefault();
                if (!dragOrderInfo || dragOrderInfo.scope !== scope) return;
                const from = dragOrderInfo.index;
                const to = idx;
                if (from === to) return;
                const [moved] = arr.splice(from, 1);
                arr.splice(to, 0, moved);
                renderOrderList(scope);
            });

            listEl.appendChild(item);
        });
    }

    function moveGroupOrder(scope, index, dir) {
        const arr = groupSelection[scope];
        const target = index + dir;
        if (target &lt; 0 || target &gt;= arr.length) return;
        const tmp = arr[index];
        arr[index] = arr[target];
        arr[target] = tmp;
        renderOrderList(scope);
    }
