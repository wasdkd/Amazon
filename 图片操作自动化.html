    &lt;h1&gt;图片批量下载工具&lt;/h1&gt;

                &lt;select id=&quot;downloadMode&quot;&gt;
                    &lt;option value=&quot;single&quot;&gt;单线程下载&lt;/option&gt;
                    &lt;option value=&quot;multi&quot;&gt;多线程下载&lt;/option&gt;
                &lt;/select&gt;
            &lt;/div&gt;

            &lt;div class=&quot;setting-row&quot; id=&quot;threadCountRow&quot;&gt;
                &lt;label for=&quot;threadCount&quot;&gt;线程数量:&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;threadCount&quot; min=&quot;1&quot; max=&quot;20&quot; value=&quot;5&quot;&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;button id=&quot;downloadBtn&quot; class=&quot;download-btn&quot; disabled&gt;
            &lt;span class=&quot;spinner hidden&quot; id=&quot;spinner&quot;&gt;&lt;/span&gt;
            &lt;span id=&quot;btnText&quot;&gt;开始下载&lt;/span&gt;
        &lt;/button&gt;

        &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
            &lt;div class=&quot;progress-header&quot;&gt;
                &lt;span&gt;下载进度&lt;/span&gt;
                &lt;span id=&quot;progressText&quot;&gt;0%&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;progress-bar&quot;&gt;
                &lt;div class=&quot;progress&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;status&quot; id=&quot;statusText&quot;&gt;准备中...&lt;/div&gt;
            &lt;div class=&quot;log&quot; id=&quot;log&quot;&gt;&lt;/div&gt;

    &lt;!-- 引入必要的库 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const downloadMode = document.getElementById('downloadMode');
        const threadCountRow = document.getElementById('threadCountRow');
        const threadCount = document.getElementById('threadCount');
        const downloadBtn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 变量
        let excelData = null;
        let isProcessing = false;

        // 事件监听
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#e8f4fc';
            uploadArea.style.borderColor = '#2980b9';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.background = '#f8fafc';
            uploadArea.style.borderColor = '#3498db';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f8fafc';
            uploadArea.style.borderColor = '#3498db';

            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        downloadMode.addEventListener('change', () =&gt; {
            threadCountRow.style.display = downloadMode.value === 'multi' ? 'flex' : 'none';
        });

        downloadBtn.addEventListener('click', startDownload);

        // 处理上传的文件
        function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/)) {
                alert('请上传Excel文件(.xlsx或.xls)');
                return;
            }

            fileInfo.textContent = `已选择: ${file.name}`;
            downloadBtn.disabled = false;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(firstSheet);

                    if (!excelData.length || !excelData[0].hasOwnProperty('名称') || !excelData[0].hasOwnProperty('图片链接')) {
                        alert('Excel文件必须包含&quot;名称&quot;和&quot;图片链接&quot;两列');
                        downloadBtn.disabled = true;
                        return;
                    }

                    addLog('Excel文件解析成功，找到 ' + excelData.length + ' 条记录', 'success');
                } catch (error) {
                    alert('解析Excel文件时出错: ' + error.message);
                    downloadBtn.disabled = true;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 开始下载
        function startDownload() {
            if (!excelData || isProcessing) return;

            isProcessing = true;
            downloadBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            const mode = downloadMode.value;
            const maxWorkers = mode === 'multi' ? parseInt(threadCount.value) : 1;

            downloadImages(excelData, mode, maxWorkers);
        }

        // 下载图片
        async function downloadImages(data, mode, maxWorkers) {
            const zip = new JSZip();
            const total = data.length;
            let completed = 0;
            let successCount = 0;
            let failCount = 0;

            updateProgress(0, total, '开始下载图片...');

            // 清理Amazon图片URL
            function cleanAmazonImageUrl(url) {
                const cleanedUrl = url.replace(/(\/I\/[^/.]+)(\.[^/]*)(\.[a-zA-Z]+)$/, '$1$3');
                return cleanedUrl;
            }

            // 下载单个图片
            async function downloadSingleImage(item) {
                const name = item['名称'].toString().trim();
                let imageUrl = item['图片链接'].toString().trim();

                // 清理URL
                const originalUrl = imageUrl;
                imageUrl = cleanAmazonImageUrl(imageUrl);

                if (imageUrl !== originalUrl) {
                    addLog(`URL已清理: ${name}`, 'info');
                }

                try {
                    // 尝试使用清理后的URL
                    let response = await fetch(imageUrl);

                    // 如果清理后的URL失败，尝试原始URL
                    if (!response.ok &amp;&amp; imageUrl !== originalUrl) {
                        addLog(`清理URL失败，尝试原始URL: ${name}`, 'info');
                        response = await fetch(originalUrl);
                        imageUrl = originalUrl;
                    }

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const blob = await response.blob();

                    // 获取文件扩展名
                    const urlObj = new URL(imageUrl);
                    let extension = '.' + urlObj.pathname.split('.').pop();
                    if (extension.length &gt; 5) extension = '.jpg'; // 防止错误扩展名

                    // 添加到ZIP
                    const filename = name + extension;
                    zip.file(filename, blob);

                    completed++;
                    successCount++;
                    updateProgress(completed, total, `成功下载: ${filename}`);
                    addLog(`成功: ${filename}`, 'success');

                    return true;
                } catch (error) {
                    completed++;
                    failCount++;
                    updateProgress(completed, total, `下载失败: ${name}`);
                    addLog(`失败: ${name} - ${error.message}`, 'error');
                    return false;
                }
            }

            // 单线程下载
            async function singleThreadDownload() {
                for (const item of data) {
                    if (!isProcessing) break; // 如果用户取消了
                    await downloadSingleImage(item);
                }
            }

            // 多线程下载
            async function multiThreadDownload() {
                const workers = Math.min(maxWorkers, data.length);
                const chunkSize = Math.ceil(data.length / workers);

                const chunks = [];
                for (let i = 0; i &lt; workers; i++) {
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, data.length);
                    chunks.push(data.slice(start, end));
                }

                // 使用Promise.all并行处理所有块
                await Promise.all(chunks.map(async (chunk) =&gt; {
                    for (const item of chunk) {
                        if (!isProcessing) break; // 如果用户取消了
                        await downloadSingleImage(item);
                    }
                }));
            }

            // 执行下载
            try {
                if (mode === 'single') {
                    await singleThreadDownload();
                } else {
                    await multiThreadDownload();
                }

                if (!isProcessing) {
                    addLog('下载已取消', 'info');
                    resetUI();
                    return;
                }

                // 生成ZIP文件
                updateProgress(total, total, '正在生成ZIP文件...');

                const content = await zip.generateAsync({type: 'blob'});
                saveAs(content, '下载图片.zip');

                addLog(`下载完成! 成功: ${successCount}, 失败: ${failCount}`, 'success');
                statusText.textContent = `下载完成! 成功: ${successCount}, 失败: ${failCount}`;

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
            } finally {
                resetUI();
            }
        }

        // 更新进度
        function updateProgress(completed, total, status) {
            const percent = Math.round((completed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            statusText.textContent = status;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 重置UI
        function resetUI() {
            isProcessing = false;
            downloadBtn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = '开始下载';
        }
    &lt;/script&gt;

&lt;body&gt;
    &lt;h1&gt;Excel图片插入工具&lt;/h1&gt;
    &lt;p class=&quot;subtitle&quot;&gt;将图片插入Excel表格并按顺序重命名图片&lt;/p&gt;

    &lt;div class=&quot;container&quot;&gt;
        &lt;div class=&quot;instructions&quot;&gt;
            &lt;h3&gt;使用说明&lt;/h3&gt;
            &lt;ol&gt;
                &lt;li&gt;上传包含ASIN列的Excel文件&lt;/li&gt;
                &lt;li&gt;上传包含图片的文件夹（ZIP压缩包）&lt;/li&gt;
                &lt;li&gt;图片文件名应与ASIN值匹配（如：B0DP9KJ6GL.jpg）&lt;/li&gt;
                &lt;li&gt;工具将插入匹配的图片到Excel中，并按顺序重命名图片&lt;/li&gt;
                &lt;li&gt;结果将包含更新后的Excel文件和重命名后的图片ZIP包&lt;/li&gt;
            &lt;/ol&gt;
        &lt;/div&gt;

        &lt;div class=&quot;upload-section&quot;&gt;
            &lt;div class=&quot;upload-area&quot; id=&quot;excelUploadArea&quot;&gt;
                &lt;i&gt;📊&lt;/i&gt;
                &lt;p&gt;拖放Excel文件到此处或&lt;span class=&quot;browse&quot;&gt;点击浏览&lt;/span&gt;&lt;/p&gt;
                &lt;p class=&quot;file-info&quot; id=&quot;excelFileInfo&quot;&gt;支持格式: .xlsx&lt;/p&gt;
                &lt;input type=&quot;file&quot; id=&quot;excelFileInput&quot; accept=&quot;.xlsx&quot; class=&quot;hidden&quot;&gt;
            &lt;/div&gt;

            &lt;div class=&quot;upload-area&quot; id=&quot;imageUploadArea&quot;&gt;
                &lt;i&gt;🖼️&lt;/i&gt;
                &lt;p&gt;拖放图片文件夹(ZIP)到此处或&lt;span class=&quot;browse&quot;&gt;点击浏览&lt;/span&gt;&lt;/p&gt;
                &lt;p class=&quot;file-info&quot; id=&quot;imageFileInfo&quot;&gt;支持格式: .zip&lt;/p&gt;
                &lt;input type=&quot;file&quot; id=&quot;imageFileInput&quot; accept=&quot;.zip&quot; class=&quot;hidden&quot;&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;button id=&quot;processBtn&quot; class=&quot;process-btn&quot; disabled&gt;
            &lt;span class=&quot;spinner hidden&quot; id=&quot;spinner&quot;&gt;&lt;/span&gt;
            &lt;span id=&quot;btnText&quot;&gt;处理文件&lt;/span&gt;
        &lt;/button&gt;

        &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
            &lt;div class=&quot;progress-header&quot;&gt;
                &lt;span&gt;处理进度&lt;/span&gt;
                &lt;span id=&quot;progressText&quot;&gt;0%&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;progress-bar&quot;&gt;
                &lt;div class=&quot;progress&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;status&quot; id=&quot;statusText&quot;&gt;准备中...&lt;/div&gt;
            &lt;div class=&quot;log&quot; id=&quot;log&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 引入必要的库 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // DOM元素
        const excelUploadArea = document.getElementById('excelUploadArea');
        const excelFileInput = document.getElementById('excelFileInput');
        const excelFileInfo = document.getElementById('excelFileInfo');
        const imageUploadArea = document.getElementById('imageUploadArea');
        const imageFileInput = document.getElementById('imageFileInput');
        const imageFileInfo = document.getElementById('imageFileInfo');
        const processBtn = document.getElementById('processBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 变量
        let imageFiles = new Map();
        let isProcessing = false;

        // 事件监听
        excelUploadArea.addEventListener('click', () =&gt; excelFileInput.click());
        excelUploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            excelUploadArea.style.background = '#e8ecfa';
            excelUploadArea.style.borderColor = '#5a6fd8';
        });
        excelUploadArea.addEventListener('dragleave', () =&gt; {
            excelUploadArea.style.background = '#f8f9fa';
            excelUploadArea.style.borderColor = '#667eea';
        });
        excelUploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            excelUploadArea.style.background = '#f8f9fa';
            excelUploadArea.style.borderColor = '#667eea';

            if (e.dataTransfer.files.length) {
                handleExcelFile(e.dataTransfer.files[0]);
            }
        });

        excelFileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleExcelFile(e.target.files[0]);
            }
        });

        imageUploadArea.addEventListener('click', () =&gt; imageFileInput.click());
        imageUploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            imageUploadArea.style.background = '#e8ecfa';
            imageUploadArea.style.borderColor = '#5a6fd8';
        });
        imageUploadArea.addEventListener('dragleave', () =&gt; {
            imageUploadArea.style.background = '#f8f9fa';
            imageUploadArea.style.borderColor = '#667eea';
        });
        imageUploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            imageUploadArea.style.background = '#f8f9fa';
            imageUploadArea.style.borderColor = '#667eea';

            if (e.dataTransfer.files.length) {
                handleImageFile(e.dataTransfer.files[0]);
            }
        });

        imageFileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleImageFile(e.target.files[0]);
            }
        });

        processBtn.addEventListener('click', processFiles);

        // 处理Excel文件
        function handleExcelFile(file) {
            if (!file.name.match(/\.(xlsx)$/)) {
                alert('请上传.xlsx格式的Excel文件');
                return;
            }

            excelFileInfo.textContent = `已选择: ${file.name}`;
            checkFilesReady();

            addLog(`已选择Excel文件: ${file.name}`, 'info');
        }

        // 处理图片文件
        async function handleImageFile(file) {
            if (!file.name.match(/\.(zip)$/)) {
                alert('请上传.zip格式的图片压缩包');
                return;
            }

            imageFileInfo.textContent = `已选择: ${file.name}`;

            try {
                addLog('正在解析图片压缩包...', 'info');

                const data = await readFileAsArrayBuffer(file);
                const zip = await JSZip.loadAsync(data);

                // 清空之前的图片
                imageFiles.clear();

                // 遍历ZIP文件中的所有图片
                let imageCount = 0;
                for (const [filename, fileEntry] of Object.entries(zip.files)) {
                    if (!fileEntry.dir &amp;&amp; filename.match(/\.(jpg|jpeg|png|gif|bmp)$/i)) {
                        const blob = await fileEntry.async('blob');
                        const asin = filename.split('.')[0]; // 假设文件名就是ASIN
                        imageFiles.set(asin, blob);
                        imageCount++;
                    }
                }

                addLog(`在压缩包中找到 ${imageCount} 张图片`, 'success');
                checkFilesReady();

            } catch (error) {
                addLog(`解析图片压缩包时出错: ${error.message}`, 'error');
            }
        }

        // 检查是否已准备好处理
        function checkFilesReady() {
            const excelReady = excelFileInput.files.length &gt; 0;
            const imageReady = imageFiles.size &gt; 0;

            processBtn.disabled = !(excelReady &amp;&amp; imageReady);
        }

        // 读取文件为ArrayBuffer
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = (e) =&gt; resolve(e.target.result);
                reader.onerror = (e) =&gt; reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        // 将Blob转换为Base64
        function blobToBase64(blob) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = () =&gt; {
                    const dataUrl = reader.result;
                    const base64 = dataUrl.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // 获取图片扩展名
        function getImageExtension(blob) {
            const type = blob.type;
            if (type === 'image/jpeg') return 'jpeg';
            if (type === 'image/png') return 'png';
            if (type === 'image/gif') return 'gif';
            if (type === 'image/bmp') return 'bmp';
            return 'jpeg'; // 默认
        }

        // 处理文件
        async function processFiles() {
            if (!excelFileInput.files.length || imageFiles.size === 0) return;

            isProcessing = true;
            processBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            try {
                addLog('开始处理文件...', 'info');

                // 读取Excel文件
                const excelFile = excelFileInput.files[0];
                const excelData = await readFileAsArrayBuffer(excelFile);

                // 使用ExcelJS读取Excel文件
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(excelData);

                // 获取第一个工作表
                const worksheet = workbook.getWorksheet(1);

                // 查找ASIN列
                let asinColumnIndex = -1;
                const headerRow = worksheet.getRow(1);
                headerRow.eachCell((cell, colNumber) =&gt; {
                    if (cell.value &amp;&amp; cell.value.toString().trim() === 'ASIN') {
                        asinColumnIndex = colNumber;
                    }
                });

                if (asinColumnIndex === -1) {
                    throw new Error('未找到名为&quot;ASIN&quot;的列');
                }

                addLog(`找到ASIN列，位于第 ${asinColumnIndex} 列`, 'success');

                // 确定图片列的位置（ASIN列的下一个列）
                const imageColumnIndex = asinColumnIndex + 1;

                // 设置图片列标题
                if (!worksheet.getRow(1).getCell(imageColumnIndex).value) {
                    worksheet.getRow(1).getCell(imageColumnIndex).value = '图片';
                }

                // 调整列宽以适应图片
                worksheet.getColumn(imageColumnIndex).width = 15;

                // 处理每一行数据
                const renamedImages = new Map();
                let imageCounter = 1;
                let matchedCount = 0;
                let missingCount = 0;

                // 从第二行开始遍历
                for (let rowIndex = 2; rowIndex &lt;= worksheet.rowCount; rowIndex++) {
                    const row = worksheet.getRow(rowIndex);
                    const asinCell = row.getCell(asinColumnIndex);
                    const asin = asinCell.value ? asinCell.value.toString().trim() : '';

                    if (!asin) {
                        continue; // 跳过空ASIN
                    }

                    // 查找匹配的图片
                    if (imageFiles.has(asin)) {
                        try {
                            const imageBlob = imageFiles.get(asin);
                            const imageBase64 = await blobToBase64(imageBlob);
                            const extension = getImageExtension(imageBlob);

                            // 将图片添加到工作簿
                            const imageId = workbook.addImage({
                                base64: imageBase64,
                                extension: extension,
                            });

                            // 插入图片到工作表 [citation:1]
                            // 图片将插入到当前行的图片列，并调整行高以适应图片
                            worksheet.addImage(imageId, {
                                tl: { col: imageColumnIndex - 1, row: rowIndex - 1 },
                                br: { col: imageColumnIndex, row: rowIndex },
                                editAs: 'oneCell'
                            });

                            // 调整行高以显示图片
                            worksheet.getRow(rowIndex).height = 100;

                            // 记录重命名的图片
                            const newImageName = `图片${imageCounter}.${extension}`;
                            renamedImages.set(newImageName, imageBlob);

                            imageCounter++;
                            matchedCount++;

                            addLog(`匹配成功: ${asin} -&gt; ${newImageName}`, 'success');

                        } catch (error) {
                            addLog(`插入图片失败 ${asin}: ${error.message}`, 'error');
                            missingCount++;
                        }
                    } else {
                        missingCount++;
                        addLog(`未找到匹配图片: ${asin}`, 'error');
                    }

                    // 更新进度
                    const progress = Math.round(((rowIndex - 1) / (worksheet.rowCount - 1)) * 100);
                    updateProgress(progress, 100, `处理中: ${rowIndex - 1}/${worksheet.rowCount - 1}`);

                    // 避免阻塞UI，让出控制权
                    if (rowIndex % 5 === 0) {
                        await new Promise(resolve =&gt; setTimeout(resolve, 0));
                    }
                }

                // 生成Excel文件的ArrayBuffer
                addLog('正在生成Excel文件...', 'info');
                const excelBuffer = await workbook.xlsx.writeBuffer();

                // 创建结果ZIP文件
                addLog('正在创建结果ZIP文件...', 'info');
                const resultZip = new JSZip();

                // 添加Excel文件
                resultZip.file('嵌入图片的Excel文件.xlsx', excelBuffer);

                // 添加重命名的图片
                const imagesFolder = resultZip.folder('重命名图片');
                for (const [filename, blob] of renamedImages.entries()) {
                    imagesFolder.file(filename, blob);
                }

                // 生成ZIP文件
                updateProgress(100, 100, '正在生成最终文件...');
                const zipContent = await resultZip.generateAsync({type: 'blob'});

                // 下载文件
                saveAs(zipContent, 'Excel图片处理结果.zip');

                addLog(`处理完成! 成功插入 ${matchedCount} 张图片, 未匹配: ${missingCount}`, 'success');
                statusText.textContent = `处理完成! 成功插入 ${matchedCount} 张图片, 未匹配: ${missingCount}`;

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
            } finally {
                resetUI();
            }
        }

        // 更新进度
        function updateProgress(completed, total, status) {
            const percent = Math.round((completed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            statusText.textContent = status;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 重置UI
        function resetUI() {
            isProcessing = false;
            processBtn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = '处理文件';
        }
    &lt;/script&gt;

            border-radius: 5px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .success {
            color: #2ecc71;
        }

        .error {
            color: #e74c3c;
        }

        .info {
            color: #3498db;
        }

        .hidden {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;Excel图片提取工具&lt;/h1&gt;
    &lt;p class=&quot;subtitle&quot;&gt;从Excel文件中提取嵌入的图片并下载&lt;/p&gt;

    &lt;div class=&quot;container&quot;&gt;
        &lt;div class=&quot;instructions&quot;&gt;
            &lt;h3&gt;使用说明&lt;/h3&gt;
            &lt;ol&gt;
                &lt;li&gt;Excel文件的第一列应为图片名称&lt;/li&gt;
                &lt;li&gt;Excel文件的第二列应为嵌入的图片（浮动图片）&lt;/li&gt;
                &lt;li&gt;上传Excel文件后，点击提取按钮&lt;/li&gt;
                &lt;li&gt;工具将提取所有图片并打包为ZIP文件下载&lt;/li&gt;
                &lt;li&gt;注意：此工具仅支持从.xlsx格式的Excel文件中提取图片&lt;/li&gt;
            &lt;/ol&gt;
        &lt;/div&gt;

        &lt;div class=&quot;upload-area&quot; id=&quot;uploadArea&quot;&gt;
            &lt;i&gt;📁&lt;/i&gt;
            &lt;p&gt;拖放Excel文件到此处或&lt;span class=&quot;browse&quot;&gt;点击浏览&lt;/span&gt;&lt;/p&gt;
            &lt;p class=&quot;file-info&quot; id=&quot;fileInfo&quot;&gt;支持格式: .xlsx&lt;/p&gt;
            &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.xlsx&quot; class=&quot;hidden&quot;&gt;
        &lt;/div&gt;

        &lt;button id=&quot;extractBtn&quot; class=&quot;extract-btn&quot; disabled&gt;
            &lt;span class=&quot;spinner hidden&quot; id=&quot;spinner&quot;&gt;&lt;/span&gt;
            &lt;span id=&quot;btnText&quot;&gt;提取图片&lt;/span&gt;
        &lt;/button&gt;

        &lt;div class=&quot;progress-container&quot; id=&quot;progressContainer&quot;&gt;
            &lt;div class=&quot;progress-header&quot;&gt;
                &lt;span&gt;提取进度&lt;/span&gt;
                &lt;span id=&quot;progressText&quot;&gt;0%&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;progress-bar&quot;&gt;
                &lt;div class=&quot;progress&quot; id=&quot;progressBar&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;status&quot; id=&quot;statusText&quot;&gt;准备中...&lt;/div&gt;
            &lt;div class=&quot;log&quot; id=&quot;log&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 引入必要的库 --&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
        // DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const extractBtn = document.getElementById('extractBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const log = document.getElementById('log');

        // 事件监听
        uploadArea.addEventListener('click', () =&gt; fileInput.click());
        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f0e6f5';
            uploadArea.style.borderColor = '#8e44ad';
        });
        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.style.background = '#f8f9fa';
            uploadArea.style.borderColor = '#9b59b6';
        });
        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.style.background = '#f8f9fa';
            uploadArea.style.borderColor = '#9b59b6';

            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) =&gt; {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        extractBtn.addEventListener('click', extractImages);

        // 处理上传的文件
        function handleFile(file) {
            if (!file.name.match(/\.(xlsx)$/)) {
                alert('请上传.xlsx格式的Excel文件');
                return;
            }

            fileInfo.textContent = `已选择: ${file.name}`;
            extractBtn.disabled = false;

            addLog(`已选择文件: ${file.name}`, 'info');
        }

        // 提取图片
        async function extractImages() {
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            extractBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = '处理中...';
            progressContainer.style.display = 'block';
            log.innerHTML = '';

            try {
                addLog('开始解析Excel文件...', 'info');

                // 读取Excel文件
                const data = await readFileAsArrayBuffer(file);
                const workbook = XLSX.read(data, {type: 'array'});

                // 获取第一个工作表
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];

                // 获取工作表数据
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                if (!jsonData.length || jsonData.length &lt; 2) {
                    throw new Error('Excel文件没有数据或数据格式不正确');
                }

                addLog(`找到 ${jsonData.length - 1} 行数据`, 'success');

                // 解析Excel文件以提取图片
                const images = await extractImagesFromExcel(data, jsonData);

                if (images.length === 0) {
                    throw new Error('未在Excel文件中找到图片');
                }

                addLog(`成功提取 ${images.length} 张图片`, 'success');

                // 创建ZIP文件
                await createZipFile(images);

            } catch (error) {
                addLog(`处理错误: ${error.message}`, 'error');
                resetUI();
            }
        }

        // 读取文件为ArrayBuffer
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) =&gt; {
                const reader = new FileReader();
                reader.onload = (e) =&gt; resolve(e.target.result);
                reader.onerror = (e) =&gt; reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        // 从Excel文件中提取图片
        async function extractImagesFromExcel(data, jsonData) {
            addLog('正在提取图片...', 'info');

            // 将Excel文件作为ZIP文件处理
            const zip = await JSZip.loadAsync(data);

            // 查找媒体文件
            const mediaFiles = [];
            zip.forEach((relativePath, zipEntry) =&gt; {
                if (relativePath.startsWith('xl/media/')) {
                    mediaFiles.push(zipEntry);
                }
            });

            addLog(`在Excel文件中找到 ${mediaFiles.length} 个媒体文件`, 'info');

            // 查找绘图文件（包含图片位置信息）
            let drawings = [];
            try {
                const drawingsXml = await zip.file('xl/drawings/drawing1.xml').async('text');
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(drawingsXml, 'text/xml');

                // 解析图片引用
                const twoCellAnchors = xmlDoc.getElementsByTagName('xdr:twoCellAnchor');

                for (let i = 0; i &lt; twoCellAnchors.length; i++) {
                    const anchor = twoCellAnchors[i];

                    // 获取图片引用
                    const blipFill = anchor.getElementsByTagName('xdr:blipFill')[0];
                    if (blipFill) {
                        const blip = blipFill.getElementsByTagName('a:blip')[0];
                        if (blip) {
                            const embedId = blip.getAttribute('r:embed');

                            // 获取图片位置
                            const from = anchor.getElementsByTagName('xdr:from')[0];
                            if (from) {
                                const col = from.getElementsByTagName('xdr:col')[0].textContent;
                                const row = from.getElementsByTagName('xdr:row')[0].textContent;

                                if (col === '1' &amp;&amp; row &gt; 0) { // 假设图片在第二列(B列)
                                    drawings.push({
                                        embedId: embedId,
                                        row: parseInt(row)
                                    });
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                addLog('无法解析图片位置信息，将使用默认顺序', 'info');
                // 如果无法解析绘图文件，则按顺序分配图片
                for (let i = 1; i &lt; jsonData.length &amp;&amp; i &lt;= mediaFiles.length; i++) {
                    drawings.push({
                        embedId: `rId${i}`,
                        row: i
                    });
                }
            }

            // 查找图片关系
            let imageRelations = {};
            try {
                const relsXml = await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('text');
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(relsXml, 'text/xml');

                const relationships = xmlDoc.getElementsByTagName('Relationship');
                for (let i = 0; i &lt; relationships.length; i++) {
                    const rel = relationships[i];
                    const id = rel.getAttribute('Id');
                    const target = rel.getAttribute('Target');
                    imageRelations[id] = target;
                }
            } catch (e) {
                addLog('无法解析图片关系，将使用默认映射', 'info');
                // 如果无法解析关系文件，则创建默认映射
                for (let i = 1; i &lt;= mediaFiles.length; i++) {
                    imageRelations[`rId${i}`] = `../media/image${i}.png`;
                }
            }

            // 提取图片
            const images = [];
            for (const drawing of drawings) {
                const relation = imageRelations[drawing.embedId];
                if (!relation) continue;

                const imagePath = relation.replace('../', 'xl/');
                const imageFile = zip.file(imagePath);

                if (imageFile) {
                    const imageData = await imageFile.async('blob');
                    const imageName = jsonData[drawing.row] &amp;&amp; jsonData[drawing.row][0] ?
                                     `${jsonData[drawing.row][0]}.png` : `图片${drawing.row}.png`;

                    images.push({
                        name: imageName,
                        data: imageData
                    });

                    addLog(`提取图片: ${imageName}`, 'success');
                    updateProgress(images.length, drawings.length, `已提取 ${images.length}/${drawings.length} 张图片`);
                }
            }

            return images;
        }

        // 创建ZIP文件
        async function createZipFile(images) {
            addLog('正在创建ZIP文件...', 'info');

            const zip = new JSZip();

            for (const image of images) {
                zip.file(image.name, image.data);
            }

            updateProgress(100, 100, '正在生成ZIP文件...');

            const content = await zip.generateAsync({type: 'blob'});
            saveAs(content, '提取的图片.zip');

            addLog(`提取完成! 成功提取 ${images.length} 张图片`, 'success');
            statusText.textContent = `提取完成! 成功提取 ${images.length} 张图片`;

            resetUI();
        }

        // 更新进度
        function updateProgress(completed, total, status) {
            const percent = Math.round((completed / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            statusText.textContent = status;
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // 重置UI
        function resetUI() {
            extractBtn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = '提取图片';
        }
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;">
      </iframe>
     </div>
    </div>
   </div>
  </div>
  <script>
   // 导航到指定报告
            function navigateToReport(index) {
                const sections = document.querySelectorAll('.visualization-section');
                sections.forEach((section, i) => {
                    section.style.display = i === index ? 'block' : 'none';
                });

                // 更新按钮状态
                document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                    if (i === index) {
                        btn.classList.add('active');
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 更新URL hash
                window.location.hash = `#report-${index + 1}`;
            }

            // 页面加载时显示第一个报告
            document.addEventListener('DOMContentLoaded', () => {
                // 从URL hash获取报告索引
                const hash = window.location.hash;
                let initialIndex = 0;

                if (hash.startsWith('#report-')) {
                    const reportNum = parseInt(hash.replace('#report-', ''));
                    if (!isNaN(reportNum) && reportNum > 0) {
                        initialIndex = reportNum - 1;
                    }
                }


                // 显示报告
                if (document.querySelectorAll('.visualization-section').length > 0) {
                    navigateToReport(initialIndex);
                }

                // 显示当前日期
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 显示最后更新时间
                document.getElementById('lastUpdate').textContent = now.toLocaleDateString('zh-CN', {
                    month: 'short',
                    day: 'numeric'
                });

                // 显示报告数量
                const reportCount = document.querySelectorAll('.visualization-section').length;
                document.getElementById('reportCount').textContent = reportCount;

                // 显示图表总数（估算）
                document.getElementById('totalCharts').textContent = reportCount * 3;
            });
  </script>
