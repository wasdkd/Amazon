        // 智能分析数据
        function analyzeData() {
            if (uploadedData.data.length === 0) {
                showNotification('请先上传数据', 'warning');
                return;
            }

            // 智能推荐图表
            const numericFields = uploadedData.fields.filter(f =&gt; uploadedData.fieldTypes[f] === 'numeric');
            const categoryFields = uploadedData.fields.filter(f =&gt; uploadedData.fieldTypes[f] === 'category');

            if (numericFields.length === 0) {
                showNotification('未检测到数值字段', 'warning');
                return;
            }

            // 自动设置配置
            const xAxisZone = document.querySelector('#xAxisZone .drop-zone-content');
            const yAxisZone = document.querySelector('#yAxisZone .drop-zone-content');

            // 清除现有配置
            xAxisZone.innerHTML = '';
            yAxisZone.innerHTML = '';

            // 自动选择字段
            if (categoryFields.length &gt; 0) {
                const bestCategoryField = findBestField(categoryFields);
                xAxisZone.innerHTML = createFieldDiv(bestCategoryField, 'category');
            }

            // 自动添加前两个数值字段到Y轴
            if (numericFields.length &gt; 0) {
                const topNumericFields = numericFields.slice(0, 2);
                topNumericFields.forEach(field =&gt; {
                    yAxisZone.innerHTML += createFieldDiv(field, 'numeric');
                });
            }

            // 智能选择图表类型
            const chartType = recommendChartType();
            document.getElementById('chartTypeSelect').value = chartType;
            updateChartGuide(chartType);

            // 更新图表类型选择器
            document.querySelectorAll('.chart-type-btn').forEach(btn =&gt; {
                btn.classList.remove('active');
            });
            document.querySelector(`.chart-type-btn[data-type=&quot;${chartType}&quot;]`).classList.add('active');

            showNotification('智能分析完成', 'success');
        }

        // 找到最优字段
        function findBestField(fields) {
            return fields[0];
        }

        // 创建字段DOM元素
        function createFieldDiv(field, type) {
            const typeIcon = type === 'numeric' ? 'fas fa-hashtag' : 'fas fa-tag';
            return `
                &lt;div class=&quot;data-field ${type}&quot; style=&quot;margin: 0;&quot;&gt;
                    &lt;i class=&quot;${typeIcon}&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;${field}&lt;/span&gt;
                    &lt;i class=&quot;fas fa-times&quot; onclick=&quot;removeFromDropZone(this)&quot;&gt;&lt;/i&gt;
                &lt;/div&gt;
            `;
        }

        // 推荐图表类型
        function recommendChartType() {
            const numericFields = uploadedData.fields.filter(f =&gt; uploadedData.fieldTypes[f] === 'numeric');
            const categoryFields = uploadedData.fields.filter(f =&gt; uploadedData.fieldTypes[f] === 'category');
            const timeFields = uploadedData.fields.filter(f =&gt; uploadedData.fieldTypes[f] === 'time');

            if (timeFields.length &gt; 0 &amp;&amp; numericFields.length &gt; 0) {
                return 'line';
            } else if (categoryFields.length &gt; 0 &amp;&amp; numericFields.length === 1) {
                return 'bar';
            } else if (categoryFields.length &gt; 0 &amp;&amp; numericFields.length &gt; 1) {
                return 'bar';
            } else if (numericFields.length &gt;= 2) {
                return 'scatter';
            } else {
                return 'bar';
            }
        }

        // 数据聚合计算
        function aggregateData(data, groupField, valueField, aggregationType) {
            if (aggregationType === 'none') {
                // 无聚合时，直接返回原始数据
                return data.map(row =&gt; ({
                    name: row[groupField] || '未知',
                    value: Number(row[valueField]) || 0,
                    rawRow: row // 保存原始行数据用于后续处理
                }));
            }

            // 分组数据
            const groups = _.groupBy(data, groupField);

            // 根据聚合类型计算
            const aggregated = Object.entries(groups).map(([groupName, groupData]) =&gt; {
                const values = groupData.map(row =&gt; {
                    const val = row[valueField];
                    return val === '' ? 0 : Number(val) || 0;
                });

                let result;
                switch(aggregationType) {
                    case 'sum':
                        result = values.reduce((a, b) =&gt; a + b, 0);
                        break;
                    case 'count':
                        result = values.length;
                        break;
                    case 'avg':
                        result = values.length &gt; 0 ? values.reduce((a, b) =&gt; a + b, 0) / values.length : 0;
                        break;
                    case 'max':
                        result = Math.max(...values);
                        break;
                    case 'min':
                        result = Math.min(...values);
                        break;
                    default:
                        result = values.reduce((a, b) =&gt; a + b, 0);
                }

                return {
                    name: groupName,
                    value: Number(result.toFixed(2))
                };
            });

            return aggregated;
        }

        // 应用排序
        function applySort(data, sortType, sortBy) {
            if (sortType === 'none') return data;

            return data.sort((a, b) =&gt; {
                let valueA, valueB;

                if (sortBy === 'value') {
                    valueA = a.value;
                    valueB = b.value;
                } else {
                    valueA = a.name;
                    valueB = b.name;
                }

                if (sortType === 'asc') {
                    return valueA &gt; valueB ? 1 : -1;
                } else {
                    return valueA &lt; valueB ? 1 : -1;
                }
            });
        }

        // 生成图表
        function generateChart() {
    if (uploadedData.data.length === 0) {
        showNotification('请先上传数据', 'warning');
        return;
    }

    // 获取X轴字段（只能有一个）
    const xAxisField = document.querySelector('#xAxisZone .drop-zone-content .data-field span')?.textContent;
    // 获取所有Y轴字段（支持多个）
    const yAxisFields = Array.from(document.querySelectorAll('#yAxisZone .drop-zone-content .data-field span'))
        .map(el =&gt; el.textContent);

    if (!xAxisField || yAxisFields.length === 0) {
        showNotification('请配置X轴和至少一个Y轴字段', 'warning');
        return;
    }

    const chartType = document.getElementById('chartTypeSelect').value;
    const filterField = document.getElementById('filterFieldSelect').value;
    const filterValueSelect = document.getElementById('filterValueSelect');
    const selectedOptions = filterValueSelect ? Array.from(filterValueSelect.selectedOptions) : [];
    const currentFilterValues = selectedOptions.map(opt =&gt; opt.value).filter(v =&gt; v !== '');
    const groupField = document.getElementById('groupSelect').value;
    const aggregationType = document.getElementById('aggregationSelect').value;
    const sortType = document.getElementById('sortSelect').value;
    const sortBy = document.getElementById('sortBySelect').value;

    // 特殊图表类型校验
    if (chartType === 'pie' &amp;&amp; yAxisFields.length &gt; 1) {
        showNotification('饼图只能使用一个数值字段，已使用第一个字段', 'warning');
        // 饼图只使用第一个数值字段
        yAxisFields.splice(1);
    }

    if (chartType === 'scatter' &amp;&amp; yAxisFields.length &lt; 2) {
        showNotification('散点图需要至少两个数值字段', 'error');
        return;
    }

    const filterConditions = activeFilters ? [...activeFilters] : [];
    if (filterField &amp;&amp; currentFilterValues.length &gt; 0) {
        const existingIndex = filterConditions.findIndex(cond =&gt; cond.field === filterField);
        if (existingIndex &gt;= 0) {
            const merged = Array.from(new Set([...filterConditions[existingIndex].values, ...currentFilterValues]));
            filterConditions[existingIndex] = { field: filterField, values: merged };
        } else {
            filterConditions.push({ field: filterField, values: currentFilterValues });
        }
    }

    let filteredData = [...uploadedData.data];
    if (filterConditions.length &gt; 0) {
        filteredData = uploadedData.data.filter(row =&gt;
            filterConditions.every(cond =&gt; cond.values.includes(String(row[cond.field])))
        );
    }

    if (filteredData.length === 0) {
        showNotification('筛选后无数据', 'warning');
        return;
    }

    // 准备图表数据
    let chartOptions;
    const aggregationName = {
        none: '原始值',
        sum: '求和',
        count: '计数',
        avg: '平均值',
        max: '最大值',
        min: '最小值'
    }[aggregationType];

    const yFieldsText = yAxisFields.join('、');
    const chartTitleEl = document.getElementById('chartTitle');
    if (chartTitleEl) {
        let filterDesc = '';
        if (filterConditions.length &gt; 0) {
            const parts = filterConditions.map(cond =&gt; cond.field + '=' + cond.values.join('、'));
            filterDesc = ' | 筛选：' + parts.join('；');
        }
        const groupDesc = groupField ? ' | 分组：' + groupField : '';
        const aggDesc = ' | 聚合：' + aggregationName;
        chartTitleEl.textContent = `${yFieldsText} 对 ${xAxisField}${aggDesc}${groupDesc}${filterDesc}`;
    }

    // 处理多Y轴数据
    if (groupField) {
        // 分组聚合数据
        chartOptions = getMultiYGroupedChartOptions(
            chartType, xAxisField, yAxisFields, filteredData,
            groupField, aggregationType, aggregationName, sortType, sortBy
        );
    } else {
        // 未分组数据（按X轴字段聚合）
        chartOptions = getMultiYChartOptions(
            chartType, xAxisField, yAxisFields, filteredData,
            aggregationType, aggregationName, sortType, sortBy
        );
    }

    // 渲染图表
    renderChart(chartOptions);

    // 显示图表区域
    document.getElementById('noData').style.display = 'none';
    document.getElementById('chartArea').style.display = 'block';

    showNotification('图表生成成功', 'success');
}

// 批量生成所有图表
function generateBatchCharts() {
    if (uploadedData.data.length === 0) {
        showNotification('请先上传数据', 'warning');
        return;
    }

    const xAxisField = document.querySelector('#xAxisZone .drop-zone-content .data-field span')?.textContent;
    const yAxisFields = Array.from(document.querySelectorAll('#yAxisZone .drop-zone-content .data-field span'))
        .map(el =&gt; el.textContent);
    const batchGroupField = document.getElementById('batchGroupSelect').value;

    if (!batchGroupField) {
        showNotification('请先选择批量生成分组字段', 'warning');
        return;
    }

    if (!xAxisField || yAxisFields.length === 0) {
        showNotification('请配置X轴和至少一个Y轴字段', 'warning');
        return;
    }

    // 获取其他通用配置
    const chartType = document.getElementById('chartTypeSelect').value;
    const aggregationType = document.getElementById('aggregationSelect').value;
    const sortType = document.getElementById('sortSelect').value;
    const sortBy = document.getElementById('sortBySelect').value;
    const filterField = document.getElementById('filterFieldSelect').value;
    const filterValueSelect = document.getElementById('filterValueSelect');
    const selectedOptions = filterValueSelect ? Array.from(filterValueSelect.selectedOptions) : [];
    const currentFilterValues = selectedOptions.map(opt =&gt; opt.value).filter(v =&gt; v !== '');

    // 合并所有筛选条件（包含已添加的筛选chips）
    const filterConditions = activeFilters ? [...activeFilters] : [];
    if (filterField &amp;&amp; currentFilterValues.length &gt; 0) {
        const existingIndex = filterConditions.findIndex(cond =&gt; cond.field === filterField);
        if (existingIndex &gt;= 0) {
            const merged = Array.from(new Set([...filterConditions[existingIndex].values, ...currentFilterValues]));
            filterConditions[existingIndex] = { field: filterField, values: merged };
        } else {
            filterConditions.push({ field: filterField, values: currentFilterValues });
        }
    }

    // 应用筛选到数据
    let filteredData = [...uploadedData.data];
    if (filterConditions.length &gt; 0) {
        filteredData = uploadedData.data.filter(row =&gt;
            filterConditions.every(cond =&gt; cond.values.includes(String(row[cond.field])))
        );
    }

    // 1. 按批量字段分组数据
    const groupedData = _.groupBy(filteredData, batchGroupField);

    // 2. 准备 UI
    const container = document.getElementById('batchChartsContainer');
    container.innerHTML = '';
    document.getElementById('noData').style.display = 'none';
    document.getElementById('chartArea').style.display = 'none';
    document.getElementById('batchChartArea').style.display = 'block';

    const aggregationName = {
        none: '原始值', sum: '求和', count: '计数', avg: '平均值', max: '最大值', min: '最小值'
    }[aggregationType];

    let totalCharts = 0;

    // 3. 遍历每个有效分组（过滤空键）
    Object.keys(groupedData).filter(k =&gt; k !== undefined &amp;&amp; k !== null &amp;&amp; String(k).trim() !== '').sort().forEach((groupValue, gIdx) =&gt; {
        const groupData = groupedData[groupValue];

        // 创建分组标题块
        const groupBlock = document.createElement('div');
        groupBlock.className = 'batch-group-block';
        groupBlock.style.cssText = 'grid-column: 1 / -1; margin-top: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 10px;';
        groupBlock.innerHTML = `&lt;h3 style=&quot;color: #4b5563; margin: 0;&quot;&gt;${batchGroupField}: &lt;span style=&quot;color: #7c3aed;&quot;&gt;${groupValue}&lt;/span&gt; &lt;span style=&quot;font-size: 14px; font-weight: normal; color: #9ca3af;&quot;&gt;(包含 ${groupData.length} 条数据)&lt;/span&gt;&lt;/h3&gt;`;
        container.appendChild(groupBlock);

        // 4. 生成图表
        if (chartType === 'scatter') {
            if (yAxisFields.length &lt; 2) {
                showNotification('散点图需要至少两个数值字段，已跳过批量散点图生成', 'warning');
                return;
            }
            const yPair = yAxisFields.slice(0, 2);
            const chartId = `batch_chart_g${gIdx}_scatter`;
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-card';
            chartDiv.style.cssText = 'background: white; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e5e7eb;';
            chartDiv.innerHTML = `
                &lt;div style=&quot;height: 350px;&quot; id=&quot;${chartId}&quot;&gt;&lt;/div&gt;
                &lt;div style=&quot;text-align: center; margin-top: 10px; font-weight: 500; color: #4b5563;&quot;&gt;${yPair.join(' vs ')}&lt;/div&gt;
            `;
            container.appendChild(chartDiv);
            const option = getMultiYChartOptions(
                chartType, xAxisField, yPair, groupData,
                aggregationType, aggregationName, sortType, sortBy
            );
            if (!option) return;
            option.title = {
                text: `${yPair.join(' vs ')}散点图`,
                subtext: `点数: ${groupData.length}`,
                left: 'center',
                textStyle: { fontSize: 16 }
            };
            requestAnimationFrame(() =&gt; {
                const chart = echarts.init(document.getElementById(chartId));
                chart.setOption(option);
                totalCharts++;
            });
            return;
        }

        // 非散点图：为该分组下的每个 Y 轴字段生成一个图表
        yAxisFields.forEach((yField, yIdx) =&gt; {
            const chartId = `batch_chart_g${gIdx}_y${yIdx}`;
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-card';
            chartDiv.style.cssText = 'background: white; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e5e7eb;';
            chartDiv.innerHTML = `
                &lt;div style=&quot;height: 350px;&quot; id=&quot;${chartId}&quot;&gt;&lt;/div&gt;
                &lt;div style=&quot;text-align: center; margin-top: 10px; font-weight: 500; color: #4b5563;&quot;&gt;${yField} (${aggregationName})&lt;/div&gt;
            `;
            container.appendChild(chartDiv);

            const option = getMultiYChartOptions(
                chartType, xAxisField, [yField], groupData,
                aggregationType, aggregationName, sortType, sortBy
            );
            if (!option) return;
            option.title = {
                text: `${yField}趋势分析`,
                subtext: `总计: ${calculateTotal(groupData, yField, aggregationType)}`,
                left: 'right',
                textStyle: { fontSize: 16 }
            };
            requestAnimationFrame(() =&gt; {
                const chart = echarts.init(document.getElementById(chartId));
                chart.setOption(option);
                totalCharts++;
            });
        });
    });

    document.getElementById('batchCountBadge').textContent = totalCharts;
    showNotification(`批量生成完成，共生成 ${totalCharts} 个图表`, 'success');
}

function closeBatchView() {
    document.getElementById('batchChartArea').style.display = 'none';
    document.getElementById('chartArea').style.display = 'none'; // 先隐藏所有
    // 如果之前有生成的单一图表，也许应该显示，但这里简单处理，显示noData或者如果uploadedData有数据就不显示noData
    if (uploadedData.data.length &gt; 0) {
        document.getElementById('chartArea').style.display = 'block';
    } else {
        document.getElementById('noData').style.display = 'flex';
    }
}

function calculateTotal(data, field, aggType) {
    const values = data.map(r =&gt; {
        const val = r[field];
        return val === '' ? 0 : Number(val) || 0;
    });
    if (aggType === 'count') return values.length;
    const sum = values.reduce((a, b) =&gt; a + b, 0);
    if (aggType === 'avg') return values.length ? (sum / values.length).toFixed(2) : 0;
    if (aggType === 'max') return Math.max(...values);
    if (aggType === 'min') return Math.min(...values);
    return sum.toFixed(2);
}

        // 获取多Y轴基础图表配置
        function getMultiYChartOptions(chartType, xField, yFields, data, aggregationType, aggregationName, sortType, sortBy) {
            const baseOptions = getBaseOptions(chartType, xField, yFields, aggregationName);

            // 特殊图表类型处理
            switch(chartType) {
                case 'scatter':
                    return getScatterChartOptions(xField, yFields, data, baseOptions);

                case 'radar':
                    return getRadarChartOptions(xField, yFields, data, baseOptions);
                case 'pie':
                    return getPieChartOptions(xField, yFields[0], data, aggregationType, aggregationName, sortType, sortBy, baseOptions);
                default:
                    return getBarOrLineChartOptions(chartType, xField, yFields, data, aggregationType, aggregationName, sortType, sortBy, baseOptions);
            }
        }

        // 获取基础配置
        function getBaseOptions(chartType, xField, yFields, aggregationName) {
            return {
                title: {
                    text: `${yFields.join('、')}对比${xField}`,
                    left: 'center',
                    textStyle: {
                        fontSize: 18,
                        fontWeight: '600',
                        color: '#1f2937'
                    }
                },
                tooltip: {
                    trigger: chartType === 'pie' || chartType === 'scatter' || chartType === 'radar' ? 'item' : 'axis',
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#e5e7eb',
                    borderWidth: 1,
                    textStyle: {
                        color: '#1f2937'
                    },
                    padding: 12,
                    borderRadius: 8,
                    order: 'seriesAsc',
                    boxShadow: '0 4px 12px rgba(0,0,0,0.08)',
                    formatter: function(params) {
                        if (chartType === 'pie') {
                            return `${params.name}&lt;br/&gt;${params.seriesName}: ${params.value} (${params.percent}%)`;
                        } else if (chartType === 'scatter') {
                            return `X: ${params.value[0]}&lt;br/&gt;Y: ${params.value[1]}`;
                        } else if (chartType === 'line' || chartType === 'bar' || chartType === 'horizontalBar') {
                            const axisLabel = Array.isArray(params) &amp;&amp; params.length ? params[0].axisValueLabel : '';
                            let html = `${xField}: ${axisLabel}`;
                            if (Array.isArray(params)) {
                                html += '&lt;br/&gt;' + params.map(p =&gt; `${p.marker}${p.seriesName}: ${p.value}`).join('&lt;br/&gt;');
                            }
                            return html;
                        }
                        return null;
                    }
                },
                axisPointer: chartType === 'bar' || chartType === 'horizontalBar' ? { type: 'shadow' } : (chartType === 'line' ? { type: 'cross' } : {}),
                grid: chartType === 'pie' || chartType === 'radar' ? null : {
                    left: '5%',
                    right: '5%',
                    bottom: 60,
                    top: chartType === 'heatmap' ? '20%' : '15%',
                    containLabel: true
                },
                legend: {
                    top: '5%',
                    textStyle: {
                        color: '#4b5563'
                    }
                },
                color: window.chartColors
            };
        }

        // 获取柱状图或折线图配置
        function getBarOrLineChartOptions(chartType, xField, yFields, data, aggregationType, aggregationName, sortType, sortBy, baseOptions) {
    // 先获取第一个Y字段的聚合数据，用于X轴取值
    const firstAggregatedData = aggregateData(data, xField, yFields[0], aggregationType);
    let sortedData = applySort(firstAggregatedData, sortType, sortBy);
    const xValues = sortedData.map(item =&gt; item.name);

    // 为每个Y轴字段生成系列数据
    const series = yFields.map((yField, index) =&gt; {
        const aggregatedData = aggregateData(data, xField, yField, aggregationType);
        const aggregatedMap = {};
        aggregatedData.forEach(item =&gt; {
            aggregatedMap[item.name] = item.value;
        });

        // 按照排序后的xValues顺序获取数据
        const yValues = xValues.map(x =&gt; aggregatedMap[x] || 0);

        // 通用系列配置
        const seriesConfig = {
            name: `${yField}(${aggregationName})`,
            data: yValues,
            itemStyle: {
                color: window.chartColors[index % window.chartColors.length]
            },
            // 显示数值标签（默认显示）
            label: {
                show: true,
                position: chartType === 'bar' ? 'top' : (chartType === 'horizontalBar' ? 'right' : 'top'),
                fontSize: 12,
                color: '#1f2937',
                fontWeight: '500',
                formatter: function(params) {
                    // 格式化数值显示
                    return parseFloat(params.value).toFixed(1);
                }
            },
            // 悬停时的强调效果
            emphasis: {
                itemStyle: {
                    shadowBlur: 10,
                    shadowColor: 'rgba(0,0,0,0.2)'
                },
                label: {
                    show: true,
                    fontSize: 13,
                    fontWeight: 'bold'
                }
            }
        };

        // 根据图表类型设置类型和特殊配置
        if (chartType === 'line') {
            return {
                ...seriesConfig,
                type: 'line',
                smooth: true,
                symbol: 'circle',
                symbolSize: 8, // 增大点的大小以便悬停
                lineStyle: {
                    width: 3
                }
            };
        } else if (chartType === 'horizontalBar') {
            return {
                ...seriesConfig,
                type: 'bar',
                barWidth: yFields.length &gt; 1 ? '30%' : '60%',
                borderRadius: [0, 4, 4, 0]
            };
        } else { // bar
            return {
                ...seriesConfig,
                type: 'bar',
                barWidth: yFields.length &gt; 1 ? '30%' : '60%',
                barGap: yFields.length &gt; 1 ? '10%' : '0%',
                borderRadius: [4, 4, 0, 0]
            };
        }
    });

    const axisConfig = chartType === 'horizontalBar' ? {
        xAxis: {
            type: 'value',
            name: aggregationName,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            },
            axisLabel: {
                color: '#4b5563',
                fontSize: 12,
                formatter: '{value}'
            }
        },
        yAxis: {
            type: 'category',
            data: xValues,
            name: xField,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            },
            axisLabel: {
                color: '#4b5563',
                fontSize: 12
            }
        }
    } : {
        xAxis: {
            type: 'category',
            data: xValues,
            name: xField,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            },
            axisLabel: {
                rotate: 45,
                color: '#4b5563',
                fontSize: 12
            }
        },
        yAxis: {
            type: 'value',
            name: aggregationName,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            },
            axisLabel: {
                color: '#4b5563',
                fontSize: 12,
                formatter: '{value}'
            }
        }
    };

    const option = {
        ...baseOptions,
        ...axisConfig,
        series: series
    };

    if (xValues.length &gt; 6 &amp;&amp; (chartType === 'line' || chartType === 'bar')) {
        option.dataZoom = [
            {
                type: 'slider',
                start: 0,
                end: 100,
                height: 10,
                fillerColor: 'rgba(84,112,198,0.12)',
                backgroundColor: 'rgba(0,0,0,0)',
                dataBackground: {
                    lineStyle: {
                        color: 'rgba(0,0,0,0)'
                    },
                    areaStyle: {
                        color: 'rgba(0,0,0,0)'
                    }
                }
            },
            {
                type: 'inside',
                start: 0,
                end: 100
            }
        ];
    }


    return option;
}



        // 获取饼图配置
        function getPieChartOptions(xField, yField, data, aggregationType, aggregationName, sortType, sortBy, baseOptions) {
    const aggregatedData = aggregateData(data, xField, yField, aggregationType);
    const sortedData = applySort(aggregatedData, sortType, sortBy);

    return {

        // 获取散点图配置
        function getScatterChartOptions(xField, yFields, data, baseOptions) {
    // 散点图需要两个数值字段
    if (yFields.length &lt; 2) {
        return null;
    }

    const scatterData = data.map(row =&gt; [
        Number(row[yFields[0]]) || 0,
        Number(row[yFields[1]]) || 0,

    ]);

                }

    };

        // 获取雷达图配置
        function getRadarChartOptions(xField, yFields, data, baseOptions) {
    // 获取X轴的所有唯一值作为雷达图的维度
    const xValues = [...new Set(data.map(row =&gt; row[xField]))];

    // 计算每个维度的最大值
    const indicator = xValues.map(x =&gt; {
        let maxValue = 0;
        data.forEach(row =&gt; {
            if (row[xField] === x) {
                yFields.forEach(yField =&gt; {
                    const value = Number(row[yField]) || 0;
                    maxValue = Math.max(maxValue, value);
                });
            }
        });
        return { name: x, max: maxValue * 1.2 }; // 增加20%的余量
    });

    // 为每个Y字段创建数据
    const seriesData = yFields.map((yField, index) =&gt; {
        const values = xValues.map(x =&gt; {
            const filtered = data.filter(row =&gt; row[xField] === x);
            if (filtered.length === 0) return 0;

            // 计算平均值
            const sum = filtered.reduce((total, row) =&gt; {
                return total + (Number(row[yField]) || 0);
            }, 0);
            return sum / filtered.length;
        });

        return {
            name: yField,
            value: values,
            itemStyle: {
                color: window.chartColors[index % window.chartColors.length]
            }
        };
    });

    return {
        ...baseOptions,
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(255,255,255,0.9)',
            borderColor: '#e5e7eb',
            borderWidth: 1,
            textStyle: { color: '#1f2937' },
            padding: 12,
            borderRadius: 8,
            formatter: function(params) {
                const name = params.name;
                const vals = params.value;
                let html = `${name}`;
                html += '&lt;br/&gt;' + indicator.map((ind, i) =&gt; `${ind.name}: ${vals[i]}`).join('&lt;br/&gt;');
                return html;
            }
        },
        radar: {
            indicator: indicator,
            axisName: { color: '#4b5563' }
        },
        series: [{
            type: 'radar',
            data: seriesData,
            areaStyle: { opacity: 0.15 },
            lineStyle: { width: 2 },
            symbol: 'circle',
            symbolSize: 6,
            label: { show: false },
            emphasis: {
                lineStyle: { width: 3 },
                areaStyle: { opacity: 0.25 }
            }
        }]
    };
}

        // 获取分组图表配置
        function getMultiYGroupedChartOptions(chartType, xField, yFields, data, groupField, aggregationType, aggregationName, sortType, sortBy) {
    const baseOptions = getBaseOptions(chartType, xField, yFields, aggregationName);

    // 雷达图不适合按分组聚合展示，直接按未分组逻辑生成
    if (chartType === 'radar') {
        return getRadarChartOptions(xField, yFields, data, baseOptions);
    }

    // 获取分组名称
    const groupNames = [...new Set(data.map(row =&gt; row[groupField]))];
    let sortedGroupNames = [...groupNames];

    // 应用排序
    if (sortType !== 'none') {
        if (sortBy === 'value') {
            // 按数值排序：基于当前聚合方式计算每个分组的代表值
            const groupValues = groupNames.map(group =&gt; {
                const groupData = data.filter(row =&gt; row[groupField] === group);
                const aggregated = aggregateData(groupData, xField, yFields[0], aggregationType);

                let value = 0;
                if (aggregated.length &gt; 0) {
                    const values = aggregated.map(item =&gt; item.value);
                    switch (aggregationType) {
                        case 'max':
                            value = Math.max(...values);
                            break;
                        case 'min':
                            value = Math.min(...values);
                            break;
                        case 'avg':
                            value = values.reduce((a, b) =&gt; a + b, 0) / values.length;
                            break;
                        case 'count':
                            value = values.reduce((a, b) =&gt; a + b, 0);
                            break;
                        case 'sum':
                        case 'none':
                        default:
                            value = values.reduce((a, b) =&gt; a + b, 0);
                            break;
                    }
                }

                return { name: group, value };
            });

            const sorted = applySort(groupValues, sortType, 'value');
            sortedGroupNames = sorted.map(item =&gt; item.name);
        } else {
            // 按名称排序
            sortedGroupNames.sort();
            if (sortType === 'desc') {
                sortedGroupNames.reverse();
            }
        }
    }

    // 为每个Y轴字段生成系列数据
    const series = yFields.map((yField, index) =&gt; {
        const seriesData = [];

        // 为每个分组计算聚合值
        sortedGroupNames.forEach(groupName =&gt; {
            const groupData = data.filter(row =&gt; row[groupField] === groupName);
            const aggregated = aggregateData(groupData, xField, yField, aggregationType);

            // 找到对应X轴字段的值
            let value = 0;
            if (aggregated.length &gt; 0) {
                // 取平均值
                value = aggregated.reduce((sum, item) =&gt; sum + item.value, 0) / aggregated.length;
            }
            seriesData.push(value);
        });

        // 系列配置
        const seriesConfig = {
            name: `${yField}(${aggregationName})`,
            type: getSeriesType(chartType),
            data: seriesData,
            itemStyle: {
                color: window.chartColors[index % window.chartColors.length]
            },
            label: {
                show: true,
                position: chartType === 'horizontalBar' ? 'right' : 'top',
                fontSize: 12,
                color: '#1f2937',
                fontWeight: '500',
                formatter: '{c}'
            },

        };

        // 特殊配置
        if (chartType === 'line') {
            seriesConfig.smooth = true;
            seriesConfig.symbol = 'circle';
            seriesConfig.symbolSize = 6;
            seriesConfig.lineStyle = { width: 3 };
        } else if (chartType === 'bar' || chartType === 'horizontalBar') {
            seriesConfig.barWidth = yFields.length &gt; 1 ? '30%' : '60%';
            seriesConfig.barGap = yFields.length &gt; 1 ? '10%' : '0%';
            seriesConfig.borderRadius = chartType === 'horizontalBar' ? [0, 4, 4, 0] : [4, 4, 0, 0];
        }

        return seriesConfig;
    });

    const option = {
        ...baseOptions,
        xAxis: chartType === 'horizontalBar' ? {
            type: 'value',
            name: aggregationName,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            }
        } : {
            type: 'category',
            data: sortedGroupNames,
            name: groupField,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            }
        },
        yAxis: chartType === 'horizontalBar' ? {
            type: 'category',
            data: sortedGroupNames,
            name: groupField,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            }
        } : {
            type: 'value',
            name: aggregationName,
            nameTextStyle: {
                color: '#6b7280',
                fontSize: 14
            }
        },
        series: series
    };

    if (sortedGroupNames.length &gt; 6 &amp;&amp; (chartType === 'line' || chartType === 'bar')) {
        option.dataZoom = [
            { type: 'slider', start: 0, end: 100 },
            { type: 'inside', start: 0, end: 100 }
        ];
    }

    return option;
}

        // 获取系列类型
        function getSeriesType(chartType) {
            switch(chartType) {
                case 'line': return 'line';
                case 'horizontalBar': return 'bar';
                case 'pie': return 'pie';
                case 'scatter': return 'scatter';
                case 'heatmap': return 'heatmap';
                case 'radar': return 'radar';
                default: return 'bar';
            }
        }

        // 渲染图表
        function renderChart(options) {
    const chartDom = document.getElementById('chartCanvas');
    if (currentChart) {
        currentChart.dispose();
    }

    // 确保图表容器可见并已渲染
    const chartArea = document.getElementById('chartArea');
    chartArea.style.display = 'block';

    // 强制重排以确保元素尺寸正确
    chartDom.offsetHeight;

    // 初始化ECharts并应用主题
    currentChart = echarts.init(chartDom, null, {
        renderer: 'canvas',
        useDirtyRect: false
    });

    // 设置图表配置
    currentChart.setOption({
        ...options,
        animation: true,
        animationDuration: 1000,
        animationEasing: 'cubicOut'
    });

    // 确保图表尺寸正确
    setTimeout(() =&gt; {
        currentChart.resize();
    }, 100);

    // 响应式调整
    window.addEventListener('resize', () =&gt; {
        if (currentChart) {
            currentChart.resize();
        }
    });
}

        // 重置配置
        function resetConfig() {
            document.querySelectorAll('.drop-zone-content').forEach(div =&gt; {
                div.innerHTML = '';

            document.getElementById('filterFieldSelect').value = '';
            document.getElementById('filterValueSelect').innerHTML = '&lt;option value=&quot;&quot;&gt;请先选择筛选字段&lt;/option&gt;';

        // 显示数据预览
        function showData() {
            if (uploadedData.data.length === 0) {
                showNotification('暂无数据', 'warning');
                return;
            }

            const modal = document.getElementById('dataModal');
            const content = document.getElementById('modalDataContent');

            // 创建数据表格
            let tableHtml = `
                &lt;div class=&quot;data-table-container&quot;&gt;
                    &lt;table class=&quot;data-table&quot;&gt;
                        &lt;thead&gt;
                            &lt;tr&gt;
                                ${uploadedData.fields.map(field =&gt; `&lt;th&gt;${field}&lt;/th&gt;`).join('')}
                            &lt;/tr&gt;
                        &lt;/thead&gt;
                        &lt;tbody&gt;
            `;

            uploadedData.data.slice(0, 50).forEach(row =&gt; {
                tableHtml += '&lt;tr&gt;';
                uploadedData.fields.forEach(field =&gt; {
                    tableHtml += `&lt;td&gt;${row[field] || ''}&lt;/td&gt;`;
                });
                tableHtml += '&lt;/tr&gt;';
            });

            tableHtml += `
                        &lt;/tbody&gt;
                    &lt;/table&gt;
                &lt;/div&gt;
                &lt;div style=&quot;margin-top: 16px; color: var(--text-secondary); font-size: 14px; display: flex; justify-content: space-between; align-items: center;&quot;&gt;
                    &lt;div&gt;显示前50条数据，共${uploadedData.data.length}条&lt;/div&gt;
                    &lt;div&gt;数据更新时间: ${new Date().toLocaleString()}&lt;/div&gt;
                &lt;/div&gt;
            `;

            content.innerHTML = tableHtml;
            modal.classList.add('active');
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('dataModal').classList.remove('active');
        }

        // 导出图表
        function exportChart() {
            if (!currentChart) {
                showNotification('请先生成图表', 'warning');
                return;
            }

            const link = document.createElement('a');
            link.download = `数据可视化图表_${new Date().getTime()}.png`;
            link.href = currentChart.getDataURL({
                type: 'png',
                pixelRatio: 2,
                backgroundColor: '#ffffff',
                excludeComponents: ['toolbox']
            });
            link.click();

            showNotification('图表已导出为PNG图片', 'success');
        }

        // 保存图表
        function saveChart() {
            try {
                // 实际项目中可保存配置到localStorage
                localStorage.setItem('chartConfig', JSON.stringify({
                    xAxisField: document.querySelector('#xAxisZone .drop-zone-content .data-field span')?.textContent,
                    yAxisFields: Array.from(document.querySelectorAll('#yAxisZone .drop-zone-content .data-field span'))
                        .map(el =&gt; el.textContent),
                    chartType: document.getElementById('chartTypeSelect').value,
                    aggregationType: document.getElementById('aggregationSelect').value,
                    groupField: document.getElementById('groupSelect').value,
                    filterField: document.getElementById('filterFieldSelect').value,
                    filterValue: document.getElementById('filterValueSelect').value,
                    saveTime: new Date().toISOString()
                }));
                showNotification('图表配置已保存到本地存储', 'info');
            } catch (e) {
                showNotification('浏览器阻止了本地存储，已跳过保存', 'warning');
            }
        }

        // 显示通知
        function showNotification(message, type) {
            // 移除已存在的通知
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;

            // 设置图标
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };

            notification.innerHTML = `
                &lt;i class=&quot;${icons[type]}&quot;&gt;&lt;/i&gt;
                &lt;span&gt;${message}&lt;/span&gt;
            `;

            document.body.appendChild(notification);

            // 3秒后自动移除
            setTimeout(() =&gt; {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() =&gt; {
                    notification.remove();
                }, 300);
            }, 3000);
        }

            function navigateToReport(index) {
                const sections = document.querySelectorAll('.visualization-section');
                sections.forEach((section, i) => {
                    section.style.display = i === index ? 'block' : 'none';
                });

                // 更新按钮状态
                document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                    if (i === index) {
                        btn.classList.add('active');
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 更新URL hash
                window.location.hash = `#report-${index + 1}`;
            }

            // 页面加载时显示第一个报告
            document.addEventListener('DOMContentLoaded', () => {
                // 从URL hash获取报告索引
                const hash = window.location.hash;
                let initialIndex = 0;

                if (hash.startsWith('#report-')) {
                    const reportNum = parseInt(hash.replace('#report-', ''));
                    if (!isNaN(reportNum) && reportNum > 0) {
                        initialIndex = reportNum - 1;
                    }
                }


                // 显示报告
                if (document.querySelectorAll('.visualization-section').length > 0) {
                    navigateToReport(initialIndex);
                }

                // 显示当前日期
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // 显示最后更新时间
                document.getElementById('lastUpdate').textContent = now.toLocaleDateString('zh-CN', {
                    month: 'short',
                    day: 'numeric'
                });

                // 显示报告数量
