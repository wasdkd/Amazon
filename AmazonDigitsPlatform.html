<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚马逊数据分析可视化平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            max-width: 95%;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 {
            font-size: 2.8rem;
            color: #2c3e50;
            margin-bottom: 10px;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            font-weight: 300;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.08);
            padding: 20px 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-color: #e0e0e0;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
        }

        .card i {
            font-size: 2.8rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card h2 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .card p {
            color: #7f8c8d;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .link-btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(178, 31, 31, 0.3);
            margin: 4px;
        }

        .link-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(178, 31, 31, 0.4);
            background: linear-gradient(to right, #2c3e99, #d12c2c);
        }

        footer {
            text-align: center;
            margin-top: 1px;
            color: #7f8c8d;
            font-size: 0.9rem;
            padding-top: 1px;
            border-top: 1px solid #eee;
        }

        .statistics {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stat-label {
            font-weight: 600;
            color: #1a2a6c;
        }

        .stat-value {
            font-weight: 700;
            color: #b21f1f;
            font-size: 1.1rem;
        }

        .baidu-stats h3 {
            color: #1a2a6c;
            margin-bottom: 10px;
            text-align: center;
        }

        .baidu-stats p {
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .container {
                padding: 25px;
            }

            .dashboard {
                gap: 15px;
            }

            .card {
                padding: 20px 15px;
            }

            .card h2 {
                font-size: 1.3rem;
            }

            .card i {
                font-size: 2.3rem;
                margin-bottom: 15px;
            }
        }

        @media (max-width: 480px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 20px;
            }

            .statistics {
                flex-direction: column;
                align-items: center;
            }
        }

        /* 密码输入框样式 */
        .password-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }

        .password-content {
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .password-content h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .password-content input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .password-content button {
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .password-content button:hover {
            opacity: 0.9;
        }

        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

            <!-- 新增行的卡片 -->

			<div class="card">
                <i class="fas fa-border-all"></i>

        </div>

        <footer>
            <p>© 2025 市场分析 | 前台导航系统 v2.0</p>

    </div>

    <script>
        // 设置正确的密码
        const correctPassword = "123456"; // 请将此处替换为你的实际密码

        // 页面加载时检查是否已通过验证
        window.onload = function() {
            // 检查 localStorage 中是否有密码验证标记
            if (!localStorage.getItem('authenticated')) {
                // 如果没有验证过，显示密码输入框
                document.getElementById('passwordModal').style.display = 'block';
                document.getElementById('mainContent').style.display = 'none';
            } else {
                // 如果已经验证过，显示主内容
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            }
        };

        // 检查密码
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === correctPassword) {
                // 密码正确，设置验证标记并隐藏模态框
                localStorage.setItem('authenticated', 'true');
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
            } else {
                // 密码错误，显示错误信息
                errorMessage.style.display = 'block';
                // 清空输入框
                document.getElementById('passwordInput').value = '';
            }
        }

        // 允许按回车键提交密码
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && document.getElementById('passwordModal').style.display === 'block') {
                checkPassword();
            }
        });
    </script>
