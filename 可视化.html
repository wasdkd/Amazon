<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>数据可视化平台（免硬编码 Token）</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    :root { --primary: #4361ee; --success: #06ffa5; --danger: #ff006e; --gray: #6c757d; }
    body { font-family: Inter, sans-serif; background: #f5f7fa; margin: 0; padding: 2rem; }
    .container { max-width: 1000px; margin: auto; }
    .modules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
    .module-card { background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 2rem; cursor: pointer; transition: .3s; }
    .module-card:hover { transform: translateY(-5px); }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 12px; width: 90%; max-width: 900px; max-height: 90vh; overflow-y: auto; padding: 2rem; }
    .close-btn { float: right; font-size: 1.5rem; cursor: pointer; }
    .file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .file-card { background: #f8f9fa; border-radius: 8px; padding: 1rem; cursor: pointer; }
    .file-card:hover { background: #e9ecef; }
    .file-actions { display: flex; gap: .5rem; margin-top: .5rem; }
    .btn { border: none; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .upload-area { border: 2px dashed var(--gray); border-radius: 8px; padding: 2rem; text-align: center; margin: 1rem 0; cursor: pointer; }
    .file-viewer { width: 100%; height: 500px; border: none; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { padding: .5rem; border: 1px solid #ddd; }
    td[contenteditable] { background: #f9f9f9; }
    #token-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.7); z-index: 2000; align-items: center; justify-content: center; }
    #token-modal-content { background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px; }
    #token-input { width: 100%; padding: .5rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <!-- Token 输入模态框 -->
  <div class="modal" id="token-modal">
    <div id="token-modal-content">
      <h3>请输入 GitHub Token</h3>
      <p>需要具有 repo 权限的 Personal Access Token</p>
      <input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxx" />
      <button class="btn btn-primary" onclick="saveToken()">保存</button>
    </div>
  </div>

  <div class="container">
    <h1>数据可视化平台（网页内预览版）</h1>
    <div class="modules-grid">
      <div class="module-card" onclick="openModule('ppt')">
        <i class="fas fa-file-powerpoint fa-2x" style="color:#d63031"></i>
        <h3>PPT/PDF展示</h3>
        <p>查看演示文稿</p>
      </div>
      <div class="module-card" onclick="openModule('excel')">
        <i class="fas fa-file-excel fa-2x" style="color:#00b894"></i>
        <h3>Excel表格</h3>
        <p>管理表格数据</p>
      </div>
      <div class="module-card" onclick="openModule('history')">
        <i class="fas fa-history fa-2x" style="color:#6c5ce7"></i>
        <h3>历史数据</h3>
        <p>查看操作记录</p>
      </div>
    </div>
  </div>

  <!-- 主模态框 -->
  <div class="modal" id="main-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('main-modal')">&times;</span>
      <h2 id="modal-title">模块</h2>
      <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <i class="fas fa-cloud-upload-alt fa-2x"></i><br>点击或拖拽上传文件
      </div>
      <input type="file" id="file-input" style="display:none" />
      <div id="file-list"></div>
    </div>
  </div>

  <!-- 文件预览模态框 -->
  <div class="modal" id="viewer-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('viewer-modal')">&times;</span>
      <h2 id="viewer-title">文件预览</h2>
      <div id="viewer-content"></div>
    </div>
  </div>

  <script>
    // ===================== 配置 =====================
    const GITHUB_USERNAME = 'wasdkd';
    const GITHUB_REPO = 'Amazon';
    const FILE_PATH = 'data.json';
    // ===============================================

    let TOKEN = localStorage.getItem('gh_token');
    let data = { pptFiles: [], excelFiles: [], history: [] };
    let sha = null;
    let currentModule = null;

    // Token 管理
    function showTokenModal() {
      document.getElementById('token-modal').style.display = 'flex';
      document.getElementById('token-input').focus();
    }

    function saveToken() {
      TOKEN = document.getElementById('token-input').value.trim();
      if (!TOKEN) return alert('Token 不能为空');
      localStorage.setItem('gh_token', TOKEN);
      document.getElementById('token-modal').style.display = 'none';
      loadData();
    }

    // 如果本地没有 token，则弹出输入框
    if (!TOKEN) {
      showTokenModal();
    }

    // GitHub API 工具
    async function loadData() {
      if (!TOKEN) return;
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${TOKEN}` }
        });
        if (res.status === 404) {
          // 文件不存在，创建空文件
          data = { pptFiles: [], excelFiles: [], history: [] };
          await saveData();
          return;
        }
        const json = await res.json();
        sha = json.sha;
        data = JSON.parse(atob(json.content));
      } catch (err) {
        alert('读取数据失败，请检查 Token 和网络');
        console.error(err);
      }
    }

    async function saveData() {
      if (!TOKEN) return;
      const content = btoa(JSON.stringify(data, null, 2));
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            Authorization: `token ${TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: '更新数据 via 前端',
            content,
            sha
          })
        });
        const json = await res.json();
        sha = json.content.sha;
      } catch (err) {
        alert('保存数据失败，请检查 Token 权限');
        console.error(err);
      }
    }

    // 模块操作
    async function openModule(type) {
      if (!TOKEN) return showTokenModal();
      await loadData();
      currentModule = type;
      document.getElementById('modal-title').textContent = {
        ppt: 'PPT/PDF文件',
        excel: 'Excel文件',
        history: '历史记录'
      }[type];
      document.getElementById('main-modal').style.display = 'flex';

      if (type === 'history') {
        renderHistory();
      } else {
        renderFileList(type);
      }
    }

    function renderFileList(type) {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      const files = type === 'ppt' ? data.pptFiles : data.excelFiles;

      files.forEach((file, idx) => {
        const div = document.createElement('div');
        div.className = 'file-card';
        div.innerHTML = `
          <strong>${file.name}</strong><br>
          <small>${file.date} · ${file.size}</small><br>
          <div class="file-actions">
            <button class="btn btn-primary" onclick="viewFile('${type}', ${idx})">查看</button>
            <button class="btn btn-danger" onclick="deleteFile('${type}', ${idx})">删除</button>
          </div>
        `;
        div.onclick = () => viewFile(type, idx);
        list.appendChild(div);
      });

      // 上传文件
      document.getElementById('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const newFile = {
          name: file.name,
          date: new Date().toISOString().slice(0, 10),
          size: (file.size / 1024).toFixed(1) + 'KB',
          data: currentModule === 'excel' ? [['列1', '列2', '列3'], ['', '', '']] : null
        };

        data[currentModule + 'Files'].unshift(newFile);
        data.history.unshift({ file: file.name, action: '上传', date: new Date().toISOString().slice(0, 19).replace('T', ' ') });
        await saveData();
        renderFileList(currentModule);
      };
    }

    function renderHistory() {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      data.history.forEach(h => {
        const div = document.createElement('div');
        div.className = 'file-card';
        div.innerHTML = `<strong>${h.file}</strong> · ${h.action} · ${h.date}`;
        list.appendChild(div);
      });
    }

    async function viewFile(type, idx) {
      const file = data[type + 'Files'][idx];
      document.getElementById('viewer-title').textContent = file.name;
      document.getElementById('viewer-modal').style.display = 'flex';

      if (type === 'excel') {
        let html = `<table>`;
        file.data.forEach((row, r) => {
          html += '<tr>' + row.map((cell, c) =>
            `<td contenteditable onblur="updateCell('${type}', ${idx}, ${r}, ${c}, this.textContent)">${cell}</td>`
          ).join('') + '</tr>';
        });
        html += '</table>';
        document.getElementById('viewer-content').innerHTML = html;
      } else {
        document.getElementById('viewer-content').innerHTML = `
          <p>预览 ${file.name}</p>
          <iframe class="file-viewer" src="https://docs.google.com/viewer?url=https://example.com/${file.name}&embedded=true"></iframe>
        `;
      }
    }

    async function updateCell(type, fileIdx, row, col, value) {
      data[type + 'Files'][fileIdx].data[row][col] = value;
      data.history.unshift({ file: data[type + 'Files'][fileIdx].name, action: '编辑', date: new Date().toISOString().slice(0, 19).replace('T', ' ') });
      await saveData();
    }

    async function deleteFile(type, idx) {
      const file = data[type + 'Files'][idx];
      if (!confirm(`确定删除 ${file.name} 吗？`)) return;
      data[type + 'Files'].splice(idx, 1);
      data.history.unshift({ file: file.name, action: '删除', date: new Date().toISOString().slice(0, 19).replace('T', ' ') });
      await saveData();
      renderFileList(type);
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
