
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
    <script src="https://wasdkd.github.io/Amazon/auth.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>主图点击率数据展示</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 10px;
                background-color: #f5f7f9;
                color: #333;
            }
            .container {
                max-width: 100%;
                margin: 0 auto;
                padding: 0 5px;
            }
            .header {
                text-align: center;
                margin-bottom: 20px;
                padding: 1px;
                background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
                color: white;
                border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
            .header h1 {
                margin: 0 0 0px 0;
                font-size: 24px;
            }
            .header p {
                margin: 0;
                font-size: 14px;
            }
            .filter-bar {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 15px;
                margin-bottom: 5px;
                padding: 1px;
                background-color: #f8f9fa;
                border-radius: 6px;
                border: 1px solid #dee2e6;
                position: sticky;
                top: 0;
                z-index: 100;
                flex-wrap: wrap;
            }
            .filter-group {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            .filter-label {
                font-size: 14px;
                font-weight: 600;
                color: #495057;
            }
            .search-box {
                width: 300px;
                padding: 8px 12px;
                border: 1px solid #ced4da;
                border-radius: 4px;
                font-size: 14px;
            }
            .btn-group {
                display: flex;
                gap: 5px;
            }
            .action-btn {
                padding: 8px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                transition: all 0.2s;
            }
            .sort-btn {
                background-color: #0d6efd;
                color: white;
            }
            .sort-btn:hover {
                background-color: #0b5ed7;
            }
            .reset-btn {
                background-color: #6c757d;
                color: white;
            }
            .reset-btn:hover {
                background-color: #5c636a;
            }
            .filter-panel {
                position: relative;
                width: 140px;
            }
            .filter-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 12px;
                border: 1px solid #ced4da;
                border-radius: 4px;
                background-color: white;
                cursor: pointer;
                font-size: 14px;
            }
            .filter-options {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                max-height: 300px;
                overflow-y: auto;
                background-color: white;
                border: 1px solid #ced4da;
                border-top: none;
                border-radius: 0 0 4px 4px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                z-index: 1000;
                display: none;
                padding: 5px;
            }
            .filter-options.active {
                display: block;
            }
            .filter-search {
                padding: 6px 10px;
                border: 1px solid #ced4da;
                border-radius: 4px;
                margin-bottom: 5px;
                width: 100%;
                box-sizing: border-box;
            }
            .filter-option {
                display: flex;
                align-items: center;
                padding: 6px 8px;
                border-bottom: 1px solid #eee;
                cursor: pointer;
            }
            .filter-option:hover {
                background-color: #f8f9fa;
            }
            .filter-option input {
                margin-right: 8px;
            }
            .filter-actions {
                display: flex;
                justify-content: space-between;
                padding: 8px 0;
                margin-top: 5px;
                border-top: 1px solid #eee;
            }
            .filter-action-btn {
                padding: 4px 8px;
                border: 1px solid #ced4da;
                border-radius: 4px;
                background-color: #f8f9fa;
                cursor: pointer;
                font-size: 0.85rem;
            }
            .filter-action-btn:hover {
                background-color: #e9ecef;
            }
            .filter-selected {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                margin-top: 5px;
                max-width: 200px;
            }
            .filter-tag {
                background-color: #e7f4ff;
                color: #0a58ca;
                padding: 2px 6px;
                border-radius: 12px;
                font-size: 0.85rem;
                display: flex;
                align-items: center;
            }
            .filter-tag-remove {
                margin-left: 4px;
                cursor: pointer;
                font-weight: bold;
            }
            .filter-tag-remove:hover {
                color: #dc3545;
            }
            .sku-group {
                background-color: white;
                border-radius: 8px;
                margin-bottom: 20px;
                box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
                overflow: hidden;
            }
            .basic-info {
                padding: 3px;
                background-color: #2c3e50;
                color: white;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 10px;
            }
            .info-item {
                margin-bottom: 5px;
                font-size: 15px;
            }
            .info-label {
                font-weight: bold;
                color: #ecf0f1;
                margin-right: 5px;
            }
            .images-container {
                padding: 15px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(710px, 1fr));
                gap: 15px;
            }
            .image-card {
                background: white;
                border-radius: 6px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s ease;
                display: flex;
                min-width: 800px;
            }
            .image-card:hover {
                transform: translateY(-3px);
            }
            .image-wrapper {
                width: 200px;
                height: 200px;
                overflow: hidden;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .image-wrapper img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                transition: transform 0.5s ease;
                display: block;
            }
            .image-card:hover .image-wrapper img {
                transform: scale(1.05);
            }
            .image-details {
                flex: 1;
                padding: 12px;
                overflow-y: auto;
                max-height: 200px;
                min-width: 280px;
            }
            .image-details h4 {
                margin-top: 0;
                margin-bottom: 8px;
                font-size: 14px;
            }
            .details-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
                table-layout: auto;
            }
            .details-table th,
            .details-table td {
                border: 1px solid #ddd;
                padding: 3px 4px;
                text-align: left;
                white-space: nowrap;
            }
            .details-table th {
                background-color: #f2f2f2;
                font-weight: bold;
            }
            .details-table td {
                word-break: break-word;
            }
            .keyword-col {
                width: 100%;
                max-width: 100%;
            }
            /* 添加特定列的样式 */
            .highest-month-col,
            .click-count-col {
                width: 40px;
                white-space: normal;
                word-wrap: break-word;
                line-height: 1.2;
            }
            .no-images {
                text-align: center;
                padding: 30px;
                color: #7f8c8d;
                font-style: italic;
                font-size: 14px;
            }
            .highlight-cell {
                background-color: #fff3cd !important;
                font-weight: bold;
            }
            .sort-indicator {
                margin-left: 5px;
            }
            .loading {
                text-align: center;
                padding: 20px;
                font-size: 16px;
                color: #6c757d;
            }
            .loading.hidden {
                display: none;
            }
            @media (max-width: 768px) {
                body {
                    padding: 5px;
                }
                .basic-info {
                    grid-template-columns: 1fr;
                }
                .images-container {
                    grid-template-columns: 1fr;
                    padding: 10px;
                }
                .image-card {
                    flex-direction: column;
                }
                .image-wrapper {
                    width: 100%;
                    height: 200px;
                }
            }
            @media (max-width: 480px) {
                .header h1 {
                    font-size: 20px;
                }
                .images-container {
                    grid-template-columns: 1fr;
                }
                .image-wrapper {
                    height: 150px;
                }
                .image-details {
                    max-height: 150px;
                }
            }
        </style>
    </head>

                            <div class="filter-actions">
                                <button class="filter-action-btn" onclick="applyFilter('group')">应用</button>
                                <button class="filter-action-btn" onclick="clearFilter('group')">清除</button>
                            </div>

                            <div class="filter-option" onclick="toggleAllOptions('promotion')">

                    checkbox.checked = false;
                }

                // 更新已选标签显示
                updateSelectedTags(type);

                // 执行筛选
                filterSKUs();
            }

            // 选择排序方式
            function selectSort(sortType) {
                sortOrder = sortType;
                // 关闭面板
                document.getElementById('sort-options').classList.remove('active');
                // 立即执行筛选和排序
                filterSKUs();
            }

            // 清除排序
            function clearSort() {
                sortOrder = null;
                // 关闭面板
                document.getElementById('sort-options').classList.remove('active');
                // 立即执行筛选
                filterSKUs();
            }

            // 筛选SKU函数
            function filterSKUs() {
                const keyword = document.getElementById('search-input').value.toLowerCase();

                // 应用筛选条件
                filteredData = skuData.filter(sku => {
                    // 应用基础信息筛选
                    let matchesFilters = true;

                    // 检查每个筛选条件
                    if (filterState.group.length > 0 && !filterState.group.includes(sku.basic_info['组别'])) {
                        matchesFilters = false;
                    }
                    if (filterState.promotion.length > 0 && !filterState.promotion.includes(sku.basic_info['推广'])) {
                        matchesFilters = false;
                    }
                    if (filterState.developer.length > 0 && !filterState.developer.includes(sku.basic_info['开发'])) {
                        matchesFilters = false;
                    }
                    if (filterState['product-type'].length > 0 && !filterState['product-type'].includes(sku.basic_info['产品类型'])) {
                        matchesFilters = false;
                    }
                    if (filterState.seasonality.length > 0 && !filterState.seasonality.includes(sku.basic_info['季节性'])) {
                        matchesFilters = false;
                    }
                    if (filterState.category.length > 0 && !filterState.category.includes(sku.basic_info['品类'])) {
                        matchesFilters = false;
                    }
                    if (filterState['product-grade'].length > 0 && !filterState['product-grade'].includes(sku.basic_info['产品定级'])) {
                        matchesFilters = false;
                    }

                    if (!matchesFilters) return false;

                    // 应用搜索筛选
                    if (keyword) {
                        let match = false;

                        // 搜索基本信息
                        for (const value of Object.values(sku.basic_info)) {
                            if (value && value.toString().toLowerCase().includes(keyword)) {
                                match = true;
                                break;
                            }
                        }

                        // 如果基本信息不匹配，搜索详细信息
                        if (!match) {
                            for (const img of sku.images) {
                                for (const detail of img.details) {
                                    for (const value of Object.values(detail)) {
                                        if (value && value.toString().toLowerCase().includes(keyword)) {
                                            match = true;
                                            break;
                                        }
                                    }
                                    if (match) break;
                                }
                                if (match) break;
                            }
                        }

                        if (!match) return false;
                    }

                    return true;
                });

                // 应用排序
                if (sortOrder) {
                    filteredData.sort((a, b) => {
                        // 获取SKU的最大值作为排序依据
                        const getMaxValue = (sku, field) => {
                            let maxValue = -Infinity;
                            for (const img of sku.images) {
                                for (const detail of img.details) {
                                    const value = detail[field];
                                    if (value !== undefined && value !== null && value !== '') {
                                        // 尝试转换为数值
                                        let numValue;
                                        if (typeof value === 'number') {
                                            numValue = value;
                                        } else if (typeof value === 'string') {
                                            // 清理字符串中的非数字字符（除了小数点）
                                            const cleanedValue = value.replace(/[^0-9.]/g, '');
                                            numValue = parseFloat(cleanedValue) || 0;
                                        } else {
                                            numValue = 0;
                                        }
                                        if (numValue > maxValue) {
                                            maxValue = numValue;
                                        }
                                    }
                                }
                            }
                            return maxValue === -Infinity ? 0 : maxValue;
                        };

                        const fieldMap = {
                            'click': '顶部点击次数',
                            'cpc': '顶部CPC',
                            'ctr': '顶部点击率',
                            'order': '顶部订单'
                        };

                        const direction = sortOrder.includes('asc') ? 1 : -1;
                        const fieldKey = sortOrder.split('_')[0];
                        const field = fieldMap[fieldKey];

                        const aValue = getMaxValue(a, field);
                        const bValue = getMaxValue(b, field);

                        return (aValue - bValue) * direction;
                    });
                }

                // 重置分页并重新渲染
                currentPage = 0;
                const container = document.getElementById('skuContainer');
                container.innerHTML = '';
                loadMoreItems();
            }

            // 重置所有筛选器
            function resetFilters() {
                // 重置筛选状态
                Object.keys(filterState).forEach(key => {
                    filterState[key] = [];
                });

                // 重置排序状态
                sortOrder = null;

                // 清除所有复选框选择
                document.querySelectorAll('.filter-options input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = false;
                });

                // 清除所有单选按钮选择
                document.querySelectorAll('input[name="sort-option"]').forEach(radio => {
                    radio.checked = false;
                });

                // 清除搜索框
                document.getElementById('search-input').value = '';

                // 清除所有已选标签
                document.querySelectorAll('.filter-selected').forEach(container => {
                    container.innerHTML = '';
                });

                // 重新筛选数据
                filterSKUs();
            }

            // 渲染SKU数据（分页加载）
            function renderSKUData(data) {
                const container = document.getElementById('skuContainer');

                if (data.length === 0) {
                    container.innerHTML = '<div class="no-images">没有找到匹配的SKU</div>';
                    return;
                }

                data.forEach(sku => {
                    const skuElement = document.createElement('div');
                    skuElement.className = 'sku-group';

                    // 创建基本信息HTML
                    let basicInfoHTML = '<div class="basic-info">';
                    for (const [key, value] of Object.entries(sku.basic_info)) {
                        basicInfoHTML += `
                            <div class="info-item">
                                <span class="info-label">${key}：</span>
                                <span>${value}</span>
                            </div>
                        `;
                    }
                    basicInfoHTML += '</div>';

                    // 创建图片HTML
                    let imagesHTML = '<div class="images-container">';
                    if (sku.images && sku.images.length > 0) {
                        sku.images.forEach(img => {
                            let detailsTable = '<table class="details-table"><thead><tr>';
                            // 表头
                            if (img.details.length > 0) {
                                Object.keys(img.details[0]).forEach(key => {
                                    // 跳过内部使用的_highlight字段
                                    if (key === '_highlight') return;

                                    const displayName = columnMapping[key] || key;
                                    const keywordClass = key === '关键词' ? 'keyword-col' : '';
                                    // 为特定列添加样式类
                                    const specialClass = (key === 'ABA最高排名月份') ? 'highest-month-col' : 
                                                        (key === '顶部点击次数') ? 'click-count-col' : '';
                                    const extraClass = keywordClass + (specialClass ? ' ' + specialClass : '');
                                    detailsTable += `<th class="${extraClass}">${displayName}</th>`;
                                });
                            } else {
                                // 默认表头
                                const defaultHeaders = ['时间', '价格', '关键词类别', '关键词', 'ABA最高排名月份', 'ABA最高排名',
                                                       '测图当周搜索频率', '顶部点击次数', '顶部CPC', '顶部点击率', '顶部订单', '顶部CVR'];
                                defaultHeaders.forEach(header => {
                                    // 跳过内部使用的_highlight字段（虽然默认表头中不应该有）
                                    if (header === '_highlight') return;

                                    const displayName = columnMapping[header] || header;
                                    const keywordClass = header === '关键词' ? 'keyword-col' : '';
                                    // 为特定列添加样式类
                                    const specialClass = (header === 'ABA最高排名月份') ? 'highest-month-col' : 
                                                        (header === '顶部点击次数') ? 'click-count-col' : '';
                                    const extraClass = keywordClass + (specialClass ? ' ' + specialClass : '');
                                    detailsTable += `<th class="${extraClass}">${displayName}</th>`;
                                });
                            }
                            detailsTable += '</tr></thead><tbody>';

                            // 表格内容
                            img.details.forEach(detail => {
                                detailsTable += '<tr>';
                                Object.keys(detail).forEach(key => {
                                    // 跳过内部使用的_highlight字段
                                    if (key === '_highlight') return;

                                    const value = detail[key] || '';
                                    const keywordClass = key === '关键词' ? 'keyword-col' : '';
                                    // 为特定列添加样式类
                                    const specialClass = (key === 'ABA最高排名月份') ? 'highest-month-col' : 
                                                        (key === '顶部点击次数') ? 'click-count-col' : '';
                                    const extraClass = keywordClass + (specialClass ? ' ' + specialClass : '');

                                    // 检查是否需要高亮
                                    let highlightClass = '';
                                    if (detail['_highlight'] && detail['_highlight'][key]) {
                                        highlightClass = ' highlight-cell';
                                    }

                                    detailsTable += `<td class="${extraClass}${highlightClass}">${value}</td>`;
                                });
                                detailsTable += '</tr>';
                            });

                            detailsTable += '</tbody></table>';

                            imagesHTML += `
                                <div class="image-card">
                                    <div class="image-wrapper">
                                        <img src="${img.image_url}" alt="${img.sequence}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPuWbvueJh+WKoOWksei0pTwvdGV4dD48L3N2Zz4=';">
                                    </div>
                                    <div class="image-details">
                                        <!--<h4>图顺序: ${img.sequence}</h4> -->
                                        ${detailsTable}
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        imagesHTML = '<div class="no-images">该SKU没有找到图片</div>';
                    }
                    imagesHTML += '</div>';

                    skuElement.innerHTML = basicInfoHTML + imagesHTML;
                    container.appendChild(skuElement);
                });
            }

            // 加载更多项目
            function loadMoreItems() {
                const loadingElement = document.getElementById('loading');
                const startIndex = currentPage * ITEMS_PER_PAGE;
                const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, filteredData.length);

                // 显示加载指示器
                loadingElement.classList.remove('hidden');

                // 模拟异步加载（实际应用中可能需要真正的异步操作）
                setTimeout(() => {
                    const pageData = filteredData.slice(startIndex, endIndex);
                    renderSKUData(pageData);

                    currentPage++;
                    isLoading = false;

                    // 隐藏加载指示器
                    loadingElement.classList.add('hidden');

                    // 检查是否已加载所有数据
                    if (endIndex >= filteredData.length) {
                        // 所有数据已加载完毕
                        window.removeEventListener('scroll', handleScroll);
                    }
                }, 100); // 模拟网络延迟
            }

            // 处理滚动事件
            function handleScroll() {
                if (isLoading || (currentPage * ITEMS_PER_PAGE >= filteredData.length)) return;

                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;

                // 当滚动到底部附近时加载更多
                if (scrollTop + windowHeight >= documentHeight - 100) {
                    isLoading = true;
                    loadMoreItems();
                }
            }

            // 页面加载时初始化
            document.addEventListener('DOMContentLoaded', function() {
                initFilters();
                filterSKUs(); // 初始筛选

                // 添加事件监听器
                document.getElementById('search-btn').addEventListener('click', filterSKUs);
                document.getElementById('search-input').addEventListener('keyup', function(event) {
                    if (event.key === 'Enter') {
                        filterSKUs();
                    }
                });
                document.getElementById('reset-filters').addEventListener('click', resetFilters);

                // 为搜索框添加Enter键监听
                document.getElementById('search-input').addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        filterSKUs();
                    }
                });

                // 添加滚动事件监听器实现瀑布流加载
                window.addEventListener('scroll', handleScroll);
            });

            // 点击页面其他地方关闭下拉菜单
            document.addEventListener('click', function(event) {
                // 检查点击是否在筛选面板外
                if (!event.target.closest('.filter-panel') && !event.target.closest('.filter-header')) {
                    document.querySelectorAll('.filter-options').forEach(panel => {
                        panel.classList.remove('active');
                    });
                }
            });

            // 为所有筛选面板的搜索框添加Enter键支持
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    // 检查是否在筛选面板的搜索框中
                    if (event.target.classList.contains('filter-search')) {
                        const panelId = event.target.id.replace('-search', '');
                        const panelType = panelId.replace(/-/g, ' ');
                        // 触发应用筛选
                        const applyBtn = event.target.closest('.filter-options').querySelector('.filter-action-btn');
                        if (applyBtn) {
                            applyBtn.click();
                        }
                    }
                }
            });
        </script>
    </body>
