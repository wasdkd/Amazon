<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚马逊选品清洗系统 V16.0 (本地中转修复版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        :root { --primary: #007185; --warning: #FF9900; --danger-bg: #fee2e2; --border-color: #bbb; --ai-btn: #722ed1; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; color: #333; display: flex; flex-direction: column; height: 100vh; margin: 0; }

        .controls { background: white; padding: 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; border: 1px solid #ccc; flex-shrink: 0; }
        .group { display: flex; align-items: center; gap: 10px; border-right: 1px solid #eee; padding-right: 15px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; color: white; display: flex; align-items: center; gap: 5px; }
        .btn-up { background: var(--warning); }
        .btn-exp { background: #10b981; }
        .btn-zip { background: #0ea5e9; }
        .btn-ai { background: var(--ai-btn); } .btn-ai:hover { background: #531dab; }
        .btn-page { background: white; border: 1px solid #ccc; color: #333; } .btn-page:disabled { opacity: 0.5; cursor: not-allowed; }
        .api-input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 250px; font-size: 13px; }

        .table-container { background: white; border-radius: 6px 6px 0 0; flex-grow: 1; overflow: auto; border: 1px solid #999; }
        table { width: 100%; border-collapse: collapse; min-width: 1800px; table-layout: fixed; }
        th { background: #232f3e; color: white; padding: 10px 8px; text-align: left; position: sticky; top: 0; z-index: 10; font-size: 13px; border: 1px solid #555; }
        td { border: 1px solid var(--border-color); padding: 0; vertical-align: top; background: white; min-height: 50px; position: relative; }

        textarea.edit-area { width: 100%; height: 100%; border: none; padding: 8px; resize: none; font-family: inherit; font-size: 12px; line-height: 1.4; min-height: 70px; white-space: pre-wrap; background: transparent; display: block; }
        textarea.edit-area:focus, input.edit:focus { outline: none; box-shadow: inset 0 0 0 2px var(--primary); background: #faffff; }
        input.edit { width: 100%; height: 100%; padding: 8px; border: none; background: transparent; font-family: inherit; font-size: 13px; min-height: 50px; }

        .title-cell { padding: 6px; display: flex; flex-direction: column; gap: 4px; }
        .en-title { font-size: 12px; color: #222; font-weight: 600; }
        .cn-title { font-size: 11px; color: #666; border-top: 1px dashed #ccc; padding-top: 4px; }
        .missing-data { background-color: var(--danger-bg) !important; }
        .thumb { width: 60px; height: 60px; object-fit: contain; margin: 5px auto; display: block; cursor: zoom-in; border: 1px solid #ddd; background: #fff; }

        #preview-overlay { display: none; position: fixed; z-index: 9999; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; background: white; padding: 5px; border: 2px solid #666; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        #preview-img { max-width: 600px; max-height: 600px; display: block; }

        .footer-bar { background: #f1f1f1; border: 1px solid #999; border-top: none; padding: 8px 15px; font-size: 13px; color: #333; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 6px 6px; flex-shrink: 0; }

        #ai-status-bar { display: none; width: 100%; background: #e6f7ff; padding: 10px 20px; border-bottom: 1px solid #91d5ff; align-items: center; gap: 15px; font-size: 13px; color: #0050b3; flex-shrink: 0; margin-bottom: 5px; }
        .progress-track { flex-grow: 1; height: 8px; background: #bae7ff; border-radius: 4px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #1890ff; transition: width 0.3s; }
        #export-mask { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 10000; color:white; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="preview-overlay"><img id="preview-img" src=""></div>

    <div id="export-mask">
        <h3 id="exp-status">正在处理...</h3>
        <div style="width:300px; height:8px; background:#444; border-radius:4px; margin-top:10px;">
            <div id="exp-bar" style="width:0%; height:100%; background:#10b981; transition:0.3s;"></div>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="controls">
        <div class="group">
            <input type="file" id="fileInput" accept=".xlsx,.csv" style="display:none" onchange="handleFile(this)">
            <button class="btn-up" onclick="document.getElementById('fileInput').click()">📂 上传表格(上传卖家精灵导出的数据)</button>
            <button class="btn-exp" onclick="exportData()">📥 导出 Excel</button>
            <button class="btn-zip" onclick="exportImagesZip()">📦 下载图片包</button>
        </div>

        <div class="group" style="border-right: none;">
            <input type="password" id="apiKey" class="api-input" placeholder="粘贴阿里云 API Key (sk-...)">
            <button class="btn-ai" onclick="startAIFill()">🚀 AI 补全 (目前线上版本用不了)</button>
            <label style="font-size:12px; display:flex; align-items:center; gap:5px; cursor:pointer; margin-left:10px;">
                <input type="checkbox" id="onlyEmptyCheck" onchange="applyFilter()">
                <span style="color:#e11d48; font-weight:bold;">只看缺漏</span>
            </label>
        </div>

        <div class="group" style="flex-grow: 1; justify-content: flex-end; border:none;">
            <button class="btn-page" onclick="changePage(-1)">上一页</button>
            <button class="btn-page" onclick="changePage(1)">下一页</button>
        </div>
    </div>

    <div id="ai-status-bar">
        <span id="ai-msg">🤖 正在请求本地中转...</span>
        <div class="progress-track"><div class="progress-fill" id="ai-prog"></div></div>
        <span id="ai-count">0/0</span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 40px;">#</th>
                    <th style="width: 80px;">图片</th>
                    <th style="width: 110px;">ASIN</th>
                    <th style="width: 110px;">品类</th>
                    <th style="width: 180px;">材质</th>
                    <th style="width: 80px;">版型</th>
                    <th style="width: 80px;">领型</th>
                    <th style="width: 80px;">袖型</th>
                    <th style="width: 140px;">设计元素</th>
                    <th style="width: 350px;">商品标题 (原标/译标)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer-bar">
        <span id="totalInfo">总数据: 0 | 当前显示: 0</span>
        <span id="pageInfo">页码: 0 / 0</span>
    </div>

    <script>
        const PAGE_SIZE = 50;
        let allData = [];
        let filteredData = [];
        let currentPage = 1;

        const RAW_CAT_MAP = { "vest":"Vests","top":"Tops","shirt":"Tops","tee":"Tops","blouse":"Blouse","dress":"Dresses","pant":"Pants","jean":"Jeans","short":"Shorts","skirt":"Skirts","sweater":"Sweaters","sweatshirt":"Sweatshirts","hoodie":"Hoodies","jacket":"Jackets","coat":"Coats","set":"Sets","bikini":"Bikini","swim":"Swimsuits","t-shirt":"Tops" };
        const SORTED_CAT_KEYS = Object.keys(RAW_CAT_MAP).sort((a,b) => b.length - a.length);
        const DICTS = { fit: { "slim":"修身","loose":"宽松","regular":"常规","oversize":"Oversize","fitted":"修身","relax":"宽松" }, collar: { "mock neck":"半高领", "mock":"半高领", "turtle neck":"高领", "turtleneck":"高领", "v-neck":"V领", "v neck":"V领", "crew":"圆领", "round":"圆领", "hood":"连帽", "polo":"POLO领", "stand":"立领", "lapel":"翻领", "square":"方领" }, sleeve: { "long sleeve":"长袖", "short sleeve":"短袖", "sleeveless":"无袖", "puff":"泡泡袖", "batwing":"蝙蝠袖" }, elements: { "print":"印花","floral":"碎花","pocket":"口袋","solid":"纯色","button":"纽扣","lace":"蕾丝","rib":"罗纹","zipper":"拉链","pleated":"褶皱" } };

        function handleFile(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type:'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {defval:""});
                processData(json);
            };
            reader.readAsArrayBuffer(file);
        }

        function processData(raw) {
            allData = raw.map(row => {
                const title = String(row['商品标题']||row['Title']||"");
                const title_cn = String(row['标题(翻译)']||row['中文标题']||row['Translated Title']||row['title_cn']||"");
                const details = String(row['详细参数']||row['Technical Details']||"");
                const desc = details + " " + String(row['产品卖点']||row['Bullet Points']||"");
                const titleLower = title.toLowerCase();
                const descLower = desc.toLowerCase();
                let img = row['商品主图']||row['Main Image URL']||"";
                img = img.replace(/\._AC_.*_\.jpg/, ".jpg").replace(/\._AC_.*_\.png/, ".png");

                let fabric = "";
                const rawFabricBlock = details.match(/Fabric type:?\s*([^|]+)/i);
                const scanText = rawFabricBlock ? rawFabricBlock[1] : desc;
                const matRegex = /(\d+(?:\.\d+)?\s*%\s*[a-zA-Z]+(?:\s[a-zA-Z]+)?)/g;
                const matMatches = scanText.match(matRegex);
                if(matMatches && matMatches.length > 0) {
                    const uniqueSet = new Set();
                    const cleanList = [];
                    matMatches.forEach(m => {
                        const key = m.toLowerCase().replace(/\s+/g, ' ').trim();
                        if(!uniqueSet.has(key)) { uniqueSet.add(key); cleanList.push(m.trim()); }
                    });
                    fabric = cleanList.join(', ');
                } else if (rawFabricBlock) { fabric = rawFabricBlock[1].trim(); }

                let category = "";
                const catText = (title + " " + descLower).toLowerCase();
                for(let key of SORTED_CAT_KEYS) { if(catText.includes(key)) { category = RAW_CAT_MAP[key]; break; } }

                const find = (dict) => { for(let k in dict) if(titleLower.includes(k)) return dict[k]; for(let k in dict) if(descLower.includes(k)) return dict[k]; return ""; };
                const findMulti = (dict) => { let res=[]; const full = titleLower + " " + descLower; for(let k in dict) if(full.includes(k) && !res.includes(dict[k])) res.push(dict[k]); return res.join(","); };

                return { img: img, asin: row['ASIN']||row['asin']||"", link: row['商品详情页链接']||"", category: category, fabric: fabric, fit: find(DICTS.fit), collar: find(DICTS.collar), sleeve: find(DICTS.sleeve), elements: findMulti(DICTS.elements), title: title, title_cn: title_cn, _raw: row };
            });
            applyFilter();
        }

        function applyFilter() {
            const onlyEmpty = document.getElementById('onlyEmptyCheck').checked;
            filteredData = allData.filter(item => {
                if(!onlyEmpty) return true;
                return !item.category || !item.fabric || !item.fit || !item.collar || !item.sleeve || !item.elements;
            });
            currentPage = 1;
            renderTable();
        }

        function changePage(delta) {
            const max = Math.ceil(filteredData.length/PAGE_SIZE) || 1;
            currentPage += delta;
            if(currentPage < 1) currentPage = 1;
            if(currentPage > max) currentPage = max;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage-1)*PAGE_SIZE;
            const end = start+PAGE_SIZE;
            const pageItems = filteredData.slice(start, end);
            const totalPages = Math.ceil(filteredData.length/PAGE_SIZE) || 1;
            document.getElementById('totalInfo').innerText = `总数据: ${allData.length} | 当前列表: ${filteredData.length}`;
            document.getElementById('pageInfo').innerText = `页码: ${currentPage} / ${totalPages}`;

            tbody.innerHTML = pageItems.map((item, idx) => {
                const globIdx = start + idx;
                const displayIdx = globIdx + 1;
                const asinUrl = item.link || `https://www.amazon.com/dp/${item.asin}`;
                const tdInp = (field, val) => {
                    const cls = (!val) ? "edit missing-data" : "edit";
                    return `<td><input type="text" class="${cls}" value="${val}" oninput="upd(${globIdx}, '${field}', this)"></td>`;
                };
                return `<tr>
                    <td style="text-align:center; padding-top:15px; color:#666;">${displayIdx}</td>
                    <td>${item.img ? `<img src="${item.img}" class="thumb" onmouseenter="showPreview('${item.img}')" onmouseleave="hidePreview()">` : ''}</td>
                    <td style="padding:5px;"><a href="${asinUrl}" target="_blank" style="color:#007185; text-decoration:none; font-weight:bold; font-size:12px; display:block; padding:5px;">${item.asin}</a></td>
                    ${tdInp('category', item.category)}
                    <td><textarea class="edit-area ${!item.fabric?'missing-data':''}" oninput="upd(${globIdx}, 'fabric', this)">${item.fabric}</textarea></td>
                    ${tdInp('fit', item.fit)}
                    ${tdInp('collar', item.collar)}
                    ${tdInp('sleeve', item.sleeve)}
                    ${tdInp('elements', item.elements)}
                    <td><div class="title-cell"><div class="en-title">${item.title}</div><div class="cn-title">${item.title_cn || "(无中文标题)"}</div></div></td>
                </tr>`;
            }).join('');
        }

        function upd(idx, field, el) {
            filteredData[idx][field] = el.value;
            if(el.value.trim()) el.classList.remove('missing-data'); else el.classList.add('missing-data');
        }

        const overlay = document.getElementById('preview-overlay');
        const pImg = document.getElementById('preview-img');
        function showPreview(url) { pImg.src = url; overlay.style.display = 'block'; }
        function hidePreview() { overlay.style.display = 'none'; }

        async function startAIFill() {
            const key = document.getElementById('apiKey').value.trim();
            if(!key) { alert("⛔ 请输入阿里云 API Key"); document.getElementById('apiKey').focus(); return; }

            const targets = filteredData.filter(item => !item.fit || !item.collar || !item.sleeve || !item.elements || !item.fabric);
            if(targets.length === 0) return alert("没有缺漏数据！");

            document.getElementById('ai-status-bar').style.display = 'flex';

            const BATCH_SIZE = 3; let completed = 0;
            const prog = document.getElementById('ai-prog');
            const txt = document.getElementById('ai-count');

            for(let i=0; i<targets.length; i+=BATCH_SIZE) {
                const batch = targets.slice(i, i+BATCH_SIZE);
                await Promise.all(batch.map(async (item) => {
                    try {
                        const res = await callLocalProxy(key, item.img, item.title);
                        if(res) {
                            if(!item.fit) item.fit = res.fit;
                            if(!item.collar) item.collar = res.collar;
                            if(!item.sleeve) item.sleeve = res.sleeve;
                            if(!item.elements) item.elements = res.elements;
                            if(!item.fabric && res.fabric) item.fabric = res.fabric;
                        }
                    } catch(e) { console.error(e); }
                    completed++;
                    prog.style.width = `${(completed/targets.length)*100}%`;
                    txt.innerText = `${completed}/${targets.length}`;
                }));
                renderTable();
            }
            alert("✅ 识别完成！");
            document.getElementById('ai-status-bar').style.display = 'none';
        }

        async function callLocalProxy(apiKey, imgUrl, title) {
            const url = "http://127.0.0.1:5000/analyze";
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey: apiKey, imgUrl: imgUrl, title: title })
                });
                if(!response.ok) throw new Error("Local Server Error");
                const json = await response.json();
                if(json.success && json.data) {
                    return JSON.parse(json.data);
                }
            } catch(e) {
                console.warn("API Fail. Is server.py running?", e);
            }
            return null;
        }

        function urlToBase64(url) {
            return new Promise(resolve => {
                const img = new Image(); img.crossOrigin = "Anonymous"; img.src = url;
                const timer = setTimeout(() => resolve(null), 5000);
                img.onload = () => { clearTimeout(timer); const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img,0,0); resolve(c.toDataURL('image/jpeg', 0.6)); };
                img.onerror = () => { clearTimeout(timer); resolve(null); };
            });
        }

        async function exportImagesZip() {
            if(filteredData.length === 0) return alert("无数据");
            const zip = new JSZip();
            const mask = document.getElementById('export-mask');
            const bar = document.getElementById('exp-bar');
            const txt = document.getElementById('exp-status');
            mask.style.display = 'flex';

            const tasks = [];
            for(let i=0; i<filteredData.length; i++) {
                if(filteredData[i].img) {
                    const fileName = `${i+1}.jpg`;
                    tasks.push({ url: filteredData[i].img, name: fileName });
                }
            }
            if(tasks.length === 0) { mask.style.display = 'none'; return alert("无图片"); }

            txt.innerText = `打包图片...`;
            const BATCH = 5; let count = 0;
            for(let i=0; i<tasks.length; i+=BATCH) {
                const batch = tasks.slice(i, i+BATCH);
                await Promise.all(batch.map(async (t) => {
                    try { const res = await fetch(t.url); if(res.ok) { const blob = await res.blob(); zip.file(t.name, blob); } } catch(e){}
                    count++;
                }));
                bar.style.width = `${Math.round((count/tasks.length)*100)}%`;
            }
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, "amazon_images.zip");
            mask.style.display = 'none';
        }

        async function exportData() {
            if(filteredData.length === 0) return alert("无数据");
            const mask = document.getElementById('export-mask');
            const bar = document.getElementById('exp-bar');
            const txt = document.getElementById('exp-status');
            mask.style.display = 'flex';
            txt.innerText = "初始化 Excel..."; bar.style.width = "0%";

            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet('选品分析');

            const headerRow = ['图片', 'ASIN', '品类', '材质', '版型', '领型', '袖型', '元素', '中文标题', '英文标题'];
            const rawKeys = [];
            if(filteredData.length > 0 && filteredData[0]._raw) {
                Object.keys(filteredData[0]._raw).forEach(k => {
                    if(!['商品主图','Main Image URL','ASIN','asin','标题(翻译)','中文标题'].includes(k)) {
                        rawKeys.push(k);
                        headerRow.push(`[原]${k}`);
                    }
                });
            }
            const hRow = ws.addRow(headerRow);
            hRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            hRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF232F3E' } };

            const imgTasks = [];
            for(let i=0; i<filteredData.length; i++){
                const item = filteredData[i];
                const rowValues = [ '', item.asin, item.category, item.fabric, item.fit, item.collar, item.sleeve, item.elements, item.title_cn, item.title ];
                rawKeys.forEach(k => rowValues.push(item._raw[k]));
                const r = ws.addRow(rowValues);
                r.height = 70;
                r.getCell(4).alignment = { wrapText: true, vertical: 'top' };
                r.getCell(9).alignment = { wrapText: true, vertical: 'top' };
                r.getCell(10).alignment = { wrapText: true, vertical: 'top' };
                if(item.img) imgTasks.push({ url:item.img, idx: r.number });
            }

            txt.innerText = `下载图片...`;
            const BATCH = 5;
            for(let i=0; i<imgTasks.length; i+=BATCH) {
                const batch = imgTasks.slice(i, i+BATCH);
                await Promise.all(batch.map(async t => {
                    try { const b64 = await urlToBase64(t.url); if(b64) { const imgId = wb.addImage({ base64:b64, extension:'jpeg' }); ws.addImage(imgId, { tl: { col: 0, row: t.idx-1 }, br: { col: 1, row: t.idx }, editAs: 'oneCell' }); } } catch(e){}
                }));
                bar.style.width = `${Math.min(100, Math.round(((i+BATCH)/imgTasks.length)*100))}%`;
            }

            txt.innerText = "生成文件...";
            const buffer = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Amazon_Analysis_${Date.now()}.xlsx`);
            mask.style.display = 'none';
        }
    </script>
</body>
</html>
