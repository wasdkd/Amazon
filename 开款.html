            fetch(csvUrl, {
                headers: {
                    'Authorization': `token ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('无法获取产品数据');
                }
                return response.json();
            })
            .then(data => {
                const csvContent = decodeBase64(data.content);
                const products = parseCSV(csvContent);

                const product = products.find(p => p.id == productId);
                if (!product) {
                    throw new Error('未找到要编辑的产品');
                }

                document.getElementById('editProductId').value = product.id;
                document.getElementById('editDeveloper').value = product.developer || '';
                document.getElementById('editDevDate').value = product.devDate || '';
                document.getElementById('editMaterial').value = product.material || '';
                document.getElementById('editCategory').value = product.category || '';
                document.getElementById('editQuarter').value = product.quarter || '';
                document.getElementById('editCycle').value = product.cycle || '';

                editImagePreview.classList.add('hidden');

                const currentImage = document.getElementById('editCurrentImage');
                if (product.imageUrl) {
                    let imageUrl = '';
                    if (product.imageUrl.startsWith('http')) {
                        imageUrl = product.imageUrl;
                    } else {
                        imageUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/${GITHUB_BRANCH}/${product.imageUrl}`;
                    }
                    currentImage.src = imageUrl;
                    currentImage.classList.remove('hidden');
                } else {
                    currentImage.classList.add('hidden');
                }
            })
            .catch(error => {
                showNotification('加载产品数据失败: ' + error.message, 'error');
                console.error('加载产品数据错误:', error);
            });
        }

        // 图片预览
        const imageUploadArea = document.getElementById('imageUploadArea');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');

        imageUploadArea.addEventListener('click', function() {
            document.getElementById('productImage').click();
        });

        productImageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    uploadPlaceholder.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 拖拽上传
        imageUploadArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            imageUploadArea.classList.add('drag-over');
        });

        imageUploadArea.addEventListener('dragleave', function() {
            imageUploadArea.classList.remove('drag-over');
        });

        imageUploadArea.addEventListener('drop', function(e) {
            e.preventDefault();
            imageUploadArea.classList.remove('drag-over');

            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageFile(file, productImageInput, imagePreview, uploadPlaceholder);
            } else {
                showNotification('请拖拽有效的图片文件', 'error');
            }
        });

        // 拖拽上传到编辑区域
        const editImageUploadContainer = document.getElementById('editProductImage').parentElement;
        const editImageUploadArea = document.getElementById('editImageUploadArea');

        // 点击编辑虚线框可自动弹出文件选择器
        editImageUploadArea.addEventListener('click', function() {
            document.getElementById('editProductImage').click();
        });

        editImageUploadContainer.addEventListener('dragover', function(e) {
            e.preventDefault();
            editImageUploadContainer.classList.add('drag-over');
        });

        editImageUploadContainer.addEventListener('dragleave', function() {
            editImageUploadContainer.classList.remove('drag-over');
        });

        editImageUploadContainer.addEventListener('drop', function(e) {
            e.preventDefault();
            editImageUploadContainer.classList.remove('drag-over');

            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageFile(file, editProductImageInput, editImagePreview);
            } else {
                showNotification('请拖拽有效的图片文件', 'error');
            }
        });

        // 处理图片文件的通用函数
        function handleImageFile(file, inputElement, previewElement, placeholderElement) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewElement.src = e.target.result;
                    previewElement.classList.remove('hidden');
                    if (placeholderElement) {
                        placeholderElement.classList.add('hidden');
                    }
                };
                reader.readAsDataURL(file);

                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                inputElement.files = dataTransfer.files;
            }
        }

        // 编辑图片预览
        editProductImageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    editImagePreview.src = e.target.result;
                    editImagePreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // 取消编辑按钮事件
        cancelEditButton.addEventListener('click', () => {
            editSection.classList.remove('show');
            editForm.reset();
            editImagePreview.classList.add('hidden');
            document.getElementById('editCurrentImage').classList.add('hidden');
            uploadSection.classList.remove('hidden');

            const uploadContent = uploadSection.querySelector('form');
            if (uploadContent) {
                uploadContent.style.display = 'block';
            }
            toggleUploadSection.textContent = '隐藏';

            if (window.editReturnPosition !== undefined) {
                setTimeout(() => {
                    window.scrollTo({
                        top: window.editReturnPosition,
                        behavior: 'smooth'
                    });
                }, 100);
            }
        });

        // 编辑表单提交事件（优化：本地同步更新机制，解决白屏闪烁与页码复位）
        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = localStorage.getItem('githubToken');
            if (!token) {
                showNotification('请先进行认证', 'error');
                return;
            }

            const progressContainer = document.getElementById('editProgress');
            const progressFill = document.getElementById('editProgressFill');
            const progressText = document.getElementById('editProgressText');
            progressContainer.classList.remove('hidden');
            progressFill.style.width = '10%';
            progressText.textContent = '准备更新数据...';

            try {
                const productId = document.getElementById('editProductId').value;
                const developer = document.getElementById('editDeveloper').value;
                const devDate = document.getElementById('editDevDate').value;
                const material = document.getElementById('editMaterial').value;
                const category = document.getElementById('editCategory').value;
                const quarter = document.getElementById('editQuarter').value;
                const cycle = document.getElementById('editCycle').value;
                const imageFile = editProductImageInput.files[0];

                const csvFileName = 'products.csv';
                const csvUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}/${csvFileName}`;

                progressFill.style.width = '20%';
                progressText.textContent = '正在获取产品数据...';

                // 1. 获取现有CSV数据表
                const response = await fetch(csvUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!response.ok) throw new Error('无法获取产品数据表');
                const data = await response.json();

                progressFill.style.width = '30%';
                progressText.textContent = '处理产品数据并解析图片...';

                const csvContent = decodeBase64(data.content);
                const lines = csvContent.trim().split('\n');
                if (lines.length < 2) throw new Error('没有足够的数据可以编辑');

                const headers = lines[0];
                let oldImagePath = '';
                let productFound = false;

                // 2. 如果上传了新图片文件，优先执行新图片的上传获取相对链接
                let newImageUrl = '';
                if (imageFile) {
                    progressFill.style.width = '40%';
                    progressText.textContent = '正在转换新图片...';

                    const imageData = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(imageFile);
                    });

                    progressFill.style.width = '50%';
                    progressText.textContent = '正在上传新图片到 GitHub...';

                    const timestamp = new Date().getTime();
                    const imageFileName = `image_${timestamp}.${imageFile.name.split('.').pop()}`;
                    newImageUrl = `uploads/img/${imageFileName}`;

                    await uploadFileToGitHub(
                        token,
                        `img/${imageFileName}`,
                        imageData,
                        'base64',
                        `更新产品图片: ${imageFileName}`
                    );
                }

                // 3. 构建新的 CSV 数据行数组，避免回滚或数据缺失
                const updatedLines = [headers];
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;

                    const values = parseCSVLine(lines[i]);

                    if (values[0] == productId) {
                        productFound = true;
                        oldImagePath = values[7]; // 捕获原图路径，以便之后根据需要进行清理

                        // 如果有新图使用新图链接，否则保留旧图链接
                        const finalImageUrl = imageFile ? newImageUrl : oldImagePath;

                        const updatedProduct = {
                            id: values[0],
                            developer: developer,
                            devDate: devDate,
                            material: material,
                            category: category,
                            quarter: quarter,
                            cycle: cycle,
                            imageUrl: finalImageUrl
                        };
                        updatedLines.push(productToCSVRow(updatedProduct).trim());
                    } else {
                        updatedLines.push(lines[i]);
                    }
                }

                if (!productFound) throw new Error('未找到需要编辑的产品行');

                // 4. 将全新的完整CSV提交更新至 GitHub
                progressFill.style.width = '70%';
                progressText.textContent = '正在更新数据表...';
                const updatedCSV = updatedLines.join('\n') + '\n';
                await updateCSVFile(token, csvFileName, updatedCSV, data.sha);

                // 5. 如果成功更换了图片，且原图是储存在GitHub的本地图片（非http网络地址），则执行物理删除原图
                if (imageFile && oldImagePath && !oldImagePath.startsWith('http')) {
                    progressFill.style.width = '85%';
                    progressText.textContent = '正在从仓库删除旧的本地图片...';
                    try {
                        await deleteFileFromGitHub(token, oldImagePath);
                    } catch (delError) {
                        console.warn(`无法从GitHub仓库删除旧图片: ${oldImagePath}`, delError);
                    }
                }

                // 6. 本地内存无缝状态同步更新（核心逻辑，替换 loadProductData，消除闪白及第一页跳顶）
                const finalImageUrl = imageFile ? newImageUrl : oldImagePath;
                const updatedLocalProduct = {
                    id: productId,
                    developer: developer,
                    devDate: devDate,
                    material: material,
                    category: category,
                    quarter: quarter,
                    cycle: cycle,
                    imageUrl: finalImageUrl
                };

                if (window.allProducts) {
                    window.allProducts = window.allProducts.map(p => p.id == productId ? updatedLocalProduct : p);
                }
                filteredProducts = filteredProducts.map(p => p.id == productId ? updatedLocalProduct : p);

                // 7. 直接在当前页刷新重绘，此时页码完全不变，也不闪屏
                renderProductsPage();

                // 8. 恢复并恢复界面状态
                progressFill.style.width = '100%';
                progressText.textContent = '更新完成!';
                showNotification('产品信息更新成功', 'success');

                editForm.reset();
                editSection.classList.remove('show');
                uploadSection.classList.remove('hidden');

                // 9. 平滑返回到编辑之前的产品位置，实现零感回弹
                if (window.editReturnPosition !== undefined) {
                    setTimeout(() => {
                        window.scrollTo({
                            top: window.editReturnPosition,
                            behavior: 'smooth'
                        });
                    }, 100);
                }

                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                }, 1000);

            } catch (error) {
                progressFill.style.width = '0%';
                progressText.textContent = '更新失败';
                showNotification('更新失败: ' + error.message, 'error');
                console.error('编辑产品失败详情:', error);
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                }, 2000);
            }
        });

        // 更新CSV文件的辅助函数
        function updateCSVFile(token, fileName, content, sha) {
            return uploadFileToGitHub(
                token,
                fileName,
                encodeBase64(content),
                'base64',
                '更新产品信息',
                sha
            )
            .catch(error => {
                if (error.message && error.message.includes('does not match')) {
                    showNotification('检测到文件冲突，正在重新尝试...', 'error');
                    return new Promise((resolve, reject) => {
                        setTimeout(() => {
                            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}/${fileName}`;
                            fetch(url, {
                                method: 'GET',
                                headers: {
                                    'Authorization': `token ${token}`
                                }
                            })
                            .then(response => {
                                if (response.ok) {
                                    return response.json();
                                }
                                throw new Error('无法重新获取文件');
                            })
                            .then(data => {
                                return uploadFileToGitHub(
                                    token,
                                    fileName,
                                    encodeBase64(content),
                                    'base64',
                                    '更新产品信息',
                                    data.sha
                                );
                            })
                            .then(resolve)
                            .catch(reject);
                        }, 1000);
                    });
                }
                throw error;
            });
        }

        // 刷新按钮点击事件
        refreshButton.addEventListener('click', loadProductData);

        // 应用筛选按钮事件
        applyFilterButton.addEventListener('click', applyFilters);

        // 重置筛选按钮事件
        resetFilterButton.addEventListener('click', resetFilters);

        // 切换区域显示/隐藏
        toggleAuthSection.addEventListener('click', () => {
            const authFormGroup = authSection.querySelector('.form-group');
            if (authFormGroup) {
                const isHidden = authFormGroup.style.display === 'none';
                authFormGroup.style.display = isHidden ? 'block' : 'none';
                toggleAuthSection.textContent = isHidden ? '隐  藏' : '显  示';
            }
        });

        toggleUploadSection.addEventListener('click', () => {
            const uploadContent = uploadSection.querySelector('form');
            if (uploadContent) {
                const isHidden = uploadContent.style.display === 'none';
                uploadContent.style.display = isHidden ? 'block' : 'none';
                toggleUploadSection.textContent = isHidden ? '隐  藏' : '显  示';
            }
        });

        toggleEditSection.addEventListener('click', () => {
            const isHidden = !editSection.classList.contains('show');
            if (isHidden) {
                editSection.classList.add('show');
                toggleEditSection.textContent = '隐  藏';
            } else {
                editSection.classList.remove('show');
                toggleEditSection.textContent = '显  示';
            }
        });

        toggleGallerySection.addEventListener('click', () => {
            const galleryContent = gallerySection.querySelector('.filter-section');
            const productList = gallerySection.querySelector('.gallery');
            const pagination = gallerySection.querySelector('.pagination');

            if (galleryContent && productList && pagination) {
                const isHidden = galleryContent.style.display === 'none';
                galleryContent.style.display = isHidden ? 'block' : 'none';
                productList.style.display = isHidden ? 'grid' : 'none';
                pagination.style.display = isHidden ? 'flex' : 'none';
                toggleGallerySection.textContent = isHidden ? '隐  藏' : '显  示';
            }
        });

        // 显示通知
        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = `notification ${type}`;

            setTimeout(() => {
                notification.className = 'notification';
            }, 3000);
        }
    </script>
</body>
