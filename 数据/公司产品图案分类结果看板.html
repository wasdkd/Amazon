  function renderGrid() {
    const list = getFiltered();
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    const slice = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    document.getElementById('qGrid').innerHTML = slice.map((r, i) => {
      const idx = (page - 1) * PAGE_SIZE + i;
      const type = r[5] || '未分类';
      const col = grpColorMap[r[5]] || '#9aa0a6';
      return '<div class="card" onclick="zoomItem(' + idx + ')">' +
        '<div class="imgwrap"><img loading="lazy" src="' + r[2] + '" onerror="this.src=\'\';this.alt=\'无图\';"></div>' +
        '<div class="badge" style="background:' + col + '">' + type + '</div>' +
        '<div class="meta" title="' + r[3] + '">' + (r[3] || '-') + '</div>' +
        '<div class="meta" style="color:#2f5496;font-weight:600;">' + (r[4] || '-') + '</div>' +
        '<div class="meta cat">' + r[1] + ' · ' + r[6] + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('qCur').textContent = page;
    document.getElementById('qTotal').textContent = totalPages;
    document.getElementById('qFiltered').textContent = list.length;
  }

  window.zoomItem = function(idx) {
    const list = getFiltered();
    const r = list[idx];
    if(!r) return;
    document.getElementById('qLbImg').src = r[2];
    document.getElementById('qLbInfo').innerHTML =
      '<div><b style="font-size:16px;color:' + (grpColorMap[r[5]]||'#9aa0a6') + '">' + (r[5]||'未分类') + '</b></div>' +
      '<hr style="border:none;border-top:1px solid #555;margin:8px 0;">' +
      '<div><b>父ASIN:</b> ' + r[0] + '</div>' +
      '<div><b>ASIN:</b> ' + r[1] + '</div>' +
      '<div><b>原始颜色:</b> ' + r[3] + '</div>' +
      '<div><b>规范颜色:</b> ' + r[4] + '</div>' +
      '<div><b>品类:</b> ' + r[6] + '</div>' +
      '<div><b>2510-2610额:</b> ' + r[7] + '</div>' +
      '<div><b>2409-2509额:</b> ' + r[8] + '</div>';
    document.getElementById('qLightbox').classList.add('on');
  };

  document.getElementById('qGroupList').onclick = (e) => {
    const item = e.target.closest('.g-item');
    if (!item) return;
    curFilter = item.dataset.g;
    page = 1;
    renderSidebar();
    renderGrid();
  };
  document.getElementById('qSearch').oninput = (e) => { searchStr = e.target.value.trim(); page = 1; renderGrid(); };
  document.getElementById('qPrev').onclick = () => { if (page > 1) { page--; renderGrid(); } };
  document.getElementById('qNext').onclick = () => { page++; renderGrid(); };
  document.getElementById('qLightbox').onclick = () => document.getElementById('qLightbox').classList.remove('on');

  renderSidebar();
  renderGrid();
</script>
</body>
</html>
