        if (filteredData.length > 0) {
            // 按结束时间点的值降序排序
            filteredData.sort((a, b) => {
                const aValue = a.values[endIndex] || 0;
                const bValue = b.values[endIndex] || 0;
                return bValue - aValue;  // 降序排序
            });
        }

        // 取前20个关键词（基于当前结束时间点排序）
        const top20Data = filteredData.slice(0, 20);

        // 构建新的图表选项
        const COLOR_LIST = [
            "#00FF00", "#FF0000", "#FFFF00", "#0000FF", "#FF00FF", "#00FFFF", "#FFA500",
            "#7CB342", "#E53935", "#FDD835", "#5C6BC0", "#AB47BC", "#26A69A", "#FF7043",
            "#8D6E63", "#42A5F5", "#66BB6A", "#D4E157", "#EC407A", "#78909C"
        ];

        // 截取数据从开始时间点到结束时间点
        const slicedXAxisData = xAxisData.slice(startIndex, endIndex + 1);
        const slicedSeries = top20Data.map((item, index) => {
            return {
                name: item.name,
                type: 'line',
                data: item.values.slice(startIndex, endIndex + 1),
                smooth: true,
                label: { show: false },
                lineStyle: { width: 2 },
                symbolSize: 4,
                itemStyle: {
                    borderWidth: 0,
                    opacity: 1,
                    color: COLOR_LIST[index % COLOR_LIST.length]
                },
                symbol: 'circle'
            };
        });

        const legendData = top20Data.map(item => item.name);

        // 更新图表
        const option = {
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: slicedXAxisData,
                axisLabel: {
                    rotate: 45,
                    fontSize: 13,
                    color: "#000000"
                },
                axisLine: {
                    lineStyle: {
                        color: "#000000"
                    }
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: "#CCCCCC",
                        width: 1,
                        type: "dashed"
                    }
                }
            },
            yAxis: {
                name: "搜索量",
                nameTextStyle: {
                    fontSize: 14,
                    color: "#000000"
                },
                axisLabel: {
                    formatter: function(value) {
                        if (value >= 10000) {
                            return (value / 10000).toFixed(1) + '万';
                        } else if (value >= 1000) {
                            return (value / 1000).toFixed(1) + '千';
                        } else {
                            return value;
                        }
                    },
                    color: "#000000"
                },
                axisLine: {
                    lineStyle: {
                        color: "#000000"
                    }
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: "#CCCCCC",
                        width: 1,
                        type: "dashed"
                    }
                }
            },
            series: slicedSeries,
            legend: {
                data: legendData,
                left: "6%",
                top: "3%",
                orient: "vertical",
                itemWidth: 10,
                itemHeight: 15,
                itemGap: 2,
                textStyle: {
                    fontSize: 20,
                    color: "#000000"
                }
            },
            title: {
                text: subcategoryName + (keyword ? ' (关键词"' + keyword + '"的搜索结果)' : ''),
                left: "50%",
                textStyle: {
                    fontSize: 25,
                    color: "#000000"
                }
            },
            tooltip: {
                trigger: "axis",
                axisPointer: {
                    type: "cross"
                },
                backgroundColor: 'rgba(255, 255, 255, 0.8)',
                borderColor: '#000000',
                borderWidth: 1,
                textStyle: {
                    color: '#000000',
                    fontSize: 14
                },
                confine: true,
                alwaysShowContent: false,
                enterable: false,
                extraCssText: 'box-shadow: 0 0 3px rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); max-width: 400px; word-wrap: break-word;',
                order: "valueDesc"
            },
            grid: {
                left: "5%",
                right: "2.5%",
                top: "10%",
                bottom: "10%"
            }
        };

        chart.setOption(option, true);
        chartIndex++;
    });
}

                            </script>
                        </body>
</div></html>
