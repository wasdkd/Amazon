<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 🌟 锁定 1400px 电脑级大屏基准视口，手机端自动等比微缩，开启双指自由缩放 -->
  <meta name="viewport" id="viewportMeta" content="width=1400, user-scalable=yes">
  <script>
    function adaptMobileViewport() {
      var sw = window.screen.width;
      var iw = window.innerWidth;
      var w = (iw && iw < 1400) ? iw : ((sw && sw < 1400) ? sw : 1400);
      if (w < 1400) {
        var scale = w / 1400;
        var meta = document.getElementById('viewportMeta');
        if (meta) {
          meta.content = 'width=1400, initial-scale=' + scale + ', minimum-scale=' + (scale * 0.4) + ', maximum-scale=3.5, user-scalable=yes';
        }
      }
    }
    adaptMobileViewport();
    window.addEventListener('resize', adaptMobileViewport);
    window.addEventListener('orientationchange', adaptMobileViewport);
  </script>

  <title>InfiniteFlow Master · 15套无缝多向流转展映系统 (已修复不动Bug)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <style id="dynamicAnimationStyles">
    /* 核心无缝滚动关键帧 (采用强制 translate3d 硬件加速) */
    @keyframes moveLeft {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    @keyframes moveRight {
      0% { transform: translate3d(-50%, 0, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes moveUp {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(0, -50%, 0); }
    }
    @keyframes moveDown {
      0% { transform: translate3d(0, -50%, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes waveFloating {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    @keyframes pulseScale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 运动类名赋予独立动画并锁定 infinite */
    .anim-left { animation: moveLeft 32s linear infinite !important; }
    .anim-right { animation: moveRight 32s linear infinite !important; }
    .anim-up { animation: moveUp 36s linear infinite !important; }
    .anim-down { animation: moveDown 36s linear infinite !important; }

    /* 只有在按下暂停按钮时才冻结 */
    body.is-paused .anim-left,
    body.is-paused .anim-right,
    body.is-paused .anim-up,
    body.is-paused .anim-down,
    body.is-paused .wave-anim {
      animation-play-state: paused !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-width: 1400px;
      width: 100%;
      margin: 0 auto;
      touch-action: auto !important;
    }
    .font-mono-num { font-family: 'Space Grotesk', monospace; }

    /* 3D 空间立体视差姿态 */
    .diagonal-perspective {
      transform: perspective(1400px) rotateX(16deg) rotateY(-8deg) rotateZ(-6deg) scale(1.15);
      transform-origin: center center;
    }
    .accordion-perspective {
      transform: perspective(1400px) rotateX(12deg) scale(1.05);
      transform-origin: center center;
    }
    .v-chevron-perspective {
      transform: perspective(1200px) rotateX(18deg) scale(1.1);
      transform-origin: center center;
    }

    /* 1400x800 固定黄金展台容器 */
    #stageCanvasBox {
      width: 1400px;
      height: 800px;
      position: relative;
      overflow: hidden;
    }

    /* 卡片高级精致阴影 */
    .flow-card {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 18px -2px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    body.is-paused .flow-card:hover {
      border-color: #0284c7;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25);
    }
    .flow-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .card-tag {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      font-size: 9px;
      font-family: monospace;
      color: #475569;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    /* 胶卷打孔效果 */
    .film-sprockets::before, .film-sprockets::after {
      content: '';
      position: absolute;
      left: 0; right: 0; height: 10px;
      background: radial-gradient(circle, #0f172a 40%, transparent 45%);
      background-size: 16px 10px;
      z-index: 20;
    }
    .film-sprockets::before { top: 2px; }
    .film-sprockets::after { bottom: 2px; }
  </style>
</head>

  <script id="engineScript">
    const DEFAULT_PRESET_IMAGES = [
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1434725039720-aaad6dd32dfe?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1600&auto=format&fit=crop&q=85",
      "https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=1600&auto=format&fit=crop&q=85"
    ];

    let PHOTO_LIST = [...DEFAULT_PRESET_IMAGES];
    let currentTemplate = 'stream-col'; // 默认你截图中的纵向瀑布
    let currentRows = 4;
    let currentZoom = 1.0;
    let currentSpeed = 1.0;
    let currentThemeColor = '#fbf9f5';
    let isPaused = false;
    let activeCardImgElem = null;

    function init() {
      document.getElementById('templateSelect').value = currentTemplate;
      applySpeedToCSS(currentSpeed);
      renderTemplate();
      setupImageReplacer();
      lucide.createIcons();
    }

    // =========================================================================
    // 1. 动态注入关键帧动画（彻底规避变量单位失效导致不动的 Bug）
    // =========================================================================
    function changeSpeed(val) {
      currentSpeed = parseFloat(val);
      document.getElementById('speedText').innerText = currentSpeed.toFixed(1) + 'x';
      applySpeedToCSS(currentSpeed);
    }

    function applySpeedToCSS(speed) {
      const durH = (32 / speed).toFixed(2);
      const durV = (36 / speed).toFixed(2);

      const styleEl = document.getElementById('dynamicAnimationStyles');
      styleEl.innerHTML = `
        @keyframes moveLeft { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        @keyframes moveRight { 0% { transform: translate3d(-50%, 0, 0); } 100% { transform: translate3d(0, 0, 0); } }
        @keyframes moveUp { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(0, -50%, 0); } }
        @keyframes moveDown { 0% { transform: translate3d(0, -50%, 0); } 100% { transform: translate3d(0, 0, 0); } }
        @keyframes waveFloating { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
        @keyframes pulseScale { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

        .anim-left { animation: moveLeft ${durH}s linear infinite !important; will-change: transform; }
        .anim-right { animation: moveRight ${durH}s linear infinite !important; will-change: transform; }
        .anim-up { animation: moveUp ${durV}s linear infinite !important; will-change: transform; }
        .anim-down { animation: moveDown ${durV}s linear infinite !important; will-change: transform; }

        body.is-paused .anim-left,
        body.is-paused .anim-right,
        body.is-paused .anim-up,
        body.is-paused .anim-down,
        body.is-paused .wave-anim {
          animation-play-state: paused !important;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; min-width: 1400px; width: 100%; margin: 0 auto; touch-action: auto !important; }
        .font-mono-num { font-family: 'Space Grotesk', monospace; }
        .diagonal-perspective { transform: perspective(1400px) rotateX(16deg) rotateY(-8deg) rotateZ(-6deg) scale(1.15); transform-origin: center center; }
        .accordion-perspective { transform: perspective(1400px) rotateX(12deg) scale(1.05); transform-origin: center center; }
        .v-chevron-perspective { transform: perspective(1200px) rotateX(18deg) scale(1.1); transform-origin: center center; }
        #stageCanvasBox { width: 1400px; height: 800px; position: relative; overflow: hidden; }
        .flow-card { position: relative; overflow: hidden; border-radius: 8px; background: #ffffff; box-shadow: 0 4px 18px -2px rgba(0, 0, 0, 0.08); border: 1px solid rgba(0, 0, 0, 0.06); transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer; }
        body.is-paused .flow-card:hover { border-color: #0284c7; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25); }
        .flow-card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .card-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(4px); padding: 2px 6px; font-size: 9px; font-family: monospace; color: #475569; display: flex; justify-content: space-between; border-top: 1px solid rgba(0,0,0,0.05); }
        .film-sprockets::before, .film-sprockets::after { content: ''; position: absolute; left: 0; right: 0; height: 10px; background: radial-gradient(circle, #0f172a 40%, transparent 45%); background-size: 16px 10px; z-index: 20; }
        .film-sprockets::before { top: 2px; }
        .film-sprockets::after { bottom: 2px; }
      `;
    }

    // =========================================================================
    // 2. 模板渲染系统 (修复高度溢出与位移计算阻断问题)
    // =========================================================================
    function switchTemplate(tpl) {
      currentTemplate = tpl;
      document.getElementById('templateSelect').value = tpl;
      renderTemplate();
      lucide.createIcons();
    }

    function renderTemplate() {
      const mount = document.getElementById('dynamicStageMount');
      mount.innerHTML = '';

      if (PHOTO_LIST.length === 0) {
        mount.innerHTML = `
          <div class="flex flex-col items-center justify-center text-slate-400 space-y-3">
            <i data-lucide="image" class="w-12 h-12 text-slate-300"></i>
            <p class="text-sm font-bold">当前图片池为空</p>
            <p class="text-xs">请点击顶部“批量导入照片”或“恢复预设”</p>
            <button onclick="restorePresetImages()" class="px-4 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-bold shadow">恢复18张预设大图</button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      switch(currentTemplate) {
        // --- 01. 多行交错对流 ---
        case 'marquee-row': {
          mount.className = "w-full h-full flex flex-col justify-between py-3 overflow-hidden relative";
          const rowHeightPct = (100 / currentRows) - 1.5;
          for (let r = 0; r < currentRows; r++) {

            const rowSubset = getShiftedPhotoList(r * 3);

            track.innerHTML = doubleList.map((src, i) => `
              <div class="flow-card h-full aspect-[16/10] shrink-0" onclick="handleCardClick(this)">

          }

        // --- 02. 多列纵向瀑布 (解决你截图卡住的核心关键) ---

          mount.className = "w-full h-full flex justify-between px-6 overflow-hidden relative";

    function getShiftedPhotoList(shift) {
      if (PHOTO_LIST.length === 0) return [];
      const s = shift % PHOTO_LIST.length;
      return PHOTO_LIST.slice(s).concat(PHOTO_LIST.slice(0, s));
    }

    // =========================================================================
    // 3. 交互与控制
    // =========================================================================
    function changeZoom(val) {
      currentZoom = parseInt(val) / 100;
      document.getElementById('zoomText').innerText = val + '%';
      document.getElementById('zoomWrapper').style.transform = `scale(${currentZoom})`;
    }

    function changeRowCount(val) {
      currentRows = parseInt(val);
      renderTemplate();
    }

    function changeThemeBg(color) {
      currentThemeColor = color;
      document.getElementById('mainBody').style.background = color;
      document.getElementById('stageCanvasBox').style.background = color;
    }

    function togglePauseState() {
      isPaused = !isPaused;
      const body = document.getElementById('mainBody');
      const btnText = document.getElementById('pauseBtnText');
      const btnIcon = document.getElementById('pauseBtnIcon');
      const statusText = document.getElementById('statusInfoText');

      if (isPaused) {
        body.classList.add('is-paused');
        btnText.innerText = "▶ 继续流动";
        btnIcon.setAttribute('data-lucide', 'play');
        document.getElementById('pauseToggleBtn').className = "bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1.5 transition active:scale-95 animate-pulse";
        statusText.innerText = "已暂停！点击画面任意照片即可替换为你的电脑本地图片";
      } else {
        body.classList.remove('is-paused');
        btnText.innerText = "⏸ 暂停换图";
        btnIcon.setAttribute('data-lucide', 'pause');
        document.getElementById('pauseToggleBtn').className = "bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1.5 transition active:scale-95";
        statusText.innerText = "运动进行中！鼠标划过保持转动 · 可随时拖动顶部“流速”滑块加速或减速";
      }
      lucide.createIcons();
    }

    function handleCardClick(cardEl) {
      if (!isPaused) togglePauseState();
      activeCardImgElem = cardEl.querySelector('img');
      document.getElementById('replaceSingleFileInput').click();
    }

    function setupImageReplacer() {
      const input = document.getElementById('replaceSingleFileInput');
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && activeCardImgElem) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            activeCardImgElem.src = evt.target.result;
            PHOTO_LIST.unshift(evt.target.result);
          };
          reader.readAsDataURL(file);
        }
        input.value = '';
      });
    }

    function clearCurrentImages() {
      if (confirm("确定清空目前的图片吗？清空后你可以批量导入属于你自己的照片！")) {
        PHOTO_LIST = [];
        renderTemplate();
      }
    }

    function restorePresetImages() {
      PHOTO_LIST = [...DEFAULT_PRESET_IMAGES];
      renderTemplate();
    }

    function handleBatchUpload(input) {
      const files = Array.from(input.files).filter(f => f.type.startsWith('image/'));
      if (files.length === 0) return;

      const newBase64List = [];
      let loaded = 0;

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          newBase64List.push(e.target.result);
          loaded++;
          if (loaded === files.length) {
            PHOTO_LIST = newBase64List;
            renderTemplate();

<html lang="zh-CN">

      if (w < 1400) {

          meta.content = 'width=1400, initial-scale=' + scale + ', minimum-scale=' + (scale * 0.4) + ', maximum-scale=3.5, user-scalable=yes';

      }
    }

    window.addEventListener('orientationchange', adaptMobileViewport);
