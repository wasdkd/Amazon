<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件下载中心</title>
<!-- 引入 FontAwesome 图标支持操作按钮 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --brand:#6366f1;
    --brand-2:#8b5cf6;
    --text:#101828;
    --muted:#667085;
    --faint:#98a2b3;
    --line:rgba(99,102,241,.14);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background-color:#f6f8ff;
    background-image:
      radial-gradient(900px 420px at 12% -8%, #e0e7ff 0%, transparent 62%),
      radial-gradient(760px 380px at 88% -4%, #ede9fe 0%, transparent 58%);
    background-repeat:no-repeat;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 顶部快捷控制条 ============ */
  .admin-bar {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 0 24px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid rgba(99,102,241,.2);
    background: rgba(255,255,255,.85);
    color: #4338ca;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all .2s;
    text-decoration: none;
    box-shadow: 0 2px 8px -2px rgba(99,102,241,.2);
  }
  .ctrl-btn:hover {
    background: #fff;
    border-color: var(--brand);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px -2px rgba(99,102,241,.3);
  }
  .ctrl-btn.primary {
    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    color: #fff;
    border: none;
  }
  .ctrl-btn.primary:hover {
    filter: brightness(1.08);
  }

  /* ============ 顶部 Hero ============ */
  .hero{
    max-width:1200px;
    margin:0 auto;
    padding:30px 24px 20px;
    text-align:center;
  }

  .pill{
    display:inline-block;
    padding:6px 14px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.4px;
    color:#4338ca;
    background:rgba(99,102,241,.10);
    border:1px solid rgba(99,102,241,.18);
    border-radius:999px;
    margin-bottom:14px;
  }

  .hero h1{
    margin:0 0 12px;
    font-size:clamp(28px, 5vw, 42px);
    font-weight:800;
    letter-spacing:-1px;
    background:linear-gradient(115deg,#4f46e5,#8b5cf6 52%,#06b6d4);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero .sub{
    margin:0;
    font-size:15px;
    color:var(--muted);
  }

  .sync-badge {
    margin-top: 10px;
    display: inline-block;
    font-size: 11.5px;
    padding: 3px 12px;
    border-radius: 999px;
    background: #eef2ff;
    color: #4f46e5;
    border: 1px solid rgba(99,102,241,.2);
  }

  /* 搜索框 */
  .search-wrap{
    position:relative;
    max-width:440px;
    margin:24px auto 0;
  }
  .search-wrap svg{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#a5acbb;
    pointer-events:none;
  }
  #search{
    width:100%;
    padding:13px 18px 13px 46px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--text);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    outline:none;
    box-shadow:0 8px 24px -14px rgba(79,70,229,.55);
    transition:border-color .2s, box-shadow .2s;
  }
  #search::placeholder{ color:#a5acbb; }
  #search:focus{
    border-color:#a5b4fc;
    box-shadow:0 0 0 4px rgba(99,102,241,.12), 0 8px 24px -14px rgba(79,70,229,.55);
  }

  .stat{
    margin:14px 0 0;
    font-size:13px;
    color:var(--faint);
  }
  .stat b{ color:var(--brand); font-size:14px; }

  /* ============ 卡片网格 ============ */
  .grid{
    max-width:1200px;
    margin:0 auto;
    padding:20px 24px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));
    gap:24px;
  }

  .card{
    position: relative;
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid rgba(99,102,241,.10);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -18px rgba(16,24,40,.45);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
    animation:fadeUp .5s ease backwards;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:rgba(99,102,241,.28);
    box-shadow:0 22px 44px -20px rgba(79,70,229,.55);
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:none; }
  }

  /* 图片区 */
  .thumb{
    position:relative;
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:#eef2ff;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .thumb img{ transform:scale(1.07); }

  .badge{
    position:absolute;
    top:12px;
    left:12px;
    padding:4px 10px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.3px;
    color:#4338ca;
    background:rgba(255,255,255,.93);
    backdrop-filter:blur(6px);
    border-radius:999px;
    box-shadow:0 2px 10px rgba(16,24,40,.14);
    pointer-events:none;
  }

  /* 卡片管理按键（编辑/删除） */
  .card-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 10;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .card:hover .card-actions {
    opacity: 1;
  }
  .act-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    border: 1px solid rgba(0,0,0,.08);
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 11px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: all .2s;
  }
  .act-btn:hover {
    color: var(--brand);
    transform: scale(1.1);
  }
  .act-btn.del:hover {
    color: #ef4444;
  }

  /* 内容区 */
  .card-body{
    display:flex;
    flex-direction:column;
    flex:1;
    padding:18px 20px 20px;
  }
  .card-body h3{
    margin:0 0 8px;
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  .card-body .desc{
    margin:0 0 14px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    margin-bottom:16px;
    font-size:12.5px;
    color:var(--faint);
  }

  .btn{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 16px;
    font-size:14px;
    font-weight:600;
    color:#fff;
    text-decoration:none;
    border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    box-shadow:0 10px 20px -12px rgba(99,102,241,1);
    transition:transform .2s, box-shadow .2s, filter .2s;
  }
  .btn:hover{
    filter:brightness(1.07);
    transform:translateY(-1px);
    box-shadow:0 14px 26px -12px rgba(99,102,241,1);
  }
  .btn:active{ transform:translateY(0); }
  .btn svg{ flex:0 0 auto; }

  .empty{
    grid-column:1 / -1;
    padding:70px 0;
    text-align:center;
    font-size:15px;
    color:var(--faint);
  }

  /* ============ 安装说明卡片 ============ */
  .guide{
    grid-column:1 / -1;
    padding:28px 28px 24px;
    background:
      radial-gradient(620px 220px at 100% 0%, #ede9fe 0%, transparent 72%),
      linear-gradient(135deg,#eef2ff,#faf5ff);
    border:1px solid rgba(99,102,241,.18);
    border-radius:20px;
    box-shadow:0 18px 44px -32px rgba(79,70,229,.95);
    animation:fadeUp .5s ease backwards;
  }

  .guide-tag{
    display:inline-block;
    padding:5px 12px;
    font-size:12px;
    font-weight:700;
    color:#6d28d9;
    background:#fff;
    border-radius:999px;
    box-shadow:0 4px 12px -6px rgba(109,40,217,.7);
    margin-bottom:12px;
  }

  .guide h2{
    margin:0 0 8px;
    font-size:20px;
    font-weight:800;
    letter-spacing:-.3px;
  }

  .guide .intro{
    margin:0 0 22px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
  }

  .steps{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(215px, 1fr));
    gap:16px;
  }

  .step{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid rgba(99,102,241,.10);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 22px -18px rgba(79,70,229,.8);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .step:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 34px -22px rgba(79,70,229,.85);
  }

  .step-img{
    position:relative;
    aspect-ratio:16 / 10;
    overflow:hidden;
    background:#eef2ff;
  }
  .step-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .step:hover .step-img img{ transform:scale(1.06); }

  .step-num{
    position:absolute;
    top:10px;
    left:10px;
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border-radius:50%;
    box-shadow:0 4px 12px -3px rgba(99,102,241,.95);
    pointer-events:none;
  }

  .step-body{
    padding:12px 14px 14px;
  }
  .step-body h4{
    margin:0 0 6px;
    font-size:14px;
    font-weight:700;
  }
  .step-body p{
    margin:0;
    font-size:12.5px;
    line-height:1.68;
    color:var(--muted);
  }

  /* ============ 图片放大灯箱 ============ */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px 12px 48px;
    background:rgba(16,24,40,.9);
    backdrop-filter:blur(8px);
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease, visibility .25s ease;
    cursor:zoom-out;
  }
  .lightbox.open{ opacity:1; visibility:visible; }

  .lightbox img{
    max-width:98vw;
    max-height:calc(100vh - 60px);
    max-height:calc(100dvh - 60px);
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:10px;
    background:#fff;
    box-shadow:0 30px 90px -22px rgba(0,0,0,.9);
    transform:scale(.96);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
    cursor:zoom-out;
  }
  .lightbox.open img{ transform:scale(1); }

  .lb-close{
    position:absolute;
    top:18px;
    right:20px;
    z-index:2;
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    font-size:26px;
    line-height:1;
    color:#fff;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    cursor:pointer;
    transition:background .2s, transform .25s;
  }
  .lb-close:hover{ background:rgba(0,0,0,.68); transform:rotate(90deg); }

  .lb-hint{
    position:absolute;
    left:0;
    right:0;
    bottom:14px;
    z-index:2;
    text-align:center;
    font-size:12.5px;
    color:rgba(255,255,255,.62);
    pointer-events:none;
  }

  /* ============ 模态弹窗系统 (与原版风格契合) ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
  }
  .modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .modal-card {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    overflow: hidden;
    border: 1px solid rgba(99,102,241,0.15);
    animation: modalIn .25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes modalIn {
    from { transform: scale(.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
  }
  .modal-header h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .modal-close {
    background: transparent;
    border: none;
    font-size: 20px;
    color: #94a3b8;
    cursor: pointer;
  }
  .modal-close:hover { color: #334155; }
  .modal-body {
    padding: 20px;
    max-height: 75vh;
    overflow-y: auto;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-control {
    width: 100%;
    padding: 9px 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 13.5px;
    outline: none;
    font-family: inherit;
  }
  .form-control:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
  }
  textarea.form-control {
    resize: vertical;
    min-height: 70px;
  }
  .dropzone {
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    background: #f8fafc;
    cursor: pointer;
    transition: all .2s;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--brand);
    background: rgba(99,102,241,0.04);
  }
  .dropzone img {
    max-height: 100px;
    border-radius: 8px;
    margin-top: 8px;
    display: inline-block;
  }
  .modal-footer {
    padding: 12px 20px;
    border-top: 1px solid #f1f5f9;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: #fafafa;
  }

  /* ============ 页脚 ============ */
  footer{
    padding:0 24px 52px;
    text-align:center;
    font-size:12.5px;
    color:var(--faint);
  }

  @media (max-width:480px){
    .admin-bar { justify-content: center; }
    .hero{ padding:24px 18px 20px; }
    .grid{ padding:16px 18px 60px; gap:18px; }
    .guide{ padding:20px 16px 16px; }
    .lightbox{ padding:8px 8px 42px; }
    .lightbox img{
      max-width:100vw;
      max-height:calc(100vh - 56px);
      max-height:calc(100dvh - 56px);
      border-radius:6px;
    }
    .lb-close{ top:10px; right:10px; width:38px; height:38px; font-size:22px; }
    .lb-hint{ bottom:10px; font-size:11.5px; }
  }
</style>
</head>
<body>

<!-- 顶部快捷控制条 -->
<div class="admin-bar">
  <button class="ctrl-btn" onclick="window.location.href='https://wasdkd.github.io/Amazon/AmazonDigitsPlatform'">
    <i class="fa-solid fa-arrow-left"></i> 返回平台
  </button>
  <button class="ctrl-btn primary" onclick="openAddModal()">
    <i class="fa-solid fa-plus-circle"></i> 添加插件
  </button>
  <button class="ctrl-btn" onclick="exportStandaloneHTML()" title="打包当前包含云端数据的独立单文件">
    <i class="fa-solid fa-file-export"></i> 导出网页备份
  </button>
  <button class="ctrl-btn" onclick="openGithubModal()">
    <i class="fa-brands fa-github"></i> GitHub 授权设置
  </button>
</div>

<header class="hero">
  <span class="pill">🔌 插件仓库</span>
  <h1>插件下载中心</h1>
  <p class="sub">精选实用插件，点击按钮即可下载安装包</p>
  <div>
    <span id="sync-status" class="sync-badge">☁️ 正在检查云端更新...</span>
  </div>

  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="搜索插件名称或功能…" autocomplete="off">
  </div>

  <p class="stat">共 <b id="count">0</b> 个插件</p>
</header>

<main class="grid" id="grid"></main>

<footer>© 2026 插件下载中心 · 所有压缩包均已通过安全检测</footer>

<!-- 图片放大灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" type="button" aria-label="关闭">×</button>
  <img id="lbImg" src="" alt="">
  <span class="lb-hint">点击任意处或按 Esc 关闭</span>
</div>

<!-- 添加插件模态框 -->
<div class="modal-overlay" id="add-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i class="fa-solid fa-circle-plus" style="color:var(--brand)"></i> 添加新插件</h3>
      <button class="modal-close" onclick="closeAddModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>插件名称 *</label>
        <input type="text" id="add-name" class="form-control" placeholder="例如：沃尔玛前台商品排序">
      </div>
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>版本号 *</label>
          <input type="text" id="add-ver" class="form-control" placeholder="v1.0" value="v1.0">
        </div>
        <div style="flex:1;">
          <label>包大小</label>
          <input type="text" id="add-size" class="form-control" placeholder="例如：250KB">
        </div>
      </div>
      <div class="form-group">
        <label>说明与功能介绍 *</label>
        <textarea id="add-desc" class="form-control" placeholder="简要阐述插件主要功能及用途"></textarea>
      </div>
      <div class="form-group">
        <label>插件预览图 (截图/封面)</label>
        <div class="dropzone" id="add-dropzone" onclick="document.getElementById('add-file').click()">
          <input type="file" id="add-file" accept="image/*" style="display:none">
          <div id="add-drop-prompt">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size:24px;color:var(--faint)"></i>
            <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">拖拽图片到此，或点击选择本地图片</p>
          </div>
          <img id="add-preview" style="display:none">
        </div>
      </div>
      <div class="form-group">
        <label>安装包文件 (.zip / .rar)</label>
        <input type="file" id="add-pkg-file" accept=".zip,.rar,.7z,.crx" style="display:none">
        <div style="display:flex; gap:6px;">
          <input type="text" id="add-link" class="form-control" placeholder="直接粘贴下载 URL 或点击右侧上传文件">
          <button type="button" class="ctrl-btn" onclick="document.getElementById('add-pkg-file').click()" title="上传安装包至 GitHub">
            <i class="fa-solid fa-upload"></i> 上传
          </button>
        </div>
        <small id="add-pkg-tip" style="color:var(--faint);font-size:11px;margin-top:4px;display:block;">支持输入已有直链，或上传本地压缩包至仓库自动托管</small>
      </div>
    </div>
    <div class="modal-footer">
      <button class="ctrl-btn" onclick="closeAddModal()">取消</button>

function loadConfig() {

// 统一数据读取逻辑（优先通过免密 RAW 读取云端最新库）
async function loadDataFromGithub() {
  const statusEl = document.getElementById('sync-status');
  statusEl.innerText = "☁️ 正在检查 GitHub 云端数据...";

  // 1. 先尝试公开直链读取（游客与用户均可直接加载）
  const rawUrl = `https://raw.githubusercontent.com/${githubConfig.owner}/${githubConfig.repo}/${githubConfig.branch}/${encodeURI(githubConfig.path)}?t=${Date.now()}`;
  try {
    let res = await fetch(rawUrl);
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        plugins = data;
        localStorage.setItem('plugin_hub_local_cache', JSON.stringify(plugins));
        statusEl.innerText = "✅ 已自动同步 GitHub 云端最新插件数据";
        statusEl.style.color = "#10b981";
        updateView();
        return;
      }
    }
  } catch(e) {
    console.warn("Raw 数据直读跳过，尝试 API 或本地缓存");
  }

  // 2. 若存在 Token，则通过官方 API 检查 SHA 与内容
  if (githubConfig.token) {
    const apiUrl = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${encodeURI(githubConfig.path)}`;
    try {
      let res = await fetch(apiUrl, {
        headers: { 'Authorization': `token ${githubConfig.token}` }
      });
      if (res.ok) {
        const fileData = await res.json();
        currentFileSha = fileData.sha;
        const decoded = decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, ''))));
        plugins = JSON.parse(decoded);
        localStorage.setItem('plugin_hub_local_cache', JSON.stringify(plugins));
        statusEl.innerText = "✅ GitHub 已认证并载入数据";
        statusEl.style.color = "#10b981";
        updateView();
        return;
      }
    } catch(e) {}
  }

  // 3. 兜底回退为本地缓存或默认数据
  try {
    const local = localStorage.getItem('plugin_hub_local_cache');
    if (local) {
      plugins = JSON.parse(local);
      statusEl.innerText = "⚡ 已加载本地暂存数据 (可随时提交同步至 GitHub)";
      statusEl.style.color = "#6366f1";
    } else {
      plugins = [...defaultPlugins];
      statusEl.innerText = "ℹ️ 已加载默认初始插件数据";
      statusEl.style.color = "#64748b";
    }
  } catch(e) {
    plugins = [...defaultPlugins];
  }
  updateView();
}

// 检查是否具备 GitHub 写入鉴权
function ensureAuth() {
  if (!githubConfig.token) {
    alert("提示：进行「添加/编辑/删除」操作需要 GitHub 写入权限，请先配置个人访问令牌 (Token)！");
    openGithubModal();
    return false;
  }
  return true;
}

// 文件转换为 Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.readAsDataURL(file);
    r.onload = () => resolve(r.result);
    r.onerror = error => reject(error);
  });
}

// 通用 GitHub 上传文件函数 (图片或压缩包)
async function uploadFileToGithub(file, targetFolder) {
  const ext = file.name.split('.').pop() || 'bin';
  const cleanName = `${Date.now()}_${Math.floor(Math.random()*1000)}.${ext}`;
  const filePath = `${targetFolder}/${cleanName}`;
  const base64Str = await fileToBase64(file);
  const cleanBase64 = base64Str.split(',')[1];

  const apiUrl = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${encodeURI(filePath)}`;
  const res = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${githubConfig.token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: `Upload asset: ${cleanName}`,
      content: cleanBase64,
      branch: githubConfig.branch
    })
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || "上传文件至 GitHub 失败");
  }

  // 返回可直接免密下载的 Raw 链接
  return `https://raw.githubusercontent.com/${githubConfig.owner}/${githubConfig.repo}/${githubConfig.branch}/${encodeURI(filePath)}`;
}

// 将更新后的 plugins 数组同步至 GitHub 数据库
async function syncDatabaseToGithub() {
  const statusEl = document.getElementById('sync-status');
  statusEl.innerText = "⏳ 正在同步写入 GitHub 仓库...";
  statusEl.style.color = "#f59e0b";

  const apiUrl = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${encodeURI(githubConfig.path)}`;

  // 获取最新的 SHA 防冲突
  try {
    const chk = await fetch(apiUrl, {
      headers: { 'Authorization': `token ${githubConfig.token}` }
    });
    if (chk.ok) {
      const data = await chk.json();
      currentFileSha = data.sha;
    } else if (chk.status === 404) {
      currentFileSha = null;
    }
  } catch(e){}

  const jsonContent = JSON.stringify(plugins, null, 2);
  const base64Content = btoa(unescape(encodeURIComponent(jsonContent)));

  const payload = {
    message: "Sync 插件/plugins.json (自动化配置管理)",
    content: base64Content,
    branch: githubConfig.branch
  };
  if (currentFileSha) payload.sha = currentFileSha;

  const res = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${githubConfig.token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || "提交数据库失败");
  }

  const resData = await res.json();
  currentFileSha = resData.content.sha;
  localStorage.setItem('plugin_hub_local_cache', JSON.stringify(plugins));

  statusEl.innerText = "✅ 数据已成功同步更新至 GitHub";
  statusEl.style.color = "#10b981";
}

async function submitNewPlugin() {
  const name = document.getElementById('add-name').value.trim();
  const version = document.getElementById('add-ver').value.trim() || 'v1.0';
  const desc = document.getElementById('add-desc').value.trim();
  let link = document.getElementById('add-link').value.trim();
  let size = document.getElementById('add-size').value.trim() || '未知大小';

  if (!name || !desc) {
    alert("请完整填写插件名称和功能描述！");
    return;
  }
  if (!link && !addPkgFile) {
    alert("请提供插件安装包下载链接，或点击「上传」选择本地压缩包！");
    return;
  }

  const btn = document.getElementById('add-submit-btn');
  btn.disabled = true;
  btn.innerText = "正在安全上传至 GitHub...";

  try {
    // 1. 如果选中了新图片，自动上传至「插件/plugin_imgs」
    let imgUrl = "";
    if (addImgFile) {
      imgUrl = await uploadFileToGithub(addImgFile, "插件/plugin_imgs");
    } else {
      imgUrl = ph(name, "#6366f1", "#8b5cf6");
    }

    // 2. 如果选中了新安装包文件，自动上传至「插件/plugin_files」
    if (addPkgFile) {
      link = await uploadFileToGithub(addPkgFile, "插件/plugin_files");
      if (!size || size === '未知大小') {
        size = (addPkgFile.size / 1024).toFixed(1) + 'KB';
      }
    }

    const today = new Date().toISOString().split('T')[0];
    const newPlugin = { name, version, desc, img: imgUrl, size, date: today, link };

    plugins.unshift(newPlugin);
    await syncDatabaseToGithub();

    closeAddModal();
    updateView();
  } catch (err) {
    alert("添加失败: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "保存至云端";
  }
}

async function submitEditPlugin() {
  if (editingIndex === null) return;

  const name = document.getElementById('edit-name').value.trim();
  const version = document.getElementById('edit-ver').value.trim();
  const desc = document.getElementById('edit-desc').value.trim();
  let link = document.getElementById('edit-link').value.trim();
  let size = document.getElementById('edit-size').value.trim();

  if (!name || !desc) {
    alert("插件名称和功能描述不能为空！");
    return;
  }

  const btn = document.getElementById('edit-submit-btn');
  btn.disabled = true;
  btn.innerText = "正在更新至 GitHub...";

  try {
    let imgUrl = plugins[editingIndex].img;

    // 如果更新了图片
    if (editImgFile) {
      imgUrl = await uploadFileToGithub(editImgFile, "插件/plugin_imgs");
    }

    // 如果上传了新的安装包
    if (editPkgFile) {
      link = await uploadFileToGithub(editPkgFile, "插件/plugin_files");
      if (!size) size = (editPkgFile.size / 1024).toFixed(1) + 'KB';
    }

    plugins[editingIndex] = {
      ...plugins[editingIndex],
      name, version, desc, img: imgUrl, size, link,
      date: new Date().toISOString().split('T')[0]
    };

    await syncDatabaseToGithub();
    closeEditModal();
    updateView();
  } catch(err) {
    alert("修改保存失败: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "更新同步";
  }
}

// 删除逻辑
async function deletePlugin(index, event) {
  if (event) event.stopPropagation();
  if (!ensureAuth()) return;

  const p = plugins[index];
  if (!confirm(`确定要彻底删除插件【${p.name}】吗？`)) return;

  try {
    plugins.splice(index, 1);
    await syncDatabaseToGithub();
    updateView();
  } catch(err) {
    alert("删除失败: " + err.message);
  }
}

/* 拖拽和文件选择绑定辅助 */
function setupDropzone(dropId, fileId, previewId, promptId, onSelected) {
  const dz = document.getElementById(dropId);
  const fi = document.getElementById(fileId);
  fi.addEventListener('change', (e) => {
    if (e.target.files.length) onSelected(e.target.files[0]);
  });
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', (e) => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    if (e.dataTransfer.files.length) onSelected(e.dataTransfer.files[0]);
  });
}

setupDropzone('add-dropzone', 'add-file', 'add-preview', 'add-drop-prompt', (file) => {

    document.getElementById('add-preview').style.display = 'block';
    document.getElementById('add-drop-prompt').style.display = 'none';
  };
  r.readAsDataURL(file);
});

/* =========================================================
   6. 导出单文件备份
   ========================================================= */
function exportStandaloneHTML() {
  const baseHTML = document.documentElement.outerHTML;
  let exported = "<!DOCTYPE html>\n" + baseHTML;

  // 保证导出时模态弹窗处于关闭状态
  exported = exported.replace(/class="modal-overlay open"/g, 'class="modal-overlay"');
  exported = exported.replace(/class="lightbox open"/g, 'class="lightbox"');

  const currentDataStr = JSON.stringify(plugins, null, 2);
  const regex = /\/\*START_DATA\*\/[\s\S]*?\/\*END_DATA\*\//;
  exported = exported.replace(regex, '/*START_DATA*/\nconst defaultPlugins = ' + currentDataStr + ';\n/*END_DATA*/');

  const blob = new Blob([exported], { type: 'text/html;charset=utf-8' });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "插件下载中心_最新备份.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* =========================================================
   7. 渲染与检索过滤
   ========================================================= */
const grid    = document.getElementById('grid');
const input   = document.getElementById('search');
const countEl = document.getElementById('count');

const downloadIcon = `
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
  </svg>`;

function renderGuide(){
  return `
    <section class="guide">
      <span class="guide-tag">${guide.tag}</span>
      <h2>${guide.title}</h2>
      <p class="intro">${guide.intro}</p>
      <div class="steps">
        ${guide.steps.map((s, i) => `
          <div class="step">
            <div class="step-img">
              <img class="zoomable" src="${s.img}" alt="${s.title}" loading="lazy">
              <span class="step-num">${i + 1}</span>
            </div>
            <div class="step-body">
              <h4>${s.title}</h4>
              <p>${s.text}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </section>`;
}

function renderPlugins(list){
  return list.map((p, i) => {
    // 获取元素在原 plugins 数组中的真正索引
    const originalIndex = plugins.indexOf(p);
    return `
    <article class="card" style="animation-delay:${i * 45}ms">
      <!-- 快捷操作按钮 -->
      <div class="card-actions">
        <button class="act-btn" onclick="openEditModal(${originalIndex}, event)" title="编辑修改此插件"><i class="fa-solid fa-pen"></i></button>
        <button class="act-btn del" onclick="deletePlugin(${originalIndex}, event)" title="删除此插件"><i class="fa-solid fa-trash"></i></button>
      </div>
      <div class="thumb">
        <img class="zoomable" src="${p.img || FALLBACK}" alt="${p.name} 预览图" loading="lazy">
        <span class="badge">${p.version || 'v1.0'}</span>
      </div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="meta">
          <span>📦 ${p.size || '未知'}</span>
          <span>🕒 ${p.date || '-'}</span>
        </div>
        <a class="btn" href="${p.link}" download target="_blank">
          ${downloadIcon}
          <span>下载插件</span>
        </a>
      </div>
    </article>
  `}).join('');
}

function render(list, showGuide){
  if(!list.length){
    grid.innerHTML = '<div class="empty">😕 没有找到匹配的插件，换个关键词试试</div>';
    return;
  }
  grid.innerHTML = (showGuide ? renderGuide() : '') + renderPlugins(list);
}

function updateView() {
  const q = input.value.trim().toLowerCase();
  const list = plugins.filter(p =>
    (p.name + ' ' + p.desc + ' ' + (p.version || '')).toLowerCase().includes(q)
  );
  countEl.textContent = list.length;
  render(list, q === '');
}

/* =========================================================
   8. 灯箱大图交互
   ========================================================= */
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');
const lbClose  = document.getElementById('lbClose');

function openLightbox(src, alt){
  lbImg.src = src;
  lbImg.alt = alt || '';
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

grid.addEventListener('click', e => {
  // 点击图片且并非管理操作按钮时唤醒灯箱
  if (e.target.closest('.card-actions')) return;
  const img = e.target.closest('img.zoomable');
  if(img){
    openLightbox(img.src, img.alt);
  }
});

lightbox.addEventListener('click', closeLightbox);
lbClose.addEventListener('click', closeLightbox);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    if (lightbox.classList.contains('open')) closeLightbox();
    closeAddModal();
    closeEditModal();
    closeGithubModal();
  }
});

grid.addEventListener('error', e => {
  const el = e.target;
  if(el.tagName === 'IMG' && !el.dataset.fallback){
    el.dataset.fallback = '1';
    el.src = FALLBACK;
  }
}, true);

input.addEventListener('input', updateView);

/* 初始化启动 */
window.onload = function() {
  loadConfig();
  loadDataFromGithub();
};
</script>
