<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>插件下载中心</title>
<style>
  :root{
    --brand:#6366f1;
    --brand-2:#8b5cf6;
    --text:#101828;
    --muted:#667085;
    --faint:#98a2b3;
    --line:rgba(99,102,241,.14);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background-color:#f6f8ff;
    background-image:
      radial-gradient(900px 420px at 12% -8%, #e0e7ff 0%, transparent 62%),
      radial-gradient(760px 380px at 88% -4%, #ede9fe 0%, transparent 58%);
    background-repeat:no-repeat;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 顶部 ============ */
  .hero{
    max-width:1200px;
    margin:0 auto;
    padding:68px 24px 34px;
    text-align:center;
  }

  .pill{
    display:inline-block;
    padding:6px 14px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.4px;
    color:#4338ca;
    background:rgba(99,102,241,.10);
    border:1px solid rgba(99,102,241,.18);
    border-radius:999px;
    margin-bottom:18px;
  }

  .hero h1{
    margin:0 0 14px;
    font-size:clamp(28px, 5vw, 44px);
    font-weight:800;
    letter-spacing:-1px;
    background:linear-gradient(115deg,#4f46e5,#8b5cf6 52%,#06b6d4);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero .sub{
    margin:0;
    font-size:15px;
    color:var(--muted);
  }

  /* 搜索框 */
  .search-wrap{
    position:relative;
    max-width:440px;
    margin:30px auto 0;
  }
  .search-wrap svg{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#a5acbb;
    pointer-events:none;
  }
  #search{
    width:100%;
    padding:14px 18px 14px 46px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--text);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    outline:none;
    box-shadow:0 8px 24px -14px rgba(79,70,229,.55);
    transition:border-color .2s, box-shadow .2s;
  }
  #search::placeholder{ color:#a5acbb; }
  #search:focus{
    border-color:#a5b4fc;
    box-shadow:0 0 0 4px rgba(99,102,241,.12), 0 8px 24px -14px rgba(79,70,229,.55);
  }

  .stat{
    margin:18px 0 0;
    font-size:13px;
    color:var(--faint);
  }
  .stat b{ color:var(--brand); font-size:14px; }

  /* ============ 卡片网格 ============ */
  .grid{
    max-width:1200px;
    margin:0 auto;
    padding:26px 24px 80px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));
    gap:24px;
  }

  .card{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid rgba(99,102,241,.10);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -18px rgba(16,24,40,.45);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
    animation:fadeUp .5s ease backwards;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:rgba(99,102,241,.28);
    box-shadow:0 22px 44px -20px rgba(79,70,229,.55);
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:none; }
  }

  /* 图片区 */
  .thumb{
    position:relative;
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:#eef2ff;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;               /* 提示可点击放大 */
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .thumb img{ transform:scale(1.07); }

  .badge{
    position:absolute;
    top:12px;
    left:12px;
    padding:4px 10px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.3px;
    color:#4338ca;
    background:rgba(255,255,255,.93);
    backdrop-filter:blur(6px);
    border-radius:999px;
    box-shadow:0 2px 10px rgba(16,24,40,.14);
    pointer-events:none;
  }

  /* 内容区 */
  .card-body{
    display:flex;
    flex-direction:column;
    flex:1;
    padding:18px 20px 20px;
  }
  .card-body h3{
    margin:0 0 8px;
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  .card-body .desc{
    margin:0 0 14px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    margin-bottom:16px;
    font-size:12.5px;
    color:var(--faint);
  }

  .btn{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 16px;
    font-size:14px;
    font-weight:600;
    color:#fff;
    text-decoration:none;
    border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    box-shadow:0 10px 20px -12px rgba(99,102,241,1);
    transition:transform .2s, box-shadow .2s, filter .2s;
  }
  .btn:hover{
    filter:brightness(1.07);
    transform:translateY(-1px);
    box-shadow:0 14px 26px -12px rgba(99,102,241,1);
  }
  .btn:active{ transform:translateY(0); }
  .btn svg{ flex:0 0 auto; }

  .empty{
    grid-column:1 / -1;
    padding:70px 0;
    text-align:center;
    font-size:15px;
    color:var(--faint);
  }

  /* =========================================================
     安装说明卡片（占满整行，放第一个位置）
     ========================================================= */
  .guide{
    grid-column:1 / -1;
    padding:28px 28px 24px;
    background:
      radial-gradient(620px 220px at 100% 0%, #ede9fe 0%, transparent 72%),
      linear-gradient(135deg,#eef2ff,#faf5ff);
    border:1px solid rgba(99,102,241,.18);
    border-radius:20px;
    box-shadow:0 18px 44px -32px rgba(79,70,229,.95);
    animation:fadeUp .5s ease backwards;
  }

  .guide-tag{
    display:inline-block;
    padding:5px 12px;
    font-size:12px;
    font-weight:700;
    color:#6d28d9;
    background:#fff;
    border-radius:999px;
    box-shadow:0 4px 12px -6px rgba(109,40,217,.7);
    margin-bottom:12px;
  }

  .guide h2{
    margin:0 0 8px;
    font-size:20px;
    font-weight:800;
    letter-spacing:-.3px;
  }

  .guide .intro{
    margin:0 0 22px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--muted);
  }

  .steps{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(215px, 1fr));
    gap:16px;
  }

  .step{
    display:flex;
    flex-direction:column;
    background:#fff;
    border:1px solid rgba(99,102,241,.10);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 22px -18px rgba(79,70,229,.8);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .step:hover{
    transform:translateY(-4px);
    box-shadow:0 20px 34px -22px rgba(79,70,229,.85);
  }

  .step-img{
    position:relative;
    aspect-ratio:16 / 10;
    overflow:hidden;
    background:#eef2ff;
  }
  .step-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:zoom-in;
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .step:hover .step-img img{ transform:scale(1.06); }

  .step-num{
    position:absolute;
    top:10px;
    left:10px;
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border-radius:50%;
    box-shadow:0 4px 12px -3px rgba(99,102,241,.95);
    pointer-events:none;
  }

  .step-body{
    padding:12px 14px 14px;
  }
  .step-body h4{
    margin:0 0 6px;
    font-size:14px;
    font-weight:700;
  }
  .step-body p{
    margin:0;
    font-size:12.5px;
    line-height:1.68;
    color:var(--muted);
  }

  /* ============ 图片放大灯箱（大图铺满屏幕） ============ */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px 12px 48px;        /* 底部留出提示文字的位置 */
    background:rgba(16,24,40,.9);
    backdrop-filter:blur(8px);
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease, visibility .25s ease;
    cursor:zoom-out;
  }
  .lightbox.open{ opacity:1; visibility:visible; }

  .lightbox img{
    max-width:98vw;                        /* 几乎占满宽度 */
    max-height:calc(100vh - 60px);         /* 几乎占满高度 */
    max-height:calc(100dvh - 60px);        /* 移动端更准，支持则优先生效 */
    width:auto;
    height:auto;
    object-fit:contain;                    /* 完整显示，不裁切 */
    border-radius:10px;
    background:#fff;
    box-shadow:0 30px 90px -22px rgba(0,0,0,.9);
    transform:scale(.96);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
    cursor:zoom-out;
  }
  .lightbox.open img{ transform:scale(1); }

  .lb-close{
    position:absolute;
    top:18px;
    right:20px;
    z-index:2;                             /* 保证按钮始终在图片上方可点 */
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    font-size:26px;
    line-height:1;
    color:#fff;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    cursor:pointer;
    transition:background .2s, transform .25s;
  }
  .lb-close:hover{ background:rgba(0,0,0,.68); transform:rotate(90deg); }

  .lb-hint{
    position:absolute;
    left:0;
    right:0;
    bottom:14px;
    z-index:2;
    text-align:center;
    font-size:12.5px;
    color:rgba(255,255,255,.62);
    pointer-events:none;
  }

  /* ============ 页脚 ============ */
  footer{
    padding:0 24px 52px;
    text-align:center;
    font-size:12.5px;
    color:var(--faint);
  }

  @media (max-width:480px){
    .hero{ padding:48px 18px 24px; }
    .grid{ padding:20px 18px 60px; gap:18px; }
    .guide{ padding:22px 18px 18px; }
    .lightbox{ padding:8px 8px 42px; }
    .lightbox img{
      max-width:100vw;
      max-height:calc(100vh - 56px);
      max-height:calc(100dvh - 56px);
      border-radius:6px;
    }
    .lb-close{ top:10px; right:10px; width:38px; height:38px; font-size:22px; }
    .lb-hint{ bottom:10px; font-size:11.5px; }
  }
</style>
</head>
<body>

<header class="hero">
  <span class="pill">🔌 插件仓库</span>
  <button class="btn btn-jump" onclick="window.location.href='https://wasdkd.github.io/Amazon/AmazonDigitsPlatform'">
                返回平台
            </button>
  <h1>插件下载中心</h1>
  <p class="sub">精选实用插件，点击按钮即可下载安装包</p>

  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="搜索插件名称或功能…" autocomplete="off">
  </div>

  <p class="stat">共 <b id="count">0</b> 个插件</p>
</header>

<main class="grid" id="grid"></main>

<footer>© 2026 插件下载中心 · 所有压缩包均已通过安全检测</footer>

<!-- 图片放大灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" type="button" aria-label="关闭">×</button>
  <img id="lbImg" src="" alt="">
  <span class="lb-hint">点击任意处或按 Esc 关闭</span>
</div>

<script>
/* =========================================================
   1. 生成占位预览图
   （当真实图片加载失败时自动兜底，也可以直接用它当预览图）
   ========================================================= */
function ph(text, c1, c2){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="${c2}"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#g)"/>
    <circle cx="565" cy="55" r="120" fill="#ffffff" opacity="0.10"/>
    <circle cx="75" cy="325" r="95" fill="#ffffff" opacity="0.08"/>
    <text x="320" y="194" font-family="PingFang SC, Microsoft YaHei, sans-serif"
          font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">${text}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* 图片加载失败时的兜底图 */
const FALLBACK = ph("暂无预览图", "#94a3b8", "#64748b");

/* =========================================================
   2. 安装说明 —— 想改文字 / 换图片，改这里
   ---------------------------------------------------------
   title  步骤标题
   text   步骤说明
   img    配图地址（可以直接写真实图片链接）
   ========================================================= */
const guide = {
  tag: "📖 新手必看",
  title: "安装方法",
  intro: "下载压缩包后，按下面 4 步完成安装，全程大约 1 分钟。点击图片可放大查看。",
  steps: [
    {
      title: "下载压缩包",
      text: "点击插件卡片上的「下载插件」按钮，把 .rar / .zip 压缩包保存到电脑本地。",
      img: ph("① 下载压缩包", "#6366f1", "#8b5cf6")
    },
    {
      title: "解压文件",
      text: "用 WinRAR 或 7-Zip 把压缩包解压到一个固定文件夹，路径建议不要带中文或空格。",
      img: ph("② 解压文件", "#0ea5e9", "#22d3ee")
    },
    {
      title: "打开扩展管理页",
      text: "在浏览器地址栏输入 chrome://extensions/ 并回车（Edge 用 edge://extensions/）。",
      img: ph("③ 打开扩展页", "#f59e0b", "#fbbf24")
    },
    {
      title: "加载已解压的扩展",
      text: "打开右上角「开发者模式」，点「加载已解压的扩展程序」，选中刚解压的文件夹即可。",
      img: encodeURI("https://raw.githubusercontent.com/wasdkd/Amazon/main/SKU_IMG/插件安装教程.png")
    }
  ]
};

/* =========================================================
   3. 插件数据 —— 改这里就行
   ---------------------------------------------------------
   name    插件名称
   version 版本号（显示在图片左上角）
   desc    说明文字
   img     预览图地址（本地路径或网络链接都可以）
   size    压缩包大小
   date    更新时间
   link    压缩包下载链接 ★
   ========================================================= */
const plugins = [
  {
    name: "亚马逊前台产品排序",
    version: "v1.0",
    desc: "对亚马逊前台产品进行销量或BSR排序展示（需登陆卖家精灵插件加载页面数据）",
    img: encodeURI("https://raw.githubusercontent.com/wasdkd/Amazon/main/SKU_IMG/亚马逊前台产品排序.png"),
    size: "5.2KB",
    date: "2026-09-15",
    link: "https://raw.githubusercontent.com/wasdkd/Amazon/main/%E5%90%8E%E5%8F%B0%E6%9C%8D%E5%8A%A1/Wofu-Helper.rar"
  },

  {
    name: "亚马逊前台主图批量下载",
    version: "v2.0",
    desc: "亚马逊前台主图批量下载，按材质命名图片名称",
    img: encodeURI("https://raw.githubusercontent.com/wasdkd/Amazon/main/SKU_IMG/亚马逊前台主图批量下载.png"),
    size: "251.1KB",
    date: "2026-09-15",
    link: "https://raw.githubusercontent.com/wasdkd/Amazon/main/%E5%90%8E%E5%8F%B0%E6%9C%8D%E5%8A%A1/%E4%B8%BB%E5%9B%BE%E4%B8%8B%E8%BD%BD_%E9%87%8D%E5%91%BD%E5%90%8D.rar"
  },
];

/* =========================================================
   4. 渲染
   ========================================================= */
const grid    = document.getElementById('grid');
const input   = document.getElementById('search');
const countEl = document.getElementById('count');

const downloadIcon = `
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
  </svg>`;

/* 安装说明卡片 */
function renderGuide(){
  return `
    <section class="guide">
      <span class="guide-tag">${guide.tag}</span>
      <h2>${guide.title}</h2>
      <p class="intro">${guide.intro}</p>
      <div class="steps">
        ${guide.steps.map((s, i) => `
          <div class="step">
            <div class="step-img">
              <img class="zoomable" src="${s.img}" alt="${s.title}" loading="lazy">
              <span class="step-num">${i + 1}</span>
            </div>
            <div class="step-body">
              <h4>${s.title}</h4>
              <p>${s.text}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </section>`;
}

/* 插件卡片 */
function renderPlugins(list){
  return list.map((p, i) => `
    <article class="card" style="animation-delay:${i * 45}ms">
      <div class="thumb">
        <img class="zoomable" src="${p.img}" alt="${p.name} 预览图" loading="lazy">
        <span class="badge">${p.version}</span>
      </div>
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="meta">
          <span>📦 ${p.size}</span>
          <span>🕒 ${p.date}</span>
        </div>
        <a class="btn" href="${p.link}" download>
          ${downloadIcon}
          <span>下载插件</span>
        </a>
      </div>
    </article>
  `).join('');
}

function render(list, showGuide){
  if(!list.length){
    grid.innerHTML = '<div class="empty">😕 没有找到匹配的插件，换个关键词试试</div>';
    return;
  }
  grid.innerHTML = (showGuide ? renderGuide() : '') + renderPlugins(list);
}

/* =========================================================
   5. 图片点击放大（灯箱）
   ========================================================= */
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');
const lbClose  = document.getElementById('lbClose');

function openLightbox(src, alt){
  lbImg.src = src;
  lbImg.alt = alt || '';
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

/* 事件委托：点击任意可放大图片 */
grid.addEventListener('click', e => {
  const img = e.target.closest('img.zoomable');
  if(img){
    openLightbox(img.src, img.alt);
  }
});

lightbox.addEventListener('click', closeLightbox);
lbClose.addEventListener('click', closeLightbox);

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
});

/* 图片加载失败兜底（error 不冒泡，用捕获阶段） */
grid.addEventListener('error', e => {
  const el = e.target;
  if(el.tagName === 'IMG' && !el.dataset.fallback){
    el.dataset.fallback = '1';
    el.src = FALLBACK;
  }
}, true);

/* =========================================================
   6. 搜索过滤
   ========================================================= */
input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  const list = plugins.filter(p =>
    (p.name + ' ' + p.desc + ' ' + p.version).toLowerCase().includes(q)
  );
  countEl.textContent = list.length;
  render(list, q === '');   // 有搜索词时隐藏安装说明
});

/* 初始化 */
countEl.textContent = plugins.length;
render(plugins, true);
</script>
</body>
</html>
