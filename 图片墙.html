<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 智能图片墙工作室</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.94);
            --panel-border: rgba(226, 232, 240, 0.95);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 15px 30px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f1f5f9 65%, #e2e8f0 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部加长型悬浮控制中心 */
        header {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            padding: 6px 14px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            row-gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            width: min(1950px, 99vw);
        }

        .tool-section {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: #e2e8f0;
            margin: 0 2px;
        }

        .btn-mode {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: var(--text-main);
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
        }

        .btn-mode:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .btn-mode.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: var(--text-main);
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
        }

        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .control-label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
            white-space: nowrap;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 55px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        #viewport {
            flex: 1;
            width: 100vw;
            height: 100vh;
            perspective: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        #viewport:active { cursor: grabbing; }

        #stage {
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.05s linear;
        }

        .card-3d {
            position: absolute;
            width: 320px;
            height: 215px;
            left: -160px;
            top: -107.5px;
            border-radius: 12px;
            background: #ffffff;
            padding: 6px;
            box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            transition: transform 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.15), box-shadow 0.3s;
            cursor: pointer;
            backface-visibility: visible;
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
        }

        .card-3d img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            pointer-events: none;
            transition: object-fit 0.2s;
        }

        .card-3d img.fit-contain {
            object-fit: contain;
            background: #f8fafc;
        }

        .card-3d:hover {
            box-shadow: 0 22px 35px -5px rgba(37, 99, 235, 0.3), 0 0 0 2.5px var(--primary);
            z-index: 100 !important;
        }

        .card-3d.has-reflection {
            -webkit-box-reflect: below 6px linear-gradient(transparent 55%, rgba(255, 255, 255, 0.42));
        }

        .card-3d.film-style {
            background: #1e293b;
            padding: 16px 8px;
            border-radius: 6px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.35);
        }
        .card-3d.film-style::before, .card-3d.film-style::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            height: 10px;
            background: repeating-linear-gradient(90deg, #ffffff 0px, #ffffff 8px, transparent 8px, transparent 15px);
            opacity: 0.9;
        }
        .card-3d.film-style::before { top: 3px; }
        .card-3d.film-style::after { bottom: 3px; }

        .card-3d.slanted-style {
            border-radius: 0;
            background: transparent;
            padding: 0;
            box-shadow: 0 15px 30px rgba(0,0,0,0.18);
            overflow: hidden;
        }
        .card-3d.slanted-style img {
            border-radius: 0;
            transform: scale(1.15);
        }

        #reorder-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--panel-border);
            padding: 10px 20px;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.15);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.06);
        }

        #reorder-drawer.open { transform: translateY(0); }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .drawer-header h3 { font-size: 13px; color: var(--text-main); }

        .thumbnail-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }

        .thumb-item {
            position: relative;
            flex-shrink: 0;
            width: 95px;
            height: 64px;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
        }
        .thumb-item:hover { transform: translateY(-2px); border-color: #cbd5e1; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-item.selected { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.35); }
        .thumb-item.hidden-img { opacity: 0.42; }
        .thumb-item.hidden-img img { filter: grayscale(0.7); }

        .thumb-controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            justify-content: space-between;
            padding: 2px 4px;
        }
        .thumb-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }

        .thumb-checkbox {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 18px;
            height: 18px;
            background: rgba(255,255,255,0.92);
            border: 1.5px solid #cbd5e1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: transparent;
            pointer-events: none;
        }
        .thumb-item.selected .thumb-checkbox {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .thumb-badge {
            position: absolute;
            top: 3px;
            left: 3px;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            pointer-events: none;
        }
        .thumb-badge.default-badge { background: rgba(100,116,139,0.85); color: white; }
        .thumb-badge.upload-badge { background: rgba(37,99,235,0.9); color: white; }
        .thumb-badge.hidden-badge { background: rgba(15,23,42,0.9); color: white; }

        .batch-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .batch-controls .btn { padding: 4px 9px; font-size: 11px; }

        #drop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 3px dashed var(--primary);
            margin: 20px;
            border-radius: 24px;
        }
        #drop-overlay.dragover { display: flex; }
        #drop-overlay h2 { font-size: 20px; color: var(--primary); margin-top: 10px; }

        .bottom-hint {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 4px 16px;
            border-radius: 999px;
            font-size: 11.5px;
            color: var(--text-sub);
            border: 1px solid rgba(226, 232, 240, 0.9);
            pointer-events: none;
            white-space: nowrap;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="tool-section">
            <button class="btn-mode active" data-mode="curvedWall">🌟 环幕墙</button>
            <button class="btn-mode" data-mode="perspectiveShelf">✨ 立体排</button>
            <button class="btn-mode" data-mode="filmStrip">🎞️ 胶卷轴</button>
            <button class="btn-mode" data-mode="isometricGrid">📐 斜飞毯</button>
            <button class="btn-mode" data-mode="foldingAccordion">🪟 屏风折</button>
            <button class="btn-mode" data-mode="slantedSlices">⚡ 斜切片</button>
            <button class="btn-mode" data-mode="ring">🎠 3D圆环</button>
            <button class="btn-mode" data-mode="doubleRing">🌊 双层波浪环</button>
            <button class="btn-mode" data-mode="coverflow">🖼️ 画廊</button>
            <button class="btn-mode" data-mode="flatGrid">🔲 平铺</button>
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <span class="control-label">每行张数:</span>
            <input type="range" id="items-per-row" min="3" max="15" step="1" value="5">
            <span id="label-row-count" style="font-size:11px; font-weight:700; color:var(--primary); width:18px;">5</span>

            <span class="control-label" style="margin-left:6px;">尺寸:</span>
            <input type="range" id="card-scale" min="0.5" max="3" step="0.05" value="0.75">

            <span class="control-label" style="margin-left:6px;">间距:</span>
            <input type="range" id="spacing-scale" min="0.5" max="1.6" step="0.05" value="1.0">
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <button class="btn" id="toggle-spin">⏸️ 巡航</button>
            <span class="control-label">速度:</span>
            <input type="range" id="spin-speed" min="0.1" max="2.5" step="0.1" value="0.5">
        </div>

        <div class="divider"></div>

        <div class="tool-section">
            <button class="btn" id="btn-fit-mode" style="background:#f1f5f9;">🔲 铺满裁剪</button>
            <button class="btn" id="btn-toggle-reorder">🧩 图片管理</button>
            <button class="btn" id="btn-upload">📂 上传</button>
            <input type="file" id="file-input" multiple accept="image/*">
            <button class="btn" id="btn-reset">重置</button>
        </div>
    </header>

    <div id="reorder-drawer">
        <div class="drawer-header">
            <h3>🧩 图片管理面板 <span style="font-size:11px; color:var(--text-sub); font-weight:400;">(点击缩略图选中 · 点击箭头调整顺序)</span></h3>
            <div class="batch-controls">
                <span id="selection-count" style="font-size:11px; color:var(--text-sub);">已选 0 张</span>
                <button class="btn" id="btn-select-all">✅ 全选</button>
                <button class="btn" id="btn-select-none">清除选择</button>
                <button class="btn" id="btn-hide-default">🙈 隐藏默认图</button>
                <button class="btn" id="btn-hide-selected" style="background:#fee2e2; border-color:#fecaca;">🙈 隐藏选中</button>
                <button class="btn" id="btn-show-selected" style="background:#dcfce7; border-color:#bbf7d0;">👁️ 显示选中</button>
                <button class="btn" id="btn-show-all">🔄 全部显示</button>
                <button class="btn" id="btn-close-drawer">收起 ✕</button>
            </div>
        </div>
        <div class="thumbnail-list" id="thumbList"></div>
    </div>

    <div id="drop-overlay">
        <svg width="46" height="46" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--primary)">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <h2>松开鼠标，批量导入高清图片</h2>
    </div>

    <div id="viewport">
        <div id="stage"></div>
    </div>

    <div class="bottom-hint">
        💡 鼠标左键旋转视角 | 滚轮缩放 | 拖拽图片到页面可批量导入 | 点“铺满/完整”切换图片裁剪模式
    </div>

    <script>
        const DEFAULT_IMAGES = [
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1434725039720-aaad6dd32dfe?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=2000&auto=format&fit=crop&q=90",
            "https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=2000&auto=format&fit=crop&q=90"
        ];

        const DEFAULT_SET = new Set(DEFAULT_IMAGES);
        let imageList = [...DEFAULT_IMAGES];
        let hiddenUrls = new Set();
        let selectedUrls = new Set();
        let currentMode = "curvedWall";
        let isSpinning = true;
        let spinSpeed = 0.5;
        let cardScale = 0.75;
        let spacingMultiplier = 1.0;
        let itemsPerRow = 5;
        let activeCoverIndex = 0;
        let fitMode = 'cover';

        let rotationX = -4;
        let rotationY = 0;
        let targetRotationX = -4;
        let targetRotationY = 0;
        let zoomZ = 0;
        let isDragging = false;
        let startX, startY;

        const stage = document.getElementById("stage");
        const viewport = document.getElementById("viewport");
        const fileInput = document.getElementById("file-input");
        const reorderDrawer = document.getElementById("reorder-drawer");
        const thumbList = document.getElementById("thumbList");
        const btnFitMode = document.getElementById("btn-fit-mode");

        function getVisibleImages() {
            return imageList.filter(url => !hiddenUrls.has(url));
        }

        function renderImages() {
            stage.innerHTML = "";
            const visibleImages = getVisibleImages();
            visibleImages.forEach((url, index) => {
                const card = document.createElement("div");
                card.className = "card-3d";
                card.dataset.index = index;

                const img = document.createElement("img");
                img.src = url;
                img.loading = "eager";
                img.draggable = false;
                if (fitMode === 'contain') {
                    img.classList.add('fit-contain');
                }

                card.appendChild(img);
                stage.appendChild(card);
            });

            // 保证 activeCoverIndex 不越界
            if (activeCoverIndex >= visibleImages.length) activeCoverIndex = 0;

            renderThumbnails();
            applyLayout();
        }

        function renderThumbnails() {
            thumbList.innerHTML = "";
            imageList.forEach((url, index) => {
                const item = document.createElement("div");
                item.className = "thumb-item";
                if (selectedUrls.has(url)) item.classList.add("selected");
                if (hiddenUrls.has(url)) item.classList.add("hidden-img");

                const isDefault = DEFAULT_SET.has(url);
                const badgeHtml = hiddenUrls.has(url)
                    ? `<div class="thumb-badge hidden-badge">🙈 已隐藏</div>`
                    : (isDefault ? `<div class="thumb-badge default-badge">默认</div>` : `<div class="thumb-badge upload-badge">上传</div>`);

                item.innerHTML = `
                    <img src="${url}" draggable="false">
                    ${badgeHtml}
                    <div class="thumb-checkbox">${selectedUrls.has(url) ? '✓' : ''}</div>
                    <div class="thumb-controls">
                        <button class="thumb-btn" data-action="move" data-idx="${index}" data-dir="-1" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>◀</button>
                        <span style="color:#fff; font-size:10px;">${index + 1}</span>
                        <button class="thumb-btn" data-action="move" data-idx="${index}" data-dir="1" ${index === imageList.length - 1 ? 'disabled style="opacity:0.3"' : ''}>▶</button>
                    </div>
                `;
                item.addEventListener("click", (e) => {
                    const btn = e.target.closest(".thumb-btn");
                    if (btn) {
                        if (btn.disabled) return;
                        const idx = parseInt(btn.dataset.idx);
                        const dir = parseInt(btn.dataset.dir);
                        moveImage(idx, dir);
                        return;
                    }
                    if (selectedUrls.has(url)) {
                        selectedUrls.delete(url);
                    } else {
                        selectedUrls.add(url);
                    }
                    renderThumbnails();
                });
                thumbList.appendChild(item);
            });
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const el = document.getElementById("selection-count");
            if (el) el.textContent = `已选 ${selectedUrls.size} 张 / 共 ${imageList.length} 张 · 已隐藏 ${hiddenUrls.size} 张`;
        }

        window.moveImage = function(index, dir) {
            const targetIdx = index + dir;
            if (targetIdx < 0 || targetIdx >= imageList.length) return;
            const temp = imageList[index];
            imageList[index] = imageList[targetIdx];
            imageList[targetIdx] = temp;
            renderImages();
        };

        // --- 核心数学排布：分排智能包裹算法 ---
        function applyLayout() {
            const cards = document.querySelectorAll(".card-3d");
            const total = cards.length;
            if (total === 0) return;

            const baseW = 320 * cardScale;
            const baseH = 215 * cardScale;

            cards.forEach((card, i) => {
                card.classList.remove("has-reflection", "film-style", "slanted-style");
                card.style.clipPath = "none";
                card.style.width = `${baseW}px`;
                card.style.height = `${baseH}px`;
                card.style.left = `-${baseW / 2}px`;
                card.style.top = `-${baseH / 2}px`;

                let transformStr = "";

                const cols = itemsPerRow;
                const col = i % cols;
                const row = Math.floor(i / cols);
                const totalRows = Math.ceil(total / cols);
                const midCol = (cols - 1) / 2;
                const midRow = (totalRows - 1) / 2;

                switch(currentMode) {
                    case "curvedWall": {
                        const angleY = (col - midCol) * 8.5;
                        const radius = 1350 * spacingMultiplier;
                        const transZ = -(1 - Math.cos((angleY * Math.PI) / 180)) * radius;
                        const transX = (col - midCol) * (baseW + 16 * spacingMultiplier);
                        const transY = (row - midRow) * (baseH + 16 * spacingMultiplier);
                        transformStr = `translate3d(${transX}px, ${transY}px, ${transZ}px) rotateY(${angleY}deg)`;
                        break;
                    }
                    case "perspectiveShelf": {
                        card.classList.add("has-reflection");
                        const spacingX = (baseW * 0.88) * spacingMultiplier;
                        const spacingY = (baseH * 1.5) * spacingMultiplier;
                        const posX = (col - midCol) * spacingX;
                        const posY = (row - midRow) * spacingY - 20;
                        const posZ = -Math.abs(col - midCol) * 35;
                        const rotY = -(col - midCol) * 3.5;
                        transformStr = `translate3d(${posX}px, ${posY}px, ${posZ}px) rotateY(${rotY}deg)`;
                        break;
                    }
                    case "filmStrip": {
                        card.classList.add("film-style");
                        const step = (Math.PI * 2) / total;
                        const angle = i * step;
                        const radius = Math.max(460, (baseW + 30) * total / (2 * Math.PI)) * spacingMultiplier;
                        const posX = Math.sin(angle) * radius;
                        const posZ = Math.cos(angle) * radius;
                        const posY = Math.sin(angle * 2) * (50 * spacingMultiplier);
                        const rotY = (angle * 180 / Math.PI) + 180;
                        const rotZ = Math.cos(angle * 2) * 8;
                        transformStr = `translate3d(${posX}px, ${posY}px, ${posZ}px) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
                        break;
                    }
                    case "isometricGrid": {
                        const px = (col - midCol) * (baseW + 28 * spacingMultiplier);
                        const py = (row - midRow) * (baseH + 28 * spacingMultiplier);
                        transformStr = `translate3d(${px}px, ${py}px, 0px)`;
                        break;
                    }
                    case "foldingAccordion": {
                        const angle = (col % 2 === 0 ? 24 : -24);
                        const spacingX = (baseW * 0.82) * spacingMultiplier;
                        const spacingY = (baseH + 30) * spacingMultiplier;
                        const posX = (col - midCol) * spacingX;
                        const posY = (row - midRow) * spacingY;
                        const posZ = -(Math.abs(col - midCol) * 20);
                        transformStr = `translate3d(${posX}px, ${posY}px, ${posZ}px) rotateY(${angle}deg)`;
                        break;
                    }
                    case "slantedSlices": {
                        card.classList.add("slanted-style");
                        card.style.clipPath = "polygon(18% 0%, 100% 0%, 82% 100%, 0% 100%)";
                        const spacingX = (baseW * 0.7) * spacingMultiplier;
                        const spacingY = (baseH + 24) * spacingMultiplier;
                        const posX = (col - midCol) * spacingX;
                        const posY = (row - midRow) * spacingY;
                        transformStr = `translate3d(${posX}px, ${posY}px, 0px)`;
                        break;
                    }
                    case "ring": {
                        const angle = i * (360 / total);
                        const radius = Math.max(420, ((baseW + 30 * spacingMultiplier) / 2) / Math.tan(Math.PI / total)) * spacingMultiplier;
                        transformStr = `rotateY(${angle}deg) translateZ(${radius}px)`;
                        break;
                    }
                    // 🌊 双层波浪环
                    case "doubleRing": {
                        const half = Math.ceil(total / 2);
                        const isTop = i < half;
                        const indexInLayer = isTop ? i : i - half;
                        const countInLayer = isTop ? half : (total - half);
                        const safeCount = Math.max(countInLayer, 2);

                        const angle = indexInLayer * (360 / safeCount);
                        const radius = Math.max(
                            360,
                            ((baseW + 24 * spacingMultiplier) / 2) / Math.tan(Math.PI / safeCount)
                        ) * spacingMultiplier;
                        const posY = isTop ? -85 * spacingMultiplier : 85 * spacingMultiplier;

                        transformStr = `rotateY(${angle}deg) translateZ(${radius}px) translateY(${posY}px)`;
                        break;
                    }
                    case "coverflow": {
                        card.classList.add("has-reflection");
                        // 环形循环：让 delta 走最短路径，最后一张之后无缝接回第一张
                        let delta = i - activeCoverIndex;
                        if (delta > total / 2) delta -= total;
                        if (delta < -total / 2) delta += total;

                        let tx = 0, tz = 0, ry = 0, scale = 1;
                        if (delta === 0) {
                            tx = 0; tz = 260; ry = 0; scale = 1.12;
                        } else if (delta < 0) {
                            tx = delta * (110 * spacingMultiplier) - (160 * spacingMultiplier);
                            tz = -Math.min(320, Math.abs(delta) * 50);
                            ry = 65;
                        } else {
                            tx = delta * (110 * spacingMultiplier) + (160 * spacingMultiplier);
                            tz = -Math.min(320, Math.abs(delta) * 50);
                            ry = -65;
                        }
                        transformStr = `translate3d(${tx}px, -20px, ${tz}px) rotateY(${ry}deg) scale(${scale})`;
                        break;
                    }
                    case "flatGrid": {
                        const px = (col - midCol) * (baseW + 18 * spacingMultiplier);
                        const py = (row - midRow) * (baseH + 18 * spacingMultiplier);
                        transformStr = `translate3d(${px}px, ${py}px, 0px)`;
                        break;
                    }
                }

                card.style.transform = transformStr;
            });
        }

        // --- 鼠标全景交互与阻尼平滑 ---
        viewport.addEventListener("mousedown", (e) => {
            if (e.target.closest("header") || e.target.closest("#reorder-drawer")) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            targetRotationY += deltaX * 0.3;
            targetRotationX -= deltaY * 0.2;
            targetRotationX = Math.max(-65, Math.min(65, targetRotationX));

            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener("mouseup", () => isDragging = false);

        viewport.addEventListener("wheel", (e) => {
            zoomZ -= e.deltaY * 0.85;
            zoomZ = Math.max(-2000, Math.min(900, zoomZ));
        }, { passive: true });

        // 自动巡航主循环
        let lastCoverStepTime = 0;

        function animate(timestamp) {
            if (isSpinning && !isDragging) {
                if (currentMode === "coverflow") {
                    if (timestamp - lastCoverStepTime > (2200 / spinSpeed)) {
                        // 基于当前实际可见卡片数循环，最后一张之后回到第一张
                        const visCount = document.querySelectorAll(".card-3d").length;
                        if (visCount > 0) {
                            activeCoverIndex = (activeCoverIndex + 1) % visCount;
                            applyLayout();
                        }
                        lastCoverStepTime = timestamp;
                    }
                } else if (currentMode === "ring" || currentMode === "filmStrip" || currentMode === "doubleRing") {
                    targetRotationY += spinSpeed * 0.5;
                }
            }

            rotationX += (targetRotationX - rotationX) * 0.1;
            rotationY += (targetRotationY - rotationY) * 0.1;

            stage.style.transform = `translateZ(${zoomZ}px) rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
            requestAnimationFrame(animate);
        }

        // --- 图片适配模式切换 ---
        btnFitMode.addEventListener("click", () => {
            fitMode = fitMode === 'cover' ? 'contain' : 'cover';
            btnFitMode.textContent = fitMode === 'cover' ? '🔲 铺满裁剪' : '📐 完整显示';
            btnFitMode.style.background = fitMode === 'cover' ? '#f1f5f9' : '#e0f2fe';

            document.querySelectorAll(".card-3d img").forEach(img => {
                if (fitMode === 'contain') {
                    img.classList.add("fit-contain");
                } else {
                    img.classList.remove("fit-contain");
                }
            });
        });

        // --- 模式切换 ---
        document.querySelectorAll(".btn-mode").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".btn-mode").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentMode = btn.dataset.mode;

                if (currentMode === "isometricGrid") {
                    targetRotationX = 48; targetRotationY = -28; zoomZ = -100;
                } else if (currentMode === "perspectiveShelf" || currentMode === "slantedSlices" || currentMode === "foldingAccordion") {
                    targetRotationX = -2; targetRotationY = 0; zoomZ = 20;
                } else if (currentMode === "doubleRing" || currentMode === "ring") {
                    targetRotationX = 8; targetRotationY = 0; zoomZ = -50;
                } else {
                    targetRotationX = -3; targetRotationY = 0; zoomZ = 0;
                }

                applyLayout();
            });
        });

        // 每行数量动态调节
        const rowInput = document.getElementById("items-per-row");
        const rowLabel = document.getElementById("label-row-count");
        rowInput.addEventListener("input", (e) => {
            itemsPerRow = parseInt(e.target.value);
            rowLabel.textContent = itemsPerRow;
            applyLayout();
        });

        // 卡片尺寸与间距调节
        document.getElementById("card-scale").addEventListener("input", (e) => {
            cardScale = parseFloat(e.target.value);
            applyLayout();
        });

        document.getElementById("spacing-scale").addEventListener("input", (e) => {
            spacingMultiplier = parseFloat(e.target.value);
            applyLayout();
        });

        // 巡航与重置
        const toggleSpinBtn = document.getElementById("toggle-spin");
        toggleSpinBtn.addEventListener("click", () => {
            isSpinning = !isSpinning;
            toggleSpinBtn.innerHTML = isSpinning ? "⏸️ 巡航" : "▶️ 巡航";
        });

        document.getElementById("spin-speed").addEventListener("input", (e) => {
            spinSpeed = parseFloat(e.target.value);
        });

        document.getElementById("btn-reset").addEventListener("click", () => {
            targetRotationX = -4; targetRotationY = 0; zoomZ = 0;
            cardScale = 0.75; spacingMultiplier = 1.0; itemsPerRow = 5;
            document.getElementById("card-scale").value = 0.75;
            document.getElementById("spacing-scale").value = 1.0;
            document.getElementById("items-per-row").value = 5;
            rowLabel.textContent = 5;
            hiddenUrls.clear();
            selectedUrls.clear();
            renderImages();
        });

        // 顺序管理抽屉
        document.getElementById("btn-toggle-reorder").addEventListener("click", () => {
            reorderDrawer.classList.toggle("open");
        });
        document.getElementById("btn-close-drawer").addEventListener("click", () => {
            reorderDrawer.classList.remove("open");
        });

        // --- 批量选中 / 隐藏 / 显示 ---
        document.getElementById("btn-select-all").addEventListener("click", () => {
            imageList.forEach(u => selectedUrls.add(u));
            renderThumbnails();
        });
        document.getElementById("btn-select-none").addEventListener("click", () => {
            selectedUrls.clear();
            renderThumbnails();
        });
        document.getElementById("btn-hide-selected").addEventListener("click", () => {
            if (selectedUrls.size === 0) { alert("先在下方缩略图里点选要隐藏的图片~"); return; }
            selectedUrls.forEach(u => hiddenUrls.add(u));
            selectedUrls.clear();
            renderImages();
        });
        document.getElementById("btn-show-selected").addEventListener("click", () => {
            if (selectedUrls.size === 0) { alert("先在下方缩略图里点选要显示的图片~"); return; }
            selectedUrls.forEach(u => hiddenUrls.delete(u));
            selectedUrls.clear();
            renderImages();
        });
        document.getElementById("btn-show-all").addEventListener("click", () => {
            hiddenUrls.clear();
            renderImages();
        });
        document.getElementById("btn-hide-default").addEventListener("click", () => {
            DEFAULT_IMAGES.forEach(u => hiddenUrls.add(u));
            selectedUrls.clear();
            renderImages();
        });

        // 文件拖拽与批量上传
        window.addEventListener("dragover", (e) => {
            e.preventDefault();
            document.getElementById("drop-overlay").classList.add("dragover");
        });
        window.addEventListener("dragleave", (e) => {
            if (e.clientX <= 0 || e.clientY <= 0) {
                document.getElementById("drop-overlay").classList.remove("dragover");
            }
        });
        window.addEventListener("drop", (e) => {
            e.preventDefault();
            document.getElementById("drop-overlay").classList.remove("dragover");
            if (e.dataTransfer.files?.length > 0) handleUploadedFiles(e.dataTransfer.files);
        });
        document.getElementById("btn-upload").addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) handleUploadedFiles(e.target.files);
        });

        function handleUploadedFiles(files) {
            const valids = Array.from(files).filter(f => f.type.startsWith("image/"));
            if (valids.length === 0) return;
            valids.forEach(f => imageList.push(URL.createObjectURL(f)));
            renderImages();
        }

        // 启动
        renderImages();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
