<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 仓库文件浏览器</title>
<script>
  try {
    var __t = localStorage.getItem('gh-theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', __t);
  } catch (e) {}
</script>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f2f4f7; --surface-3:#e9ecf1;
  --border:#e4e7ec; --border-strong:#d0d5dd;
  --text:#101828; --text-dim:#667085; --text-faint:#98a2b3;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef1ff;
  --accent-ring:rgba(79,70,229,.14);
  --green:#16a34a; --green-hover:#15803d; --danger:#dc2626;
  --radius:12px; --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 6px 18px rgba(16,24,40,.08);
  --shadow-lg:0 14px 36px rgba(16,24,40,.13);
}
html[data-theme="dark"]{
  --bg:#0b0e14; --surface:#141821; --surface-2:#1b202b; --surface-3:#232936;
  --border:#242b38; --border-strong:#333c4d;
  --text:#e7eaf0; --text-dim:#98a2b3; --text-faint:#667085;
  --accent:#7c85ff; --accent-hover:#929aff; --accent-soft:rgba(124,133,255,.14);
  --accent-ring:rgba(124,133,255,.2);
  --green:#22c55e; --green-hover:#16a34a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 18px rgba(0,0,0,.42);
  --shadow-lg:0 14px 36px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}
button,input,select{font-family:inherit;}

.app{max-width:1280px;margin:0 auto;padding:26px 20px 72px;}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:13px;min-width:0;}
.brand-icon{
  width:44px;height:44px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;font-size:21px;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  box-shadow:0 6px 16px rgba(99,102,241,.32);
}
.brand-text{min-width:0;}
.brand-line{display:flex;align-items:center;gap:8px;min-width:0;}
.brand-line h1{
  font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.branch-badge{
  display:none;flex-shrink:0;
  font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent);
  border:1px solid transparent;
}
.branch-badge.show{display:inline-block;}
.brand-text p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{
  width:40px;height:40px;flex-shrink:0;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:16px;cursor:pointer;
  display:grid;place-items:center;
  box-shadow:var(--shadow-sm);
  transition:background .15s,border-color .15s,transform .15s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border-strong);transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0);}

/* ---------- 仓库输入栏 ---------- */
.repo-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:10px;margin-bottom:22px;
  box-shadow:var(--shadow-sm);
}
.field{position:relative;display:flex;align-items:center;min-width:0;}
.field .fi{position:absolute;left:12px;font-size:13px;opacity:.45;pointer-events:none;line-height:1;}
.field input{
  width:100%;padding:10px 12px 10px 34px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);color:var(--text);font-size:13.5px;
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input::placeholder{color:var(--text-faint);}
.field input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-ring);}
#repo-field{flex:1 1 300px;}
#branch-field{flex:0 1 150px;}
#branch-field input{padding-left:12px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 20px;border-radius:var(--radius-sm);
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  text-decoration:none;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong);}
.btn:active{transform:scale(.98);}
.btn-primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 4px 12px var(--accent-ring);
}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}

/* ---------- 状态 ---------- */
.status{
  display:none;text-align:center;padding:56px 20px;
  color:var(--text-dim);font-size:14px;
}
.status.error{color:var(--danger);}
.status .spinner{
  width:22px;height:22px;margin:0 auto 14px;border-radius:50%;
  border:2.5px solid var(--border);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- 主视图布局 ---------- */
.main-view{display:none;}
.main-view.active{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start;}

/* ---------- 侧边栏 ---------- */
.sidebar{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:9px;box-shadow:var(--shadow-sm);
  position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
.sidebar-head{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-faint);padding:8px 10px 7px;
}
.cat-nav{display:flex;flex-direction:column;gap:1px;}
.cat-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border:none;border-radius:9px;background:none;
  font-size:13.5px;color:var(--text-dim);cursor:pointer;text-align:left;
  transition:background .12s,color .12s;
}
.cat-item:hover{background:var(--surface-2);color:var(--text);}
.cat-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.cat-item .ci{font-size:15px;width:18px;text-align:center;flex-shrink:0;line-height:1;}
.cat-item .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-item .cc{
  font-size:11px;color:var(--text-faint);background:var(--surface-2);
  padding:1px 7px;border-radius:20px;flex-shrink:0;font-weight:500;
}
.cat-item.active .cc{background:rgba(124,133,255,.18);color:var(--accent);}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.search-field{flex:1 1 220px;}
.search-field input{
  padding:10px 12px 10px 34px;border-radius:var(--radius-sm);
}
.select{
  padding:10px 32px 10px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:13.5px;cursor:pointer;outline:none;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2.5 4.5L6 8L9.5 4.5' stroke='%2398a2b3' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:11px;
  transition:border-color .15s,box-shadow .15s;
}
.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}
.stats{font-size:12.5px;color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* ---------- 文件卡片网格 ---------- */
.file-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
  gap:12px;
}
.card{
  position:relative;display:flex;flex-direction:column;gap:7px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:14px;min-width:0;cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
  border-color:var(--border-strong);
}
.card:active{transform:translateY(-1px);}
.card-icon{font-size:30px;line-height:1;height:34px;display:flex;align-items:center;}
.card-name{
  font-size:13px;font-weight:600;line-height:1.35;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.7em;
}
.card-path{
  font-size:11px;color:var(--text-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-top:auto;padding-top:8px;border-top:1px solid var(--border);
}
.card-size{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-acts{display:flex;gap:4px;flex-shrink:0;}
.mini{
  width:26px;height:26px;padding:0;border-radius:7px;
  display:grid;place-items:center;font-size:12px;line-height:1;
  border:1px solid transparent;background:transparent;color:var(--text-faint);
  cursor:pointer;transition:background .13s,color .13s,border-color .13s;
}
.mini:hover{background:var(--surface-2);color:var(--accent);border-color:var(--border);}
.mini:active{transform:scale(.94);}

.empty{
  grid-column:1/-1;padding:60px 20px;text-align:center;
  color:var(--text-faint);font-size:14px;
}

/* ---------- 分享视图 ---------- */
.share-view{display:none;}
.share-view.active{display:block;}
.share-card{
  max-width:520px;margin:8px auto 0;text-align:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:44px 28px 34px;
  box-shadow:var(--shadow-lg);
}
.share-card .sc-icon{font-size:56px;line-height:1;margin-bottom:18px;}
.share-card .sc-name{
  font-size:19px;font-weight:650;word-break:break-all;letter-spacing:-.01em;
}
.share-card .sc-path{
  font-size:12px;color:var(--text-faint);word-break:break-all;
  margin-top:6px;
}
.share-card .sc-meta{
  font-size:12.5px;color:var(--text-dim);margin:14px 0 26px;
}
.share-card .sc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);
  background:var(--text);color:var(--bg);
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;word-break:break-all;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 响应式 ---------- */
@media (max-width:860px){
  .app{padding:18px 14px 60px;}
  .main-view.active{grid-template-columns:1fr;gap:14px;}
  .sidebar{
    position:static;max-height:none;overflow:visible;
    padding:8px;border-radius:12px;
  }
  .sidebar-head{display:none;}
  .cat-nav{
    flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-item{
    flex:0 0 auto;border:1px solid var(--border);border-radius:20px;
    padding:6px 12px;white-space:nowrap;
  }
  .cat-item.active{border-color:transparent;}
  .cat-item .cn{max-width:130px;}
  .file-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;}
  .card{padding:12px;}
  .card-icon{font-size:26px;height:30px;}
  .card-name{font-size:12.5px;}
  #branch-field{flex:1 1 120px;}
  .repo-bar .btn{flex:1 1 100%;}
}
</style>
</head>
<body>

<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">📦</div>
      <div class="brand-text">
        <div class="brand-line">
          <h1 id="repo-title">GitHub 仓库浏览器</h1>
          <span class="branch-badge" id="branch-badge"></span>
        </div>
        <p id="repo-sub">输入仓库地址即可浏览文件</p>
      </div>
    </div>
    <button class="icon-btn" id="theme-btn" title="切换主题">🌙</button>
  </header>

  <!-- 仓库输入 -->
  <div class="repo-bar">
    <div class="field" id="repo-field">
      <span class="fi">🔍</span>
      <input type="text" id="repo-input" placeholder="仓库地址，如 wasdkd/Amazon 或完整 GitHub URL" spellcheck="false" autocomplete="off">
    </div>
    <div class="field" id="branch-field">
      <input type="text" id="branch-input" placeholder="分支（可选）" spellcheck="false" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="load-btn">加载仓库</button>
  </div>

  <!-- 状态 -->
  <div class="status" id="status">
    <div class="spinner"></div>
    <div id="status-text">正在准备…</div>
  </div>

  <!-- 单文件分享视图 -->
  <div class="share-view" id="share-view">
    <div class="share-card">
      <div class="sc-icon" id="share-icon">📄</div>
      <div class="sc-name" id="share-name"></div>
      <div class="sc-path" id="share-path"></div>
      <div class="sc-meta" id="share-meta"></div>
      <div class="sc-actions">
        <a class="btn btn-primary" id="share-download" download>⬇ 下载文件</a>
<!--        <button class="btn" id="share-back" type="button">← 返回列表</button>-->
      </div>
    </div>
  </div>

  <!-- 主视图 -->
  <div class="main-view" id="main-view">

    <aside class="sidebar">
      <div class="sidebar-head">分类</div>
      <nav class="cat-nav" id="cat-nav"></nav>
    </aside>

    <section class="content">
      <div class="toolbar">
        <div class="field search-field">
          <span class="fi">🔍</span>
          <input type="text" id="search" placeholder="搜索文件名或路径…" spellcheck="false" autocomplete="off">
        </div>
        <select class="select" id="sort">
          <option value="path">按路径排序</option>
          <option value="name">按名称排序</option>
          <option value="size">按大小排序</option>
        </select>
        <span class="stats" id="stats"></span>
      </div>
      <div class="file-grid" id="file-grid"></div>
    </section>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ===================== 配置 ===================== */
  const DEFAULT_REPO = 'wasdkd/Amazon';
  const LS_REPO  = 'gh-repo-browser-last';
  const LS_THEME = 'gh-theme';

  const EXT_CATEGORY = {
    html:'HTML 页面', htm:'HTML 页面',
    css:'样式表', scss:'样式表', less:'样式表',
    js:'脚本', mjs:'脚本', cjs:'脚本',
    json:'数据文件', xml:'数据文件', yml:'数据文件', yaml:'数据文件', toml:'数据文件',
    csv:'数据表格', xlsx:'数据表格', xls:'数据表格',
    png:'图片', jpg:'图片', jpeg:'图片', gif:'图片', svg:'图片',
    webp:'图片', ico:'图片', bmp:'图片', avif:'图片',
    zip:'压缩包', rar:'压缩包', '7z':'压缩包', tar:'压缩包', gz:'压缩包', bz2:'压缩包',
    pdf:'PDF 文档',
    md:'文档', txt:'文档', doc:'文档', docx:'文档', rtf:'文档',
    mp4:'音视频', mp3:'音视频', wav:'音视频', mov:'音视频', avi:'音视频', mkv:'音视频', webm:'音视频',
    py:'代码', java:'代码', c:'代码', h:'代码', cpp:'代码', go:'代码', rs:'代码',
    ts:'代码', jsx:'代码', tsx:'代码', vue:'代码', svelte:'代码', php:'代码', rb:'代码',
    swift:'代码', kt:'代码',
    sql:'数据库', db:'数据库', sqlite:'数据库',
    ttf:'字体', otf:'字体', woff:'字体', woff2:'字体',
    exe:'可执行文件', apk:'可执行文件', dmg:'可执行文件', msi:'可执行文件'
  };

  const CATEGORY_ORDER = [
    'HTML 页面','样式表','脚本','代码','数据文件','数据表格',
    '图片','压缩包','PDF 文档','文档','音视频','字体','数据库',
    '可执行文件','其他文件'
  ];

  const CATEGORY_ICON = {
    'HTML 页面':'🌐','样式表':'🎨','脚本':'⚡','代码':'💻',
    '数据文件':'📋','数据表格':'📊','图片':'🖼️','压缩包':'🗜️',
    'PDF 文档':'📕','文档':'📝','音视频':'🎬','字体':'🔤',
    '数据库':'🗄️','可执行文件':'⚙️','其他文件':'📄'
  };

  const TEXT_EXTS = new Set([
    'html','htm','css','scss','less','js','mjs','cjs','json','xml','yml','yaml',
    'toml','csv','md','txt','py','java','c','h','cpp','go','rs','ts','jsx','tsx',
    'vue','svelte','php','rb','swift','kt','sql'
  ]);

  /* ===================== 状态 ===================== */
  const state = {
    owner: '', repo: '', branch: '',
    files: [],
    activeCat: '__all__',
    query: '',
    sort: 'path'
  };

  /* ===================== 工具 ===================== */
  const $ = id => document.getElementById(id);

  function formatSize(bytes) {
    if (bytes === undefined || bytes === null) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function getExt(name) {
    const i = name.lastIndexOf('.');
    return i >= 0 ? name.slice(i + 1).toLowerCase() : '';
  }

  function getCategory(path) {
    return EXT_CATEGORY[getExt(path)] || '其他文件';
  }

  function baseName(path) {
    return path.split('/').pop();
  }

  function dirName(path) {
    return path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
  }

  function getFileIcon(name) {
    const map = {
      html:'🌐', htm:'🌐', css:'🎨', scss:'🎨', js:'⚡', mjs:'⚡', json:'📋',
      png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️', ico:'🖼️',
      zip:'🗜️', rar:'🗜️', '7z':'🗜️', gz:'🗜️', pdf:'📕',
      md:'📝', txt:'📝', csv:'📊', xlsx:'📊', xls:'📊',
      mp4:'🎬', mp3:'🎵', wav:'🎵', mov:'🎬',
      py:'🐍', java:'☕', go:'🐹', rs:'🦀', c:'🔧', cpp:'🔧',
      ts:'📘', tsx:'📘', jsx:'📘', vue:'💚', sql:'🗄️', db:'🗄️',
      ttf:'🔤', otf:'🔤', woff:'🔤', woff2:'🔤'
    };
    return map[getExt(name)] || '📄';
  }

  function catSort(a, b) {
    const ia = CATEGORY_ORDER.indexOf(a);
    const ib = CATEGORY_ORDER.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b, 'zh');
  }

  function rawUrl(path) {
    const segs = path.split('/').map(encodeURIComponent).join('/');
    return 'https://raw.githubusercontent.com/' + state.owner + '/' + state.repo + '/' +
           encodeURIComponent(state.branch) + '/' + segs;
  }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  function showStatus(text, isError, loading) {
    const s = $('status');
    s.style.display = 'block';
    s.className = 'status' + (isError ? ' error' : '');
    $('status-text').textContent = text;
    const sp = s.querySelector('.spinner');
    if (sp) sp.style.display = loading ? 'block' : 'none';
    $('main-view').classList.remove('active');
    $('share-view').classList.remove('active');
  }

  function hideStatus() {
    $('status').style.display = 'none';
  }

  /* ===================== 主题 ===================== */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(LS_THEME, t); } catch (e) {}
  }
  function initTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    $('theme-btn').textContent = cur === 'dark' ? '☀️' : '🌙';
    $('theme-btn').addEventListener('click', () => {
      const now = document.documentElement.getAttribute('data-theme');
      applyTheme(now === 'dark' ? 'light' : 'dark');
    });
  }

  /* ===================== 仓库解析 ===================== */
  function parseRepoInput(raw) {
    if (!raw) return null;
    let s = String(raw).trim();
    if (!s) return null;
    s = s.replace(/\.git$/i, '').replace(/\/+$/, '');

    let m = s.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s]+)\/tree\/([^\/\s?#]+)/i);
    if (m) return { owner: m[1], repo: m[2], branch: m[3] };

    m = s.match(/^https?:\/\/github\.com\/([^\/\s]+)\/([^\/\s?#]+)/i);
    if (m) return { owner: m[1], repo: m[2] };

    m = s.match(/^git@github\.com:([^\/\s]+)\/([^\/\s]+)$/i);
    if (m) return { owner: m[1], repo: m[2] };

    m = s.match(/^([^\/\s]+)\/([^\/\s]+)$/);
    if (m) return { owner: m[1], repo: m[2] };

    return null;
  }

  /* ===================== API ===================== */
  async function fetchRepoInfo(owner, repo) {
    const res = await fetch('https://api.github.com/repos/' + owner + '/' + repo);
    if (res.status === 404) throw new Error('找不到仓库 ' + owner + '/' + repo + '（可能是私有仓库或名字拼写有误）');
    if (res.status === 403) throw new Error('GitHub API 访问次数受限，请稍后再试');
    if (!res.ok) throw new Error('读取仓库信息失败：HTTP ' + res.status);
    return res.json();
  }

  async function fetchTree(owner, repo, branch) {
    const url = 'https://api.github.com/repos/' + owner + '/' + repo +
                '/git/trees/' + encodeURIComponent(branch) + '?recursive=1';
    const res = await fetch(url);
    if (res.status === 404) throw new Error('找不到分支「' + branch + '」，请检查分支名是否正确');
    if (res.status === 403) throw new Error('GitHub API 访问次数受限，请稍后再试');
    if (!res.ok) throw new Error('读取文件列表失败：HTTP ' + res.status);
    const data = await res.json();
    return (data.tree || []).filter(item => item.type === 'blob');
  }

  /* ===================== URL ===================== */
  function buildMainUrl() {
    const p = new URLSearchParams();
    p.set('repo', state.owner + '/' + state.repo);
    if (state.branch) p.set('branch', state.branch);
    return location.pathname + '?' + p.toString();
  }

  function buildShareUrl(filePath) {
    const p = new URLSearchParams();
    p.set('repo', state.owner + '/' + state.repo);
    if (state.branch) p.set('branch', state.branch);
    p.set('file', filePath);
    return location.origin + location.pathname + '?' + p.toString();
  }

  /* ===================== 加载仓库 ===================== */
  async function loadRepo(owner, repo, branch, opts) {
    opts = opts || {};
    const shareFile = opts.shareFile || null;
    const syncUrl = opts.syncUrl !== false;

    try {
      showStatus('正在读取仓库信息…', false, true);

      if (!branch) {
        const info = await fetchRepoInfo(owner, repo);
        branch = info.default_branch || 'main';
      }

      showStatus('正在读取文件列表…', false, true);
      const files = await fetchTree(owner, repo, branch);

      state.owner = owner;
      state.repo = repo;
      state.branch = branch;
      state.files = files;

      try { localStorage.setItem(LS_REPO, owner + '/' + repo); } catch (e) {}

      $('repo-input').value = owner + '/' + repo;
      $('branch-input').value = branch;
      $('repo-title').textContent = owner + '/' + repo;
      $('repo-sub').textContent = files.length + ' 个文件 · 分支 ' + branch;

      const badge = $('branch-badge');
      badge.textContent = branch;
      badge.classList.add('show');

      if (shareFile) {
        if (!files.some(f => f.path === shareFile)) {
          showStatus('找不到该文件：' + shareFile, true);
          return;
        }
        renderShareView(shareFile);
        if (syncUrl) history.replaceState({ file: shareFile }, '', buildShareUrl(shareFile));
      } else {
        renderMainView();
        if (syncUrl) history.replaceState(null, '', buildMainUrl());
      }
    } catch (e) {
      console.error(e);
      showStatus('加载失败：' + e.message, true);
    }
  }

  /* ===================== 主视图 ===================== */
  function renderMainView() {
    hideStatus();
    $('share-view').classList.remove('active');
    $('main-view').classList.add('active');

    state.activeCat = '__all__';
    state.query = '';
    $('search').value = '';

    renderSidebar();
    renderFiles();
  }

  function countByCategory() {
    const counts = {};
    state.files.forEach(f => {
      const c = getCategory(f.path);
      counts[c] = (counts[c] || 0) + 1;
    });
    return counts;
  }

  function renderSidebar() {
    const nav = $('cat-nav');
    nav.innerHTML = '';

    const counts = countByCategory();
    const cats = Object.keys(counts).sort(catSort);

    nav.appendChild(makeCatItem('__all__', '🗂️', '全部文件', state.files.length));
    cats.forEach(c => {
      nav.appendChild(makeCatItem(c, CATEGORY_ICON[c] || '📁', c, counts[c]));
    });
  }

  function makeCatItem(key, icon, label, count) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-item' + (state.activeCat === key ? ' active' : '');

    const ic = document.createElement('span');
    ic.className = 'ci';
    ic.textContent = icon;

    const cn = document.createElement('span');
    cn.className = 'cn';
    cn.textContent = label;

    const cc = document.createElement('span');
    cc.className = 'cc';
    cc.textContent = count;

    btn.appendChild(ic);
    btn.appendChild(cn);
    btn.appendChild(cc);

    btn.addEventListener('click', () => {
      if (state.activeCat === key) return;
      state.activeCat = key;
      renderSidebar();
      renderFiles();
    });

    return btn;
  }

  function getVisibleFiles() {
    let list = state.files;

    if (state.activeCat !== '__all__') {
      list = list.filter(f => getCategory(f.path) === state.activeCat);
    }

    const q = state.query.trim().toLowerCase();
    if (q) list = list.filter(f => f.path.toLowerCase().includes(q));

    const arr = list.slice();
    if (state.sort === 'name') {
      arr.sort((a, b) => baseName(a.path).localeCompare(baseName(b.path), 'zh'));
    } else if (state.sort === 'size') {
      arr.sort((a, b) => (b.size || 0) - (a.size || 0));
    } else {
      arr.sort((a, b) => a.path.localeCompare(b.path, 'zh'));
    }
    return arr;
  }

  function renderFiles() {
    const files = getVisibleFiles();
    const grid = $('file-grid');
    grid.innerHTML = '';

    if (!files.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = state.query ? '没有匹配的文件' : '这个分类下没有文件';
      grid.appendChild(empty);
    } else {
      const frag = document.createDocumentFragment();
      files.forEach(f => frag.appendChild(makeCard(f)));
      grid.appendChild(frag);
    }

    $('stats').textContent = files.length + ' / ' + state.files.length + ' 个文件';
  }

  function makeCard(f) {
    const name = baseName(f.path);
    const dir = dirName(f.path);

    const card = document.createElement('article');
    card.className = 'card';
    card.title = f.path;

    const icon = document.createElement('div');
    icon.className = 'card-icon';
    icon.textContent = getFileIcon(name);

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = name;

    card.appendChild(icon);
    card.appendChild(nameEl);

    if (dir) {
      const pathEl = document.createElement('div');
      pathEl.className = 'card-path';
      pathEl.textContent = dir;
      card.appendChild(pathEl);
    }

    const foot = document.createElement('div');
    foot.className = 'card-foot';

    const size = document.createElement('span');
    size.className = 'card-size';
    size.textContent = formatSize(f.size) || '—';

    const acts = document.createElement('div');
    acts.className = 'card-acts';

    const dl = document.createElement('button');
    dl.type = 'button';
    dl.className = 'mini';
    dl.title = '下载';
    dl.textContent = '⬇';
    dl.addEventListener('click', e => { e.stopPropagation(); downloadFile(f); });

    const sh = document.createElement('button');
    sh.type = 'button';
    sh.className = 'mini';
    sh.title = '复制分享链接';
    sh.textContent = '🔗';
    sh.addEventListener('click', e => { e.stopPropagation(); copyShareLink(f.path); });

    acts.appendChild(dl);
    acts.appendChild(sh);
    foot.appendChild(size);
    foot.appendChild(acts);
    card.appendChild(foot);

    card.addEventListener('click', () => openShare(f.path));

    return card;
  }

  /* ===================== 分享视图 ===================== */
  function renderShareView(filePath) {
    hideStatus();
    $('main-view').classList.remove('active');
    $('share-view').classList.add('active');

    const file = state.files.find(f => f.path === filePath);
    const name = baseName(filePath);
    const dir = dirName(filePath);

    $('share-icon').textContent = getFileIcon(name);
    $('share-name').textContent = name;
    $('share-path').textContent = dir ? dir + '/' : '';
    $('share-path').style.display = dir ? 'block' : 'none';

    $('share-meta').textContent = [
      file && file.size != null ? formatSize(file.size) : '',
      state.owner + '/' + state.repo + ' @ ' + state.branch
    ].filter(Boolean).join('  ·  ');

    const dl = $('share-download');
    dl.href = rawUrl(filePath);
    dl.setAttribute('download', name);
    dl.onclick = function (e) {
      e.preventDefault();
      downloadFile(file || { path: filePath, size: null });
    };

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function openShare(path, push) {
    renderShareView(path);
    if (push !== false) {
      history.pushState({ file: path }, '', buildShareUrl(path));
    }
  }

  /* ===================== 下载 ===================== */
  async function downloadFile(file) {
    const path = file.path;
    const name = baseName(path);
    const url = rawUrl(path);
    const ext = getExt(name);

    if (TEXT_EXTS.has(ext) && file.size != null && file.size < 5 * 1024 * 1024) {
      try {
        showToast('正在获取文件…');
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objUrl;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
        showToast('已开始下载：' + name);
        return;
      } catch (e) { /* 降级 */ }
    }

    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* ===================== 分享链接 ===================== */
  async function copyShareLink(filePath) {
    const link = buildShareUrl(filePath);
    try {
      await navigator.clipboard.writeText(link);
      showToast('分享链接已复制');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = link;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('分享链接已复制'); }
      catch (err) { showToast('复制失败，请手动复制：' + link); }
      document.body.removeChild(ta);
    }
  }

  /* ===================== 事件 ===================== */
  function bindEvents() {
    $('load-btn').addEventListener('click', handleLoad);

    ['repo-input', 'branch-input'].forEach(id => {
      $(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); handleLoad(); }
      });
    });

    // 搜索
    $('search').addEventListener('input', e => {
      state.query = e.target.value;
      if (state.activeCat !== '__all__') {
        state.activeCat = '__all__';
        renderSidebar();
      }
      renderFiles();
    });

    // 排序
    $('sort').addEventListener('change', e => {
      state.sort = e.target.value;
      renderFiles();
    });

    // 分享页返回
    // $('share-back').addEventListener('click', () => {
    //   if (window.history.length > 1) history.back();
    //   else {
    //     renderMainView();
    //     history.replaceState(null, '', buildMainUrl());
    //   }
    // });

    // 浏览器前进/后退
    window.addEventListener('popstate', () => {
      const p = new URLSearchParams(location.search);
      const file = p.get('file');
      if (file && state.files.some(f => f.path === file)) {
        renderShareView(file);
      } else if (state.files.length) {
        renderMainView();
      }
    });
  }

  function handleLoad() {
    const raw = $('repo-input').value;
    const parsed = parseRepoInput(raw);
    if (!parsed) {
      showStatus('无法识别仓库地址。请输入「owner/repo」或完整 GitHub URL。', true);
      return;
    }
    const branch = $('branch-input').value.trim();
    loadRepo(parsed.owner, parsed.repo, branch || parsed.branch || '', {});
  }

  /* ===================== 初始化 ===================== */
  async function init() {
    initTheme();
    bindEvents();

    const params = new URLSearchParams(location.search);
    const repoParam = params.get('repo');
    const branchParam = params.get('branch') || '';
    const fileParam = params.get('file') || null;

    let owner = '', repo = '', branch = branchParam;

    if (repoParam) {
      const parsed = parseRepoInput(repoParam);
      if (parsed) {
        owner = parsed.owner;
        repo = parsed.repo;
        if (!branch && parsed.branch) branch = parsed.branch;
      }
    }

    if (!owner) {
      let saved = '';
      try { saved = localStorage.getItem(LS_REPO) || ''; } catch (e) {}
      const parsed = parseRepoInput(saved) || parseRepoInput(DEFAULT_REPO);
      owner = parsed.owner;
      repo = parsed.repo;
      if (parsed.branch) branch = parsed.branch;
    }

    $('repo-input').value = owner + '/' + repo;
    if (branch) $('branch-input').value = branch;

    await loadRepo(owner, repo, branch, { shareFile: fileParam, syncUrl: false });
  }

  init();
})();
</script>
