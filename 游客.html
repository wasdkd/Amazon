
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺展厅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background-color: #faf9f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-900 flex flex-col min-h-screen">
    <!-- 顶部公告栏 -->
    <div id="announcement-bar" class="bg-black text-white text-xs tracking-widest text-center py-2.5"></div>

    <!-- 顶栏 -->
    <header class="sticky top-0 backdrop-blur-md z-40 border-b border-gray-100 bg-white/90">
        <div class="mx-auto py-4 flex justify-between items-center" style="max-width: 1500px; width: 94%;">
            <a href="#" id="nav-brand-name" class="text-xl font-bold tracking-widest">店铺展厅</a>
            <nav class="flex items-center space-x-6 text-xs">
                <a href="#shop" class="hover:text-gray-500 transition font-medium">选购款式</a>
                <button onclick="openWeChatModal()" class="bg-black text-white px-4 py-2 rounded text-xs hover:bg-gray-800 transition font-medium">客服 / 下单</button>
            </nav>
        </div>
    </header>

    <!-- 主容器 -->
    <main id="shop" class="mx-auto py-12 flex-grow" style="max-width: 1500px; width: 94%;">
        <!-- 未指定商家的提示栏 -->
        <div id="no-shop-notice" class="hidden bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-lg text-xs text-center mb-6">
            ⚠️ 提示：您当前未通过商家专属链接进入。请联系卖家获取完整的店铺访问链接。
        </div>

        <div class="text-center mb-12 border-b pb-4 border-gray-100">
            <h1 id="shop-header-title" class="text-2xl font-light tracking-widest">热销精选系列</h1>
        </div>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-8 gap-y-12"></div>
    </main>

    <!-- 商品详情 Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl rounded-lg overflow-hidden shadow-2xl flex flex-col md:flex-row relative" style="height: auto; max-height: 90vh;">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-white/80 hover:bg-white text-gray-800 p-1.5 rounded-full shadow transition">&times;</button>

            <div class="w-full md:w-1/2 bg-gray-50 p-6 flex flex-col justify-between overflow-y-auto no-scrollbar">
                <div>
                    <!-- 主媒体展示区 (可展示图片或视频) -->
                    <div id="modal-media-container" class="w-full overflow-hidden rounded-md bg-white border border-gray-100 flex items-center justify-center" style="aspect-ratio: 3/4;">
                        <img id="modal-main-img" src="" class="w-full h-full object-cover">
                    </div>
                    <div id="modal-thumbnails" class="flex gap-2.5 mt-3 overflow-x-auto py-1"></div>
                </div>
            </div>

            <div class="w-full md:w-1/2 p-8 flex flex-col justify-between overflow-y-auto border-t md:border-t-0 md:border-l border-gray-100">
                <div class="space-y-5">
                    <div>
                        <h2 id="modal-title" class="text-xl font-medium tracking-wide">商品标题</h2>
                        <div class="flex items-center space-x-3 mt-2">
                            <p id="modal-price" class="text-xl text-red-600 font-bold">￥0.00</p>
                            <span id="modal-stock" class="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700 font-bold">有现货</span>
                        </div>
                    </div>

                    <div id="modal-colors-wrapper" class="hidden">
                        <span class="text-xs tracking-wider text-gray-400 font-semibold block">选择颜色 / 款式</span>
                        <div id="modal-colors" class="flex flex-wrap gap-2.5 mt-2"></div>
                    </div>

                    <div id="modal-sizes-wrapper" class="hidden">
                        <span class="text-xs tracking-wider text-gray-400 font-semibold block">选择尺寸 / 规格</span>
                        <div id="modal-sizes" class="flex flex-wrap gap-2 mt-2"></div>
                    </div>

                    <div>
                        <span class="text-xs tracking-wider text-gray-400 font-semibold">商品详情说明</span>
                        <p id="modal-desc" class="text-xs text-gray-600 leading-relaxed mt-2"></p>
                    </div>
                </div>

                <div class="mt-8 pt-4 border-t border-gray-100">
                    <button onclick="openWeChatModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-3.5 rounded transition font-bold flex items-center justify-center gap-2">
                        💬 联系客服 / 咨询下单
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 微信联系 Modal -->
    <div id="wechat-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full text-center space-y-4 relative">
            <button onclick="closeWeChatModal()" class="absolute top-3 right-3 text-gray-400 hover:text-black font-bold text-lg">&times;</button>
            <h3 class="text-sm font-bold text-gray-800">联系客服</h3>

            <div id="wechat-qr-container" class="hidden my-2">
                <img id="wechat-qr-img" class="w-48 h-48 mx-auto border rounded p-1">
                <p class="text-xs text-gray-400 mt-1">长按保存二维码或扫一扫</p>
            </div>

            <div class="bg-gray-50 p-3 rounded border text-xs">
                <span class="text-gray-500 block text-xs">添加</span>
                <span id="wechat-id-text" class="font-bold text-sm text-gray-800 select-all"></span>
            </div>

            <button onclick="copyWeChatId()" class="w-full bg-black text-white text-xs py-2.5 rounded font-bold hover:bg-gray-800 transition">复制</button>
        </div>
    </div>

    <footer class="bg-black text-gray-500 py-8 text-xs border-t border-gray-900 mt-auto">
        <div class="mx-auto text-center space-y-2" style="max-width: 1500px; width: 94%;">
            <div id="footer-copy">© 2026 版权所有.</div>
        </div>
    </footer>

    <script src="products.js"></script>
    <script>
        let appConfig = {
            shopId: "default",
            shopName: "店铺展厅",
            wechatId: "后台私信",
            wechatQr: "",
            announcement: "全场支持下单 • 全国包邮 • 现货秒发",
            githubRepo: "wasdkd/Amazon",
            githubBranch: "main"
        };

        let products = [];

        function getShopIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('shop') || urlParams.get('shopId') || "";
        }

        // 原生 UTF-8 Base64 解码器
        function decodeUtf8Base64(base64Str) {
            const cleanBase64 = base64Str.replace(/\s/g, '');
            const binaryStr = atob(cleanBase64);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        async function fetchProductsFromGitHub() {
            const shopId = getShopIdFromUrl();
            if (!shopId) {
                document.getElementById('no-shop-notice').classList.remove('hidden');
                return window.soraProducts || [];
            }

            try {
                const apiUrl = `https://api.github.com/repos/${appConfig.githubRepo}/contents/stores/${shopId}/products.json?ref=${appConfig.githubBranch}&t=${Date.now()}`;
                const apiRes = await fetch(apiUrl, { cache: 'no-store' });
                if (apiRes.ok) {
                    const apiData = await apiRes.json();
                    const jsonStr = decodeUtf8Base64(apiData.content);
                    const productsData = JSON.parse(jsonStr);
                    if (Array.isArray(productsData)) {
                        return productsData;
                    }
                }
            } catch (e) {}

            try {
                const rawUrl = `https://raw.githubusercontent.com/${appConfig.githubRepo}/${appConfig.githubBranch}/stores/${shopId}/products.json?t=${Date.now()}`;
                const rawRes = await fetch(rawUrl, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache, no-store' } });
                if (rawRes.ok) {
                    const productsData = await rawRes.json();
                    if (Array.isArray(productsData)) {
                        return productsData;
                    }
                }
            } catch (e) {}

            const localSaved = localStorage.getItem(`sora_products_${shopId}`);
            if (localSaved) {
                try { return JSON.parse(localSaved); } catch (e) {}
            }

            return window.soraProducts || [];
        }

        async function fetchShopConfigFromGitHub(shopId) {
            if (!shopId) return;
            try {
                const apiUrl = `https://api.github.com/repos/${appConfig.githubRepo}/contents/stores/${shopId}/config.json?ref=${appConfig.githubBranch}&t=${Date.now()}`;
                const res = await fetch(apiUrl, { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    const cfg = JSON.parse(decodeUtf8Base64(data.content));
                    if (cfg && cfg.shopName) {
                        appConfig = { ...appConfig, ...cfg };
                    }
                }
            } catch (e) {}
        }

        async function initApp() {
            const shopId = getShopIdFromUrl();
            const localConfig = localStorage.getItem('sora_config');
            if (localConfig) {
                try { appConfig = { ...appConfig, ...JSON.parse(localConfig) }; } catch (e) {}
            }

            if (shopId) {
                appConfig.shopId = shopId;
                await fetchShopConfigFromGitHub(shopId);
            }

            products = await fetchProductsFromGitHub();
            applyConfig();
            renderProducts();
        }

        function applyConfig() {
            document.title = appConfig.shopName + " | 官方展示展厅";
            document.getElementById('nav-brand-name').innerText = appConfig.shopName;
            document.getElementById('announcement-bar').innerText = appConfig.announcement;
            document.getElementById('wechat-id-text').innerText = appConfig.wechatId;
            document.getElementById('footer-copy').innerText = `© 2026 ${appConfig.shopName}. 保留所有权利.`;

            if (appConfig.wechatQr) {
                document.getElementById('wechat-qr-img').src = appConfig.wechatQr;
                document.getElementById('wechat-qr-container').classList.remove('hidden');
            }
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-lg border border-dashed border-gray-200">
                        <p class="text-gray-400 text-xs">商家暂未发布商品</p>
                    </div>
                `;
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "flex flex-col bg-white p-4 rounded-lg shadow-sm border border-gray-100 relative group cursor-pointer hover:shadow-md transition";
                card.onclick = () => openProduct(p.id);

                const imgUrl = p.img1 || 'https://via.placeholder.com/400x600?text=暂无图片';

                card.innerHTML = `
                    <div class="relative overflow-hidden bg-gray-50 mb-4 rounded-md" style="aspect-ratio: 3/4;">
                        <img src="${imgUrl}" class="absolute inset-0 w-full h-full object-cover">
                    </div>
                    <div class="space-y-1">
                        <h3 class="font-medium text-xs md:text-sm text-gray-800 line-clamp-1">${p.title}</h3>
                        <div class="flex justify-between items-center pt-1">
                            <p class="text-red-600 font-bold text-sm">￥${p.price.toFixed(2)}</p>
                            <span class="text-xs font-bold ${p.stock > 0 ? 'text-green-600' : 'text-red-500'}">
                                ${p.stock > 0 ? '库存: ' + p.stock + '件' : '暂无库存'}
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openProduct(id) {
            const p = products.find(prod => String(prod.id) === String(id));
            if (!p) return;

            document.getElementById('modal-title').innerText = p.title;
            document.getElementById('modal-price').innerText = `￥${p.price.toFixed(2)}`;
            document.getElementById('modal-desc').innerText = p.desc || '暂无详细介绍';

            const stockBadge = document.getElementById('modal-stock');
            if ((p.stock ?? 0) > 0) {
                stockBadge.innerText = `库存剩余: ${p.stock} 件`;
                stockBadge.className = "text-xs px-2 py-0.5 rounded bg-green-100 text-green-700 font-bold";
            } else {
                stockBadge.innerText = "暂无库存";
                stockBadge.className = "text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-500 font-bold";
            }

            renderModalMedia(p);

            const colorsWrapper = document.getElementById('modal-colors-wrapper');
            const colorsDiv = document.getElementById('modal-colors');
            colorsDiv.innerHTML = '';
            if (p.colors && p.colors.length > 0) {
                colorsWrapper.classList.remove('hidden');
                p.colors.forEach((col, idx) => {
                    const wrap = document.createElement('div');
                    wrap.className = `flex items-center space-x-1.5 border px-2.5 py-1.5 rounded bg-white text-xs cursor-pointer transition ${idx === 0 ? 'border-black' : 'border-gray-200'}`;
                    wrap.innerHTML = `<span class="w-3 h-3 rounded-full border border-gray-300" style="background-color:${col.hex}"></span><span class="font-medium text-gray-700">${col.name}</span>`;
                    wrap.onclick = () => {
                        document.querySelectorAll('#modal-colors > div').forEach(div => div.classList.replace('border-black', 'border-gray-200'));
                        wrap.classList.replace('border-gray-200', 'border-black');
                        if (col.img) {
                            const container = document.getElementById('modal-media-container');
                            container.innerHTML = `<img id="modal-main-img" src="${col.img}" class="w-full h-full object-cover">`;
                        }
                    };
                    colorsDiv.appendChild(wrap);
                });
            } else {
                colorsWrapper.classList.add('hidden');
            }

            const sizesWrapper = document.getElementById('modal-sizes-wrapper');
            const sizesDiv = document.getElementById('modal-sizes');
            sizesDiv.innerHTML = '';
            if (p.sizes && p.sizes.length > 0) {
                sizesWrapper.classList.remove('hidden');
                p.sizes.forEach((size, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `border px-3 py-1.5 text-xs font-medium transition ${idx === 0 ? 'bg-black text-white border-black' : 'bg-white text-gray-800 border-gray-200'}`;
                    btn.innerText = size;
                    btn.onclick = () => {
                        document.querySelectorAll('#modal-sizes button').forEach(b => b.className = "border border-gray-200 px-3 py-1.5 text-xs bg-white text-gray-800");
                        btn.className = "border border-black px-3 py-1.5 text-xs bg-black text-white";
                    };
                    sizesDiv.appendChild(btn);
                });
            } else {
                sizesWrapper.classList.add('hidden');
            }

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        /* 🎬 支持图片与 MP4 视频缩略图及大屏切换 */
        function renderModalMedia(p) {
            const container = document.getElementById('modal-media-container');
            const thumbsDiv = document.getElementById('modal-thumbnails');

            const mediaList = [];
            if (p.video) mediaList.push({ type: 'video', url: p.video, poster: p.img1 });
            if (p.img1) mediaList.push({ type: 'image', url: p.img1 });
            if (p.img2) mediaList.push({ type: 'image', url: p.img2 });
            if (p.img3) mediaList.push({ type: 'image', url: p.img3 });
            if (p.img4) mediaList.push({ type: 'image', url: p.img4 });

            if (mediaList.length === 0) {
                container.innerHTML = `<img id="modal-main-img" src="https://via.placeholder.com/400x600?text=暂无媒体" class="w-full h-full object-cover">`;
                thumbsDiv.innerHTML = '';
                return;
            }

            function displayMedia(mediaItem) {
                if (mediaItem.type === 'video') {
                    container.innerHTML = `<video src="${mediaItem.url}" controls autoplay loop class="w-full h-full object-cover bg-black rounded-md"></video>`;
                } else {
                    container.innerHTML = `<img id="modal-main-img" src="${mediaItem.url}" class="w-full h-full object-cover">`;
                }
            }

            displayMedia(mediaList[0]);

            thumbsDiv.innerHTML = '';
            if (mediaList.length > 1) {
                mediaList.forEach((media) => {
                    const btn = document.createElement('div');
                    btn.className = "w-12 h-16 border rounded overflow-hidden cursor-pointer flex-shrink-0 border-gray-200 relative group hover:border-black transition";

                    if (media.type === 'video') {
                        const poster = media.poster || 'https://via.placeholder.com/100?text=Video';
                        btn.innerHTML = `
                            <img src="${poster}" class="w-full h-full object-cover opacity-80">
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                                <span class="text-white text-xs font-bold bg-black/60 px-1 py-0.5 rounded">▶ 视频</span>
                            </div>
                        `;
                    } else {
                        btn.innerHTML = `<img src="${media.url}" class="w-full h-full object-cover">`;
                    }

                    btn.onclick = () => displayMedia(media);
                    thumbsDiv.appendChild(btn);
                });
            }
        }

        function openWeChatModal() { document.getElementById('wechat-modal').classList.remove('hidden'); }
        function closeWeChatModal() { document.getElementById('wechat-modal').classList.add('hidden'); }
        function copyWeChatId() { navigator.clipboard.writeText(appConfig.wechatId); alert('已复制！'); }
        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        window.onload = initApp;
    </script>
</body>
</html>
