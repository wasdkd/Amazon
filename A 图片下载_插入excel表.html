    <script>
        const AUTO_GEN_KEY = "__AUTO_GENERATE_UNIQUE_CODE__";
        let currentFile = null;
        let loadedWorkbook = null;
        let isProcessing = false;
        let detectedHeaders = [];

        const dropArea = document.getElementById('dropArea');
        const excelInput = document.getElementById('excelInput');
        const fileInfo = document.getElementById('fileInfo');
        const configCard = document.getElementById('configCard');
        const nameColSelect = document.getElementById('nameColSelect');
        const urlColSelect = document.getElementById('urlColSelect');
        const corsProxySelect = document.getElementById('corsProxySelect');
        const autoCodeConfig = document.getElementById('autoCodeConfig');
        const autoCodeHeaderName = document.getElementById('autoCodeHeaderName');
        const autoCodePrefix = document.getElementById('autoCodePrefix');
        const previewThead = document.getElementById('previewThead');
        const previewTbody = document.getElementById('previewTbody');
        const previewSheetName = document.getElementById('previewSheetName');
        const startBtn = document.getElementById('startBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusText = document.getElementById('statusText');
        const logBox = document.getElementById('logBox');

        ['dragover', 'dragleave', 'drop'].forEach(evt => {
            dropArea.addEventListener(evt, (e) => {
                e.preventDefault();
                if (evt === 'dragover') dropArea.classList.add('active');
                else dropArea.classList.remove('active');
            });
        });

        dropArea.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files[0]);
        });
        excelInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleUpload(e.target.files[0]);
        });

        async function handleUpload(file) {
            if (!file.name.match(/\.xlsx$/i)) {
                alert('请上传标准的 .xlsx 格式文件！');
                return;
            }
            currentFile = file;
            fileInfo.textContent = `已载入: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                loadedWorkbook = new ExcelJS.Workbook();
                await loadedWorkbook.xlsx.load(arrayBuffer);

                const firstSheet = loadedWorkbook.worksheets[0];
                if (!firstSheet || firstSheet.rowCount < 1) {
                    alert('Excel 文件为空或没有有效工作表！');
                    return;
                }

                initPreviewAndSelectors(firstSheet);
                configCard.style.display = 'block';
                configCard.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert('解析 Excel 文件失败: ' + err.message);
                console.error(err);
            }
        }

        function initPreviewAndSelectors(sheet) {
            previewSheetName.textContent = `当前预览子表: [${sheet.name}]`;
            detectedHeaders = [];
            nameColSelect.innerHTML = '';
            urlColSelect.innerHTML = '';

            const autoOpt = new Option("➕ [推荐] 自动生成唯一编码列 (自增编号)", AUTO_GEN_KEY);
            nameColSelect.add(autoOpt);

            const headerRow = sheet.getRow(1);
            headerRow.eachCell({ includeEmpty: false }, (cell, colNumber) => {
                const val = extractPureValue(cell.value);
                const strVal = (val !== null && val !== undefined) ? val.toString().trim() : '';
                detectedHeaders.push({ colNumber, name: strVal || `列 ${colNumber}` });
            });

            detectedHeaders.forEach(h => {
                nameColSelect.add(new Option(h.name, h.name));
                urlColSelect.add(new Option(h.name, h.name));
            });

            let defaultNameCol = AUTO_GEN_KEY;
            let defaultUrlCol = detectedHeaders[detectedHeaders.length - 1].name;

            detectedHeaders.forEach(h => {
                const lower = h.name.toLowerCase();
                if (/asin|sku|编号|编码|款号|名称|id|货号/.test(lower)) defaultNameCol = h.name;
                if (/图片|链接|url|image|img|主图|photo|pic/.test(lower)) defaultUrlCol = h.name;
            });

            nameColSelect.value = defaultNameCol;
            urlColSelect.value = defaultUrlCol;

            renderPreviewTable(sheet);

            nameColSelect.onchange = () => {
                toggleAutoCodeBox();
                updateTableHighlights();
            };
            urlColSelect.onchange = () => updateTableHighlights();

            toggleAutoCodeBox();
            updateTableHighlights();
        }

        function toggleAutoCodeBox() {
            autoCodeConfig.style.display = (nameColSelect.value === AUTO_GEN_KEY) ? 'grid' : 'none';
        }

        function renderPreviewTable(sheet) {
            previewThead.innerHTML = '';
            previewTbody.innerHTML = '';

            const trHead = document.createElement('tr');
            detectedHeaders.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h.name;
                th.setAttribute('data-colname', h.name);
                trHead.appendChild(th);
            });
            previewThead.appendChild(trHead);

            const maxRow = Math.min(sheet.rowCount, 11);
            for (let r = 2; r <= maxRow; r++) {
                const row = sheet.getRow(r);
                const tr = document.createElement('tr');
                detectedHeaders.forEach(h => {
                    const td = document.createElement('td');
                    const val = extractPureValue(row.getCell(h.colNumber).value);
                    td.textContent = (val !== null && val !== undefined) ? val.toString() : '';
                    td.setAttribute('data-colname', h.name);
                    tr.appendChild(td);
                });
                previewTbody.appendChild(tr);
            }
        }

        function updateTableHighlights() {
            const selectedName = nameColSelect.value;
            const selectedUrl = urlColSelect.value;

            document.querySelectorAll('#previewTable [data-colname]').forEach(el => {
                const cName = el.getAttribute('data-colname');
                el.classList.remove('col-highlight-name', 'col-highlight-url');
                if (cName === selectedName) el.classList.add('col-highlight-name');
                if (cName === selectedUrl) el.classList.add('col-highlight-url');
            });
        }

        function extractPureValue(val) {
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') {
                if (val.result !== undefined) return val.result;
                if (val.richText) return val.richText.map(t => t.text).join('');
                if (val.text !== undefined) return val.text;
                if (val.formula !== undefined) return '';
            }
            return val;
        }

        startBtn.addEventListener('click', async () => {
            if (!loadedWorkbook || isProcessing) return;

            const nameHeader = nameColSelect.value;
            const urlHeader = urlColSelect.value;

            if (!urlHeader) {
                alert('请指定【图片链接列】！');
                return;
            }

            isProcessing = true;
            startBtn.disabled = true;
            startBtn.innerText = '正在全力处理中...';
            progressContainer.style.display = 'block';
            logBox.innerHTML = '';

            try {
                await processWorkbook(nameHeader, urlHeader);
            } catch (err) {
                addLog(`处理出错: ${err.message}`, 'error');
                console.error(err);
            } finally {
                isProcessing = false;
                startBtn.disabled = false;
                startBtn.innerText = '开始处理并导出打包文件';
            }
        });

        async function processWorkbook(targetNameHeader, targetUrlHeader) {
            const shouldMerge = document.getElementById('mergeSheetMode').value === 'merge';
            const concurrency = parseInt(document.getElementById('concurrencyCount').value) || 5;
            const proxyMode = corsProxySelect.value;
            const isAutoGenerateCode = (targetNameHeader === AUTO_GEN_KEY);
            const autoHeaderTitle = autoCodeHeaderName.value.trim() || '系统唯一编号';
            const codePrefix = autoCodePrefix.value.trim();

            const finalWorkbook = new ExcelJS.Workbook();
            const downloadTasks = [];
            let globalAutoIndex = 1;

            if (shouldMerge) {
                addLog('正在合并所有子表并消除公式冲突...', 'info');
                const mergedSheet = finalWorkbook.addWorksheet('合并汇总');
                let mergedHeaders = null;

                loadedWorkbook.eachSheet((sheet) => {
                    if (sheet.rowCount < 2) return;
                    const map = findColumnIndices(sheet, targetNameHeader, targetUrlHeader, isAutoGenerateCode);
                    if (map.urlCol === -1 || (!isAutoGenerateCode && map.nameCol === -1)) {
                        addLog(`工作表 [${sheet.name}] 未找到对应列，已跳过`, 'warn');
                        return;
                    }

                    if (!mergedHeaders) {
                        mergedHeaders = ['图片'];
                        if (isAutoGenerateCode) mergedHeaders.push(autoHeaderTitle);

                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell) => {
                            mergedHeaders.push(extractPureValue(cell.value));
                        });

                        const headerRow = mergedSheet.getRow(1);
                        headerRow.values = mergedHeaders;
                        headerRow.commit();
                        mergedSheet.getColumn(1).width = 20;
                    }

                    for (let r = 2; r <= sheet.rowCount; r++) {
                        const row = sheet.getRow(r);
                        const urlVal = extractPureValue(row.getCell(map.urlCol).value);
                        if (!urlVal && !row.hasValues) continue;

                        let customName = '';
                        if (isAutoGenerateCode) {
                            customName = `${codePrefix}${globalAutoIndex}`;
                            globalAutoIndex++;
                        } else {
                            const nameVal = extractPureValue(row.getCell(map.nameCol).value);
                            customName = sanitizeFilename(nameVal, `ROW_${r}`);
                        }

                        const rowData = [''];
                        if (isAutoGenerateCode) rowData.push(customName);

                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, colNum) => {
                            rowData.push(extractPureValue(row.getCell(colNum).value));
                        });

                        const appendedRow = mergedSheet.addRow(rowData);
                        downloadTasks.push({
                            sheet: mergedSheet,
                            rowIdx: appendedRow.number,
                            customName: customName,
                            url: (urlVal || '').toString().trim()
                        });
                    }
                });

                if (!mergedHeaders) throw new Error('未检索到符合条件的子表数据');

            } else {
                addLog('正在独立处理各个子表并纯化单元格...', 'info');

                loadedWorkbook.eachSheet((sheet) => {
                    if (sheet.rowCount < 2) return;
                    const map = findColumnIndices(sheet, targetNameHeader, targetUrlHeader, isAutoGenerateCode);
                    if (map.urlCol === -1 || (!isAutoGenerateCode && map.nameCol === -1)) {
                        addLog(`工作表 [${sheet.name}] 缺少所需列，已跳过`, 'warn');
                        return;
                    }

                    const newSheet = finalWorkbook.addWorksheet(sheet.name);
                    const newHeaders = ['图片'];
                    if (isAutoGenerateCode) newHeaders.push(autoHeaderTitle);

                    sheet.getRow(1).eachCell({ includeEmpty: false }, (cell) => {
                        newHeaders.push(extractPureValue(cell.value));
                    });

                    newSheet.getRow(1).values = newHeaders;
                    newSheet.getColumn(1).width = 20;

                    for (let r = 2; r <= sheet.rowCount; r++) {
                        const row = sheet.getRow(r);
                        const urlVal = extractPureValue(row.getCell(map.urlCol).value);
                        if (!urlVal && !row.hasValues) continue;

                        let customName = '';
                        if (isAutoGenerateCode) {
                            customName = `${codePrefix}${globalAutoIndex}`;
                            globalAutoIndex++;
                        } else {
                            const nameVal = extractPureValue(row.getCell(map.nameCol).value);
                            customName = sanitizeFilename(nameVal, `ROW_${r}`);
                        }

                        const rowData = [''];
                        if (isAutoGenerateCode) rowData.push(customName);

                        sheet.getRow(1).eachCell({ includeEmpty: false }, (cell, colNum) => {
                            rowData.push(extractPureValue(row.getCell(colNum).value));
                        });

                        const appendedRow = newSheet.addRow(rowData);
                        downloadTasks.push({
                            sheet: newSheet,
                            rowIdx: appendedRow.number,
                            customName: customName,
                            url: (urlVal || '').toString().trim()
                        });
                    }
                });
            }

            if (downloadTasks.length === 0) throw new Error('没有检索到可下载的数据！');

            addLog(`检索到 ${downloadTasks.length} 条记录，启动防跨域并发下载...`, 'info');

            const namedZip = new JSZip();
            const seqZip = new JSZip();

            const CELL_PIXEL_W = 145;
            const CELL_PIXEL_H = 160;
            const ROW_HEIGHT = 120;
            const EMU = 9525;

            let completed = 0;
            let success = 0;
            let failed = 0;

            await runWorkerPool(downloadTasks, concurrency, async (task, index) => {
                const seqIndex = index + 1;
                if (!task.url) {
                    completed++;
                    failed++;
                    updateProgress(completed, downloadTasks.length);
                    return;
                }

                try {
                    // 使用防跨域网络请求
                    const blob = await fetchImageWithBypass(task.url, proxyMode);
                    const ext = getExtension(blob, task.url);

                    // 1. 唯一码命名包
                    namedZip.file(`${task.customName}.${ext}`, blob);

                    // 2. 顺序编号包
                    seqZip.file(`图片${seqIndex}.${ext}`, blob);

                    // 3. 插入 Excel
                    const base64 = await blobToBase64(blob);
                    const dim = await getImageDimensions(blob);

                    const scale = Math.min(CELL_PIXEL_W / dim.w, CELL_PIXEL_H / dim.h);
                    const finalW = Math.max(1, Math.floor(dim.w * scale));
                    const finalH = Math.max(1, Math.floor(dim.h * scale));
                    const offsetX = Math.floor((CELL_PIXEL_W - finalW) / 2 * EMU);
                    const offsetY = Math.floor((CELL_PIXEL_H - finalH) / 2 * EMU);

                    const imgId = finalWorkbook.addImage({
                        base64: base64,
                        extension: ext === 'jpg' ? 'jpeg' : ext
                    });

                    task.sheet.addImage(imgId, {
                        tl: { col: 0, row: task.rowIdx - 1, nativeColOff: offsetX, nativeRowOff: offsetY },
                        ext: { width: finalW, height: finalH },
                        editAs: 'oneCell'
                    });

                    task.sheet.getRow(task.rowIdx).height = ROW_HEIGHT;
                    success++;
                    addLog(`[${seqIndex}] 成功: ${task.customName}`, 'success');
                } catch (e) {
                    failed++;
                    addLog(`[${seqIndex}] 失败: ${task.customName} (${e.message})`, 'error');
                } finally {
                    completed++;
                    updateProgress(completed, downloadTasks.length);
                }
            });

            addLog(`图片下载完成！成功: ${success}，失败: ${failed}。正在安全导出 Excel...`, 'info');
            statusText.textContent = '生成打包压缩包中...';

            const excelBuffer = await finalWorkbook.xlsx.writeBuffer();
            const rootZip = new JSZip();
            rootZip.file("处理结果.xlsx", excelBuffer);

            const folderNamed = rootZip.folder("唯一编码命名图片");
            namedZip.forEach((relPath, file) => folderNamed.file(relPath, file.async('blob')));

            const folderSeq = rootZip.folder("按表格顺序重命名图片");
            seqZip.forEach((relPath, file) => folderSeq.file(relPath, file.async('blob')));

            const finalBlob = await rootZip.generateAsync({ type: "blob" });
            saveAs(finalBlob, `Excel图片处理结果_${new Date().toISOString().slice(0,10)}.zip`);

            addLog('🎉 全部完成！ZIP 压缩包已开始下载。', 'success');
            statusText.textContent = '全部处理完成！';
        }

        // --- 核心防跨域下载函数 ---

        async function fetchImageWithBypass(rawUrl, proxyMode) {
            let targetUrl = rawUrl.trim();
            if (targetUrl.startsWith('//')) targetUrl = 'https:' + targetUrl;
            // 亚马逊高清规则清洗
            targetUrl = targetUrl.replace(/(\/I\/[^/.]+)(\.[^/]*)(\.[a-zA-Z]+)$/, '$1$3');

            // 模式 A：强制走跨域穿透通道
            if (proxyMode === 'always') {
                return await fetchViaProxy(targetUrl);
            }

            // 模式 B：仅直连
            if (proxyMode === 'none') {
                const res = await fetch(targetUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            }

            // 模式 C：智能模式 (优先直连，出现 CORS 或网络错误自动降级切入代理)
            try {
                const res = await fetch(targetUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            } catch (err) {
                // 捕获 Failed to fetch / CORS 拦截，静默切换至高速代理隧道
                return await fetchViaProxy(targetUrl);
            }
        }

        // 多级防跨域中继服务，轮换防止单点失效
        async function fetchViaProxy(url) {
            const encodedUrl = encodeURIComponent(url);
            const proxyList = [
                // 1. 国际专业图片 CDN 镜像 (免 CORS，且响应速度极快)
                `https://images.weserv.nl/?url=${encodedUrl}&default=${encodedUrl}`,
                // 2. 纯 CORS 代理隧道
                `https://api.allorigins.win/raw?url=${encodedUrl}`,
                `https://corsproxy.io/?url=${encodedUrl}`
            ];

            let lastErr = null;
            for (let proxyUrl of proxyList) {
                try {
                    const res = await fetch(proxyUrl);
                    if (res.ok) {
                        const blob = await res.blob();
                        // 校验是否为有效图片
                        if (blob.size > 200) return blob;
                    }
                } catch (e) {
                    lastErr = e;
                }
            }
            throw new Error(`跨域穿透失败: ${lastErr ? lastErr.message : '所有通道无响应'}`);
        }

        function findColumnIndices(sheet, nameHeader, urlHeader, isAutoGenerateCode) {
            let nameCol = -1;
            let urlCol = -1;
            const headerRow = sheet.getRow(1);
            headerRow.eachCell({ includeEmpty: false }, (cell, colNumber) => {
                const val = (extractPureValue(cell.value) || '').toString().trim();
                if (!isAutoGenerateCode && val === nameHeader) nameCol = colNumber;
                if (val === urlHeader) urlCol = colNumber;
            });
            return { nameCol, urlCol };
        }

        function getExtension(blob, url) {
            if (blob.type) {
                const sub = blob.type.split('/')[1];
                if (sub && sub.length <= 4) return sub.replace('jpeg', 'jpg');
            }
            try {
                const pathname = new URL(url).pathname;
                const ext = pathname.split('.').pop().toLowerCase();
                if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) return ext === 'jpeg' ? 'jpg' : ext;
            } catch (e) {}
            return 'jpg';
        }

        function getImageDimensions(blob) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve({ w: img.naturalWidth || 100, h: img.naturalHeight || 100 });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    resolve({ w: 100, h: 100 });
                };
                img.src = url;
            });
        }

        function sanitizeFilename(val, fallback) {
            if (!val) return fallback;
            const str = val.toString().trim().replace(/[\\/:*?"<>|]/g, '_');
            return str || fallback;
        }

        async function runWorkerPool(items, maxWorkers, taskFn) {
            let cursor = 0;
            const workers = Array(Math.min(maxWorkers, items.length)).fill(0).map(async () => {
                while (cursor < items.length) {
                    const currentIndex = cursor++;
                    await taskFn(items[currentIndex], currentIndex);
                    // 加入轻微平滑间隔，避免大并发冲击触发对方 CDN 频控
                    await new Promise(r => setTimeout(r, 60));
                }
            });
            await Promise.all(workers);
        }

        function updateProgress(done, total) {
            const pct = Math.round((done / total) * 100) + '%';
            progressBar.style.width = pct;
            progressText.innerText = pct;
            statusText.innerText = `已完成 ${done} / ${total}`;
        }

        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        const readFileAsArrayBuffer = (f) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsArrayBuffer(f);
        });

        const blobToBase64 = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    </script>
