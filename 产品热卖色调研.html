  /* 卡片样式 */

  .img-lightbox {

</style>

<script>
/* 工具函数 */
function isRowEmpty(row) {
  if (!row || !Array.isArray(row)) return true;
  return row.every(c => String(c == null ? '' : c).trim() === '');
}
function toNumber(v) {
  if (v == null) return 0;
  const s = String(v).replace(/,/g, '').trim();
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function extractAsin(str) {
  if (!str) return '';
  const s = String(str);
  const m1 = s.match(/\b(B0[A-Z0-9]{8})\b/i);
  if (m1) return m1[1].toUpperCase();
  const m2 = s.match(/\b([A-Z0-9]{10})\b/);
  return m2 ? m2[1].toUpperCase() : '';
}
function parseSku(skuStr) {
  const result = { color: '', size: '' };
  if (!skuStr) return result;
  const tokens = String(skuStr).split('|').map(t => t.trim()).filter(Boolean);
  for (const t of tokens) {
    const idx = t.indexOf(':');
    if (idx < 0) continue;
    const key = t.slice(0, idx).trim().toLowerCase();
    const val = t.slice(idx + 1).trim();
    if (key.includes('color') || key.includes('colour') || key.includes('颜色')) result.color = val;
    else if (key.includes('size') || key.includes('尺码') || key.includes('尺寸')) result.size = val;
  }
  return result;
}
function normalizeImgUrl(url) {
  if (!url) return '';
  const s = String(url).trim();
  if (!/^https?:/i.test(s)) return '';
  const r1 = s.replace(/(\/I\/[A-Za-z0-9%_-]+)\.[^\/]*\.(jpe?g|png|webp)(?:\?.*)?$/i, '$1.$2');
  if (r1 !== s) return r1;
  return s.replace(/\._[^\/]*\.(jpe?g|png|webp)(?:\?.*)?$/i, '.$1');
}
function sanitizeName(n) {
  return String(n || '').replace(/[\\\/:*?"<>|]/g, '_').trim() || 'unknown';
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
function collectFiles(fileLists) {
  const out = [], seen = new Set();
  for (const list of fileLists) {
    if (!list) continue;
    for (const f of list) {
      const key = f.webkitRelativePath || (f.name + '_' + f.size);
      if (seen.has(key)) continue;
      seen.add(key);
      if (/\.(xlsx|xls|csv)$/i.test(f.name)) out.push(f);
    }
  }
  return out;
}
const SIZE_ORDER = ['XXS','XS','S','M','L','XL','XXL','XXXL','XXXXL','XXXXXL','2XL','3XL','4XL','5XL','均码','F','FREE'];
const SIZE_ALIAS = {
  'XXSMALL':'XXS','XSMALL':'XS','X-SMALL':'XS','X SMALL':'XS',
  'SMALL':'S','MEDIUM':'M','LARGE':'L',
  'X-LARGE':'XL','XLARGE':'XL','X LARGE':'XL',
  'XX-LARGE':'XXL','XXLARGE':'XXL','XX LARGE':'XXL','2X-LARGE':'2XL','2XLARGE':'2XL',
  'XXX-LARGE':'XXXL','XXXLARGE':'XXXL','XXX LARGE':'XXXL','3X-LARGE':'3XL','3XLARGE':'3XL',
  'XXXX-LARGE':'XXXXL','XXXXLARGE':'XXXXL','4X-LARGE':'4XL','4XLARGE':'4XL',
  'XXXXX-LARGE':'XXXXXL','5X-LARGE':'5XL','5XLARGE':'5XL',
  'ONE SIZE':'F','ONESIZE':'F','FREE SIZE':'F','FREESIZE':'F','均码':'F','均一码':'F',
};
function normalizeSize(sz) {
  const s = String(sz || '').toUpperCase().trim().replace(/\s+/g, ' ');
  if (SIZE_ALIAS[s]) return SIZE_ALIAS[s];
  const stripped = s.replace(/^SIZE\s*[:：]\s*/i, '').trim();
  if (SIZE_ALIAS[stripped]) return SIZE_ALIAS[stripped];
  return stripped || s;
}
function sizeWeight(sz) {
  const s = normalizeSize(sz);
  const idx = SIZE_ORDER.indexOf(s);
  if (idx >= 0) return idx;
  const numMatch = s.match(/^(\d+(\.\d+)?)/);
  if (numMatch) return 100 + parseFloat(numMatch[1]);
  return 999;
}
function sortSizes(sizes) {
  return sizes.slice().sort((a, b) => {
    const sa = Number(a.sortVal != null ? a.sortVal : a.sales) || 0;
    const sb = Number(b.sortVal != null ? b.sortVal : b.sales) || 0;
    if (sb !== sa) return sb - sa;
    return sizeWeight(a.size) - sizeWeight(b.size);
  });
}

function parseMonthLabel(h) {
  const s = String(h || '');
  const m = s.match(/(20\d\d)\s*[\-\/\.\年]?\s*(\d{1,2})/);
  if (!m) return null;
  const y = parseInt(m[1], 10);
  const mo = parseInt(m[2], 10);
  if (mo < 1 || mo > 12) return null;
  return { year: y, month: mo };
}
function fmtMonthStr(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }
function monthStrToDate(v) {
  if (!v) return null;
  const parts = String(v).split('-').map(n => parseInt(n, 10));
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return new Date(parts[0], parts[1] - 1, 1);
}
function collectAvailableMonths(books, keyword, headerRowNum) {
  const monthSet = new Set();
  const defaultHeaderIdx = Math.max(0, (headerRowNum || 1) - 1);
  for (const bk of books) {
    let sheetNames = bk.workbook.SheetNames || [];
    let matchedSheets = keyword ? sheetNames.filter(sn => String(sn).includes(keyword)) : sheetNames;
    if (!matchedSheets.length && sheetNames.length) matchedSheets = [sheetNames[0]];

    for (const sn of matchedSheets) {
      const ws = bk.workbook.Sheets[sn];
      if (!ws) continue;
      const arr = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: true, defval: '' });
      if (!arr.length) continue;
      let hIdx = defaultHeaderIdx;
      if (hIdx >= arr.length) continue;
      let headers = (arr[hIdx] || []).map(h => String(h || '').trim());
      const looksHeader = hs => hs.some(h => /^(sku|asin|父\s*asin|parent\s*asin|全部流量词)$/i.test(h));
      if (!looksHeader(headers)) {
        let found = -1;
        for (let i = 0; i < Math.min(arr.length, 30); i++) {
          const hs = (arr[i] || []).map(h => String(h || '').trim());
          if (looksHeader(hs)) { found = i; headers = hs; break; }
        }
        if (found >= 0) hIdx = found;
      }
      for (const h of headers) {
        const p = parseMonthLabel(h);
        if (p) monthSet.add(fmtMonthStr(p.year, p.month));
      }
    }
  }
  return Array.from(monthSet).sort();
}

const COLOR_FAMILY_KEYWORDS = [
  'black', 'blue', 'green', 'brown', 'burgundy', 'red', 'pink', 'white', 'grey', 'gray',
  'navy', 'purple', 'yellow', 'orange', 'beige', 'khaki', 'gold', 'silver', 'ivory',

];
function stripColorPrefix(s) {
  let t = String(s || '').trim();
  t = t.replace(/^(color|colour|颜色|色号|色)\s*[:：]\s*/i, '').trim();
  return t;
}
function normalizeColorName(s) {
  let t = stripColorPrefix(s);
  const barIdx = t.indexOf('|');
  if (barIdx >= 0) t = t.slice(0, barIdx).trim();
  return t.replace(/\s+/g, ' ').trim();
}
function getColorGroupKey(colorName) {
  const norm = normalizeColorName(colorName).toLowerCase();
  return norm || 'other';
}
function getColorFamily(colorName) {
  const lower = normalizeColorName(colorName).toLowerCase();
  for (const kw of COLOR_FAMILY_KEYWORDS) {
    if (lower.includes(kw)) return kw === 'gray' ? 'grey' : kw;
  }
  return lower.split(/\s+/)[0] || 'other';
}

function formatItemMetricInfo(it) {

}

  const nav = $('sideNav');

  let best = null, bestDist = Infinity;

async function readAllWorkbooks(files) {
  const out = [];
  for (const f of files) {
    try {
      let wb;
      if (/\.csv$/i.test(f.name)) {
        const text = await f.text();
        wb = XLSX.read(text, { type: 'string' });
      } else {
        const buf = await f.arrayBuffer();
        wb = XLSX.read(buf, { type: 'array' });
      }
      out.push({ name: f.name, path: f.webkitRelativePath || f.name, workbook: wb });
    } catch (e) { console.error('解析失败:', f.name, e); }
  }
  return out;
}

/* 智能主数据提取 */
function extractRecords(books, keyword, headerRowNum, monthRange, dataMode, kwMetric) {
  const records = [];
  const defaultHeaderIdx = Math.max(0, (headerRowNum || 1) - 1);

  for (const bk of books) {
    let sheetNames = bk.workbook.SheetNames || [];
    let matchedSheets = keyword ? sheetNames.filter(sn => String(sn).includes(keyword)) : sheetNames;
    if (!matchedSheets.length && sheetNames.length) {
      matchedSheets = [sheetNames[0]];
    }

    for (const sn of matchedSheets) {
      const ws = bk.workbook.Sheets[sn];
      if (!ws) continue;
      const arr = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: true, defval: '' });
      if (!arr.length) continue;

      let hIdx = defaultHeaderIdx;
      if (hIdx >= arr.length) continue;
      let headers = (arr[hIdx] || []).map(h => String(h || '').trim());
      const looksHeader = hs => hs.some(h => /^(sku|asin|父\s*asin|parent\s*asin|全部流量词|自然搜索词)$/i.test(h));
      if (!looksHeader(headers)) {
        let found = -1;
        for (let i = 0; i < Math.min(arr.length, 30); i++) {
          const hs = (arr[i] || []).map(h => String(h || '').trim());
          if (looksHeader(hs)) { found = i; headers = hs; break; }
        }
        if (found >= 0) hIdx = found;
      }

      const colOf = regex => {
        for (let i = 0; i < headers.length; i++) if (regex.test(headers[i])) return i;
        return -1;
      };

      const skuCol = colOf(/^sku$/i);
      const asinCol = colOf(/^asin$/i);
      const parentCol = colOf(/^(父\s*asin|parent\s*asin)$/i);
      const colorCol = colOf(/^(颜色|color|colour)$/i);
      const sizeCol = colOf(/^(尺码|尺寸|size)$/i);
      const allKwCol = colOf(/^(全部流量词|全部词|all\s*keywords?)$/i);
      const orgKwCol = colOf(/^(自然搜索词|自然流量词|自然词|organic\s*keywords?)$/i);

      const salesCols = [];
      headers.forEach((h, i) => {
        if (monthRange) {
          const p = parseMonthLabel(h);
          if (p) {
            const d = new Date(p.year, p.month - 1, 1);
            if (d >= monthRange.start && d <= monthRange.end) salesCols.push(i);
          }
        } else {
          if (/^20\d\d/.test(h) || /(销量|sales|units)/i.test(h)) salesCols.push(i);
        }
      });

      const parentFromSheet = extractAsin(sn) || extractAsin(bk.path) || extractAsin(bk.name) || bk.name.replace(/\.[^/.]+$/, "");

      for (let r = hIdx + 1; r < arr.length; r++) {
        const row = arr[r];
        if (!row || isRowEmpty(row)) continue;
        const asinRaw = asinCol >= 0 ? String(row[asinCol] || '').trim() : '';
        const skuStr = skuCol >= 0 ? String(row[skuCol] || '').trim() : '';
        let asin = asinRaw.toUpperCase();
        if (!asin) asin = extractAsin(skuStr);
        if (!asin) continue;

        let color = colorCol >= 0 ? stripColorPrefix(String(row[colorCol] || '')) : '';
        let size = sizeCol >= 0 ? String(row[sizeCol] || '').replace(/^\s*size\s*[:：]\s*/i, '').trim() : '';

        if ((!color || !size) && skuStr) {
          const p = parseSku(skuStr);
          if (!color) color = p.color;
          if (!size) size = p.size;
        }
        color = stripColorPrefix(color);
        if (size) size = size.replace(/^\s*size\s*[:：]\s*/i, '').trim();

        const parent = ((parentCol >= 0 ? String(row[parentCol] || '').trim().toUpperCase() : '') || parentFromSheet || 'PARENT_DEFAULT');

        let rawSales = 0;
        for (const ci of salesCols) rawSales += toNumber(row[ci]);

        const allKw = allKwCol >= 0 ? toNumber(row[allKwCol]) : 0;
        const orgKw = orgKwCol >= 0 ? toNumber(row[orgKwCol]) : 0;

        let activeMetricVal = rawSales;
        if (dataMode === 'keywords') {
          if (kwMetric === 'allKw') activeMetricVal = allKw;
          else if (kwMetric === 'orgKw') activeMetricVal = orgKw;
          else if (kwMetric === 'orgRatio') activeMetricVal = allKw > 0 ? (orgKw / allKw) : 0;
        }

        records.push({
          parent,
          asin,
          colorRaw: color,
          size,
          sales: activeMetricVal,
          rawSales,
          allKw,
          orgKw,
          sourceFile: bk.name,
          sourceSheet: sn,
        });
      }
    }
  }
  return records;
}

function buildImageMap(imgBooks) {
  const map = new Map();
  for (const bk of imgBooks) {
    for (const sn of (bk.workbook.SheetNames || [])) {
      const ws = bk.workbook.Sheets[sn];
      if (!ws) continue;
      const arr = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });
      if (!arr.length) continue;
      const headers = (arr[0] || []).map(h => String(h || '').trim());
      const findIdx = cands => {
        for (const c of cands) {
          const i = headers.findIndex(h => h.toLowerCase() === c.toLowerCase());
          if (i >= 0) return i;
        }
        for (const c of cands) {
          const i = headers.findIndex(h => h.toLowerCase().includes(c.toLowerCase()));
          if (i >= 0) return i;
        }
        return -1;
      };
      const asinIdx = findIdx(['ASIN', 'asin', '子ASIN', '子asin']);
      const imgIdx = findIdx(['商品主图', '主图', 'Main Image', 'Image URL', 'ImageURL', '主图链接', '图片链接', '图片', 'Image', 'MainImage']);
      if (asinIdx < 0 || imgIdx < 0) continue;
      for (let r = 1; r < arr.length; r++) {
        const row = arr[r];
        if (!row || isRowEmpty(row)) continue;
        const asin = String(row[asinIdx] || '').trim().toUpperCase();
        const img = normalizeImgUrl(String(row[imgIdx] || '').trim());
        if (asin && img && !map.has(asin)) map.set(asin, img);
      }
    }
  }
  return map;
}

function buildSingleView(records) {
  const pcSizeMap = new Map();
  for (const rec of records) {
    if (!rec.parent || !rec.size) continue;
    const ck = getColorGroupKey(rec.colorRaw);
    const k = rec.parent + '|' + ck;
    if (!pcSizeMap.has(k)) pcSizeMap.set(k, new Map());
    const m = pcSizeMap.get(k);
    if (!m.has(rec.size)) m.set(rec.size, { size: rec.size, sales: 0, allKw: 0, orgKw: 0 });
    const sObj = m.get(rec.size);
    sObj.sales += rec.sales;
    sObj.allKw += rec.allKw;
    sObj.orgKw += rec.orgKw;
  }

  const byAsin = new Map();
  for (const rec of records) {
    if (!rec.asin) continue;
    let o = byAsin.get(rec.asin);
    if (!o) {
      o = { asin: rec.asin, parent: rec.parent || '', colorRaw: rec.colorRaw || '', colorKey: getColorGroupKey(rec.colorRaw), sales: 0, allKw: 0, orgKw: 0 };
      byAsin.set(rec.asin, o);
    }
    o.sales += rec.sales;
    o.allKw += rec.allKw;
    o.orgKw += rec.orgKw;
    if (!o.parent && rec.parent) o.parent = rec.parent;
    if (!o.colorRaw && rec.colorRaw) { o.colorRaw = rec.colorRaw; o.colorKey = getColorGroupKey(rec.colorRaw); }
  }

  const parentMap = new Map();
  for (const o of byAsin.values()) {
    if (!o.parent || !o.colorKey) continue;
    let p = parentMap.get(o.parent);
    if (!p) { p = { parent: o.parent, colorMap: new Map(), totalSales: 0, totalAllKw: 0, totalOrgKw: 0 }; parentMap.set(o.parent, p); }
    let c = p.colorMap.get(o.colorKey);
    if (!c) { c = { key: o.colorKey, raw: o.colorRaw, sales: 0, allKw: 0, orgKw: 0, asins: [] }; p.colorMap.set(o.colorKey, c); }
    c.sales += o.sales;
    c.allKw += o.allKw;
    c.orgKw += o.orgKw;
    c.asins.push({ asin: o.asin, sales: o.sales, allKw: o.allKw, orgKw: o.orgKw });
  }

  const singleView = [];
  const isRatioMode = (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio');

  for (const p of parentMap.values()) {
    const items = Array.from(p.colorMap.values());
    const total = items.reduce((s, it) => s + (isRatioMode ? it.allKw : it.sales), 0);
    p.totalSales = total;

    for (const it of items) {
      it.asins.sort((a, b) => b.sales - a.sales);
      it.repAsin = it.asins[0] ? it.asins[0].asin : '';
      it.ratio = total > 0 ? ((isRatioMode ? it.allKw : it.sales) * 100 / total) : 0;
      it.link = it.repAsin ? `https://www.amazon.com/dp/${it.repAsin}` : '';
      it.parent = p.parent;
      const k = p.parent + '|' + it.key;
      const m = pcSizeMap.get(k);
      it.sizeData = m ? Array.from(m.values()) : [];
    }

    if (isRatioMode) {
      items.sort((a, b) => {
        const ra = a.allKw > 0 ? (a.orgKw / a.allKw) : 0;
        const rb = b.allKw > 0 ? (b.orgKw / b.allKw) : 0;
        if (rb !== ra) return rb - ra;
        return b.orgKw - a.orgKw;
      });
    } else {
      items.sort((a, b) => b.sales - a.sales);
    }

    const szMap = new Map();
    for (const it of items) {
      for (const s of it.sizeData) {
        if (!szMap.has(s.size)) szMap.set(s.size, { size: s.size, sales: 0, allKw: 0, orgKw: 0 });
        const obj = szMap.get(s.size);
        obj.sales += s.sales;
        obj.allKw += s.allKw;
        obj.orgKw += s.orgKw;
      }
    }
    const rawSizes = Array.from(szMap.values());
    if (isRatioMode) {
      rawSizes.forEach(s => {
        s.sortVal = s.allKw > 0 ? (s.orgKw / s.allKw) : 0;
      });
    }
    const sizes = sortSizes(rawSizes);
    singleView.push({ parent: p.parent, items, total, sizes });
  }
  singleView.sort((a, b) => a.parent.localeCompare(b.parent));
  return singleView;
}

function buildColorGroups(singleView) {
  const map = new Map();
  const isRatioMode = (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio');

  for (const p of singleView) {
    for (const it of p.items) {
      const key = getColorGroupKey(it.raw);
      let g = map.get(key);
      if (!g) {
        g = {
          key,
          topName: key,
          displayName: key,
          items: [],
          total: 0,
          totalAllKw: 0,
          totalOrgKw: 0,
          nameCount: new Map()
        };
        map.set(key, g);
      }
      const nm = it.raw || '(未命名)';
      g.nameCount.set(nm, (g.nameCount.get(nm) || 0) + 1);
      g.total += it.sales;
      g.totalAllKw += (it.allKw || 0);
      g.totalOrgKw += (it.orgKw || 0);
      g.items.push({
        parent: p.parent,
        raw: it.raw,
        sales: it.sales,
        allKw: it.allKw || 0,
        orgKw: it.orgKw || 0,
        parentRatio: it.ratio,
        groupRatio: 0,
        repAsin: it.repAsin,
        link: it.link,
        img: '',
        sizeData: it.sizeData ? it.sizeData.slice() : [],
      });
    }
  }

  const groups = Array.from(map.values());
  const grandTotal = groups.reduce((s, g) => s + (isRatioMode ? g.totalAllKw : g.total), 0);

  for (const g of groups) {
    let best = '', bestN = -1;
    for (const [nm, n] of g.nameCount) {
      if (n > bestN || (n === bestN && nm.length < best.length)) { best = nm; bestN = n; }
    }
    g.topName = best || g.key;
    g.displayName = g.topName;
    g.grandTotal = grandTotal;

    if (isRatioMode) {
      g.items.sort((a, b) => {
        const ra = a.allKw > 0 ? (a.orgKw / a.allKw) : 0;
        const rb = b.allKw > 0 ? (b.orgKw / b.allKw) : 0;
        if (rb !== ra) return rb - ra;
        return b.orgKw - a.orgKw;
      });
    } else {
      g.items.sort((a, b) => b.sales - a.sales);
    }

    for (const it of g.items) {
      it.groupRatio = g.total > 0 ? (it.sales * 100 / g.total) : 0;
    }
    g.sizes = aggregateSizesFromItems(g.items);
    g.nameCount = null;
  }
  return groups;
}

function aggregateSizesFromItems(items) {
  const szMap = new Map();
  const isRatioMode = (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio');
  for (const it of items) {
    if (!it.sizeData) continue;
    for (const s of it.sizeData) {
      if (!szMap.has(s.size)) szMap.set(s.size, { size: s.size, sales: 0, allKw: 0, orgKw: 0 });
      const obj = szMap.get(s.size);
      obj.sales += s.sales;
      obj.allKw += (s.allKw || 0);
      obj.orgKw += (s.orgKw || 0);
    }
  }
  const rawSizes = Array.from(szMap.values());
  if (isRatioMode) {
    rawSizes.forEach(s => {
      s.sortVal = s.allKw > 0 ? (s.orgKw / s.allKw) : 0;
    });
  }
  return sortSizes(rawSizes);
}

function recomputeGroupRatios() {
  const isRatioMode = (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio');
  const grandTotal = state.colorGroups.reduce((s, g) => s + (isRatioMode ? g.totalAllKw : g.total), 0);
  for (const g of state.colorGroups) {
    g.grandTotal = grandTotal;
    g.total = g.items.reduce((s, it) => s + it.sales, 0);
    g.totalAllKw = g.items.reduce((s, it) => s + (it.allKw || 0), 0);
    g.totalOrgKw = g.items.reduce((s, it) => s + (it.orgKw || 0), 0);

    if (isRatioMode) {
      g.items.sort((a, b) => {
        const ra = a.allKw > 0 ? (a.orgKw / a.allKw) : 0;
        const rb = b.allKw > 0 ? (b.orgKw / b.allKw) : 0;
        if (rb !== ra) return rb - ra;
        return b.orgKw - a.orgKw;
      });
    } else {
      g.items.sort((a, b) => b.sales - a.sales);
    }
    for (const it of g.items) {
      it.groupRatio = g.total > 0 ? (it.sales * 100 / g.total) : 0;
    }
    g.sizes = aggregateSizesFromItems(g.items);
  }
}

function applyDisplayNames() {
  const used = new Set();
  for (const g of state.colorGroups) {
    let base = state.colorOverrides.has(g.key) ? state.colorOverrides.get(g.key) : g.topName;
    base = String(base || '').trim() || g.topName || '未命名';
    let name = base, n = 1;
    while (used.has(name)) { n++; name = `${base}-${n}`; }
    used.add(name);
    g.displayName = name;
  }
}
function nameSimilarity(a, b) {
  a = String(a || '').toLowerCase();
  b = String(b || '').toLowerCase();
  if (!a && !b) return 0;
  if (!a || !b) return -1;
  let maxLen = 0;
  for (let i = 0; i < a.length; i++) {
    for (let j = 0; j < b.length; j++) {
      let k = 0;
      while (i + k < a.length && j + k < b.length && a[i + k] === b[j + k]) k++;
      if (k > maxLen) maxLen = k;
    }
  }
  const bonus = (a[0] === b[0]) ? 2 : 0;
  return maxLen + bonus;
}
function sortGroupsByColorSimilarity() {
  const groups = state.colorGroups.slice();
  if (groups.length <= 1) return groups;
  groups.sort((a, b) => {
    const fa = getColorFamily(a.displayName || a.topName || a.key);
    const fb = getColorFamily(b.displayName || b.topName || b.key);
    if (fa !== fb) return fa.localeCompare(fb);
    return String(a.displayName).localeCompare(String(b.displayName));
  });
  const result = [];
  let i = 0;
  while (i < groups.length) {
    const fam = getColorFamily(groups[i].displayName || groups[i].topName || groups[i].key);
    const bucket = [];
    let j = i;
    while (j < groups.length && getColorFamily(groups[j].displayName || groups[j].topName || groups[j].key) === fam) {
      bucket.push(groups[j]);
      j++;
    }
    if (bucket.length > 1) {
      const remaining = bucket.slice();
      const chain = [remaining.shift()];
      while (remaining.length) {
        const last = chain[chain.length - 1];
        let bestIdx = 0, bestScore = -Infinity;
        for (let k = 0; k < remaining.length; k++) {
          const score = nameSimilarity(last.displayName, remaining[k].displayName);
          if (score > bestScore) { bestScore = score; bestIdx = k; }
        }
        chain.push(remaining.splice(bestIdx, 1)[0]);
      }
      result.push(...chain);
    } else {
      result.push(...bucket);
    }
    i = j;
  }
  return result;
}

function attachImages() {
  const get = asin => (asin ? (state.asinImageMap.get(asin) || '') : '');
  for (const p of state.singleView) {
    for (const it of p.items) it.img = get(it.repAsin);
  }
  for (const g of state.colorGroups) {
    for (const it of g.items) it.img = get(it.repAsin);
  }
}

/* ==================================================================
   Pointer 拖拽系统
================================================================== */
let isDragging = false;
let dragGhost = null;
let dragItems = [];
let dragFromGroupKey = null;
let hoveredNavItem = null;
let hoveredGrid = null;

window.addEventListener('wheel', e => {
  if (isDragging) {
    e.preventDefault();
    e.stopPropagation();
    const navWrap = $('stickyNavWrap');
    if (navWrap) navWrap.scrollTop += e.deltaY;
  }
}, { passive: false, capture: true });

function initCardPointerDrag(cardEl, it, fromGroupKey) {
  cardEl.addEventListener('pointerdown', e => {
    if (e.target.closest('.card-select')) return;
    if (e.button !== 0) return;

    const startX = e.clientX;
    const startY = e.clientY;
    let dragStarted = false;

    function onPointerMove(moveEvent) {
      if (!dragStarted) {
        if (Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY) > 6) {
          dragStarted = true;
          isDragging = true;
          dragFromGroupKey = fromGroupKey;

          if (state.selectedItems.has(it)) {
            dragItems = Array.from(state.selectedItems);
          } else {
            dragItems = [it];
          }

          dragGhost = document.createElement('div');
          dragGhost.style.cssText = `
            position: fixed; left: ${moveEvent.clientX + 12}px; top: ${moveEvent.clientY + 12}px;
            background: rgba(255, 255, 255, 0.98); border: 2px solid #3b82f6; border-radius: 8px;
            padding: 6px 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); pointer-events: none;
            z-index: 1000000; display: flex; align-items: center; gap: 8px; font-size: 12px;
            font-weight: 700; color: #1e293b;
          `;
          const thumbHtml = it.img ? `<img src="${it.img}" style="width:30px;height:40px;object-fit:cover;border-radius:4px;">` : '';
          dragGhost.innerHTML = `
            ${thumbHtml}
            <div>
              <div>移动 ${dragItems.length} 个卡片</div>
              <div style="font-size:10px; color:#2563eb; font-weight:normal;">滑轮直接翻动导航栏</div>
            </div>
          `;
          document.body.appendChild(dragGhost);

          document.querySelectorAll('.color-card.selected').forEach(c => c.classList.add('dragging-source'));
          cardEl.classList.add('dragging-source');
          const navWrap = $('stickyNavWrap');
          if (navWrap) navWrap.classList.add('drag-active');
        }
      }

      if (dragStarted && dragGhost) {
        dragGhost.style.left = (moveEvent.clientX + 12) + 'px';
        dragGhost.style.top = (moveEvent.clientY + 12) + 'px';

        const elUnder = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
        const navItem = elUnder ? elUnder.closest('.nav-item') : null;
        if (hoveredNavItem && hoveredNavItem !== navItem) {
          hoveredNavItem.classList.remove('nav-drop-hover');
        }
        if (navItem) {
          navItem.classList.add('nav-drop-hover');
          hoveredNavItem = navItem;
        } else {
          hoveredNavItem = null;
        }

        const grid = elUnder ? elUnder.closest('.grid') : null;
        if (hoveredGrid && hoveredGrid !== grid) {
          hoveredGrid.classList.remove('drop-hover');
        }
        if (grid) {
          grid.classList.add('drop-hover');
          hoveredGrid = grid;
        } else {
          hoveredGrid = null;
        }
      }
    }

    function onPointerUp(upEvent) {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);

      if (dragStarted) {
        if (dragGhost) {
          dragGhost.remove();
          dragGhost = null;
        }

        const elUnder = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
        const targetNavItem = elUnder ? elUnder.closest('.nav-item') : null;
        const targetGrid = elUnder ? elUnder.closest('.grid') : null;

        if (targetNavItem) {
          const targetKey = targetNavItem.dataset.key;
          attemptBatchMove(dragItems.slice(), targetKey, () => {
            scrollToGroup(targetKey);
          });
        } else if (targetGrid) {
          const section = targetGrid.closest('.group-section');
          if (section) {
            const targetKey = section.id.replace('group-', '');
            attemptBatchMove(dragItems.slice(), targetKey, null);
          }
        }

        document.querySelectorAll('.color-card.dragging-source').forEach(c => c.classList.remove('dragging-source'));
        document.querySelectorAll('.nav-item.nav-drop-hover').forEach(n => n.classList.remove('nav-drop-hover'));
        document.querySelectorAll('.grid.drop-hover').forEach(g => g.classList.remove('drop-hover'));
        const navWrap = $('stickyNavWrap');
        if (navWrap) navWrap.classList.remove('drag-active');

        isDragging = false;
        dragItems = [];
        dragFromGroupKey = null;
        hoveredNavItem = null;
        hoveredGrid = null;
      }
    }

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  });
}

/* 导航栏跳转定位 */
let isNavClickScrolling = false;
let navScrollTimer = null;

function scrollToGroup(key) {
  const target = document.getElementById('group-' + key);

  const navWrap = $('stickyNavWrap');

  window.scrollTo({

  });

let scrollThrottle = null;
function updateNavByScroll() {
  if (scrollThrottle || isNavClickScrolling || isDragging) return;
  scrollThrottle = setTimeout(() => {
    scrollThrottle = null;
    const secSum = $('sec-summary');
    if (!secSum || secSum.classList.contains('hidden')) return;
    const navWrap = $('stickyNavWrap');
    if (!navWrap) return;

    const navBottom = navWrap.getBoundingClientRect().bottom;

    let currentKey = '';

    for (let i = 0; i < sections.length; i++) {

      if (rect.top <= focalLine && rect.bottom > focalLine) {
        currentKey = sections[i].id.replace('group-', '');
        break;
      }
    }
    if (!currentKey && sections.length > 0) {
      const firstRect = sections[0].getBoundingClientRect();
      if (firstRect.top > focalLine && firstRect.top < window.innerHeight) {
        currentKey = sections[0].id.replace('group-', '');
      }
    }

  }, 60);

function updateBatchMoveUI() {
  const el = $('selectedSummary');
  if (el) el.textContent = `已选 ${state.selectedItems.size} 个`;
}

function findConflicts(items, targetGroupKey) {
  const target = state.colorGroups.find(g => g.key === targetGroupKey);
  if (!target) return { target: null, conflicts: [] };
  const conflicts = [];
  for (const item of items) {
    if (!item.parent) continue;
    for (const existing of target.items) {
      if (existing === item) continue;
      if (!existing.parent) continue;
      if (existing.parent === item.parent && String(existing.raw || '') !== String(item.raw || '')) {
        conflicts.push({ incoming: item, existing, parent: item.parent });
      }
    }
  }
  return { target, conflicts };
}

function highlightConflicts(conflicts) {
  for (const c of conflicts) {
    c.incoming._conflict = true;
    c.existing._conflict = true;
  }
  renderSummaryView();
}

function clearConflictHighlights(conflicts) {
  for (const c of conflicts) {
    delete c.incoming._conflict;
    delete c.existing._conflict;
  }
}

function attemptBatchMove(items, targetGroupKey, onSuccess) {
  const target = state.colorGroups.find(g => g.key === targetGroupKey);
  if (!target) return;
  const validItems = items.filter(item => !target.items.includes(item));
  if (!validItems.length) return;

  const { conflicts } = findConflicts(validItems, targetGroupKey);

  if (conflicts.length) {
    highlightConflicts(conflicts);
    const uniqueParents = new Set(conflicts.map(c => c.parent));
    const lines = [];
    const shown = conflicts.slice(0, 5);
    for (const c of shown) {
      lines.push(`· 款式/父ASIN ${c.parent}：目标组已有「${c.existing.raw || '未命名'}」，要加入「${c.incoming.raw || '未命名'}」`);
    }
    if (conflicts.length > 5) lines.push(`· …… 还有 ${conflicts.length - 5} 处冲突`);
    const msg = `⚠️ 检测到 ${uniqueParents.size} 个款式会重复出现在「${target.displayName}」组中：\n\n${lines.join('\n')}\n\n冲突项已用红色高亮显示。\n\n是否仍要移动？`;

    showConflictBanner(`⚠️ 目标组「${target.displayName}」已存在相同父款，冲突项已高亮`, 6000);

    setTimeout(() => {
      const proceed = confirm(msg);
      if (proceed) {
        clearConflictHighlights(conflicts);
        moveItemsToGroup(validItems, targetGroupKey);
        if (onSuccess) onSuccess();
        hideConflictBanner();
      } else {
        setTimeout(() => {
          clearConflictHighlights(conflicts);
          renderSummaryView();
          hideConflictBanner();
        }, 3000);
      }
    }, 60);
  } else {
    moveItemsToGroup(validItems, targetGroupKey);
    if (onSuccess) onSuccess();
  }
}

function moveItemsToGroup(items, targetGroupKey) {
  const target = state.colorGroups.find(g => g.key === targetGroupKey);
  if (!target) return 0;
  let moved = 0;
  for (const item of items) {
    let fromGroup = null;
    for (const g of state.colorGroups) {
      if (g.items.indexOf(item) >= 0) { fromGroup = g; break; }
    }
    if (!fromGroup || fromGroup === target) continue;
    const idx = fromGroup.items.indexOf(item);
    fromGroup.items.splice(idx, 1);
    target.items.push(item);
    moved++;
  }
  state.colorGroups = state.colorGroups.filter(g => g.items.length > 0 || g.custom);
  recomputeGroupRatios();
  applyDisplayNames();
  state.selectedItems.clear();
  renderSummaryView();
  saveStateDebounced();
  return moved;
}

function addNewGroup() {
  const name = prompt('请输入新颜色分组名称：', '');
  if (name == null) return;
  const trimmed = String(name).trim();
  if (!trimmed) return;
  const key = 'custom_' + Date.now();
  state.colorGroups.push({
    key, topName: trimmed, displayName: trimmed, items: [], total: 0, grandTotal: 0, totalAllKw: 0, totalOrgKw: 0, sizes: [], custom: true,
  });
  recomputeGroupRatios();
  applyDisplayNames();
  renderSummaryView();
  saveStateDebounced();
  setTimeout(() => {
    scrollToGroup(key);
  }, 100);
}

const imgCache = new Map();
async function fetchImage(url) {
  if (!url) return null;
  try {
    const resp = await fetch(url, { mode: 'cors', cache: 'force-cache' });
    if (!resp.ok) return null;
    const blob = await resp.blob();
    const buf = await blob.arrayBuffer();
    let ext = 'jpeg';
    const ct = (blob.type || '').toLowerCase();
    if (ct.includes('png')) ext = 'png';
    else if (ct.includes('gif')) ext = 'gif';
    else if (ct.includes('jpeg') || ct.includes('jpg')) ext = 'jpeg';
    else if (/\.png(\?|$)/i.test(url)) ext = 'png';
    return { buffer: new Uint8Array(buf), ext };
  } catch (e) { return null; }
}
function getImageBuffer(url) {
  if (!url) return Promise.resolve(null);
  if (!imgCache.has(url)) imgCache.set(url, fetchImage(url));
  return imgCache.get(url);
}

/* 核心优化：多线程并发并发池预加载图片（15并发速度飞快） */
async function prefetchImagesConcurrently(urls, onProgress) {
  const validUrls = Array.from(new Set(urls.filter(u => u && /^https?:/i.test(u))));
  const total = validUrls.length;
  if (!total) return;

  const concurrency = 15;
  let cursor = 0;
  let doneCount = 0;

  const workers = Array(Math.min(concurrency, total)).fill(0).map(async () => {
    while (cursor < total) {
      const idx = cursor++;
      await getImageBuffer(validUrls[idx]);
      doneCount++;
      if (onProgress) onProgress(doneCount, total);
    }
  });
  await Promise.all(workers);
}

/* 导出单款视图（带进度条、极速秒打包、带文字版Excel、款号合并到尺码排名） */
async function exportSingleZip() {
  const status = $('exportSummary');
  if (!state.singleView.length) { status.textContent = '没有单款视图数据。'; return; }
  try {
    showExportProgress(true, '正在导出：单款视图');
    status.textContent = '准备导出单款视图...';

    // 1. 提取所有需要的图片 URL 并执行并发高速预下载 (0% -> 45%)
    const allUrls = [];
    for (const p of state.singleView) {
      for (const it of p.items) if (it.img) allUrls.push(it.img);
    }
    const uniqueUrlCount = new Set(allUrls).size;
    updateExportProgress(5, `正在并发加速获取 ${uniqueUrlCount} 张图片...`);

    await prefetchImagesConcurrently(allUrls, (done, total) => {
      const pct = 5 + Math.round((done / total) * 40);
      updateExportProgress(pct, `正在并发加速获取主图 (${done}/${total})...`);
    });

    // 2. 生成 Excel 表格并绘制 (45% -> 65%)
    updateExportProgress(45, '图片获取完成，正在填充两个版本的 Excel 表格及排版...');
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('单款视图');

    const wbText = new ExcelJS.Workbook();
    const wsText = wbText.addWorksheet('单款视图');

    const lbl = getMetricLabel();

    let maxColors = 0;
    for (const p of state.singleView) maxColors = Math.max(maxColors, p.items.length);

    [ws, wsText].forEach(sheet => {
      sheet.getColumn(1).width = 18;
      sheet.getColumn(2).width = 14;
      for (let i = 0; i < maxColors; i++) sheet.getColumn(3 + i).width = 14;
      sheet.getCell(1, 1).value = '款号/父ASIN';
      sheet.getCell(1, 2).value = '数据指标';
      for (let i = 0; i < maxColors; i++) sheet.getCell(1, 3 + i).value = `top${i + 1}`;
      sheet.getRow(1).font = { bold: true };
    });

    const imageIdCache = new Map();
    let row = 2;
    for (let pIdx = 0; pIdx < state.singleView.length; pIdx++) {
      const p = state.singleView[pIdx];
      const startRow = row;

      // 款号/父ASIN这一列在两个表中均合并到尺码排名行 (startRow 到 startRow + 4)
      ws.mergeCells(startRow, 1, startRow + 4, 1);
      wsText.mergeCells(startRow, 1, startRow + 4, 1);

      [ws, wsText].forEach(sheet => {
        sheet.getCell(startRow, 1).value = p.parent;
        sheet.getCell(startRow, 1).alignment = { vertical: 'middle', horizontal: 'center' };
        sheet.getCell(startRow, 2).value = '颜色';
        sheet.getCell(startRow + 2, 2).value = lbl;
        sheet.getCell(startRow + 3, 2).value = '占比';
      });

      for (let i = 0; i < p.items.length; i++) {
        const it = p.items[i];
        const col = 3 + i;

        // 文字版：原插入图片单元格填充文字“图片”
        wsText.getCell(startRow, col).value = '图片';
        wsText.getCell(startRow, col).alignment = { vertical: 'middle', horizontal: 'center' };

        [ws, wsText].forEach(sheet => {
          sheet.getCell(startRow + 1, col).value = it.raw || '';

          if (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio') {
            const r = it.allKw > 0 ? ((it.orgKw * 100) / it.allKw).toFixed(1) : '0.0';
            sheet.getCell(startRow + 2, col).value = `${r}% (${it.orgKw}/${it.allKw})`;
          } else {
            sheet.getCell(startRow + 2, col).value = it.sales;
          }

          const rc = sheet.getCell(startRow + 3, col);
          rc.value = it.ratio / 100;
          rc.numFmt = '0.0%';
        });

        // 原表插入真实图片
        const data = await getImageBuffer(it.img);
        if (data) {
          let imgId = imageIdCache.get(it.img);
          if (imgId === undefined) {
            imgId = wb.addImage({ buffer: data.buffer, extension: data.ext });
            imageIdCache.set(it.img, imgId);
          }
          ws.addImage(imgId, {
            tl: { col: col - 1 + 0.05, row: startRow - 1 + 0.05 },
            ext: { width: 90, height: 120 },
            editAs: 'oneCell',
          });
        }
      }

      const sizeText = (p.sizes && p.sizes.length)
        ? p.sizes.map((s, i) => {
            const v = (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio')
              ? `${(s.allKw > 0 ? (s.orgKw*100/s.allKw).toFixed(1) : '0')}%`
              : s.sales;
            return `${i+1}.${s.size}:${v}`;
          }).join(' | ')
        : '（无尺码数据）';

      [ws, wsText].forEach(sheet => {
        sheet.getCell(startRow + 4, 2).value = '尺码排名';
        sheet.mergeCells(startRow + 4, 3, startRow + 4, 3 + Math.max(0, maxColors - 1));
        sheet.getCell(startRow + 4, 3).value = sizeText;
        sheet.getCell(startRow + 4, 3).alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
        sheet.getCell(startRow + 4, 2).font = { bold: true };

        sheet.getRow(startRow).height = 125;
        sheet.getRow(startRow + 1).height = 20;
        sheet.getRow(startRow + 2).height = 20;
        sheet.getRow(startRow + 3).height = 20;
        sheet.getRow(startRow + 4).height = 22;
      });

      row += 5;

      const pProgress = 45 + Math.round(((pIdx + 1) / state.singleView.length) * 20);
      updateExportProgress(pProgress, `正在构建单款数据表格 (${pIdx + 1}/${state.singleView.length})...`);
    }

    const xlsxBuf = await wb.xlsx.writeBuffer();
    const xlsxTextBuf = await wbText.xlsx.writeBuffer();

    const zip = new JSZip();
    zip.file('单款视图.xlsx', xlsxBuf);
    zip.file('单款视图(文字版).xlsx', xlsxTextBuf);

    // 3. 构建 Zip 文件夹：原按款号分组与新按列名分组 (65% -> 75%)
    updateExportProgress(65, '正在组织图片并构建多维归类文件夹...');
    const imgRoot = zip.folder('图片');
    for (const p of state.singleView) {
      const sub = imgRoot.folder(sanitizeName(p.parent));
      let n = 0;
      for (const it of p.items) {
        const data = await getImageBuffer(it.img);
        if (!data) continue;
        n++;
        sub.file(String(n).padStart(2, '0') + '.' + data.ext, data.buffer);
      }
    }

    const imgByColRoot = zip.folder('图片_按列名');
    for (let colIdx = 0; colIdx < maxColors; colIdx++) {
      const colName = `top${colIdx + 1}`;
      const sub = imgByColRoot.folder(colName);
      let n = 0;
      for (const p of state.singleView) {
        const it = p.items[colIdx];
        if (!it || !it.img) continue;
        const data = await getImageBuffer(it.img);
        if (!data) continue;
        n++;
        sub.file(String(n).padStart(2, '0') + '.' + data.ext, data.buffer);
      }
    }

    // 4. 打包并生成 ZIP (极速 STORE 秒打包)
    updateExportProgress(75, '正在快速封装 ZIP 文件...');
    const blob = await zip.generateAsync({
      type: 'blob',
      compression: 'STORE'
    }, (metadata) => {
      const currentPct = 75 + Math.round(metadata.percent * 0.25);
      updateExportProgress(currentPct, `正在打包压缩 ZIP 文件 (${metadata.percent.toFixed(0)}%)...`);
    });

    updateExportProgress(100, '打包完成，浏览器正在保存文件！');
    downloadBlob(blob, '单款视图.zip');
    status.textContent = '✅ 单款视图导出完成（含原版Excel、文字版Excel及图片文件夹）';

    setTimeout(() => {
      showExportProgress(false);
    }, 2500);
  } catch (e) {
    showExportProgress(false);
    status.textContent = '导出失败：' + e.message;
  }
}

/* 导出汇总视图（带进度条、极速秒打包、带文字版Excel） */
async function exportSummaryZip() {
  const status = $('exportSummary');
  if (!state.colorGroups.length) { status.textContent = '没有汇总视图数据。'; return; }
  try {
    showExportProgress(true, '正在导出：汇总视图');
    status.textContent = '准备导出汇总视图...';

    const exportGroups = state.colorGroups.slice().sort((a, b) => {
      if (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio') {
        const ra = a.totalAllKw > 0 ? (a.totalOrgKw / a.totalAllKw) : 0;
        const rb = b.totalAllKw > 0 ? (b.totalOrgKw / b.totalAllKw) : 0;
        if (rb !== ra) return rb - ra;
        return b.totalOrgKw - a.totalOrgKw;
      }
      return b.total - a.total;
    });

    // 1. 并发预下载全部图片 (0% -> 45%)
    const allUrls = [];
    for (const g of exportGroups) {
      for (const it of g.items) if (it.img) allUrls.push(it.img);
    }
    const uniqueUrlCount = new Set(allUrls).size;
    updateExportProgress(5, `正在并发加速获取 ${uniqueUrlCount} 张图片...`);

    await prefetchImagesConcurrently(allUrls, (done, total) => {
      const pct = 5 + Math.round((done / total) * 40);
      updateExportProgress(pct, `正在并发加速获取主图 (${done}/${total})...`);
    });

    // 2. 生成 Excel 表格并排版 (45% -> 65%)
    updateExportProgress(45, '图片获取完成，正在填充两个版本的汇总数据与图表...');
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('汇总视图');

    const wbText = new ExcelJS.Workbook();
    const wsText = wbText.addWorksheet('汇总视图');

    const lbl = getMetricLabel();

    let maxProducts = 0;
    for (const g of exportGroups) maxProducts = Math.max(maxProducts, g.items.length);

    [ws, wsText].forEach(sheet => {
      sheet.getCell(1, 1).value = '排序';
      sheet.getCell(1, 2).value = `颜色整体${lbl}`;
      sheet.getCell(1, 3).value = '颜色整体占比';
      sheet.getCell(1, 4).value = '颜色';
      sheet.getRow(1).font = { bold: true };
      sheet.getRow(1).height = 30;

      const colWidths = [6, 16, 14, 16];
      colWidths.forEach((w, i) => sheet.getColumn(i + 1).width = w);
      for (let i = 0; i < maxProducts; i++) {
        sheet.getColumn(5 + i).width = 14;
        sheet.getCell(1, 5 + i).value = `top${i + 1}`;
        sheet.getCell(1, 5 + i).font = { bold: true };
        sheet.getCell(1, 5 + i).alignment = { vertical: 'middle', horizontal: 'center' };
      }
    });

    const imageIdCache = new Map();
    let row = 2;
    let sortIdx = 1;

    for (let gIdx = 0; gIdx < exportGroups.length; gIdx++) {
      const g = exportGroups[gIdx];
      const startRow = row;

      [ws, wsText].forEach(sheet => {
        sheet.mergeCells(startRow, 1, startRow + 2, 1);
        sheet.mergeCells(startRow, 2, startRow + 2, 2);
        sheet.mergeCells(startRow, 3, startRow + 2, 3);
        sheet.mergeCells(startRow, 4, startRow + 2, 4);

        sheet.getCell(startRow, 1).value = sortIdx;
        sheet.getCell(startRow, 1).alignment = { vertical: 'middle', horizontal: 'center' };

        if (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio') {
          const ratio = g.totalAllKw > 0 ? ((g.totalOrgKw * 100) / g.totalAllKw).toFixed(2) : '0.00';
          sheet.getCell(startRow, 2).value = `${ratio}% (${g.totalOrgKw}/${g.totalAllKw})`;
        } else {
          sheet.getCell(startRow, 2).value = g.total;
        }
        sheet.getCell(startRow, 2).alignment = { vertical: 'middle', horizontal: 'center' };

        const pctCell = sheet.getCell(startRow, 3);
        pctCell.value = g.grandTotal > 0 ? g.total / g.grandTotal : 0;
        pctCell.numFmt = '0.00%';
        pctCell.alignment = { vertical: 'middle', horizontal: 'center' };

        sheet.getCell(startRow, 4).value = g.displayName;
        sheet.getCell(startRow, 4).alignment = { vertical: 'middle', horizontal: 'center' };
      });
      sortIdx++;

      for (let i = 0; i < g.items.length; i++) {
        const it = g.items[i];
        const col = 5 + i;

        // 文字版填入“图片”字样
        wsText.getCell(startRow, col).value = '图片';
        wsText.getCell(startRow, col).alignment = { vertical: 'middle', horizontal: 'center' };

        [ws, wsText].forEach(sheet => {
          sheet.getCell(startRow + 1, col).value = it.raw || '';
          sheet.getCell(startRow + 1, col).alignment = { horizontal: 'center' };

          if (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio') {
            const r = it.allKw > 0 ? ((it.orgKw * 100) / it.allKw).toFixed(1) : '0.0';
            sheet.getCell(startRow + 2, col).value = `${r}% (${it.orgKw}/${it.allKw})`;
          } else {
            sheet.getCell(startRow + 2, col).value = it.sales;
          }
          sheet.getCell(startRow + 2, col).alignment = { horizontal: 'center' };
        });

        const data = await getImageBuffer(it.img);
        if (data) {
          let imgId = imageIdCache.get(it.img);
          if (imgId === undefined) {
            imgId = wb.addImage({ buffer: data.buffer, extension: data.ext });
            imageIdCache.set(it.img, imgId);
          }
          ws.addImage(imgId, {
            tl: { col: col - 1 + 0.05, row: startRow - 1 + 0.05 },
            ext: { width: 90, height: 120 },
            editAs: 'oneCell',
          });
        }
      }

      const sizeText = (g.sizes && g.sizes.length)
        ? g.sizes.map((s, i) => {
            const v = (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio')
              ? `${(s.allKw > 0 ? (s.orgKw*100/s.allKw).toFixed(1) : '0')}%`
              : s.sales;
            return `${i+1}.${s.size}:${v}`;
          }).join(' | ')
        : '（无尺码数据）';

      [ws, wsText].forEach(sheet => {
        sheet.getCell(startRow + 3, 4).value = '尺码排名';
        sheet.getCell(startRow + 3, 4).font = { bold: true };
        sheet.getCell(startRow + 3, 4).alignment = { vertical: 'middle', horizontal: 'center' };

        sheet.mergeCells(startRow + 3, 5, startRow + 3, 5 + Math.max(0, maxProducts - 1));
        sheet.getCell(startRow + 3, 5).value = sizeText;
        sheet.getCell(startRow + 3, 5).alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };

        sheet.getRow(startRow).height = 125;
        sheet.getRow(startRow + 1).height = 20;
        sheet.getRow(startRow + 2).height = 20;
        sheet.getRow(startRow + 3).height = 22;
      });

      row += 4;

      const gProgress = 45 + Math.round(((gIdx + 1) / exportGroups.length) * 20);
      updateExportProgress(gProgress, `正在构建颜色分组表格 (${gIdx + 1}/${exportGroups.length})...`);
    }

    const xlsxBuf = await wb.xlsx.writeBuffer();
    const xlsxTextBuf = await wbText.xlsx.writeBuffer();

    const zip = new JSZip();
    zip.file('汇总视图.xlsx', xlsxBuf);
    zip.file('汇总视图(文字版).xlsx', xlsxTextBuf);

    // 3. 构建多维图片文件夹 (65% -> 75%)
    updateExportProgress(65, '正在组织图片并构建多维归类文件夹...');
    const imgRoot = zip.folder('图片');
    const usedNames = new Set();
    for (const g of exportGroups) {
      let fname = sanitizeName(g.displayName);
      let n = 1;
      const base = fname;
      while (usedNames.has(fname)) { n++; fname = `${base}_${n}`; }
      usedNames.add(fname);
      const sub = imgRoot.folder(fname);
      let idx = 0;
      for (const it of g.items) {
        const data = await getImageBuffer(it.img);
        if (!data) continue;
        idx++;
        sub.file(String(idx).padStart(2, '0') + '.' + data.ext, data.buffer);
      }
    }

    const imgByColRoot = zip.folder('图片_按列名');
    for (let colIdx = 0; colIdx < maxProducts; colIdx++) {
      const colName = `top${colIdx + 1}`;
      const sub = imgByColRoot.folder(colName);
      let n = 0;
      for (const g of exportGroups) {
        const it = g.items[colIdx];
        if (!it || !it.img) continue;
        const data = await getImageBuffer(it.img);
        if (!data) continue;
        n++;
        sub.file(String(n).padStart(2, '0') + '.' + data.ext, data.buffer);
      }
    }

    // 4. 打包并生成 ZIP (极速 STORE 秒打包)
    updateExportProgress(75, '正在快速封装 ZIP 文件...');
    const blob = await zip.generateAsync({
      type: 'blob',
      compression: 'STORE'
    }, (metadata) => {
      const currentPct = 75 + Math.round(metadata.percent * 0.25);
      updateExportProgress(currentPct, `正在打包压缩 ZIP 文件 (${metadata.percent.toFixed(0)}%)...`);
    });

    updateExportProgress(100, '打包完成，浏览器正在保存文件！');
    downloadBlob(blob, '汇总视图.zip');
    status.textContent = '✅ 汇总视图导出完成（含原版Excel、文字版Excel及图片文件夹）';

    setTimeout(() => {
      showExportProgress(false);
    }, 2500);
  } catch (e) {
    showExportProgress(false);
    status.textContent = '导出失败：' + e.message;
  }
}

function applyAsinFilter() {
  const text = $('keepAsinText').value || '';
  const tokens = text.split(/[\s,，;；、|]+/).map(s => s.trim().toUpperCase()).filter(Boolean);

  if (!tokens.length) {
    state.records = state.allRecords.slice();
    const asinSet = new Set();
    for (const rec of state.allRecords) if (rec.asin) asinSet.add(rec.asin);
    state.allAsins = Array.from(asinSet);
    $('filterSummary').textContent = `未输入 ASIN，保留全部 ${state.allAsins.length} 个 ASIN。`;
    $('filterSummary').className = 'summary';
  } else {
    const keepSet = new Set(tokens);
    state.records = state.allRecords.filter(r => keepSet.has(r.asin));
    const asinSet = new Set();
    for (const rec of state.records) if (rec.asin) asinSet.add(rec.asin);
    state.allAsins = Array.from(asinSet);
    const matched = state.allAsins.length;
    const missed = tokens.length - matched;
    $('filterSummary').textContent = `已筛选：输入 ${tokens.length} 个，匹配 ${matched} 个，未匹配 ${missed} 个；共 ${state.records.length} 条记录。`;
    $('filterSummary').className = missed > 0 ? 'summary warn' : 'summary ok';
  }

  buildAsinGroups();
  state.singleView = [];
  state.colorGroups = [];
  state.selectedItems.clear();
  $('sec-single').classList.add('hidden');
  $('sec-summary').classList.add('hidden');
  $('sec-export').classList.add('hidden');
  $('processSummary').textContent = '数据已更新，请重新点击“开始处理”。';

  saveStateDebounced();
  updateSideNav();
}

/* 公用近12个月计算 */
function applyLast12Months(silent) {
  if (!state.availableMonths.length) {
    if (!silent) alert('请先上传主数据文件。');
    return false;
  }
  const latest = state.availableMonths[state.availableMonths.length - 1];
  const [ly, lm] = latest.split('-').map(n => parseInt(n, 10));
  const endDate = new Date(ly, lm - 1, 1);
  const startDate = new Date(ly, lm - 12, 1);

  const inRange = state.availableMonths.filter(m => {
    const [y, mo] = m.split('-').map(n => parseInt(n, 10));
    const d = new Date(y, mo - 1, 1);
    return d >= startDate && d <= endDate;
  });
  if (!inRange.length) {
    if (!silent) alert('没有找到近12个月的月份列。');
    return false;
  }
  const s = inRange[0], e = inRange[inRange.length - 1];
  $('rangeStart').value = s;
  $('rangeEnd').value = e;
  state.monthRange = { start: monthStrToDate(s), end: monthStrToDate(e) };
  $('rangeSummary').textContent = `当前范围：${s} ~ ${e}（近12个月）`;
  return true;
}

async function handleMainFiles(files) {
  if (!files.length) return;
  $('mainSummary').textContent = `已选择 ${files.length} 个文件，正在解析...`;

  const books = await readAllWorkbooks(files);
  state.mainBooks = books;

  let hasKeywordsColumn = false;
  let hasSalesOrMonth = false;

  for (const bk of books) {
    for (const sn of (bk.workbook.SheetNames || [])) {
      const ws = bk.workbook.Sheets[sn];
      if (!ws) continue;
      const arr = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });
      for (let r = 0; r < Math.min(arr.length, 10); r++) {
        const hs = (arr[r] || []).map(h => String(h || '').trim());
        if (hs.some(h => /^(全部流量词|自然搜索词)$/i.test(h))) hasKeywordsColumn = true;
        if (hs.some(h => parseMonthLabel(h) || /(销量|sales|units)/i.test(h))) hasSalesOrMonth = true;
      }
    }
  }

  if (hasKeywordsColumn && !hasSalesOrMonth) {
    state.dataMode = 'keywords';
    $('autoDetectHint').textContent = '💡 智能识别：已自动为您切换到【流量词数据模式】';
  } else {
    state.dataMode = 'sales';
    $('autoDetectHint').textContent = hasKeywordsColumn ? '💡 提示：检测到数据支持销量/流量词双模式，可随时上方切换' : '';
  }
  updateModeUI();

  const keyword = ($('sheetKeyword').value || '').trim();
  const headerRow = parseInt($('headerRow').value, 10) || 1;

  state.availableMonths = collectAvailableMonths(books, keyword, headerRow);
  fillMonthSelects();

  if (state.availableMonths.length) {
    const applied = applyLast12Months(true);
    if (!applied) {
      state.monthRange = null;
      $('rangeStart').value = state.availableMonths[0];
      $('rangeEnd').value = state.availableMonths[state.availableMonths.length - 1];
      $('rangeSummary').textContent = `已识别 ${state.availableMonths.length} 个月份列，当前使用：全部销量`;
    }
  } else {
    state.monthRange = null;
    $('rangeSummary').textContent = '未识别到月份列，将使用含“销量/sales/units”的列作为销量来源。';
  }

  reextractFromMainBooks();
}

function reextractFromMainBooks() {
  if (!state.mainBooks.length) return;
  const keyword = ($('sheetKeyword').value || '').trim();
  const headerRow = parseInt($('headerRow').value, 10) || 1;

  state.allRecords = extractRecords(state.mainBooks, keyword, headerRow, state.monthRange, state.dataMode, state.kwMetric);
  if (!state.allRecords.length) {
    $('mainSummary').textContent = '没有提取到任何有效记录，请检查子表关键字与表头行设置。';
    return;
  }

  const text = $('keepAsinText').value || '';
  const tokens = text.split(/[\s,，;；、|]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
  if (tokens.length) {
    const keepSet = new Set(tokens);
    state.records = state.allRecords.filter(r => keepSet.has(r.asin));
    const asinSet = new Set();
    for (const rec of state.records) if (rec.asin) asinSet.add(rec.asin);
    state.allAsins = Array.from(asinSet);
  } else {
    state.records = state.allRecords.slice();
    const asinSet = new Set();
    for (const rec of state.allRecords) if (rec.asin) asinSet.add(rec.asin);
    state.allAsins = Array.from(asinSet);
  }

  const lbl = getMetricLabel();
  $('mainSummary').textContent = `主数据解析完成：模式【${state.dataMode === 'keywords' ? '流量词' : '销量'}】，当前指标【${lbl}】，共 ${state.allRecords.length} 条记录，${state.allAsins.length} 个唯一 ASIN。`;
  $('btnDownloadMerged').disabled = false;
  $('btnApplyFilter').disabled = false;

  buildAsinGroups();
  $('sec-asin').classList.remove('hidden');

  state.singleView = [];
  state.colorGroups = [];
  state.selectedItems.clear();
  $('sec-single').classList.add('hidden');
  $('sec-summary').classList.add('hidden');
  $('sec-export').classList.add('hidden');
  $('processSummary').textContent = '';

  saveStateDebounced();
  updateSideNav();
}

  if (!s || !e) { alert('请先选择月份范围。'); return; }
  const start = monthStrToDate(s);
  const end = monthStrToDate(e);
  if (!start || !end || start > end) { alert('月份范围不正确。'); return; }
  state.monthRange = { start, end };
  $('rangeSummary').textContent = `当前范围：${s} ~ ${e}`;
  if (state.mainBooks.length) reextractFromMainBooks();
});

$('btnDownloadMerged').addEventListener('click', downloadMergedTable);
$('btnApplyFilter').addEventListener('click', applyAsinFilter);
$('btnClearAll').addEventListener('click', clearAll);

let imgFilesCache = [];
$('imgFolder').addEventListener('change', e => {
  imgFilesCache = collectFiles([e.target.files]);
  $('imgSummary').textContent = `已选择 ${imgFilesCache.length} 个主图文件。`;
});
$('imgFiles').addEventListener('change', e => {
  imgFilesCache = collectFiles([e.target.files]);
  $('imgSummary').textContent = `已选择 ${imgFilesCache.length} 个主图文件。`;
});

$('btnRegroup').addEventListener('click', buildAsinGroups);
$('btnAddGroup').addEventListener('click', addNewGroup);

$('btnProcess').addEventListener('click', async () => {
  const status = $('processSummary');
  if (!state.records.length) { status.textContent = '请先上传主数据。'; return; }
  try {
    status.textContent = '解析主图文件...';
    if (imgFilesCache.length) {
      const imgBooks = await readAllWorkbooks(imgFilesCache);
      state.asinImageMap = buildImageMap(imgBooks);
    }

    status.textContent = '构建视图...';
    state.singleView = buildSingleView(state.records);
    state.colorGroups = buildColorGroups(state.singleView);
    state.colorOverrides = new Map();
    applyDisplayNames();
    state.sortMode = 'sales';

    if (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio') {
      state.colorGroups.sort((a, b) => {
        const ra = a.totalAllKw > 0 ? (a.totalOrgKw / a.totalAllKw) : 0;
        const rb = b.totalAllKw > 0 ? (b.totalOrgKw / b.totalAllKw) : 0;
        if (rb !== ra) return rb - ra;
        return b.totalOrgKw - a.totalOrgKw;
      });
    } else {
      state.colorGroups.sort((a, b) => b.total - a.total);
    }

    state.selectedItems.clear();
    attachImages();

    renderSingleView();
    renderSummaryView();

    $('sec-single').classList.remove('hidden');
    $('sec-summary').classList.remove('hidden');
    $('sec-export').classList.remove('hidden');

    const parentCount = state.singleView.length;
    const totalItems = state.singleView.reduce((s, p) => s + p.items.length, 0);
    const lbl = getMetricLabel();
    status.textContent = `✅ 处理完成：基于【${lbl}】指标；父款/ASIN ${parentCount} 个；单款条目 ${totalItems} 条；汇总颜色分组 ${state.colorGroups.length} 个。`;

    saveStateDebounced();
    updateSideNav();
  } catch (e) { status.textContent = '处理失败：' + e.message; }
});

$('btnSortColor').addEventListener('click', () => {
  state.sortMode = 'color';
  state.colorGroups = sortGroupsByColorSimilarity();
  renderSummaryView();
  saveStateDebounced();
});
$('btnSortSales').addEventListener('click', () => {
  state.sortMode = 'sales';
  if (state.dataMode === 'keywords' && state.kwMetric === 'orgRatio') {
    state.colorGroups.sort((a, b) => {
      const ra = a.totalAllKw > 0 ? (a.totalOrgKw / a.totalAllKw) : 0;
      const rb = b.totalAllKw > 0 ? (b.totalOrgKw / b.totalAllKw) : 0;
      if (rb !== ra) return rb - ra;
      return b.totalOrgKw - a.totalOrgKw;
    });
  } else {
    state.colorGroups.sort((a, b) => b.total - a.total);
  }
  renderSummaryView();
  saveStateDebounced();
});

$('btnExportSingle').addEventListener('click', exportSingleZip);
$('btnExportSummary').addEventListener('click', exportSummaryZip);

$('btnClearSelection').addEventListener('click', () => {
  state.selectedItems.clear();
  renderSummaryView();
});
$('chkShowSelect').addEventListener('change', () => {
  const show = $('chkShowSelect').checked;
  document.querySelectorAll('.card-select').forEach(cb => {
    cb.style.display = show ? 'block' : 'none';
  });
});

window.addEventListener('DOMContentLoaded', () => {
  const restored = loadState();
  if (restored) {
    renderAfterRestore();
    showSaveHint();
  }
  updateSideNav();
  updateBatchMoveUI();
});
window.addEventListener('beforeunload', () => {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  saveState();
});
</script>

<script>
(function initImageLightbox() {
  const box = document.createElement('div');
  box.className = 'img-lightbox';
  box.innerHTML = '<div class="lb-close">✕</div><img src="" alt="预览大图"><div class="lb-tip">点击空白处或按 Esc 关闭</div>';
  document.body.appendChild(box);

  const bigImg = box.querySelector('img');

  function open(src) {
    bigImg.src = src;
    box.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    box.classList.remove('show');
    bigImg.src = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.preview-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const img = el.querySelector('img');
      open(el.dataset.full || (img ? img.src : ''));
    });
  });

  box.addEventListener('click', close);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && box.classList.contains('show')) close();
  });
})();
</script>
