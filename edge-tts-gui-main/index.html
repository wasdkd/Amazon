<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小夕TTS - 免费开源语音合成工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { margin-bottom: 10px; }
        p { color: #bdc3c7; margin-bottom: 30px; }
        .buttons { display: flex; gap: 20px; }
        .btn {
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #27ae60; color: white; }
        .btn-secondary:hover { background-color: #219150; }
        .footer { margin-top: 50px; font-size: 0.8em; color: #7f8c8d; }
    </style>
</head>
<body>
    <h1>🎙️ 小夕TTS</h1>
    <p>简单、强大、免费的 Edge TTS 语音合成工具</p>
    
    <div class="buttons">
        <a href="https://share.streamlit.io/YOUR_GITHUB_USER/YOUR_REPO/main/web_app.py" class="btn btn-secondary">🌐 在线使用 (Streamlit)</a>
        <a href="https://github.com/YOUR_GITHUB_USER/YOUR_REPO/releases" class="btn btn-primary">💻 下载桌面版 (GitHub)</a>
    </div>

    <div class="footer">
        Powered by Edge TTS & Cloudflare Pages
    </div>
</body>
</html>
