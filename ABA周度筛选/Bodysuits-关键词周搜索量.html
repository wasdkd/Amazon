                                        selectAllBtn.innerHTML = '全选';
                                        selectAllBtn.title = '显示所有图例';

                                        const unselectAllBtn = document.createElement('button');
                                        unselectAllBtn.innerHTML = '全不选';
                                        unselectAllBtn.classList.add('unselect');
                                        unselectAllBtn.title = '隐藏所有图例';

                                        selectAllBtn.onclick = function() {
                                            const chart = echarts.getInstanceByDom(container);
                                            if (chart) {
                                                const option = chart.getOption();
                                                const legendData = option.legend[0].data;
                                                const selected = {};
                                                legendData.forEach(name => {
                                                    selected[name] = true;
                                                });
                                                chart.setOption({ legend: { selected: selected } });
                                            }
                                        };

                                        unselectAllBtn.onclick = function() {
                                            const chart = echarts.getInstanceByDom(container);
                                            if (chart) {
                                                const option = chart.getOption();
                                                const legendData = option.legend[0].data;
                                                const selected = {};
                                                legendData.forEach(name => {
                                                    selected[name] = false;
                                                });
                                                chart.setOption({ legend: { selected: selected } });
                                            }
                                        };

                                        btnContainer.appendChild(selectAllBtn);
                                        btnContainer.appendChild(unselectAllBtn);
                                        container.appendChild(btnContainer);
                                    }

                                    // 添加图例点击复制功能
                                    const chart = echarts.getInstanceByDom(container);
                                    if (chart) {
                                        // 移除旧的事件监听器避免重复绑定
                                        chart.off('legendselectchanged');

                                        // 添加新的事件监听器
                                        chart.on('legendselectchanged', function(params) {
                                            const selectedName = params.name;
                                            navigator.clipboard.writeText(selectedName).then(() => {
                                                // 添加视觉反馈
                                                const toast = document.createElement('div');
                                                toast.style.position = 'fixed';
                                                toast.style.top = '20px';
                                                toast.style.left = '50%';
                                                toast.style.transform = 'translateX(-50%)';
                                                toast.style.backgroundColor = '#4CAF50';
                                                toast.style.color = 'white';
                                                toast.style.padding = '10px 20px';
                                                toast.style.borderRadius = '4px';
                                                toast.style.zIndex = '10000';
                                                toast.style.transition = 'opacity 0.5s';
                                                toast.textContent = '"' + selectedName + '" 已复制';
                                                document.body.appendChild(toast);

                                                // 创建自定义确认框并放在顶部
                                                const confirmBox = document.createElement('div');
                                                confirmBox.style.position = 'fixed';
                                                confirmBox.style.top = '70px';
                                                confirmBox.style.left = '50%';
                                                confirmBox.style.transform = 'translateX(-50%)';
                                                confirmBox.style.backgroundColor = '#1e1e1e';
                                                confirmBox.style.padding = '15px 20px';
                                                confirmBox.style.borderRadius = '8px';
                                                confirmBox.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.3)';
                                                confirmBox.style.zIndex = '10001';
                                                confirmBox.style.textAlign = 'center';
                                                confirmBox.style.minWidth = '300px';
                                                confirmBox.style.maxWidth = '90%';
                                                confirmBox.style.display = 'flex';
                                                confirmBox.style.alignItems = 'center';
                                                confirmBox.style.justifyContent = 'space-between';
                                                confirmBox.style.flexWrap = 'wrap';
                                                confirmBox.style.gap = '10px';

                                                const message = document.createElement('div');
                                                message.textContent = '"' + selectedName + '" 已复制，是否跳转到亚马逊查看搜索结果？';
                                                message.style.color = 'white';
                                                message.style.fontSize = '14px';
                                                message.style.flex = '1';
                                                message.style.minWidth = '250px';
                                                message.style.wordBreak = 'break-word';

                                                const buttonContainer = document.createElement('div');
                                                buttonContainer.style.display = 'flex';
                                                buttonContainer.style.gap = '8px';

                                                const confirmBtn = document.createElement('button');
                                                confirmBtn.textContent = '跳转';
                                                confirmBtn.style.padding = '6px 12px';
                                                confirmBtn.style.backgroundColor = '#4CAF50';
                                                confirmBtn.style.color = 'white';
                                                confirmBtn.style.border = 'none';
                                                confirmBtn.style.borderRadius = '4px';
                                                confirmBtn.style.cursor = 'pointer';
                                                confirmBtn.style.fontSize = '14px';
                                                confirmBtn.style.whiteSpace = 'nowrap';

                                                const cancelBtn = document.createElement('button');
                                                cancelBtn.textContent = '取消';
                                                cancelBtn.style.padding = '6px 12px';
                                                cancelBtn.style.backgroundColor = '#f44336';
                                                cancelBtn.style.color = 'white';
                                                cancelBtn.style.border = 'none';
                                                cancelBtn.style.borderRadius = '4px';
                                                cancelBtn.style.cursor = 'pointer';
                                                cancelBtn.style.fontSize = '14px';
                                                cancelBtn.style.whiteSpace = 'nowrap';

                                                buttonContainer.appendChild(confirmBtn);
                                                buttonContainer.appendChild(cancelBtn);

                                                confirmBox.appendChild(message);
                                                confirmBox.appendChild(buttonContainer);

                                                document.body.appendChild(confirmBox);

                                                // 处理跳转确认
                                                let actionTaken = false;

                                                confirmBtn.addEventListener('click', function() {
                                                    actionTaken = true;
                                                    const encodedKeyword = encodeURIComponent(selectedName);
                                                    window.open('https://www.amazon.com/s?k=' + encodedKeyword, '_blank');
                                                    document.body.removeChild(confirmBox);
                                                    // 确认跳转后也移除提示框
                                                    if (toast.parentNode) {
                                                        toast.style.opacity = '0';
                                                        setTimeout(() => {
                                                            if (toast.parentNode) {
                                                                document.body.removeChild(toast);
                                                            }
                                                        }, 500);
                                                    }
                                                });

                                                cancelBtn.addEventListener('click', function() {
                                                    actionTaken = true;
                                                    document.body.removeChild(confirmBox);
                                                    // 取消后也移除提示框
                                                    if (toast.parentNode) {
                                                        toast.style.opacity = '0';
                                                        setTimeout(() => {
                                                            if (toast.parentNode) {
                                                                document.body.removeChild(toast);
                                                            }
                                                        }, 500);
                                                    }
                                                });

                                                // 2秒后自动关闭确认框和提示框
                                                setTimeout(() => {
                                                    if (!actionTaken && confirmBox.parentNode) {
                                                        document.body.removeChild(confirmBox);
                                                    }
                                                    if (!actionTaken && toast.parentNode) {
                                                        toast.style.opacity = '0';
                                                        setTimeout(() => {
                                                            if (toast.parentNode) {
                                                                document.body.removeChild(toast);
                                                            }
                                                        }, 500);
                                                    }
                                                }, 4000);
                                            }).catch(err => {
                                                console.error('复制失败:', err);
                                            });
                                        });
                                    }
                                };

                                // 处理所有图表容器
                                chartContainers.forEach(container => {
                                    // 跳过标题图表
                                    if (!container.querySelector('.ec-title')) {
                                        processChart(container);
                                    }
                                });

                                // 创建响应式布局
                                const chartsContainer2 = document.querySelector('.charts-container');
                                if (chartsContainer2) {
                                    // 清除现有内容（保留标题和控件）
                                    while (chartsContainer2.children.length > 2) {
                                        chartsContainer2.removeChild(chartsContainer2.lastChild);
                                    }

                                    // 创建新的布局
                                    let currentRow = null;

                                    chartContainers.forEach((container, index) => {
                                        // 跳过标题图表
                                        if (container.querySelector('.ec-title')) return;

                                        if (index % 2 === 0) {
                                            currentRow = document.createElement('div');
                                            currentRow.className = 'chart-row';
                                            chartsContainer2.appendChild(currentRow);
                                        }

                                        const chartItem = document.createElement('div');
                                        chartItem.className = 'chart-item ' + 
                                            (chartContainers.length === 1 ? 
                                             'chart-item-full' : 'chart-item-half');

                                        // 移动图表到新容器
                                        chartItem.appendChild(container);
                                        if (currentRow) {
                                            currentRow.appendChild(chartItem);
                                        }
                                    });
                                }

                                // 页面加载后立即调用一次筛选函数
                                filterCharts();
                            });

                            // 根据关键词和时间范围筛选图表
                            function filterCharts() {
    // 获取搜索关键词
    const keyword = document.getElementById('keywordSearch') ? document.getElementById('keywordSearch').value : '';

    // 获取所有图表容器
    const chartContainers = document.querySelectorAll('[id^="chart_"]');
    let chartIndex = 0;

    chartContainers.forEach(container => {
        // 跳过标题图表
        if (container.querySelector('.ec-title')) return;

        const chart = echarts.getInstanceByDom(container);
        if (!chart) return;

        // 确定当前是第几个图表（用于获取对应的子分类）
        const subcategoryNames = Object.keys(allChartData);
        if (chartIndex >= subcategoryNames.length) return;

        const subcategoryName = subcategoryNames[chartIndex];
        const subcategoryData = allChartData[subcategoryName] || [];

        // 筛选数据
        let filteredData = subcategoryData;
        if (keyword) {
            filteredData = subcategoryData.filter(item => 
                item.name.toLowerCase().includes(keyword.toLowerCase())
            );
        }

        // 确保结束索引在有效范围内
        const endIndex = Math.min(currentEndIndex, xAxisData.length - 1);
        const startIndex = Math.min(currentTimeIndex, endIndex);

        // 核心功能：按结束时间点的值降序排序，动态更新关键词列表
        if (filteredData.length > 0) {
            // 按结束时间点的值降序排序
            filteredData.sort((a, b) => {
                const aValue = a.values[endIndex] || 0;
                const bValue = b.values[endIndex] || 0;
                return bValue - aValue;  // 降序排序
            });
        }

        // 取前20个关键词（基于当前结束时间点排序）
        const top20Data = filteredData.slice(0, 20);

        // 构建新的图表选项
        const COLOR_LIST = [
            "#00FF00", "#FF0000", "#FFFF00", "#0000FF", "#FF00FF", "#00FFFF", "#FFA500",
            "#7CB342", "#E53935", "#FDD835", "#5C6BC0", "#AB47BC", "#26A69A", "#FF7043",
            "#8D6E63", "#42A5F5", "#66BB6A", "#D4E157", "#EC407A", "#78909C"
        ];

        // 截取数据从开始时间点到结束时间点
        const slicedXAxisData = xAxisData.slice(startIndex, endIndex + 1);
        const slicedSeries = top20Data.map((item, index) => {
            return {
                name: item.name,
                type: 'line',
                data: item.values.slice(startIndex, endIndex + 1),
                smooth: true,
                label: { show: false },
                lineStyle: { width: 2 },
                symbolSize: 4,
                itemStyle: {
                    borderWidth: 0,
                    opacity: 1,
                    color: COLOR_LIST[index % COLOR_LIST.length]
                },
                symbol: 'circle'
            };
        });

        const legendData = top20Data.map(item => item.name);

        // 更新图表
        const option = {
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: slicedXAxisData,
                axisLabel: {
                    rotate: 45,
                    fontSize: 13,
                    color: "#000000"
                },
                axisLine: {
                    lineStyle: {
                        color: "#000000"
                    }
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: "#CCCCCC",
                        width: 1,
                        type: "dashed"
                    }
                }
            },
            yAxis: {
                name: "搜索量",
                nameTextStyle: {
                    fontSize: 14,
                    color: "#000000"
                },
                axisLabel: {
                    formatter: function(value) {
                        if (value >= 10000) {
                            return (value / 10000).toFixed(1) + '万';
                        } else if (value >= 1000) {
                            return (value / 1000).toFixed(1) + '千';
                        } else {
                            return value;
                        }
                    },
                    color: "#000000"
                },
                axisLine: {
                    lineStyle: {
                        color: "#000000"
                    }
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: "#CCCCCC",
                        width: 1,
                        type: "dashed"
                    }
                }
            },
            series: slicedSeries,
            legend: {
                data: legendData,
                left: "6%",
                top: "3%",
                orient: "vertical",
                itemWidth: 10,
                itemHeight: 15,
                itemGap: 2,
                textStyle: {
                    fontSize: 20,
                    color: "#000000"
                }
            },
            title: {
                text: subcategoryName + (keyword ? ' (关键词"' + keyword + '"的搜索结果)' : ''),
                left: "50%",
                textStyle: {
                    fontSize: 25,
                    color: "#000000"
                }
            },
            tooltip: {
                trigger: "axis",
                axisPointer: {
                    type: "cross"
                },
                backgroundColor: 'rgba(255, 255, 255, 0.8)',
                borderColor: '#000000',
                borderWidth: 1,
                textStyle: {
                    color: '#000000',
                    fontSize: 14
                },
                confine: true,
                alwaysShowContent: false,
                enterable: false,
                extraCssText: 'box-shadow: 0 0 3px rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); max-width: 400px; word-wrap: break-word;',
                order: "valueDesc"
            },
            grid: {
                left: "5%",
                right: "2.5%",
                top: "10%",
                bottom: "10%"
            }
        };

        chart.setOption(option, true);
        chartIndex++;
    });
}
