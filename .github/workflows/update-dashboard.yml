# .github/workflows/update-dashboard.yml
name: Auto-update ExcelAPI.html

on:
  push:
    paths:
      - 'uploads/**'          # 只要 uploads 目录有变动就触发
  workflow_dispatch:          # 也可手动点 Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 允许写回仓库

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run build_dashboard.py
        run: python build_dashboard.py

      - name: Commit & push if changed
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ExcelAPI.html
          git diff --cached --quiet || (git commit -m "chore: auto-update dashboard" && git push)