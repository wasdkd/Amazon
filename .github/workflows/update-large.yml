name: Upload large file via dispatch

on:
  repository_dispatch:
    types: [upload-large-file]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode & write file
        run: |
          mkdir -p uploads
          echo "${{ github.event.client_payload.base64 }}" | base64 -d > "uploads/${{ github.event.client_payload.name }}"

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploads/
          git diff --cached --quiet || (
            git commit -m "upload large file ${{ github.event.client_payload.name }}"
            git push
          )